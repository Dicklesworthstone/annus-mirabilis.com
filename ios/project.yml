# The iPhone app's Xcode project, generated by XcodeGen 2.46.0
# (docs/DECISIONS.md D-2026-09-23-apple-toolchain). Edit this file, never the
# generated project: `cd ios && xcodegen generate`, then commit both.
#
# Identity comes from D-2026-09-23-app-identity. No DEVELOPMENT_TEAM is set while
# that entry's team id is the owner's placeholder; simulator builds need none.
# Universal links: the associated-domains entitlement (applinks:annus-mirabilis.com) is a
# REFUSED PLACEHOLDER for the same reason. The handling, the vectors and the association-file
# generator exist (am-app-universal-links-re8v); scripts/app/identity.test.ts refuses the
# entitlement while the team id is the placeholder and requires it once a real one is recorded.

name: AnnusMirabilis
options:
  bundleIdPrefix: com.annus-mirabilis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.1"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  AnnusMirabilis:
    type: application
    platform: iOS
    sources:
      - path: AnnusMirabilis
        excludes:
          - "**/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annus-mirabilis.AnnusMirabilis
        PRODUCT_NAME: AnnusMirabilis
        INFOPLIST_FILE: AnnusMirabilis/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnnusMirabilis/Resources/AnnusMirabilis.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
    postBuildScripts:
      - name: Bundle the verified edition
        shell: /bin/bash
        basedOnDependencyAnalysis: true
        inputFileLists:
          - $(SRCROOT)/../generated/app-edition/edition-inputs.xcfilelist
        outputFileLists:
          - $(SRCROOT)/../generated/app-edition/edition-outputs.xcfilelist
        script: |
          # App plan §5.4: the bundle holds exactly the files the edition manifest
          # lists, byte for byte. The export (never this phase) decides what ships.
          set -euo pipefail
          GEN="${SRCROOT}/../generated/app-edition"
          OUT="$(cat "${GEN}/edition-source.txt")"
          RES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          DEST="${RES}/Edition"
          REEXPORT="bun scripts/app/export-edition.ts"
          if [ ! -f "${GEN}/edition-manifest.json" ]; then
            echo "error: This build has no app edition. From the repository root, run: ${REEXPORT}"
            exit 1
          fi
          # shasum names each file it fails; the first goes in the error, which is what Xcode shows.
          if ! failed="$(cd "${OUT}" && /usr/bin/shasum -a 256 -c --quiet "${GEN}/edition.sha256" 2>&1)"; then
            first="$(printf '%s\n' "${failed}" | grep -m 1 'FAILED' | sed 's/: FAILED.*//')"
            echo "error: ${OUT} has changed since the edition was exported, first: ${first}. From the repository root, run: ${REEXPORT} --out <that out directory>"
            exit 1
          fi
          mkdir -p "${DEST}"
          /usr/bin/rsync -a --inplace --files-from="${GEN}/edition-files.txt" "${OUT}/" "${DEST}/"
          /bin/cp "${GEN}/edition-manifest.json" "${RES}/edition-manifest.json"
          /bin/cp "${GEN}/bridge-user-script.js" "${RES}/bridge-user-script.js"
          /bin/cp "${GEN}/settings-snapshot.js" "${RES}/settings-snapshot.js"
          # Inert text in a reader's build: only a DEBUG build has the code that injects it.
          /bin/cp "${GEN}/test-console.js" "${RES}/test-console.js"
          /bin/cp "${GEN}/native-catalog.json" "${RES}/native-catalog.json"
          if ! failed="$(cd "${DEST}" && /usr/bin/shasum -a 256 -c --quiet "${GEN}/edition.sha256" 2>&1)"; then
            first="$(printf '%s\n' "${failed}" | grep -m 1 'FAILED' | sed 's/: FAILED.*//')"
            echo "error: A bundled edition file does not match its manifest digest, first: ${first}."
            exit 1
          fi
          unlisted="$(cd "${DEST}" && find . -type f | sed 's|^\./||' | LC_ALL=C sort | LC_ALL=C comm -23 - <(LC_ALL=C sort "${GEN}/edition-files.txt"))"
          if [ -n "${unlisted}" ]; then
            echo "error: The bundled edition holds files its manifest does not list, first: $(printf '%s\n' "${unlisted}" | head -n 1). Clean the build folder and build again."
            exit 1
          fi
          echo "note: bundled $(wc -l < "${GEN}/edition-files.txt" | tr -d ' ') edition files"

  AnnusMirabilisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnnusMirabilisTests
      # The shared test-log record writer, compiled into both test targets.
      - path: AnnusMirabilisTestSupport
      # The bridge's golden messages: the same file the TypeScript schema tests read.
      - path: ../src/platform/app-bridge/fixtures/messages.json
        buildPhase: resources
      # The site's export of the reader's data, computed by exportNamespaces (readerData.test.ts).
      - path: ../src/platform/app-bridge/fixtures/readerDataExport.json
        buildPhase: resources
      # Website links and what the app does with each; association-file.test.ts reads them too.
      - path: ../scripts/app/fixtures/route-vectors.json
        buildPhase: resources
      # One test-log record as AMTestLog writes it; scripts/app/test-records.test.ts validates it.
      - path: ../scripts/app/fixtures/amtestlog-record.json
        buildPhase: resources
      # Evidence folder names, which the app and the gate must agree on (test-evidence.test.ts too).
      - path: ../scripts/app/fixtures/evidence-folders.json
        buildPhase: resources
      # Requests to the edition origin and their answers; origin-vectors.test.ts reads them too.
      - path: ../scripts/app/fixtures/origin-vectors.json
        buildPhase: resources
    dependencies:
      - target: AnnusMirabilis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.annus-mirabilis.AnnusMirabilisTests
        TARGETED_DEVICE_FAMILY: "1,2"

  AnnusMirabilisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AnnusMirabilisUITests
      - path: AnnusMirabilisTestSupport
    dependencies:
      - target: AnnusMirabilis
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.annus-mirabilis.AnnusMirabilisUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: AnnusMirabilis
        # Keeps a screenshot at every failing test's first issue (HarnessObserver.swift).
        INFOPLIST_KEY_NSPrincipalClass: AnnusMirabilisUITests.HarnessObserver

schemes:
  AnnusMirabilis:
    build:
      targets:
        AnnusMirabilis: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnnusMirabilisTests
        - AnnusMirabilisUITests
    archive:
      config: Release
