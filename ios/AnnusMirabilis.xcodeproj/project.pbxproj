			shellScript = "# App plan §5.4: the bundle holds exactly the files the edition manifest\n# lists, byte for byte. The export (never this phase) decides what ships.\nset -euo pipefail\nGEN=\"${SRCROOT}/../generated/app-edition\"\nOUT=\"$(cat \"${GEN}/edition-source.txt\")\"\nRES=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nDEST=\"${RES}/Edition\"\nREEXPORT=\"bun scripts/app/export-edition.ts\"\nif [ ! -f \"${GEN}/edition-manifest.json\" ]; then\n  echo \"error: This build has no app edition. From the repository root, run: ${REEXPORT}\"\n  exit 1\nfi\nif ! (cd \"${OUT}\" && /usr/bin/shasum -a 256 -c --quiet \"${GEN}/edition.sha256\"); then\n  echo \"error: ${OUT} has changed since the edition was exported. From the repository root, run: ${REEXPORT} --out <that out directory>\"\n  exit 1\nfi\nmkdir -p \"${DEST}\"\n/usr/bin/rsync -a --inplace --files-from=\"${GEN}/edition-files.txt\" \"${OUT}/\" \"${DEST}/\"\n/bin/cp \"${GEN}/edition-manifest.json\" \"${RES}/edition-manifest.json\"\n/bin/cp \"${GEN}/bridge-user-script.js\" \"${RES}/bridge-user-script.js\"\nif ! (cd \"${DEST}\" && /usr/bin/shasum -a 256 -c --quiet \"${GEN}/edition.sha256\"); then\n  echo \"error: A bundled edition file does not match its manifest digest.\"\n  exit 1\nfi\nunlisted=\"$(cd \"${DEST}\" && find . -type f | sed 's|^\\./||' | LC_ALL=C sort | LC_ALL=C comm -23 - <(LC_ALL=C sort \"${GEN}/edition-files.txt\"))\"\nif [ -n \"${unlisted}\" ]; then\n  echo \"error: The bundled edition holds files its manifest does not list, first: $(printf '%s\\n' \"${unlisted}\" | head -n 1). Clean the build folder and build again.\"\n  exit 1\nfi\necho \"note: bundled $(wc -l < \"${GEN}/edition-files.txt\" | tr -d ' ') edition files\"\n";
		};
