description: Stokes-Einstein and RMS from modern SI constants. Plumbing, not a historical claim.
constantSetId: modern-si-2019
owner: diffusion.stokesEinsteinRms
equations:
  - eq-model-bm-diffusivity
  - eq-model-bm-rms
