id: diffusion-adversarial-half-diffusivity
kind: adversarial
title: Halving D scales RMS by 1/sqrt(2), not 1/2
description: The plausible mistake is that displacement scales with D.
constantSetId: modern-si-2019
owner: selfTest.rootTwoScale
