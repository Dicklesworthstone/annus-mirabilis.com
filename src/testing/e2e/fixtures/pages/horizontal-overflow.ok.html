<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizontal Overflow Check - OK</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      max-width: 100%;
      overflow-x: hidden;
      font-family: sans-serif;
    }
    .responsive-card {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <main class="responsive-card">
    <h1>320px Responsive Viewport</h1>
    <p>This layout reflows cleanly without page-level horizontal overflow.</p>
  </main>
</body>
</html>
