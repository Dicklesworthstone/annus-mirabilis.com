<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Restoration Check - OK</title>
</head>
<body>
  <main>
    <h1>Focus Restoration Demo</h1>
    <button id="open-dialog-btn" type="button">Open Drawer</button>
    
    <div id="drawer" role="dialog" aria-modal="true" style="display: none; border: 1px solid #333; padding: 16px; margin-top: 16px;">
      <h2>Clarification Drawer</h2>
      <p>Explaining Brownian motion context.</p>
      <button id="close-dialog-btn" type="button">Close Drawer</button>
    </div>
  </main>

  <script>
    const openBtn = document.getElementById('open-dialog-btn');
    const closeBtn = document.getElementById('close-dialog-btn');
    const drawer = document.getElementById('drawer');
    let lastActiveElement = null;

    openBtn.addEventListener('click', () => {
      lastActiveElement = document.activeElement;
      drawer.style.display = 'block';
      closeBtn.focus();
    });

    closeBtn.addEventListener('click', () => {
      drawer.style.display = 'none';
      if (lastActiveElement && typeof lastActiveElement.focus === 'function') {
        lastActiveElement.focus();
      }
    });
  </script>
</body>
</html>
