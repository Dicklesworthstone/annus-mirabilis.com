# WCAG 2.2 Level A and AA Criteria Mapping for annus-mirabilis.com
# Specification: W3C Recommendation 05 October 2023 (https://www.w3.org/TR/WCAG22/)
# Retrieved: 2026-09-16
# Total criteria: 55 (Level A: 31, Level AA: 24). Note: 4.1.1 Parsing was removed in WCAG 2.2.
#
# Every criterion maps to:
# - rule & check with owning beadId, OR
# - not-applicable with reason and revisit trigger.

metadata:
  standard: "WCAG 2.2"
  levels: ["A", "AA"]
  totalCriteria: 55
  sourceUrl: "https://www.w3.org/TR/WCAG22/"
  retrievedAt: "2026-09-16"

criteria:
  # Principle 1: Perceivable
  - id: "1.1.1"
    name: "Non-text Content"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "All images, SVGs, and interactive canvas instruments have text alternatives or aria-hidden with adjacent description."
    check: "axe-core image-alt / svg-title checks + ThreeStudioScene canvas action contract fallback."

  - id: "1.2.1"
    name: "Audio-only and Video-only (Prerecorded)"
    level: "A"
    status: "not-applicable"
    notApplicableReason: "No standalone prerecorded audio-only or video-only media is hosted on the site at launch."
    revisitTrigger: "Adding audio recordings of period lectures or video demonstrations."

  - id: "1.2.2"
    name: "Captions (Prerecorded)"
    level: "A"
    status: "not-applicable"
    notApplicableReason: "No synchronized video media with audio is hosted at launch."
    revisitTrigger: "Adding captioned video demonstrations."

  - id: "1.2.3"
    name: "Audio Description or Media Alternative (Prerecorded)"
    level: "A"
    status: "not-applicable"
    notApplicableReason: "No prerecorded video media requiring visual description tracks is hosted."
    revisitTrigger: "Adding video tracks."

  - id: "1.2.4"
    name: "Captions (Live)"
    level: "AA"
    status: "not-applicable"
    notApplicableReason: "No live synchronized media streams are broadcast."
    revisitTrigger: "Adding live event broadcasts."

  - id: "1.2.5"
    name: "Audio Description (Prerecorded)"
    level: "AA"
    status: "not-applicable"
    notApplicableReason: "No prerecorded video tracks are hosted."
    revisitTrigger: "Adding video tracks."

  - id: "1.3.1"
    name: "Info and Relationships"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Semantic HTML headings, lists, tables, landmarks, and MathML expression trees convey relationships programmatically."
    check: "Semantic element audit + MathML tree structure validation."

  - id: "1.3.2"
    name: "Meaningful Sequence"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "DOM order matches visual and logical reading order across multi-column, bilingual, and drawer projections."
    check: "E2E tab-order and accessibility tree reading order verification."

  - id: "1.3.3"
    name: "Sensory Characteristics"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Instructions and scientific explanations never rely solely on shape, color, size, or spatial orientation."
    check: "Editorial voice linter sensory language check + UI text audit."

  - id: "1.3.4"
    name: "Orientation"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Views operate equally in portrait and landscape orientations without locking orientation."
    check: "E2E viewport orientation tests across 320px to 1920px."

  - id: "1.3.5"
    name: "Identify Input Purpose"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Telemetry inputs, search queries, and parameter sliders carry autocomplete or aria-label describing exact intent."
    check: "Input element autocomplete and aria attribute validation."

  - id: "1.4.1"
    name: "Use of Color"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Every semantic color token is paired with a visible label, distinctive dash pattern, marker, or term badge."
    check: "checkColorIndependence automated check on equation tokens and graph lines."

  - id: "1.4.2"
    name: "Audio Control"
    level: "A"
    status: "not-applicable"
    notApplicableReason: "No background audio plays automatically on any route."
    revisitTrigger: "Adding automatic auditory sonification playback."

  - id: "1.4.3"
    name: "Contrast (Minimum)"
    level: "AA"
    status: "implemented"
    owner: "am-design-themes-typography-288q"
    rule: "Text and mathematical symbols achieve at least 4.5:1 contrast for normal text and 3:1 for large text across both themes."
    check: "src/app/theme/contrast.test.ts audits every declared pair of THEME_TOKENS across the Annalen and Kramgasse Night palettes, 16 pairs of a stated 8 per theme, with a planted sub-3.0:1 focus ring proving the audit fails when a token is out of range."

  - id: "1.4.4"
    name: "Resize Text"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Page content scales to 200% zoom without loss of content or functionality."
    check: "E2E zoom-200 lane verification."

  - id: "1.4.5"
    name: "Images of Text"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Actual text, KaTeX MathML, and SVG vectors are used instead of raster images of text (historical facsimiles have live text overlays)."
    check: "Raster asset audit in public/ and content/."

  - id: "1.4.10"
    name: "Reflow"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Content reflows at 320px width without two-dimensional scrolling, except for necessary displayed equations."
    check: "E2E 320px phone viewport test lane."

  - id: "1.4.11"
    name: "Non-text Contrast"
    level: "AA"
    status: "implemented"
    owner: "am-design-themes-typography-288q"
    rule: "UI components, focus rings, and scientific chart marks achieve at least 3:1 contrast against adjacent background."
    check: "Theme token contrast audit for UI controls and graphical marks."

  - id: "1.4.12"
    name: "Text Spacing"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "No text is clipped or obscured when user text spacing overrides (1.5x line height, 0.12em letter spacing, 0.16em word spacing, 2em paragraph spacing) are injected."
    check: "checkTextSpacing automated check in E2E text-spacing lane."

  - id: "1.4.13"
    name: "Content on Hover or Focus"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Tooltips, term cards, and overlays are dismissible via Escape, hoverable, and persistent until dismissed."
    check: "Hover/focus overlay dismissal test suite."

  # Principle 2: Operable
  - id: "2.1.1"
    name: "Keyboard"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "All functionality (reading navigation, sliders, term exploration, graph inspection) is operable via keyboard."
    check: "E2E keyboard-only test lane."

  - id: "2.1.2"
    name: "No Keyboard Trap"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Focus can always be moved away from any component using standard Tab or Escape; dialogs trap focus only while open and release on close."
    check: "trapFocus and popFocusScope automated tests in src/testing/a11y/focus.test.tsx."

  - id: "2.1.4"
    name: "Character Key Shortcuts"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Single-key character shortcuts are inactive when an input has focus, or can be remapped/disabled."
    check: "Keyboard shortcuts manager audit."

  - id: "2.2.1"
    name: "Timing Adjustable"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "No reading sessions or discovery journeys time out; simulations pause and step at user command."
    check: "Host scheduler time control verification (no automatic session expiration)."

  - id: "2.2.2"
    name: "Pause, Stop, Hide"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Moving or animated physics simulations provide explicit pause/play controls and respect reduced-motion settings."
    check: "reducedMotion integration tests and transport play/pause controls."

  - id: "2.3.1"
    name: "Three Flashes or Below Threshold"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "No visual component flashes faster than 3 times per second."
    check: "Animation frame rate and strobe check."

  - id: "2.4.1"
    name: "Bypass Blocks"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "A visible skip link ('Skip to main content') is the first focusable element on every page."
    check: "src/app/layout.tsx skip-link presence and target audit."

  - id: "2.4.2"
    name: "Page Titled"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Every route provides a unique, informative page title describing the paper or exhibit."
    check: "checkPageTitles across route manifest."

  - id: "2.4.3"
    name: "Focus Order"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Keyboard focus proceeds in a sequential, logical order matching the argument progression."
    check: "E2E tab order trace validation."

  - id: "2.4.4"
    name: "Link Purpose (In Context)"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Every link has a descriptive accessible name (never vague text like 'here' or 'click here')."
    check: "checkLinkPurpose automated check across all rendered links."

  - id: "2.4.5"
    name: "Multiple Ways"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Users can locate pages via table of contents, paper navigation index, search palette, and deep links."
    check: "Site navigation and search palette tests."

  - id: "2.4.6"
    name: "Headings and Labels"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Headings clearly describe section content and labels describe the purpose of interactive controls."
    check: "Heading hierarchy and form label validation."

  - id: "2.4.7"
    name: "Focus Visible"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Keyboard focus indicators are clearly visible with high contrast across all themes."
    check: "Focus ring CSS contrast token inspection."

  - id: "2.4.11"
    name: "Focus Not Obscured (Minimum)"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "When an item receives keyboard focus, it is not entirely obscured by fixed or sticky content."
    check: "checkFocusObscuring 9-point bounding box sampling."

  - id: "2.5.1"
    name: "Pointer Gestures"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "All multi-point or path-based gestures (e.g. 3D rotation, pinch zoom) have single-pointer button equivalents."
    check: "Single-pointer stepper and button controls audit on instruments."

  - id: "2.5.2"
    name: "Pointer Cancellation"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "No action commits on pointerdown; actions commit on pointerup within bounds and abort on pointercancel or release outside bounds."
    check: "createPointerCommitController and evaluatePointerSequence test suite."

  - id: "2.5.3"
    name: "Label in Name"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Accessible names of buttons and links include the visible text string."
    check: "axe-core label-content-name-mismatch check."

  - id: "2.5.4"
    name: "Motion Actuation"
    level: "A"
    status: "not-applicable"
    notApplicableReason: "No device motion sensors (accelerometer, gyroscope) trigger functions."
    revisitTrigger: "Adding shake-to-reset or tilt-based controls."

  - id: "2.5.7"
    name: "Dragging Movements"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Every draggable slider, divider, or graph point can also be adjusted via single-pointer click or keyboard arrows."
    check: "Direct numeric input and keyboard arrow handlers beside all drag controls."

  - id: "2.5.8"
    name: "Target Size (Minimum)"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Interactive touch targets are at least 24x24 px or satisfy the 24px spacing exception."
    check: "checkTargetSize automated check on interactive elements."

  # Principle 3: Understandable
  - id: "3.1.1"
    name: "Language of Page"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "HTML document specifies lang='en' as default page language."
    check: "src/app/layout.tsx html element lang attribute check."

  - id: "3.1.2"
    name: "Language of Parts"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "German original passages and terms carry lang='de' so screen readers switch pronunciation correctly."
    check: "checkLanguageOfParts automated check across all bilingual reading faces."

  - id: "3.2.1"
    name: "On Focus"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Receiving focus does not automatically trigger an unexpected context change or navigation."
    check: "Focus change side-effect audit."

  - id: "3.2.2"
    name: "On Input"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Changing an input value does not automatically trigger navigation or unexpected major context shift."
    check: "Input change handler audit."

  - id: "3.2.3"
    name: "Consistent Navigation"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Navigation headers, drawer controls, and theme selectors appear in consistent order across pages."
    check: "Layout template consistency audit."

  - id: "3.2.4"
    name: "Consistent Identification"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Components with the same function (e.g. term card triggers, explanation expanders) are identified consistently."
    check: "Component icon and label consistency audit."

  - id: "3.2.6"
    name: "Consistent Help"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Foundations library link and mathematical reading help appear in the same relative position across paper editions."
    check: "Navigation drawer help link audit."

  - id: "3.3.1"
    name: "Error Identification"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Input errors (e.g. invalid parameter ranges) are described to the user in text with aria-describedby."
    check: "Numeric input boundary and error notification checks."

  - id: "3.3.2"
    name: "Labels or Instructions"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Labels and unit instructions are provided for all interactive parameters and mathematical sliders."
    check: "Form input label associations."

  - id: "3.3.3"
    name: "Error Suggestion"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "When a parameter exceeds stability bounds (e.g. CFL condition in diffusion), suggestions for valid ranges are provided."
    check: "Typed refusal error message and suggestion audit."

  - id: "3.3.4"
    name: "Error Prevention (Legal, Financial, Data)"
    level: "AA"
    status: "not-applicable"
    notApplicableReason: "No legal commitments, financial transactions, or user account data modifications occur on the site."
    revisitTrigger: "Adding purchasing or user profile editing."

  - id: "3.3.7"
    name: "Redundant Entry"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Information entered during discovery journeys is retained across journey steps without requiring redundant re-entry."
    check: "Journey state persistence in localStorage/session."

  - id: "3.3.8"
    name: "Accessible Authentication (Minimum)"
    level: "AA"
    status: "not-applicable"
    notApplicableReason: "The site requires no accounts, passwords, or authentication."
    revisitTrigger: "Adding user authentication."

  # Principle 4: Robust
  - id: "4.1.2"
    name: "Name, Role, Value"
    level: "A"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "All custom UI widgets expose standard ARIA roles, states, and accessible names."
    check: "axe-core aria-* attributes and role checks."

  - id: "4.1.3"
    name: "Status Messages"
    level: "AA"
    status: "implemented"
    owner: "am-a11y-baseline-1cg5"
    rule: "Status updates and simulation completions are presented via polite aria-live regions without moving focus."
    check: "announce() utility tests in src/testing/a11y/announce.test.ts."
