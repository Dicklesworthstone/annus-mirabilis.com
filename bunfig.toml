# Subprocess-spawning tests cannot run under `bun test` on this host:
# bun's test runner posix_spawn of node fails with EBADF (measured: the
# same files pass under node --test). bun 1.4.0 honours camelCase
# pathIgnorePatterns with repo-relative paths or **/ globs; basename-only
# entries and kebab-case keys are silently ignored.
# Node still runs this list via scripts/run-node-only-tests.ts (`bun run test:node`).
[test]
pathIgnorePatterns = [
  "scripts/e2e",
  "**/*.e2e.test.ts",
  "scripts/quality-gates.test.ts",
  "scripts/prepare-lane.test.ts",
  "scripts/ocr-ledgers.test.ts",
  "scripts/ocr-ledgers.cli.test.ts",
  "scripts/app/export-edition.test.ts",
  "scripts/app/editionWasmPinned.test.ts",
  "src/content/ledger/validateLedgerCli.test.ts",
  # am-4cpx: the source layers are derived from the tree, and their proof runs in the node lane so
  # that it is not checked by the same lane the manifest report is generated in.
  "src/content/manifest/sourceLayers.node.test.ts",
  # am-hcx5: puts every COMMITTED yaml record through parseYaml AND js-yaml and names the files the
  # two disagree about, which is the only cheap instrument for a hand-written parser's leniency. The
  # population is `git ls-files`, which bun's runner cannot spawn here, and the population is the
  # point: walking the tree instead would pull in peers' untracked work-in-progress records.
  "src/content/provenance/yamlDifferential.node.test.ts",
  # am-f3e4: reads the historical pins with `git show`, which bun's runner cannot spawn here.
  "src/content/kernel/declaredPins.node.test.ts",
  # am-rc1001-bridge-plan-pcjk.3: builds a throwaway git repository with its own local origin to
  # check the release origin guard against REAL git. Same reason as the entry above: this file is
  # nothing but git, and bun's runner cannot reliably spawn it here.
  "scripts/releaseOriginGuard.node.test.ts",
  # am-rc1001-bridge-plan-pcjk.46: installs the proposed reference-transaction hook into a
  # throwaway repository and drives the four cases the bead names. Same reason again: it is nothing
  # but git, and it must never touch this checkout's own .git/hooks.
  "scripts/git-hooks/referenceTransaction.node.test.ts",
  # am-rc1001-bridge-plan-pcjk.9: bun CAN run this one. It is here for the other reason the two
  # entries above are, lane independence: the gate census judges every registry step, and
  # `bun run test` is itself one of them, so a proof living only in the bun lane disappears at the
  # moment that lane fails open. AGENTS.md: "keep a version of its proof in a DIFFERENT lane from the
  # one it controls."
  "scripts/gate-census/population.node.test.ts",
  "scripts/gate-census/reach.node.test.ts",
  "scripts/gate-census/judge.node.test.ts",
  # am-jioj: reads out/, so it belongs in the lane that already refuses a stale build.
  "src/testing/a11y/actionContractsRendered.node.test.ts",
  # am-ig23: reads `git ls-files`, which bun's runner cannot posix_spawn here.
  "src/testing/refusals/flattenedRefusals.test.ts",
  # am-uxh9: bun CAN run this one. It is here for lane independence, the same reason the gate-census
  # entries above are: it asserts a property of every registry step, and `bun run test` is one of
  # them, so a proof living only in the bun lane disappears at the moment that lane fails open.
  "scripts/quality-gates/gatesPersistEvidence.node.test.ts",
  "scripts/quality-gates/ciExemptionReasons.node.test.ts",
  # am-t84m: reads `git ls-files` to state the client-boundary check's denominator from the index
  # rather than from the walker being measured, and bun's runner cannot posix_spawn git here.
  "src/testing/appRouterCoverage.node.test.ts",
  "src/testing/a11y/accessibleNamesBrowser.test.mjs",
  "src/testing/a11y/noScriptControls.browser.test.mjs",
  "src/discovery/investigation/workspace.browser.test.mjs",
  "src/testing/styles/computedStylesLayout.test.ts",
  "src/testing/foundCalculus.browser.test.mjs",
  "src/testing/asupersyncProfile.test.ts",
  "src/testing/trackedImports.test.ts",
  "src/testing/hygiene/beadsCommitScope.test.ts",
  "src/content/kernel/formatterExclusions.test.ts",
  "src/testing/docs/inventoryVersions.test.ts",
  "scripts/verify-facsimile-pins.test.ts",
  "src/testing/outFreshness.fixture.test.ts",
  "src/testing/hygiene/extractionCarriersDerived.test.ts",
]
