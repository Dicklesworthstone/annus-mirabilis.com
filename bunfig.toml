# Subprocess-spawning tests cannot run under `bun test` on this host:
# bun's test runner posix_spawn of node fails with EBADF (measured: the
# same files pass under node --test). bun 1.4.0 honours camelCase
# pathIgnorePatterns with repo-relative paths or **/ globs; basename-only
# entries and kebab-case keys are silently ignored.
# Node still runs this list via scripts/run-node-only-tests.ts (`bun run test:node`).
[test]
pathIgnorePatterns = [
  "scripts/e2e",
  "**/*.e2e.test.ts",
  "scripts/quality-gates.test.ts",
  "scripts/prepare-lane.test.ts",
  "scripts/ocr-ledgers.test.ts",
  "scripts/ocr-ledgers.cli.test.ts",
  "scripts/app/export-edition.test.ts",
  "src/content/ledger/validateLedgerCli.test.ts",
  # am-4cpx: the source layers are derived from the tree, and their proof runs in the node lane so
  # that it is not checked by the same lane the manifest report is generated in.
  "src/content/manifest/sourceLayers.node.test.ts",
  # am-f3e4: reads the historical pins with `git show`, which bun's runner cannot spawn here.
  "src/content/kernel/declaredPins.node.test.ts",
  # am-rc1001-bridge-plan-pcjk.9: bun CAN run this one. It is here for the other reason the two
  # entries above are, lane independence: the gate census judges every registry step, and
  # `bun run test` is itself one of them, so a proof living only in the bun lane disappears at the
  # moment that lane fails open. AGENTS.md: "keep a version of its proof in a DIFFERENT lane from the
  # one it controls."
  "scripts/gate-census/population.node.test.ts",
  "src/testing/a11y/accessibleNamesBrowser.test.mjs",
  "src/testing/styles/computedStylesLayout.test.ts",
  "src/testing/foundCalculus.browser.test.mjs",
  "src/testing/asupersyncProfile.test.ts",
  "src/testing/trackedImports.test.ts",
  "src/testing/hygiene/beadsCommitScope.test.ts",
  "src/content/kernel/formatterExclusions.test.ts",
  "src/testing/docs/inventoryVersions.test.ts",
  "scripts/verify-facsimile-pins.test.ts",
  "src/testing/outFreshness.fixture.test.ts",
  "src/testing/hygiene/extractionCarriersDerived.test.ts",
]
