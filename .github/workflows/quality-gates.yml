name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: Fast Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"

      - name: Verify imported trajectories against the real reference owners
        run: node --experimental-strip-types --test src/testing/trajectory*.test.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install system dependencies for rendering
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Prepare content and lab artifacts
        run: bun run prepare:content && bun run prepare:lab

      - name: Run node-only subprocess tests
        run: bun run test:node

      - name: Run fast quality gate chain
        run: bun scripts/quality-gates.ts --all --family fast --cadence every-run

      - name: Upload test logs and evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-fast-gates
          path: artifacts/test-logs/
          if-no-files-found: ignore
