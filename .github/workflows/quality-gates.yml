name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: Fast Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"

      - name: Verify imported trajectories against the real reference owners
        run: node --experimental-strip-types --test src/testing/trajectory*.test.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install system dependencies for rendering
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Playwright browsers (chromium and webkit)
        # scripts/e2e/lanes.ts declares a real webkit lane ("webkit-real"); AGENTS.md
        # requires a real WebKit/Safari lane in the browser acceptance matrix. Installing
        # chromium alone made lanes.test.ts:111 fail on main with
        # "Executable doesn't exist at .../webkit-2336/pw_run.sh".
        run: bunx playwright install --with-deps chromium webkit

      - name: Prepare site artifacts
        run: bun scripts/prepare-lane.ts

      # Keep the live laboratory and reader checks ahead of the export-dependent node lane.
      # That lane can fail before the fast gate chain reaches either types or these regressions.
      - name: Check types and instrument registry
        id: laboratory-types
        run: bun run check:types

      - name: Run laboratory, reader, search and storage regression tests
        if: success() || steps.laboratory-types.outcome == 'failure'
        run: >-
          bun test --isolate --timeout 60000
          src/testing/scheduler*.test.ts
          src/testing/concurrency.test.ts
          src/testing/readerViewLoaders.integration.test.tsx
          src/experiments/shelfOptics
          src/experiments/bm01
          src/experiments/bm08
          src/experiments/avogadro
          src/components/lab/avogadro
          src/reasoning/infer
          src/physics/reference/inference/identifiability.test.mjs
          src/experiments/lq04
          src/testing/radiation.entropy.test.ts
          src/reader/weave
          src/reader/notebook/panel.test.ts
          src/content/essays/essays.test.ts
          src/search/essayDocuments.test.ts
          src/components/essays/EssayReading.test.tsx
          src/discovery/tours/studyTours.test.ts
          src/experiments/bm07/kitchen/admission.test.ts
          src/experiments/bm07/kitchen/visibility.test.ts
          src/testing/discovery-notebook.test.mjs
          src/testing/discovery-session.test.mjs
          src/testing/discovery-storage.test.mjs
          src/platform/storage
          src/testing/sr-05.test.ts
          src/testing/sr05Lab.test.tsx
          src/testing/sr05Controls.test.tsx
          src/testing/bm03/bm03.tape.test.ts
          src/testing/bm03/bm03.recording.test.tsx
          src/testing/sr01Recording.test.tsx
          src/testing/me01TapeLink.test.tsx
          src/testing/lq09Recording.test.tsx
          src/testing/labFormSweep.test.tsx
          src/testing/lightQuantaPredictionGates.test.tsx
          src/testing/relativityPredictionGates.test.tsx
          src/testing/predictSupportedCandidates.test.ts
          src/testing/predictGateHidesOnlyTheResponse.test.tsx
          src/testing/sr04.manifest.test.ts
          src/testing/lq03.manifest.test.ts
          src/components/lab/PredictGate.test.tsx
          src/components/lab/TracerPlayback.test.tsx
          src/components/lab/ModeAllocationLab.test.tsx
          src/components/lab/ModeAllocationLab.refusals.test.tsx
          src/experiments/permalink/sessionTape.transaction.test.ts
          src/experiments/permalink/ShareControl.test.tsx
          src/experiments/permalink/LabTapeLink.location.test.tsx
          src/experiments/permalink/LabTapeLink.cancellation.test.tsx
          src/experiments/permalink/LabTapeLink.predictions.test.tsx
          src/experiments/permalink/LabTapeLink.newRun.test.tsx
          src/experiments/permalink/LabTapeLink.recovery.test.tsx
          src/equations/printed/sourceSemantics.test.ts
          src/equations/derivations/srSynchronization.test.ts
          src/content/results
          src/reader/faces/printedOperations.test.tsx
          src/search/closingPassages.test.ts
          src/search/languageFaces.test.ts
          src/search/queryQuality.test.ts
          src/testing/refusals

      # Both the node lane and fast/browser gates inspect the static export. A fresh
      # checkout has no out/; preparing generated inputs alone does not build it.
      - name: Build the static site for export-dependent tests
        run: bun run build

      - name: Run node-only subprocess tests
        run: bun run test:node

      - name: Run fast quality gate chain
        run: bun scripts/quality-gates.ts --all --family fast --cadence every-run

      # The browser family, which no job ran until 2026-09-21. browser-acceptance has read
      # requiredInCi true throughout while nothing executed it; the workflow that carried its
      # name ran a different command over 20 files the node lane already runs. Owner decision
      # am-browser-gate-identity-7nq2, verbatim "Delete the workflow; register the journey".
      # Chromium and webkit are installed above, so this adds no install.
      - name: Run browser quality gate chain
        run: bun scripts/quality-gates.ts --all --family browser --cadence every-run

      - name: Upload test logs and evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-fast-gates
          path: artifacts/test-logs/
          if-no-files-found: ignore
