name: Brownian laboratory preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Retain exact public source for reproducible laboratory review
        run: mkdir -p artifacts/review artifacts/browser && git archive --format=tar HEAD > artifacts/review/source.tar
      - name: Upload review source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laboratory-review-source
          path: artifacts/review/source.tar
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:reference
      - name: Verify the reference owners under Node as well
        shell: bash
        run: node --experimental-strip-types --test src/testing/*.test.mjs 2>&1 | tee artifacts/browser/reference-tests.log
      - name: Exercise the no-algebra reader entrances
        run: bun test --isolate src/testing/light-quanta-entrance-ui.test.tsx src/testing/clock-entrance-ui.test.tsx
      - name: Exercise semantic equation integration and server-rendered gloss controls
        run: bun test --isolate src/testing/mass-energy-equation-ui.test.tsx src/reader/faces/GlossFace.render.test.tsx src/reader/faces/GlossPair.render.test.tsx src/testing/gloss-reasoning-toggle.test.tsx
      - name: Exercise the checked mass-energy derivation
        run: bun test --isolate src/testing/mass-energy-elimination-ui.test.tsx
      - name: Exercise the local video capture entrance
        run: bun test --isolate src/testing/kitchen-video-ui.test.tsx
      - run: bun run typecheck
      - name: Build the complete production preview
        shell: bash
        run: bun run build 2>&1 | tee artifacts/browser/build.log
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: tar -cf artifacts/review/site.tar out
      - name: Upload static preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laboratory-static-preview
          path: artifacts/review/site.tar
      - run: bunx playwright install --with-deps chromium
      - name: Exercise local video annotation through the real decoder and inference worker
        run: bun scripts/test-kitchen-video-browser.mjs
      - run: bun run test:browser
      - name: Upload browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: brownian-browser-evidence
          path: artifacts/browser/
          if-no-files-found: ignore
