    readings:
      r0: "Follow one flash of light through three papers. Its energy comes in parts whose size is set by its colour; an observer moving away sees it redder and weaker in exactly the same proportion; and a body that sends out such flashes, equally in opposite directions, becomes lighter by their energy divided by the square of the speed of light."
      r1: "The light paper says that monochromatic radiation behaves, as far as its energy goes, as if it were made of quanta of size hν. The relativity paper gives in §7 the frequency a moving observer measures, and in §8 finds that the energy of a light complex changes with the observer's motion by the same law. At the defaults, a pulse of 1 J at 500 THz, seen by an observer receding at 0.6c along its direction, has half the frequency, 250 THz, and half the energy, 0.5 J, so the number E/hν = 3.02 × 10^{18} is the same for both observers, although neither paper assumes the other. A pulse sent the opposite way is seen with twice its energy, so a pair of 1 J pulses, 2 J in the frame of the body that emits them, carries 2.5 J for the moving observer, 1.25 times as much. The mass–energy paper uses exactly that difference to show that the body loses mass L/V^{2}, here 2 J/c^{2} = 2.23 × 10^{−17} kg. A single pulse has no rest mass; the pair, taken as a system, has."
      r2: "For an observer moving at β = v/c along the direction of a light pulse, the frequency is multiplied by (1 − β)/√(1 − β^{2}) = √((1 − β)/(1 + β)). At β = 0.6 that is √(0.4/1.6) = √0.25 = 0.5, so 500 THz becomes 250 THz. Section 8 gives the pulse's energy the same factor, so 1 J becomes 0.5 J. One quantum at 500 THz has hν = 6.626 × 10^{−34} × 5 × 10^{14} = 3.313 × 10^{−19} J, so the pulse holds 1/(3.313 × 10^{−19}) = 3.02 × 10^{18} such amounts; for the moving observer each quantum is 1.657 × 10^{−19} J and the pulse 0.5 J, which is again 3.02 × 10^{18}. A pulse travelling the other way gets the factor √((1 + β)/(1 − β)) = 2, so 1 J becomes 2 J. Two pulses of 1 J each, sent in opposite directions, carry 2 J in the body's frame and 0.5 + 2 = 2.5 J for the moving observer. The difference is 0.5 J, and 2.5/2 = 1.25 = 1/√(1 − 0.36). That is the mass–energy paper's step: the body gives up 2 J in its own frame but 2.5 J as the moving observer counts it, and the extra 0.5 J can only come out of its energy of motion. For small speeds that extra is ½(L/c^{2})v^{2}, the kinetic energy of a mass L/c^{2}, so the body has lost that much mass: with L = 2 J and c = 2.998 × 10^{8} m/s, 2/(8.988 × 10^{16}) = 2.23 × 10^{−17} kg. One pulse alone, with E = pc, has zero rest mass; the pair's momenta cancel in the body's frame, so there all of its energy is rest energy."
      r3: "The light paper never mentions relativity, and the mass–energy paper uses Maxwell's theory of radiation without light quanta. The link here is a later synthesis: because energy and frequency transform alike, the count of quanta is the same for every observer. Einstein wrote V for the speed of light and L for the emitted energy, and stated the result as the mass changing by L/V^{2}, with 9 × 10^{20} in centimetre-gram-second units. The photon as a particle with energy hν and momentum hν/c came later, with Einstein's 1916 and 1917 papers on radiation and Compton's scattering experiment of 1923."
      r3Citations:
        - "Einstein, A. (1905). Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt. Annalen der Physik 17, 132–148."
        - "Einstein, A. (1905). Zur Elektrodynamik bewegter Körper. Annalen der Physik 17, 891–921 (§7, §8)."
        - "Einstein, A. (1905). Ist die Trägheit eines Körpers von seinem Energieinhalt abhängig? Annalen der Physik 18, 639–641."
        - "Einstein, A. (1917). Zur Quantentheorie der Strahlung. Physikalische Zeitschrift 18, 121–128."
        - "Compton, A. H. (1923). A quantum theory of the scattering of X-rays by light elements. Physical Review 21, 483–502."
