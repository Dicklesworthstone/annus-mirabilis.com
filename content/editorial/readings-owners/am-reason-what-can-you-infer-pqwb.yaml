    readings:
      r0: "The same set of observations can fit more than one explanation. Here the data stay fixed, and you add one independent piece of information at a time to see which question it settles."
      r1: "Two cases hold a synthetic record fixed. In the first, 50 steps in two directions give D = 0.883 μm^{2}/s with a 95 percent interval of 0.681 to 1.189, and Section 5's relation then fixes only the product of radius and molecular number, a·N = 1.46 × 10^{17} m/mol. Every point on the curve N = 1.46 × 10^{17}/a fits equally well: a radius of 0.1 μm with 14.6 × 10^{23}, 0.5 μm with 2.93 × 10^{23}, 2 μm with 0.73 × 10^{23}. Only an independent measurement of the radius picks a point: with 0.5 μm known to lie between 0.45 and 0.55 μm at 97.5 percent coverage, N lies between 1.89 and 4.37 × 10^{23} with at least 95 percent coverage. In the second case a camera record's step variance, 0.812 μm^{2}, could come from the particle's motion or from errors in locating it. The two trade off along a line, and only a second relation, the covariance of neighbouring steps or the variance at twice the spacing, separates them."
      r2: "Case one. From the 100 squared steps, D̂ = 0.883 μm^{2}/s, and the chi-square bounds for 100 degrees of freedom, 74.2 and 129.6, turn that into 0.681 to 1.189 μm^{2}/s. Einstein's D = RT/(6πηaN) can be turned around for the product: a·N = RT/(6πηD̂) = 2437/(6 × 3.1416 × 0.001 × 8.83 × 10^{−13}) = 1.465 × 10^{17} m/mol. Doubling a and halving N leaves that unchanged, so the data define a curve, not a point. Now admit a radius interval, 0.45 to 0.55 μm, that is right with probability at least 97.5 percent, and use the 97.5 percent interval for D, which is a little wider than the 95 percent one. If both are right, which fails with probability at most 2.5 + 2.5 = 5 percent, N lies between the smallest and largest values the two ranges allow, from RT/(6πη D_{max} a_{max}) to RT/(6πη D_{min} a_{min}): 1.89 to 4.37 × 10^{23}. That is a conservative bound, not a probability for this one interval. Case two. With localization errors of variance σ^{2} and an exposure of half the frame spacing, a step's variance is 2D(τ − T_{e}/3) + 2σ^{2} = 1.667D + 2σ^{2}. One number, 0.812 μm^{2}, cannot fix two unknowns: D = 0.238 μm^{2}/s with σ^{2} = 0.208 μm^{2} fits it exactly, and so does D = 0.012 with σ^{2} = 0.396. The neighbouring covariance, DT_{e}/3 − σ^{2}, differs along that line, which is why admitting it supplies the second equation."
      r3: "Section 5 of the Brownian paper already gives N only in terms of a known radius, and Perrin measured his grains' radii separately, by their rate of settling and by weighing, before counting molecules. Separating motion from measurement error, and combining two intervals by adding their error probabilities, are modern statistics. The records here are synthetic, made by a known generator, so the exercise tests the reasoning rather than the world."
      r3Citations:
        - "Einstein, A. (1905). Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen. Annalen der Physik 17, 549–560 (§5)."
        - "Perrin, J. (1909). Mouvement brownien et réalité moléculaire. Annales de chimie et de physique (8) 18, 5–114."
        - "Berglund, A. J. (2010). Statistics of camera-based single-particle tracking. Physical Review E 82, 011917."
