    readings:
      r0: "If every way a resonator can vibrate gets the same share of energy, the energy of the radiation grows without limit as higher and higher frequencies are allowed. Einstein notes that on this picture matter and light could never settle into a definite share of the energy."
      r1: "Section 1 puts a gas, free electrons and resonators, electrons bound to fixed points, in a box with mirror walls. Collisions give each resonator's vibration along one line a mean energy Ē = (R/N)T, the same at every frequency; at 1500 K that is 2.07 × 10^{−20} J. Planck's relation between a resonator and the radiation around it, Ē_{ν} = (L^{3}/8πν^{2})ρ_{ν}, then fixes the density: ρ_{ν} = (R/N)(8πν^{2}/L^{3})T. The energy per unit volume up to a highest frequency ν_{c} is (8πk_{B}T/3c^{3})ν_{c}^{3}, which at 1500 K is 0.00644 J/m^{3} up to 10^{14} Hz, and 99.9 percent of it lies above 10^{13} Hz. Allow frequencies ten times higher and the energy grows a thousandfold, to 6.44 J/m^{3}; allow them all and there is no finite total, which the instrument reports as a refusal rather than a number. Einstein concludes that the relation disagrees with experience and that on this picture there can be no definite distribution of energy between the ether and matter. Section 2 then shows that Planck's formula, which fits experience, agrees with this law at long wavelengths, and that matching the two gives N = 6.17 × 10^{23}."
      r2: "Take a resonator vibrating along one line. In a gas at temperature T each molecule's energy of motion averages (3/2)(R/N)T, which is (1/2)(R/N)T for each direction. A bound electron also has potential energy, and for a spring force the average potential energy equals the average kinetic energy, so the vibration along one line averages (R/N)T in all. With R/N = k_{B} = 1.381 × 10^{−23} J/K and T = 1500 K that is 2.071 × 10^{−20} J. Planck showed that a resonator of frequency ν, in radiation whose energy per unit volume and unit frequency is ρ_{ν}, settles at Ē_{ν} = c^{3}ρ_{ν}/(8πν^{2}). Setting Ē_{ν} = k_{B}T gives ρ_{ν} = 8πν^{2}k_{B}T/c^{3}. The energy up to ν_{c} adds this density up: the integral of 8πν^{2}k_{B}T/c^{3} from 0 to ν_{c} is (8πk_{B}T/3c^{3})ν_{c}^{3}. The factor in front is 8π × 2.071 × 10^{−20}/(3 × (2.998 × 10^{8})^{3}) = 6.44 × 10^{−45} J s^{3}/m^{3}, and multiplied by (10^{14})^{3} = 10^{42} it gives 0.00644 J/m^{3}. Up to 10^{13} Hz the cube is a thousand times smaller, 6.44 × 10^{−6} J/m^{3}, so 1 − 1/1000 = 99.9 percent of the energy lies between 10^{13} and 10^{14} Hz. Each tenfold widening multiplies the energy by 10^{3}, to 6.44 J/m^{3} at 10^{15} Hz, and there is no highest frequency at which to stop, so the total is infinite. For N: at low frequency Planck's formula αν^{3}/(e^{βν/T} − 1) becomes (α/β)ν^{2}T, because e^{βν/T} − 1 is then close to βν/T. Matching (R/N)(8π/c^{3}) = α/β gives N = (β/α)(8πR/c^{3}); with Planck's constants that is 6.17 × 10^{23}, and a hydrogen atom weighs 1/N gram, 1.62 × 10^{−24} g."
      r3: "Einstein wrote Ē for the resonator's mean energy, L for the speed of light and ρ_{ν} for the density, and he gave the result no name; the name it later carried in textbooks is Ehrenfest's, from 1911. Rayleigh had given a density growing as ν^{2}T for long waves in June 1900, and Jeans corrected its coefficient in July 1905, after this paper was received. Planck had derived the resonator relation in 1900 by treating the radiation as the most disordered process conceivable, which is how Einstein cites it; Einstein uses it without Planck's energy elements. The value N = 6.17 × 10^{23} is Planck's own. The exponent of α as the edition reads the plate, 10^{−56}, would give a tenth of that N; the constants that give 6.17 × 10^{23} need 10^{−57}, and the provenance record leaves the printed digit to a second witness."
      r3Citations:
        - "Einstein, A. (1905). Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt. Annalen der Physik 17, 132–148 (§1, §2)."
        - "Planck, M. (1900). Ueber irreversible Strahlungsvorgänge. Annalen der Physik 1, 69–122 (Einstein cites p. 99)."
        - "Rayleigh, Lord (1900). Remarks upon the law of complete radiation. Philosophical Magazine (5) 49, 539–540."
        - "Jeans, J. H. (1905). On the partition of energy between matter and aether. Philosophical Magazine (6) 10, 91–98."
        - "Ehrenfest, P. (1911). Welche Züge der Lichtquantenhypothese spielen in der Theorie der Wärmestrahlung eine wesentliche Rolle? Annalen der Physik 36, 91–118."
