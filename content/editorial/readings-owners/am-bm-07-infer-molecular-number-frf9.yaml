ownerBeadId: am-bm-07-infer-molecular-number-frf9
paper: brownian-motion
targets:
  - kind: caption
    id: bm-07
    readings:
      r0: "Watching a small sphere wander tells you how fast it spreads. If you also know the temperature, how thick the liquid is and how big the sphere is, the spreading tells you how many molecules make up a mole, and the lab shows how sure a limited number of observations can make you."
      r1: "Section 5 ends by turning its formula around: N = (t/λ_{x}^{2})(RT/(3πkP)), so a measured mean square displacement, with the temperature, the viscosity and the radius, gives the number of molecules in a gram-molecule. The instrument does this with synthetic data from a generator whose number is hidden, 3.03 × 10^{23}, deliberately not today's value, so the exercise tests the method and not the world. From 50 steps of 1 s in two directions, 100 squared steps, it estimates D = 8.83 × 10^{−13} m^{2}/s, with a 95 percent interval from 6.81 to 11.89 × 10^{−13}. Displacements alone fix only the product of radius and number, a·N = 1.46 × 10^{17} m/mol. Given the radius, 0.5 μm, the estimate is N = 2.93 × 10^{23}, with an interval from 2.17 to 3.80 × 10^{23} that contains the hidden value. With today's defined constants the same inversion is only a consistency check, because N_{A} is now fixed by definition."
      r2: "Start from what each step tells you. Along one axis a sphere's step Δ over a time τ has mean square 2Dτ, so D can be estimated as the average of Δ^{2}/(2τ). The instrument records 50 steps of τ = 1 s in two directions, 100 squared steps in all, and their average divided by 2 gives D̂ = 8.83 × 10^{−13} m^{2}/s. Because each step is a Gaussian draw, 100 D̂/D follows a chi-square law with 100 degrees of freedom, whose middle 95 percent runs from 74.2 to 129.6. So D lies between 100 D̂/129.6 = 6.81 × 10^{−13} and 100 D̂/74.2 = 11.89 × 10^{−13} m^{2}/s; the generator's own D, 8.55 × 10^{−13}, is inside. Now invert. Einstein's D = (RT/N)/(6πηa) gives a·N = RT/(6πηD̂). With R = 8.314 J/(mol K), T = 293.15 K and η = 0.001 Pa s, RT = 2437 J/mol and 6πηD̂ = 6 × 3.1416 × 0.001 × 8.83 × 10^{−13} = 1.664 × 10^{−14}, so a·N = 2437/(1.664 × 10^{−14}) = 1.465 × 10^{17} m/mol. A sphere twice as large with half as many molecules per mole wanders in exactly the same way, so the data cannot tell them apart. Give the radius, a = 0.5 × 10^{−6} m, and N = 1.465 × 10^{17}/(0.5 × 10^{−6}) = 2.93 × 10^{23}. Because N goes as 1/D, the interval turns over: the largest D gives the smallest N, so N lies between 2.17 and 3.80 × 10^{23}. Inverting also biases the estimate, since the average of 1/D̂ exceeds 1/D by the factor 100/98 = 1.020."
      r3: "Einstein's printed form is N = (t/λ_{x}^{2})(RT/(3πkP)), with k the viscosity and P the radius, and he closed by hoping a researcher would soon decide the question. Perrin did, in 1908 and 1909, following grains of gamboge and mastic whose radius he measured separately, and found N near 7 × 10^{23}. The chi-square interval, the turned-over interval for N and the bias factor are modern statistics that Einstein did not give. Since 2019 N_{A} = 6.022 140 76 × 10^{23} mol^{−1} exactly and k_{B} is fixed too, so an inversion with today's constants recovers its own inputs: it checks the method and does not count molecules."
      r3Citations:
        - "Einstein, A. (1905). Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen. Annalen der Physik 17, 549–560 (§5)."
        - "Perrin, J. (1909). Mouvement brownien et réalité moléculaire. Annales de chimie et de physique 18, 5–114."
        - "BIPM (2019). The International System of Units (SI), 9th edition. Defining constants N_A = 6.02214076e23 mol^-1 and k_B = 1.380649e-23 J/K."
  - kind: caption
    id: bm-07-identifiability
    readings:
      r0: "Displacements fix a product of radius and molecular number, not either one alone."
      r1: "The joint pair (a, N) is underdetermined until an independent radius is declared."
      r2: "Doubling the assumed particle radius a and halving the molecular number N leaves the predicted diffusion coefficient identical. Because displacements constrain only the combined product a·N, no individual confidence interval can be formed without an external measurement of particle size."
      r3: "This is the identifiability view Journey II opens before any inversion interval."
      r3Citations:
        - "Einstein, A. (1905). Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen. Annalen der Physik 17, 549–560 (§5)."
  - kind: caption
    id: bm-07-inversion-golden
    readings:
      r0: "With modern SI constants the inversion is a consistency check against defined N_A."
      r1: "N̂ = 6.02213e23 mol^-1 with the ratio to defined N_A and an estimate of k_B."
      r2: "Under the 2019 SI redefinition, the molar gas constant R and Avogadro's constant N_A are exact defined numbers, which fixes the Boltzmann constant k_B = R / N_A without measurement. Inverting displacement data with these values tests model self-consistency rather than measuring an unknown count of molecules."
      r3: "The 2019 SI defining constants make a modern-constant inversion a consistency check."
      r3Citations:
        - "BIPM (2019). The International System of Units (SI), 9th edition. Exact defining constants N_A = 6.02214076e23 mol^-1 and k_B = 1.380649e-23 J/K."
  - kind: caption
    id: bm-07-perrin-1909
    readings:
      r0: "Perrin's 1909 observations invert with a gas constant measured without counting molecules."
      r1: "The estimate is an independent-estimate beside Perrin's reported value, once the dataset is admitted."
      r2: "In Jean Perrin's 1909 observations, the macroscopic gas constant R is obtained from bulk gas laws without assuming molecular structure. When historical summary tables omit individual displacement counts, the point estimate N̂ is calculated directly, but the confidence interval is flagged as not applicable because sample uncertainty cannot be reconstructed."
      r3: "Table cells wait on the admitted HistoricalDataset; they are not invented here."
      r3Citations:
        - "Perrin, J. (1909). Mouvement brownien et réalité moléculaire. Annales de chimie et de physique 18, 5–114."
  - kind: caption
    id: bm-07-coverage
    readings:
      r0: "Repeat the procedure on many synthetic datasets and count how often the interval covers the generator value."
      r1: "Each interval moves; the generating parameter does not. The covering fraction is a property of the procedure."
      r2: "In frequentist inference, the true Avogadro number N_A is a fixed constant of nature, while the interval endpoints vary randomly from one experimental trial to the next. The stated confidence level represents the asymptotic fraction of hypothetical intervals that bracket the true value, not a posterior probability for any single calculated interval."
      r3: "The foundation node's repeated-experiment construction opens this preset."
      r3Citations:
        - "Neyman, J. (1937). Outline of a Theory of Statistical Estimation Based on the Classical Theory of Probability. Philosophical Transactions of the Royal Society of London A 236, 333–380."
