  - kind: 'derivation-step'
    id: 'chain-sr-coordinate-source-clocks/sr-coordinate-source-linear-time'
    readings:
      r0: 'Linearity leaves one unknown multiplier in the moving time.'
      r1: 'Write the linear time function as a t + Bx′ + Cy + Dz plus a constant. The sideways equations give C=D=0, the common origin fixes the constant, and the differential constraint fixes B = −av/(V²−v²).'
      r2: 'Homogeneity and inertial-coordinate conventions motivate linearity; we retain that as a premise. Then τ_t=a and τ_x′=B are constant at fixed v. Substitution into the earlier differential constraint yields B=−av/(V²−v²). The sideways synchronization calculations eliminate C and D, and choosing both origins’ zero event makes the additive constant zero. Integrating gives the displayed τ. The multiplier a is still an arbitrary function of frame speed. Assigning it the Lorentz factor here would assume the normalization we have yet to derive.'
      r3: 'Section 3 constructs the transformation by expressing moving-clock synchronization through light paths measured in the stationary system. The source uses x′ for the auxiliary x−vt, ξ for the moving longitudinal coordinate, τ for moving coordinate time, V for the speed of light, and β for the modern γ. It carries an unknown a before rewriting the map with a common φ(v); this reconstruction makes the relation φ=aβ explicit. The printed prose calls the earlier a an unknown φ(v), so the symbol’s bookkeeping changes between those stages rather than asserting a=φ for both formulas. The spherical-wave calculation is the paper’s own consistency check. The second route here is an explicitly modern pedagogical reconstruction, not an account of Einstein’s private thought process. These explanatory chains remain authored drafts and do not certify a historical or physics review.'
