  - kind: 'derivation-step'
    id: 'chain-sr-coordinate-source-rays/sr-coordinate-source-transverse-time'
    readings:
      r0: 'On the moving sideways axis, the position-dependent time term vanishes.'
      r1: 'A ray along η stays at auxiliary x′=0. The time map therefore becomes τ=at; substitute it into η=Vτ, keeping the undetermined scale visible.'
      r2: 'The sideways axis moves horizontally through K, so x=vt and x′=x−vt=0 along the ray. Setting this auxiliary coordinate to zero in the established time expression removes its position term, leaving τ=at. The light postulate in k then supplies η=Vτ. This is why the earlier right-triangle crossing time matters: a transverse light ray in k is not a ray with x=0 in K.'
