targets:
  - kind: 'derivation-step'
    id: 'chain-sr-coordinate-source-synchronization/sr-coordinate-source-departure'
    readings:
      r0: 'Assign the first moving-clock reading to the emission event.'
      r1: 'The midpoint convention compares three readings of clocks at rest in k. The departure clock is at the moving origin, where the auxiliary coordinate x′ = x − vt is zero.'
      r2: 'Keep the coordinate labels distinct. Einstein’s x′ means x − vt, a distance measured with K’s coordinates from k’s moving origin; ξ is the actual moving-frame coordinate. At emission the event has auxiliary coordinates (0,0,0,t), so τ₀ is the value τ(0,0,0,t). Replacing this event value does not assume any transformation formula for τ.'
      r3: 'Section 3 constructs the transformation by expressing moving-clock synchronization through light paths measured in the stationary system. The source uses x′ for the auxiliary x−vt, ξ for the moving longitudinal coordinate, τ for moving coordinate time, V for the speed of light, and β for the modern γ. It carries an unknown a before rewriting the map with a common φ(v); this reconstruction makes the relation φ=aβ explicit. The printed prose calls the earlier a an unknown φ(v), so the symbol’s bookkeeping changes between those stages rather than asserting a=φ for both formulas. The spherical-wave calculation is the paper’s own consistency check. The second route here is an explicitly modern pedagogical reconstruction, not an account of Einstein’s private thought process. These explanatory chains remain authored drafts and do not certify a historical or physics review.'
      r3Citations:
        - 'Einstein, A. (1905). Zur Elektrodynamik bewegter Körper. Annalen der Physik 17, 891–921, §3, pp. 897–902. Source anchors eq-s3-d1 through eq-s3-d26; notation concordance sr.xprime.auxiliaryGalileanCoordinate, sr.a.transformationCoefficientA, sr.varphi.scaleFactorUnknown.'
  - kind: 'derivation-step'
    id: 'chain-sr-coordinate-source-synchronization/sr-coordinate-source-return'
    readings:
      r0: 'Use the two different travel times measured in the stationary frame.'
      r1: 'The outward ray catches a receding endpoint at relative speed V − v; the return ray meets the origin at relative speed V + v. Add both times to t.'
      r2: 'For the outward leg, VΔt = x′ + vΔt gives Δt = x′/(V − v). For the return leg, the light and origin approach one another, giving Δt = x′/(V + v). These are K-coordinate travel times, not a claim that either frame measures a different local light speed. The return event lies again at auxiliary coordinate zero. The subluminal assumption keeps both denominators positive for a positive outward separation.'
      r3: 'Section 3 constructs the transformation by expressing moving-clock synchronization through light paths measured in the stationary system. The source uses x′ for the auxiliary x−vt, ξ for the moving longitudinal coordinate, τ for moving coordinate time, V for the speed of light, and β for the modern γ. It carries an unknown a before rewriting the map with a common φ(v); this reconstruction makes the relation φ=aβ explicit. The printed prose calls the earlier a an unknown φ(v), so the symbol’s bookkeeping changes between those stages rather than asserting a=φ for both formulas. The spherical-wave calculation is the paper’s own consistency check. The second route here is an explicitly modern pedagogical reconstruction, not an account of Einstein’s private thought process. These explanatory chains remain authored drafts and do not certify a historical or physics review.'
