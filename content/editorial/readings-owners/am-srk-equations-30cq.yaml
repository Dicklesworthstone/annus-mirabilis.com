  - kind: 'derivation-step'
    id: 'chain-sr-coordinate-source-rays/sr-coordinate-source-transverse-position'
    readings:
      r0: 'The sideways position coefficient is aV/√(V² − v²).'
      r1: 'Insert the crossing time from the right triangle into η=aVt. This gives η=[aV/√(V²−v²)]y rather than assuming η=y at the outset.'
      r2: 'The previous geometry supplies the K travel time t=y/√(V²−v²) for a positive sideways separation. Multiplication by aV gives the displayed coefficient. Reflection of the y axis extends the same linear map to negative y; this uses the stated spatial-symmetry and normalization assumptions. Its coefficient differs from the longitudinal coefficient by one factor V/√(V²−v²), so there is no basis for copying the longitudinal formula onto the transverse direction.'
