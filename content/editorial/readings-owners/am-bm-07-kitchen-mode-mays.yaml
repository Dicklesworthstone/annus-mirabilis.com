targets:
  - kind: caption
    id: brownian-data
    readings:
      r0: "Track a real particle under a microscope, load its positions, and the lab estimates how fast it spreads. It also says what that estimate assumes, and what a recording cannot tell you on its own, such as whether camera errors or a slow drift of the stage have crept in."
      r1: "The lab takes the positions of one or more particles at equal time steps, in micrometres and seconds, and estimates the diffusion coefficient from the steps: along each axis D̂ is the average of Δ^{2}/(2τ), Section 4's λ_{x}^{2} = 2Dt read backwards. Before it gives an interval it checks what that rule assumes: steps independent of one another, no steady drift, and positions without camera error. It tests for drift and for correlation between neighbouring steps, and when those checks fail it says which estimate still applies, as the camera laboratory explains. A recording alone fixes D, not the number of molecules: that also needs the temperature, the viscosity and the particle's radius, each measured separately. Loading a file does not show that it is a real measurement, or that the model fits it."
      r2: "Take bm-07's downloadable synthetic trajectory as an example: 50 steps of τ = 1 s in two directions, 100 squared steps. Their average divided by 2τ is D̂ = 8.83 × 10^{−13} m^{2}/s. Because each step is a Gaussian draw, 100 D̂/D follows a chi-square law with 100 degrees of freedom, so the 95 percent interval runs from 100 D̂/129.6 to 100 D̂/74.2, that is from 6.81 to 11.89 × 10^{−13} m^{2}/s. That interval holds only if the steps are independent and centred. A steady drift at speed u moves every step by uτ as well, adding u^{2}τ^{2} to each squared step: at u = 0.1 μm/s that is 0.01 μm^{2}, about half a percent of this trajectory's step variance of 1.77 μm^{2}, and it shows up as an average step different from zero. Camera error adds 2σ^{2} to every step's variance and makes neighbouring steps negatively correlated, by −σ^{2}; a negative correlation between neighbours is the sign of it, and then the estimator that uses disjoint pairs of frames is the one to trust. To go from D to N, Section 5 needs a·N = RT/(6πηD): at 293.15 K in water of viscosity 1 mPa·s, this D gives a·N = 1.465 × 10^{17} m/mol, and only a radius measured independently turns that into N."
      r3: "Einstein expected displacements to be measured rather than speeds, and closed Section 5 hoping that a researcher would soon decide the question. Svedberg in 1906 and Henri in 1908, with the ultramicroscope and the cinematograph, made early attempts; Perrin's measurements from 1908 gave the first convincing confirmation. The format the lab reads, one row per frame, is modern, as are its drift and correlation checks and the estimators that allow for camera noise (Berglund 2010; Vestergaard, Blainey and Flyvbjerg 2014)."
      r3Citations:
        - "Einstein, A. (1905). Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen. Annalen der Physik 17, 549–560 (§4, §5)."
        - "Henri, V. (1908). Étude cinématographique des mouvements browniens. Comptes rendus de l'Académie des sciences 146, 1024–1026."
        - "Perrin, J. (1909). Mouvement brownien et réalité moléculaire. Annales de chimie et de physique (8) 18, 5–114."
        - "Berglund, A. J. (2010). Statistics of camera-based single-particle tracking. Physical Review E 82, 011917."
        - "Vestergaard, C. L., Blainey, P. C. and Flyvbjerg, H. (2014). Optimal estimation of diffusion coefficients from single-particle trajectories. Physical Review E 89, 022726."
  - kind: caption
    id: bm-07-kitchen
    readings:
      r0: "Load a track of one particle's positions, from your own microscope video or the practice file, and the lab estimates how fast the particle spreads, after correcting for the camera's own errors. Without the particle's size it cannot go on to count molecules."
      r1: "This laboratory takes a record you made yourself, or the synthetic practice record, and asks what it can support. A record is a table of clicked positions at stated times, a calibration from pixels to micrometres, repeated clicks on one feature that does not move, and declared inputs: temperature, viscosity, exposure and, if you know it, the particle's radius. Section 4 says the displacement along one axis over a time τ has mean square 2Dτ, so D can be read backwards from measured displacements. A camera adds two things the paper does not consider. Each click misses the true centre by a little, which adds to every displacement's variance, and each frame averages the position over its exposure, which takes some away. The analysis uses disjoint pairs of frames, measures the click error on the stationary feature, fits a constant drift and corrects for both. On the practice record's x coordinate that gives D = 0.372 μm²/s, with a conservative 95 percent interval from 0.203 to 0.654 μm²/s, against 0.335 μm²/s if the camera is ignored. The record was generated with D = 0.429 μm²/s, so the interval contains the value it was made from; recovering a planted value shows that the method works, not that molecules exist. Section 5's route from D to the number of molecules N needs the radius. Without one, the record fixes only the product a·N, here 3.47 × 10^{17} m/mol. Excluded points keep their rows and their reasons, and an interval is withheld once points have been chosen by hand."
      r2: "Here is the calculation on the practice record's x coordinate, step by step. The calibration is 10 pixels per micrometre, so each clicked pixel coordinate is divided by 10. The record has 100 frames 1 s apart. Pair frame 0 with frame 1, frame 2 with frame 3, and so on: 50 pairs, each giving one displacement Δ over τ = 1 s. The pairs do not share frames, because two displacements that share a frame share that frame's click error and are no longer independent. Ignoring the camera, Section 4 read backwards gives D as the average of Δ² divided by 2τ: 0.335 μm²/s. Now the camera. Thirty clicks on a feature that does not move scatter with variance σ² = 0.0283 μm², a standard deviation of 0.17 μm, or 1.7 pixels. Every displacement is the difference of two clicks, so it carries twice that variance, 2σ² = 0.057 μm², which has nothing to do with the particle. The exposure works the other way. Each frame records the particle's average position over 0.5 s, and averaging smooths the path, so a displacement between two frames is smaller on average than one between two instants. For a random walk the effect is exact: the mean square of Δ is 2D(τ − E/3) + 2σ², with E the exposure, so the effective time is 1 − 0.5/3 = 0.833 s instead of 1 s. Next, drift. The average of the 50 displacements is −0.076 μm, a fitted drift of −0.076 μm/s. Its standard error is √(0.677/50) = 0.12 μm/s, so this drift is well within chance, but subtracting it costs one degree of freedom, leaving 49. The spread of the displacements about their mean is s² = 0.677 μm². Solve for D: (0.677 − 0.057)/(2 × 0.833) = 0.620/1.667 = 0.372 μm²/s. The interval has two sources of uncertainty and spends 2.5 percent of its risk on each: a chi-square interval for s² with 49 degrees of freedom, and one for σ² with 29. Combining the largest s² with the smallest σ², and the reverse, gives 0.203 to 0.654 μm²/s, and because the two 2.5 percent risks add to at most 5 percent, the coverage is at least 95 percent. The practice record was generated with D = 0.429 μm²/s, and the interval contains it. The y coordinate of the same particle gives 0.580 μm²/s, from 0.343 to 0.995, which also contains it: with 50 pairs each, two coordinates of one track can differ this much. Last, Section 5's step. Stokes's law gives D = RT/(6πηaN), so a·N = RT/(6πηD) = 8.314 × 293.15/(6π × 0.001 × 3.72 × 10^{−13}) = 3.47 × 10^{17} m/mol. The record declares no radius, so N stays unknown: a 0.5 μm sphere would give one value and a 1 μm sphere half of it, and the displacements cannot choose between them."
      r3: "Einstein proposed the test in Section 5 without knowing whether the motion he predicted was the one already observed, and gave a number to look for: about 6 μm in a minute for a sphere 0.001 mm across in water at 17 °C. Henri filmed grains in 1908, and Perrin, from 1908, traced grain positions at fixed intervals with a camera lucida, reading displacements from the drawings much as this lab reads them from clicks. Neither corrected for the error of marking a position or for a frame's exposure. Those corrections come from the modern analysis of camera-based particle tracking, where the effective time τ − E/3 and the added 2σ² are standard results. The practice record is synthetic, and a record loaded here is the reader's own, not a reviewed measurement."
      r3Citations:
        - "Einstein, A. (1905). Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen. Annalen der Physik 17, 549–560 (§4–§5)."
        - "Henri, V. (1908). Étude cinématographique des mouvements browniens. Comptes rendus de l'Académie des sciences 146, 1024–1026."
        - "Perrin, J. (1909). Mouvement brownien et réalité moléculaire. Annales de chimie et de physique (8) 18, 5–114."
        - "Savin, T. and Doyle, P. S. (2005). Static and dynamic errors in particle tracking microrheology. Biophysical Journal 88, 623–638."
        - "Berglund, A. J. (2010). Statistics of camera-based single-particle tracking. Physical Review E 82, 011917."
