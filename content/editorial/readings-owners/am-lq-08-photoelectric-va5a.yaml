targets:
  - kind: caption
    id: lq-08
    readings:
      r0: "Light shining on a metal knocks electrons out of it. In this model, brighter light releases more of them each second but none faster, while light of a higher frequency makes the fastest ones faster, as Einstein expected if light gives up its energy in separate quanta."
      r1: "Section 8 applies the light quantum to cathode rays produced by light. In the simplest picture, which Einstein says he will assume, one quantum gives its whole energy hν to one electron; the electron spends a work Φ, characteristic of the body, in leaving it, so the fastest electrons come out with kinetic energy hν − Φ. A body charged positive just enough to keep them all in, to the potential V_{s}, satisfies eV_{s} = hν − Φ. Two consequences follow. Plotted against ν, V_{s} is a straight line whose slope, h/e, does not depend on the substance. And if each quantum acts independently of the rest, the intensity of the light changes how many electrons leave each second, not how fast they go. The defaults, 600 THz light at 1 mW on a hypothetical surface with Φ = 2.2 eV, give quanta of 2.48 eV, a threshold at 532 THz and a stopping potential of 0.281 V; with one quantum in ten releasing an electron, 2.52 × 10^{14} electrons leave each second, a current of 40.3 μA. Doubling the power doubles the current and leaves 0.281 V unchanged."
      r2: "Start with one quantum. Its energy is hν, Planck's constant times the frequency: h = 6.626 × 10^{−34} J s and ν = 6.00 × 10^{14} Hz give hν = 3.976 × 10^{−19} J. An electronvolt, the energy an electron gains in falling through one volt, is 1.602 × 10^{−19} J, so hν = 3.976/1.602 = 2.48 eV. To leave the metal an electron must do the work Φ, here 2.2 eV. If the quantum gives all its energy to one electron at the surface, the most that electron can keep is 2.481 − 2.2 = 0.281 eV. To stop it, charge the metal positive: an electron climbing back against a potential V loses eV of energy, so it turns back once eV equals its kinetic energy, and the fastest one needs V_{s} = 0.281 V. That is the stopping potential. A quantum that carries less than Φ releases nothing, so the light must have hν at least Φ, or ν at least ν_{0} = Φ/h = (2.2 × 1.602 × 10^{−19})/(6.626 × 10^{−34}) = 5.32 × 10^{14} Hz, which is 532 THz. Now the intensity. A power of 1 mW delivers 10^{−3} J each second; shared into quanta of 3.976 × 10^{−19} J, that is 10^{−3}/(3.976 × 10^{−19}) = 2.52 × 10^{15} quanta each second. If one in ten releases an electron, 2.52 × 10^{14} electrons leave each second, and since each carries 1.602 × 10^{−19} C the current is 2.52 × 10^{14} × 1.602 × 10^{−19} = 4.03 × 10^{−5} A, or 40.3 μA. Double the power to 2 mW and there are twice as many quanta, so twice the current, 80.6 μA; each quantum still carries 2.48 eV, so the fastest electron still needs 0.281 V to stop. Einstein's own check sets the work to nothing, Φ = 0, and takes ν = 1.03 × 10^{15} Hz, where the solar spectrum ends in the ultraviolet. Then eV_{s} = hν gives 4.26 V with today's constants. He printed 4.3 V and said it agrees in order of magnitude with Lenard's results."
      r3: "Einstein wrote the quantum's energy as (R/N)βν, with R the gas constant, N the number of molecules in a gram-molecule and β the constant in Wien's exponent, so (R/N)β is Planck's h. He wrote Π for the potential, ε for the electron's charge and P for the work, and also gave the law per gram-equivalent of charge, ΠE = Rβν − P′. He called complete transfer to one electron the simplest picture, and allowed that an electron might take up only part of a quantum, in which case ΠE + P′ ≤ Rβν. In 1905 the prediction was untested: Lenard had reported in 1902 that the electrons' speed does not depend on the intensity of the light, but nobody had yet measured the straight line Einstein predicted. Millikan did so in 1916, finding a slope that gave Planck's h to within about half a percent, while calling the theory by which Einstein had reached the equation untenable. The word photon is Lewis's, from 1926."
      r3Citations:
        - "Einstein, A. (1905). Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt. Annalen der Physik 17, 132–148 (§8)."
        - "Lenard, P. (1902). Ueber die lichtelektrische Wirkung. Annalen der Physik 8, 149–198."
        - "Millikan, R. A. (1916). A direct photoelectric determination of Planck's \"h\". Physical Review 7, 355–388."
        - "Lewis, G. N. (1926). The conservation of photons. Nature 118, 874–875."
  - kind: caption
    id: lq-08-data
    readings:
      r0: "Enter stopping voltages measured at several frequencies, and the lab fits a straight line through them. The slope estimates Planck's constant divided by the electron's charge, but the line alone cannot give the surface's escape work unless you also know the instrument's voltage offset."
      r1: "§8 of the light-quanta paper gives, for an electron that takes one quantum's energy and leaves the surface, Πε = (R/N)βν − P: the stopping potential Π rises in a straight line with the frequency ν, with a slope, (R/N)β/ε in Einstein's notation and h/e in ours, that should not depend on the substance. The workbench fits that line to a record: measured stopping voltage = slope × frequency + intercept. On the constructed example, five points from 500 to 900 THz, each with a standard uncertainty of 0.04 V, the fitted slope is 0.00399 ± 0.00013 V/THz. Multiplied by the elementary charge that is h = (6.39 ± 0.20) × 10^{−34} J·s, 3.5 percent below the defined 6.626 × 10^{−34}, a difference of about 1.2 standard errors. The reduced chi-square is 1.71 with 3 degrees of freedom: a diagnostic of how well the declared errors describe the scatter, not a verdict. The intercept, −1.49 V, mixes two things, the escape work per unit charge and a voltage offset common to every reading, such as the contact potential between the two electrodes. With the offset unknown, the workbench reports the work function as underdetermined. Enter an independently calibrated offset of 0 ± 0.01 V and it gives 1.49 ± 0.09 eV and a threshold of 374 ± 12 THz. The other two examples show what a fit can reveal: a curved trend leaves its residuals in a U shape with a reduced chi-square of 13, and a point with a 1 V uncertainty can sit 1.02 V off the line and still count for little. A straight line does not prove the quantum account by itself; it passes one test the account sets."
      r2: "Write the single-quantum budget for one electron. A quantum of light carries the energy hν. Part of it, the escape work W, is spent getting the electron out of the surface, and the rest is the electron's kinetic energy. To stop the electron, the collector must be made negative enough that the electron's charge e times the voltage equals that kinetic energy, so eV = hν − W, or V = (h/e)ν − W/e. That is a straight line in ν with slope h/e. A real instrument adds a common voltage V_{off} to every reading, for instance the contact potential between two different metals, so the measured line is V = (h/e)ν + (V_{off} − W/e). Now fit the constructed record: 0.52, 0.85, 1.36, 1.66 and 2.11 V at 500, 600, 700, 800 and 900 THz, each with σ = 0.04 V. With equal uncertainties the weighted fit is ordinary least squares. The mean frequency is 700 THz and the mean voltage 1.30 V. The slope is the sum of (ν − 700)(V − 1.30) divided by the sum of (ν − 700)². The numerator is (−200)(−0.78) + (−100)(−0.45) + 0 + (100)(0.36) + (200)(0.81) = 156 + 45 + 36 + 162 = 399 V·THz, and the denominator is 40 000 + 10 000 + 0 + 10 000 + 40 000 = 100 000 THz², so the slope is 0.00399 V/THz. Its variance is σ² divided by the same sum, 0.0016/100 000 = 1.6 × 10^{−8}, a standard error of 0.000126 V/THz. The intercept is 1.30 − 0.00399 × 700 = −1.493 V. The residuals, data minus line, are 0.018, −0.051, 0.060, −0.039 and 0.012 V. The sum of their squares divided by σ² is 5.12, and divided by the 3 degrees of freedom left after fitting two numbers that is 1.71. A slope of 0.00399 V/THz is 3.99 × 10^{−15} V·s, and multiplied by e = 1.602 × 10^{−19} C it gives h = 6.39 × 10^{−34} J·s, against the defined 6.626 × 10^{−34}: the slopes differ by 0.00015 V/THz, about 1.2 standard errors. The intercept, −1.493 V, equals V_{off} − W/e. One equation cannot fix two unknowns: W/e = 1.49 V with no offset, or 1.99 V with an offset of +0.5 V, fits the same line equally well. Supplying V_{off} = 0 ± 0.01 V gives W/e = 1.493 V, so W = 1.49 eV, with an uncertainty of √(0.0903² + 0.01²) = 0.091 eV, and a threshold frequency W/h = 1.493/0.00399 = 374 THz. The threshold is where the corrected line crosses zero, not where the raw readings would, and the workbench carries the slope and intercept uncertainties and their covariance into its ±12 THz."
      r3: "Einstein offered the line as a test he could not yet make. With the data then available he checked only the order of magnitude, about 4.3 volts for ν = 1.03 × 10^{15} s^{−1} with the escape work set to zero, against Lenard's results, and wrote that if the formula is right the curve must be a straight line whose slope does not depend on the substance. Richardson and Compton in 1912 found the maximum energy of the electrons rising roughly linearly with frequency, and Millikan's sodium and lithium measurements of 1916, which corrected for the contact potential between his electrodes, gave h ≈ 6.57 × 10^{−27} erg·s from the slope. Millikan still called the physical theory behind the equation untenable. The examples here are constructed, and a record loaded here is the reader's own, not a reviewed measurement."
      r3Citations:
        - "Einstein, A. (1905). Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen Gesichtspunkt. Annalen der Physik 17, 132–148 (§8)."
        - "Lenard, P. (1902). Ueber die lichtelektrische Wirkung. Annalen der Physik 8, 149–198."
        - "Richardson, O. W. and Compton, K. T. (1912). The photoelectric effect. Philosophical Magazine (6) 24, 575–594."
        - "Millikan, R. A. (1916). A direct photoelectric determination of Planck's \"h\". Physical Review 7, 355–388."
