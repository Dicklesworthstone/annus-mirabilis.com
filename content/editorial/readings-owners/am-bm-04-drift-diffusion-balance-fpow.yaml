targets:
  - kind: caption
    id: bm-04
    readings:
      r0: "Push every suspended particle the same way with a small steady force and they drift and pile up, while their random jostling spreads them back out. When the two balance, the strength of the jostling is fixed by the temperature and the drag of the liquid alone, whatever the force was."
      r1: "Section 3 imagines a force K acting along x on every suspended particle. In equilibrium the force is balanced by osmotic pressure: Kν = ∂p/∂x, with p = (RT/N)ν, so the density falls off exponentially over a length (RT/N)/K. Einstein then reads the same equilibrium as two opposite processes. The force drives each sphere at K/(6πkP), carrying νK/(6πkP) particles through unit area each second, and diffusion carries D ∂ν/∂x back; for the two to cancel everywhere, D = (RT/N)/(6πkP). The force does not appear in the result. The instrument takes a sphere of radius 0.5 μm in water at 20 °C, with viscosity 1.002 mPa·s, and a force of 4.05 fN, chosen so that the decay length k_{B}T/F is 1 μm. The drag gives a drift of 0.429 μm/s and D = 0.429 μm^{2}/s, and the density in a 10 μm box relaxes towards that 1 μm exponential. With the jostling switched off, Nägeli's objection, only the drift is left and the particles pile against the wall; with it doubled, the profile stretches to 2 μm, twice what osmotic balance allows."
      r2: "Take unit cross-section and a force K on each particle along x. The suspended particles exert an osmotic pressure p = (RT/N)ν, like a gas of ν particles per unit volume. For a thin slab to stay at rest, the force on its particles, Kν per unit volume, must be matched by the change of pressure across it: Kν = dp/dx = (RT/N) dν/dx. So ν changes by the same fraction, K/(RT/N), over every unit of length, which makes the profile an exponential with decay length (RT/N)/K = k_{B}T/K. With k_{B}T = 1.381 × 10^{−23} × 293.15 = 4.047 × 10^{−21} J and K = 4.047 × 10^{−15} N, that length is 10^{−6} m, 1 μm. Now the moving picture. Stokes's law gives a sphere of radius P, in a liquid of viscosity k, the speed K/(6πkP) under the force K. Here 6πkP = 6 × 3.1416 × 0.001002 × 0.5 × 10^{−6} = 9.44 × 10^{−9} kg/s, so the drift speed is 4.047 × 10^{−15}/(9.44 × 10^{−9}) = 4.29 × 10^{−7} m/s, or 0.429 μm/s, and ν such spheres per unit volume carry νK/(6πkP) across unit area each second. Diffusion carries D dν/dx the other way. In equilibrium the two cancel: νK/(6πkP) = D dν/dx. Put in dν/dx = νK/(k_{B}T) from the pressure balance: νK/(6πkP) = DνK/(k_{B}T). Both ν and K cancel, leaving D = k_{B}T/(6πkP) = 4.047 × 10^{−21}/(9.44 × 10^{−9}) = 4.29 × 10^{−13} m^{2}/s. The same D follows from any force at all, which is why Einstein can use an imagined one. The flow around the sphere is extremely slow, with a Reynolds number of 2 × 10^{−7}, so Stokes's law applies. In the box the density starts uniform and, after 1 s, the drift still outweighs the returning diffusion, so it is still settling towards the exponential."
      r3: "Einstein wrote K for the force, ν for the number of particles per unit volume, k for the viscosity and P for the radius. The force is a device of the argument, and it drops out of the result. The same relation, D = (RT/N)/(6πkP), was found independently by Sutherland in 1905 and is often called the Stokes–Einstein relation. Nägeli had argued in 1879 that molecular impacts are far too small to move a visible particle; the branch with the jostling switched off shows what the balance would look like without them, drift alone with nothing to hold the particles off the wall. Stokes's law for the drag on a sphere dates from 1851."
      r3Citations:
        - "Einstein, A. (1905). Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von in ruhenden Flüssigkeiten suspendierten Teilchen. Annalen der Physik 17, 549–560 (§3)."
        - "Sutherland, W. (1905). A dynamical theory of diffusion for non-electrolytes and the molecular mass of albumin. Philosophical Magazine (6) 9, 781–785."
        - "Nägeli, C. von (1879). Über die Bewegungen kleinster Körperchen. Sitzungsberichte der mathematisch-physikalischen Classe der k. b. Akademie der Wissenschaften zu München 9, 389–453."
        - "Stokes, G. G. (1851). On the effect of the internal friction of fluids on the motion of pendulums. Transactions of the Cambridge Philosophical Society 9, 8–106."
