# Editorial voice overrides (content/editorial/voice-rules.yaml is the rule set this overrides).
# No overrides are recorded yet; leaving this empty is the honest state until a reviewed exception
# is actually granted. An entry without "reason" or "reviewer" is itself an error, and an entry
# whose "matchedText" no longer occurs in its "target" is flagged as stale.
#
# Format of one entry:
#   - target: <record id, matched EXACTLY - see am-s64j. A file path is not supported: the
#             matcher only ever receives a record id, so a path target matches nothing.>
#     rule: <the voice-rules.yaml rule id this overrides>
#     matchedText: <the exact text the rule matched>
#     reason: <why this specific text is allowed here>
#     reviewer: <a reviewer id from docs/OWNERS.md>
#     date: <YYYY-MM-DD>
overrides: []
