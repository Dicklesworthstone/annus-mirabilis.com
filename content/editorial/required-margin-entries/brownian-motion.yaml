# The required historian's-margin entries of the master plan section 3.9, transcribed.
# See mass-energy.yaml in this directory for what this file is and is not.
#
# None of the seven is present. The three editorial notes this paper has are notation and
# qualification notes (k is viscosity, four letters change meaning between papers, the paper's
# stated uncertainty about the reports). All three are legitimate and none is a section 3.9 entry.
paper: brownian-motion
planSection: "3.9"
ownerBead: am-bm-margin-entries-7fa4
revision: 2
# The bead's acceptance criteria read "All seven records and the verification note exist", so the
# denominator is eight rather than section 3.9's seven.
additionalRequired:
  - name: verification-note
    proposition: "The note recording which factual claims were checked against which primary source, with name, date and edition, which this bead requires separately from the seven entries."
entries:
  - letter: a
    proposition: "Sutherland's independent derivation and its history: Dunedin in January 1904, a misprinted congress proceedings version in early 1905, and Phil. Mag. in June 1905, between Einstein's submission and publication."
    namedSources: ["Sutherland 1904", "Sutherland, Phil. Mag. June 1905"]
    requiresCitations: ["cit-sutherland-1905"]
  - letter: b
    proposition: "Smoluchowski's independent kinetic derivation of 1906, with a different numerical factor."
    namedSources: ["Smoluchowski 1906"]
    # NOT AUTHORABLE TODAY, AND THE REPOSITORY HAD ALREADY SAID SO IN ITS OWN WORDS. The citation
    # resolves, so this entry is not waiting on the bibliography; what it waits on is the one thing
    # its proposition asserts. content/equation-explanations/brownian-motion/eq-s5-d2.yaml closes
    # its r3 with "this edition registers its identity and not its content, so how his numerical
    # factor stands to this one is not stated here". Writing the factor into a margin note would
    # contradict a decision this edition has already taken in a reader-facing record, and would do
    # it from memory rather than from the paper.
    #
    # Recorded here on 2026-10-19 rather than left for the next reader to re-derive, which is the
    # lesson light-quanta (b) left behind in the other direction: a judgement that a claim cannot
    # be grounded has to search the repository, and when the search finds the edition's own refusal
    # it belongs in this file beside the entry.
    claimNotGroundable:
      reportedOn: "2026-10-19"
      groundedBy: "Smoluchowski's identity and date are pinned as cit-smoluchowski-1906, and two reader-facing records already carry what this edition knows of him: content/equation-explanations/brownian-motion/eq-s5-d2.yaml gives the locator Ann. Phys. (4) 21, 756-780 (1906) and calls it an independent kinetic treatment of the same motion published in this journal the following year, and content/arguments/brownian-motion/arg-bm-diffusivity.json says he reached the displacement law by another route in 1906. The independence and the year are therefore grounded."
      missing: "The numerical factor, which is the only thing the proposition adds to what is already written. Nobody in this repository has read Ann. Phys. (4) 21, 756-780, and eq-s5-d2.yaml states in the edition's own voice that it registers the paper's identity and not its content, so how Smoluchowski's factor stands to Einstein's is deliberately unstated. A margin note asserting it would be a claim about a text no pinned source here reproduces."
    requiresCitations: ["cit-smoluchowski-1906"]
  - letter: c
    proposition: "Bachelier's 1900 random-walk mathematics for stock prices."
    namedSources: ["Bachelier 1900"]
    requiresCitations: ["cit-bachelier-1900"]
  - letter: d
    proposition: "Einstein's assumption that the interval tau is long compared with the momentum relaxation time. For shorter intervals the motion is ballistic, with mean square displacement proportional to t squared, first measured in 2010 and 2011."
    namedSources: ["Li et al., Science 2010", "Huang et al., Nature Physics 2011"]
    # SATISFIED 2026-10-14 by note-bm-d-tau-and-the-ballistic-regime. Einstein's own statement of
    # the condition is on the page (s4-p3, quoted in that record's evidence); the identification
    # of his lower limit with the momentum relaxation time is marked there as a later reading and
    # not his phrase. The two modern papers are named by the titles their publishers registered,
    # which is all that is checked: neither was read, and the plan's "first measured" is left as
    # the plan's claim rather than restated as this edition's.
    satisfiedBy: note-bm-d-tau-and-the-ballistic-regime
    requiresCitations: ["cit-li-2010", "cit-huang-2011"]
  - letter: e
    proposition: "The 1911 viscosity correction and Bancelin's measurement."
    namedSources: ["Einstein 1911 correction", "Bancelin"]
    requiresCitations: ["cit-einstein-1911-viscosity", "cit-bancelin-1911"]
  - letter: f
    proposition: "Perrin's program of 1908 to 1909 and his 1926 Nobel Prize."
    namedSources: ["Perrin 1909"]
    requiresCitations: ["cit-perrin-1909"]
  - letter: g
    proposition: "Exner's 1900 velocity measurements and why the observable was wrong."
    namedSources: ["Exner 1900"]
    # SATISFIED 2026-10-14 by note-bm-g-exner-measured-the-wrong-quantity. Both halves are
    # grounded in this repository: what Exner measured comes from the shelf card
    # exner-1900-particle-speeds, including his own stated limits, and why the observable fails is
    # this edition's authored fork arg-fork-exner, whose verdict is `correct-but-weaker` rather
    # than a refutation. His paper was not read; the card reports him at one remove and the record
    # says so.
    satisfiedBy: note-bm-g-exner-measured-the-wrong-quantity
    requiresCitations: ["cit-exner-1900"]
