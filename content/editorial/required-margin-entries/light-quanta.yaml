# The required historian's-margin entries of the master plan section 3.9, transcribed.
# See mass-energy.yaml in this directory for what this file is and is not.
paper: light-quanta
planSection: "3.9"
ownerBead: am-lq-margin-entries-bo1b
revision: 2
# THE BEAD NAMES THESE RECORDS `lq-margin-a` THROUGH `lq-margin-e`, AND NO RECORD ON DISK CARRIES
# ANY OF THOSE IDS. The five editorial notes this paper has are notation notes under `note-lq-*`
# ids. So the bead's criterion "Records lq-margin-a ... lq-margin-e exist" is unmet by name as well
# as by content, and whether the id convention is `lq-margin-<letter>` or `note-lq-<letter>-<slug>`
# (which is what mass-energy's completed set uses) is unsettled. Flagged, not chosen.
#
# This bead's own acceptance criteria include "The definition-of-done audit finds the required list
# complete", which is the check this directory makes possible.
entries:
  - letter: a
    proposition: "The photoelectric equation is not, by itself, proof that light consists of photons: a semiclassical theory with quantized matter and a classical field reproduces it. The decisive evidence came with Compton scattering and, for single photons, photon anti-bunching. The site does not repeat the textbook simplification."
    namedSources: ["Lamb and Scully 1969", "Compton 1923", "Kimble, Dagenais, and Mandel 1977"]
    requiresCitations: ["cit-lamb-scully-1969", "cit-compton-1923", "cit-kimble-dagenais-mandel-1977"]
  - letter: b
    proposition: "Millikan verified the equation to better than one percent in 1916 while rejecting the light-quantum hypothesis it came from."
    namedSources: ["Millikan 1916"]
    satisfiedBy:
      - note-lq-b-millikan-verified-and-rejected
    requiresCitations: ["cit-millikan-1916"]
    # SUPERSEDED ON 2026-10-14, AND THE SUPERSEDING EVIDENCE WAS ALREADY HERE. This entry carried
    # a `claimNotGroundable` block recorded on 2026-10-08, which said the citation resolves and the
    # entry is still not authorable: the two halves it asserts, the one-percent figure for h and
    # Millikan's rejecting the hypothesis while verifying the equation, are claims about his own
    # text, and the Internet Archive scan behind content/datasets/millikan-1916-sodium.yaml is not
    # pinned here. That reasoning was sound about the DATASET and wrong about the repository.
    #
    # src/content/lightQuantaShelf.ts's card `millikan-1916-photoelectric-h` carries a source check
    # that reads the March 1916 issue from page images and QUOTES his prose with pages: p. 355,
    # Einstein's hypothesis "bold, not to say the reckless"; p. 381, the observations "seem to leave
    # no room whatever for doubt that the agreement demanded by Einstein's equation ... actually
    # exists"; p. 383, "Yet the semi-corpuscular theory by which Einstein arrived at his equation
    # seems at present to be wholly untenable"; p. 388, "h = 6.57 x 10^-27" "with a precision of
    # about .5 per cent". Both halves are grounded, and the note authored on 2026-10-14 quotes them
    # from the card rather than claiming a reading of its own.
    #
    # The lesson is narrower than the entry: a judgement that a claim cannot be grounded has to
    # search the repository, not one record of it. The `claimNotGroundable` field is removed rather
    # than left beside a satisfying record, because the two contradict and the audit says so.
  - letter: c
    proposition: "Planck's 1913 recommendation of Einstein to the Prussian Academy excuses the light quanta as an overreach. Paraphrased, never reproduced."
    namedSources: ["Planck 1913 recommendation"]
    requiresCitations: ["cit-planck-1913-recommendation"]
  - letter: d
    proposition: "Einstein's 1951 letter to Besso, that fifty years of brooding had brought him no closer to answering what light quanta are. Paraphrased, never reproduced."
    namedSources: ["Einstein to Besso, 1951"]
    requiresCitations: ["cit-einstein-besso-1951"]
  - letter: e
    proposition: "The section 1 derivation of the equipartition spectrum is independent of, and contemporary with, Jeans's 1905 correction of Rayleigh's constant; and the phrase \"ultraviolet catastrophe\" is Ehrenfest's, from 1911, and is labeled as later."
    namedSources: ["Rayleigh June 1900", "Jeans 1905", "Ehrenfest 1911"]
    # BOTH HALVES ARE NOW CARRIED, by two records rather than one, which is why this is a list.
    # note-lq-e-equipartition-predates-jeans (2026-10-14) covers the half that was missing: that
    # section 1's equipartition derivation is Einstein's own and cannot rest on Jeans, because
    # Jeans's paper is the Philosophical Magazine issue for July 1905 and this paper was received
    # on 18 March and published on 9 June 1905. Independence follows from the chronology alone.
    #
    # ONE CHARACTERISATION IS STILL THE PLAN'S AND NOT THIS REPOSITORY'S. That Jeans's 1905 paper
    # corrects RAYLEIGH'S CONSTANT is the proposition above; what is pinned here is its identity
    # and date (cit-jeans-1905: "XI. On the partition of energy between matter and AEther",
    # Phil. Mag. (6) 10 (55), 91-98, July 1905, from the publisher's registered metadata). Nobody
    # has read the paper. The entry's own argument does not depend on it: the independence turns
    # on the dates, not on what Jeans concluded.
    satisfiedBy:
      - note-lq-ultraviolet-catastrophe-is-ehrenfests
      - note-lq-e-equipartition-predates-jeans
    requiresCitations: ["cit-rayleigh-1900", "cit-jeans-1905", "cit-ehrenfest-1911"]
