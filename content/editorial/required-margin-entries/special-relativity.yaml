# The required historian's-margin entries of the master plan section 3.9, transcribed.
# See mass-energy.yaml in this directory for what this file is and is not.
#
# This paper's four editorial notes are notation notes (beta is the modern gamma, tau is not proper
# time), one qualification note (no experiment is named), and one that covers part of (e). The
# notation notes belong to the concordance and are not section 3.9 entries.
paper: special-relativity
planSection: "3.9"
ownerBead: am-sr-margin-entries-tn4l
revision: 2
# The bead requires "the reception and confirmation records" in addition to (a) through (h), and
# does NOT enumerate them, so this file does not invent a count. Recorded as unenumerated rather
# than guessed, because a denominator nobody wrote down is the exact gap this directory exists to
# close and inventing one here would reproduce it.
# This bead also carries a human gate: "A named human reviewer has accepted the records".
additionalRequired:
  - name: reception-and-confirmation-records
    proposition: "The reception and confirmation records, with dates and exact citations, such that every confirmation cited by a relativity reading resolves to a record or a timeline card."
    enumerated: false
entries:
  - letter: a
    proposition: "The paper has no references and closes by thanking Besso."
    namedSources: ["ap-17-891, closing"]
    requiresCitations: ["ap-17-891"]
    satisfiedBy: note-sr-a-no-references-thanks-besso
  - letter: b
    proposition: "The 1905 manuscript was discarded. Einstein wrote out a copy by hand in 1943 for a war-bond auction, and that copy is in the Library of Congress."
    namedSources: ["Library of Congress, 1943 holograph"]
    requiresCitations: ["cit-loc-1943-holograph"]
  - letter: c
    proposition: "Einstein's later statement to Shankland that Fizeau's experiment and stellar aberration weighed more with him than Michelson and Morley."
    namedSources: ["Shankland 1963"]
    requiresCitations: ["cit-shankland-1963"]
  - letter: d
    proposition: "Lorentz 1904 and Poincare 1905, the 5 June note and the Palermo paper, stated from what they wrote, with the difference in interpretation and the ether."
    namedSources: ["Lorentz 1904", "Poincare, 5 June 1905 note", "Poincare, Palermo 1906"]
    requiresCitations: ["cit-lorentz-1904", "cit-poincare-1905-note", "cit-poincare-1906-palermo"]
  - letter: e
    proposition: "The transverse mass and Planck 1906."
    namedSources: ["Planck 1906"]
    partial:
      satisfiedBy: note-sr-transverse-mass-depends-on-the-force-convention
      covers: "The force-convention half: that the section 10 transverse mass is not a property of the electron alone, which Einstein says on printed page 919."
      missing: "Planck 1906, which is what makes this a historical entry rather than a reading of the page."
    requiresCitations: ["cit-planck-1906"]
  - letter: f
    proposition: "The equator-clock remark and the geoid."
    namedSources: ["Hafele 1970"]
    requiresCitations: ["cit-hafele-1970"]
  - letter: g
    proposition: "The footnote conceding the imprecision of the rigid-body concept."
    namedSources: ["ap-17-891, footnote"]
    requiresCitations: ["ap-17-891"]
    # THE PLAN'S DESCRIPTION DOES NOT MATCH THE PLATES, and this bead asked for exactly this check:
    # "the correction of the plan's rigid-body description if the facsimile confirms the witness".
    # Read from the pinned facsimile's page images on 2026-10-08 (pdftoppm renders pixels; the
    # embedded text layer is forbidden and was not used). The paper has FOUR footnotes and neither
    # of the two candidates is what the plan describes:
    #
    #   s1-fn1, printed p. 893 -- DOES concede an imprecision, but of GLEICHZEITIGKEIT, not
    #     rigidity: "Die Ungenauigkeit, welche in dem Begriffe der Gleichzeitigkeit zweier
    #     Ereignisse an (annaehernd) demselben Orte steckt und gleichfalls durch eine Abstraktion
    #     ueberbrueckt werden muss, soll hier nicht eroertert werden."
    #   s4-fn1, printed p. 903 -- IS the rigid-body footnote, attached to "eine starre Kugel" in
    #     the first line of section 4, and it concedes nothing. It defines: "Das heisst einen
    #     Koerper, welcher ruhend untersucht Kugelgestalt besitzt."
    #
    # Both machine-draft transcriptions match their plates exactly, which is also a check on those
    # two drafts. The other two footnotes are s2-fn1 (p. 896, defining "Zeit") and s6-fn1 (p. 909,
    # a symmetry argument).
    #
    # So the entry as written describes a footnote that does not exist. Whether (g) should become
    # the simultaneity concession, the rigid-sphere definition, or both as one entry about what the
    # paper does and does not concede, is the owner's call. Reported, not chosen, and the plan text
    # above is left exactly as section 3.9 prints it.
    planDescriptionDisputed:
      reportedOn: "2026-10-08"
      evidence: "pinned facsimile ap-17-891.pdf, page images for printed pages 893 and 903"
      candidates: ["s1-fn1", "s4-fn1"]
      finding: "No footnote concedes an imprecision of the rigid-body concept. s1-fn1 concedes one about simultaneity; s4-fn1 is attached to the rigid sphere and is a definition."
  - letter: h
    proposition: "The notation V and beta."
    namedSources: ["ap-17-891"]
    requiresCitations: ["ap-17-891"]
