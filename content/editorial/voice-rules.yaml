# Editorial voice rules (AGENTS.md "Editorial Voice", "Engineering Doctrine" item 13,
# "Typed results", "Reasonable alternatives deserve a fair hearing"). Bead: am-edit-voice-lint-trmf.
#
# This is the ONE list and ONE override mechanism per kind of vocabulary. Surfaces that need
# theater, mockery, overclaim, or independence-claim vocabulary call src/content/checks/voice's
# checkVoice() rather than keeping a second copy; src/content/checks/voice/noParallelDenyLists.test.ts
# enforces that no second list exists anywhere in the tree.
#
# status-enum-leak id groups are data, not code, so a later bead adds one line, not a matcher
# change. Each group below is labeled with the bead that registers those ids in
# src/experiments/results/{types,outcomes,refusalCodes}.ts. A registered id missing here is a
# build failure (am-rt-typed-results-mqb requirement 11 reads this file against the live
# registries), never a style note.

contexts:
  default: prose
  known:
    - prose
    - ui-label
    - task-feedback
    - reader-progress
    - journey-branch
    - countermodel-cell
    - independence-claim

rules:
  em-dash:
    description: "U+2014 (em dash) anywhere in scanned text."
    kind: literal-chars
    chars:
      - "—"
    defaultSeverity: error
    quotationExempt: true
    translationSeverity: flag

  ascii-dash:
    description: "Two hyphens used as a word-joining dash, not as a command-line flag."
    kind: regex
    pattern: "(?<=[A-Za-z0-9)])[ \\t]--[ \\t](?=[A-Za-z0-9(])"
    defaultSeverity: error
    quotationExempt: true
    codeSpanExempt: true
    translationSeverity: flag

  hype-word:
    description: "seminal, pivotal, groundbreaking, revolutionary, in any inflection."
    kind: word-list
    words:
      - seminal
      - pivotal
      - groundbreaking
      - revolutionary
      - revolutionize
      - revolutionizes
      - revolutionized
      - revolutionizing
      # German inflection, banned like the English ones except for the one attributed exception
      # immediately below (Einstein's own "sehr revolutionär" to Habicht).
      - revolutionär
    defaultSeverity: error
    quotationDowngrade: flag
    exception:
      attribution: habicht-letter
      phrase: "sehr revolutionär"
      passesOutright: true

  unlock:
    description: '"unlock" in any form.'
    kind: word-list
    words:
      - unlock
      - unlocks
      - unlocked
      - unlocking
    defaultSeverity: error

  not-x-its-y:
    description: 'The construction "it''s not X, it''s Y" and close variants.'
    kind: regex
    pattern: "it'?s not [^,.;]+, ?it'?s "
    defaultSeverity: flag

  condescension:
    description: 'obviously, clearly, "it is easy to see," trivially.'
    kind: phrase-list
    phrases:
      - obviously
      - clearly
      - it is easy to see
      - trivially
    defaultSeverity: error

  effortless-promise:
    description: 'effortless, "master in minutes," "anyone can instantly understand," and similar.'
    kind: phrase-list
    phrases:
      - effortless
      - effortlessly
      - master in minutes
      - master it in minutes
      - anyone can instantly understand
      - instantly understand
    defaultSeverity: flag

  persona-label:
    description: "A persona or profession used as a reader-facing label, mode, or choice."
    kind: phrase-list
    phrases:
      - for programmers
      - programmer mode
      - physician mode
      - the engineer's view
      - engineer mode
      - student version
      - for readers with no algebra
      - the physicist's view
    severityByContext:
      ui-label: error
      default: flag

  level-assignment:
    description: '"your level," "beginner mode," "advanced users only," "placement test."'
    kind: phrase-list
    phrases:
      - your level
      - beginner mode
      - advanced users only
      - placement test
    defaultSeverity: error

  # --- status-enum-leak -------------------------------------------------------------------
  status-enum-leak:
    description: "Raw result status, execution-outcome, or refusal-code identifiers in visitor-facing text."
    kind: status-enum-leak
    defaultSeverity: error
    singleWordProseSeverity: flag
    ids:
      # Result statuses (am-rt-typed-results-mqb). "value" and "symbolic" are ordinary words and
      # are deliberately absent; the rendered-string test of am-rt-typed-results-mqb covers them.
      statuses:
        - analytic-limit
        - underdetermined
        - not-applicable
        - outside-domain
      # Execution outcomes (am-rt-typed-results-mqb). "cancelled" and "superseded" are ordinary
      # words and are deliberately absent for the same reason.
      executionOutcomes:
        - transport-error
        - protocol-mismatch
        - malformed-response
        - budget-exhausted
        - missing-artifact
        - artifact-mismatch
        - environment-unsupported
        - worker-crashed
        - context-lost
        - invariant-violation
      # Refusal codes, grouped by the bead that registers them.
      refusalCodes:
        # am-rt-typed-results-mqb requirement 4 (initial registry).
        - ftcs-unstable
        - off-replay-grid
        - superluminal-observer
        - outside-wien-domain
        - stokes-gas-medium
        - invalid-seed
        - nonfinite-input
        - unsupported-kernel
        - invalid-parameter
        - stream-index-overflow
        # am-rt-control-tapes-0gc requirement 7 (tape compatibility codes; reused by
        # am-inst-permalink-tape-s677 for shared links).
        - tape-version-unsupported
        - tape-model-mismatch
        - tape-artifact-mismatch
        - tape-constant-set-mismatch
        - tape-stream-version-mismatch
        - tape-allocation-mismatch
        - tape-grid-mismatch
        # am-ref-diffusion-lr3 numerical codes. drift-cfl-exceeded is the Courant condition of
        # the drift branch, a different code from ftcs-unstable (the von Neumann diffusion-number
        # limit); neither is the retired spelling cfl-unstable, which never appears here.
        - drift-diffusion-unstable
        - drift-cfl-exceeded
        - quantile-not-converged
        # am-ref-inference-2w9.
        - circular-radius-from-displacement
      # Donor labels that must never leak as a visible execution label.
      donorLabels:
        - HONEST_PLACEHOLDER
        - TS_FALLBACK

  theater:
    description: "Scoring and gamification vocabulary, and mark vocabulary on reader work."
    kind: word-list
    words:
      - streak
      - badge
      - leaderboard
      - grade
      - score
      - "% complete"
      - percent complete
      - validated
      - certified
    markWords:
      - correct
      - incorrect
      - wrong answer
      - right answer
      # Bare "wrong" is also mark vocabulary when grading an attempt ("You guessed wrong.",
      # "Wrong!"); the multi-word forms above stay for the display-badge shape ("Wrong answer").
      - wrong
      - "✓"
      - "✗"
    markWordsProseExempt: true
    # NEGATED VOCABULARY IS A DISCLAIMER, NOT AN INSTANCE (am-gzxs follow-up, 2026-09-22).
    # AGENTS.md doctrine item 13 is "No theater", so this edition's chrome keeps NAMING the
    # banned words in order to refuse them, and the rule kept reporting the refusals. Measured
    # at HEAD 81d6ec70: ALL FOUR of the theater rule's remaining findings were negated -
    # "No score, timer or answer gate is used", "not a visual fit score", "The composition
    # below is the model, not a score", and "not certified by the easier large-number example".
    # Four of four is a class, not a coincidence; the tree carries 35 sites of the same shape.
    #
    # Rewording to dodge the lint is Option A of D-2026-09-19-theater-points-compounds, which
    # that decision rejected: it taxes every author forever and pushes prose away from the
    # plainest word. This is the same move as the points construction gate, one level up.
    #
    # SCOPE IS STRUCTURAL: the exemption is applied in the `words` loop and NEVER to
    # `markWords`. Negating a noun is a disclaimer ("no badge"); negating a verdict still
    # grades the attempt, so "Your answer is not wrong" must keep firing. The counter-case is
    # already in the tree at BrownianFirstEncounter.tsx and GlossFace.render.test.tsx.
    #
    # KNOWN RESIDUAL LEAK, stated rather than discovered later. A window cannot tell whether the
    # negation attaches to the noun or to a verb before it, so "Do not lose your score" would be
    # exempted although it is gamification. Checked before shipping: that shape occurs ZERO
    # times in src and content today. A test pins the leak so the next author reads it here
    # instead of finding it.
    #
    # Four tokens, not three: "not a visual fit score" puts the marker four words back, and
    # that is real corpus text rather than a hypothetical.
    negationExempt:
      markers:
        - "no"
        - not
        - never
        - without
        - rather
        - instead
        - neither
        - nor
      maxTokensBefore: 4
    # CONSTRUCTION GATE for "points" (am-gzxs, 2026-09-22). This word is NOT in the `words`
    # list above. It is gamification vocabulary when a scoring construction reaches it and an
    # ordinary noun otherwise, and the previous remedy - enumerating exempt compounds - could
    # not express that. Measured at HEAD 5dafd774: bare "points" produced 52 of the lint's 93
    # flags over 16,918 items, every one in prose, and the three read in full were "the number
    # of independently movable points in a gas model", "lines joining recorded points", and
    # "the probability is (V/V0)^n only when the points are independent", which is Einstein's
    # statistical mechanics. The last has NO modifier noun, so no compound enumeration could
    # ever have reached it. D-2026-09-19-theater-points-compounds predicted this and named the
    # remedy: move the discriminator from the modifier noun to the scoring construction.
    #
    # THE ALLOWLIST BELOW IS STILL REQUIRED, which answers the acceptance question directly. It
    # no longer carries prose, where the gate now does the work; it carries the SCORING
    # CONTEXTS, where a bare "points" is a score display by default and "Plot all data points"
    # is a button label that must not fire. Removing it turns six existing assertions red.
    constructionGated:
      words:
        - points
      # In these three contexts the surface exists to report a reader's standing, so a bare
      # "points" is a score unless the allowlist names it as technical.
      scoringContexts:
        - ui-label
        - task-feedback
        - reader-progress
      # A trigger must appear within maxTokensBetween words BEFORE the occurrence and inside the
      # same sentence. Three is deliberate: it reaches "Earn 5 points" and "You earned 10
      # points!" and does not reach the second occurrence in "Earn 5 points for every 10 data
      # points you plot", where the verb is six tokens back and the noun is ordinary.
      triggers:
        - earn
        - earns
        - earned
        - earning
        - award
        - awards
        - awarded
        - collect
        - collects
        - collected
        - score
        - scores
        - scored
        - scoring
        - win
        - wins
        - won
        - lose
        - loses
        - lost
        - redeem
        - redeemed
        - spend
        - spent
        - tally
        - total
        - totals
        - accumulate
        - accumulated
        - bonus
        - reward
        - rewards
        - experience
        - extra
        - achievement
        - xp
      maxTokensBetween: 3
    allowlist:
      - data points
      - data point
      - plot points
      - sample points
      - grid points
    severityByContext:
      task-feedback: error
      reader-progress: error
      ui-label: error
      default: flag

  mockery:
    description: "Words that mock a historical figure, a countermodel, or a reader's earlier guess."
    kind: word-list
    words:
      - foolish
      - naive
      - naively
      - silly
      - stupid
      - absurd
      - obviously wrong
    allowlist:
      - naive estimate
      - naive estimator
      - naive estimates
      - naive estimators
    severityByContext:
      journey-branch: error
      countermodel-cell: error
      default: flag

  overclaim:
    description: "The verdict vocabulary of reception and causation, which turns evidence into a settlement."
    kind: overclaim
    phrases:
      - first decisive proof
      - finally proved
      - confirmed einstein's theory
      - vindicated
      - settled the question
      - proved
      - caused
    # "proved" alone also matches ordinary mathematical-proof language; it is allowed when a
    # nearby word marks a derivation inside a stated model rather than a verdict on the world.
    provedAllowlistNearWords:
      - theorem
      - proof route
      - converse
      - lemma
      - corollary
      - "section"
      - "§"
      - derivation
    quotationExempt: true
    severityByContext:
      prose: error
      ui-label: error
      task-feedback: error
      journey-branch: flag
      countermodel-cell: flag
      default: flag

  # independence-claim carries no active rule; am-dataset-independence-registry-3dfb matches on
  # this list for its own independence-claim-missing rule. Held here, and only here, so that
  # rule and this one never drift into two copies of the same vocabulary.
  independence-claim:
    description: "Vocabulary that marks a claim of independent determination. Data only; no rule enforced here."
    kind: data-only
    phrases:
      - independent
      - independently
      - separate determinations
      - agree independently

  pedagogy-claim:
    description: "Sitewide claims about discovery learning, direct instruction, or productive struggle."
    kind: phrase-list
    phrases:
      - discovery learning works better
      - discovery learning is generally superior
      - discovery learning is superior
      - discovery learning is best
      - productive struggle is essential
      - productive struggle is generally superior
      - productive struggle is superior
      - direct instruction is more effective
      - direct instruction is generally superior
      - direct instruction is superior
      - direct instruction is best
      - minimal guidance is generally superior
      - minimal guidance is superior
      - minimal guidance is best
      - minimal guidance is worthless
    defaultSeverity: error


  # --- de-slop rules (owner directive of 2026-09-22: "there are horrendous slop writing
  # tropes. Every word of copy on the entire site has to have /de-slopify applied to it
  # rigorously"). Added as RULES rather than as a one-time rewrite so the patterns cannot
  # come back. Every rule below is a phrase-list of NAMED collocations, never a bare word or
  # a part-of-speech pattern, for the reason recorded in docs/DECISIONS.md
  # D-2026-09-19-theater-points-compounds: a rule broad enough to catch the marketing form
  # is broad enough to fire on legitimate physics prose, and blinding it afterwards is worse
  # than scoping it correctly now. Each rule below names, in its own comment, the vocabulary
  # it deliberately does NOT claim and why.

  setup-reversal:
    description: "Reversal markers that set an expectation only to overturn it. Marketing cadence, not exposition."
    # NOT CLAIMED: the two-beat fragment headline itself ("Four papers. / A different way /
    # to ask why."). The linter sees each JSX text node separately, so a rule cannot see that
    # the fragments are adjacent. That hero is caught instead by significance-inflation, on
    # "a different way to", and voice.test.ts plants the literal string to prove it.
    kind: phrase-list
    phrases:
      - until now
      - not anymore
      - that changes now
      - all that changed
      - think again
      - "or so you might think"
      - "or so it seems"
    defaultSeverity: error

  negative-parallelism:
    description: "The marketing reversal in its lexical forms: the thing is disowned, then reasserted bigger."
    # NOT CLAIMED: the bare correlative "not only X but also Y", and bare "not just". Both are
    # ordinary measured academic prose - "the transformation is not only exact but also
    # independent of the frame" is a sentence this edition may legitimately need. Only the
    # collocations that carry the marketing register are listed.
    kind: phrase-list
    phrases:
      - not just another
      - more than just
      - "isn't just"
      - "it's not about"
      - it is not about
      - "isn't about"
      - not your average
      - "this isn't your"
    defaultSeverity: error

  copula-avoidance:
    description: "Standing in for a plain 'is' with a verb of agency, so a description sounds like an achievement."
    # NOT CLAIMED, and this is the most important exclusion in this file: "represents",
    # "acts as", "functions as", "corresponds to" and "emerges as" are all load-bearing
    # technical language in a critical edition of physics papers. Page 907 of ap-17-891 says
    # in so many words that (X, Y, Z) REPRESENTS the vector of the electric force. A rule
    # that banned those verbs would be the "data points" false positive again, one order of
    # magnitude worse. Only the inflated collocations are listed.
    kind: phrase-list
    phrases:
      - serves as a
      - stands as a
      - positions itself as
      - establishes itself as
      - "emerges as the definitive"
    defaultSeverity: error

  significance-inflation:
    description: "Claiming importance in place of stating content."
    # NOT CLAIMED: "transform", "transformation" and "transformative" are three different
    # words here. Only the last is inflation; the first two are the subject matter of
    # sections 3 and 6 of the relativity paper and appear in our own link labels. The phrase
    # matcher asserts letter boundaries, so listing "transformative" cannot reach either of
    # the others, and voice.test.ts plants that pair.
    kind: phrase-list
    phrases:
      - a different way to
      - a new way to think about
      - a different way to think about
      - at its core
      - a testament to
      - serves as a reminder
      - stands as a reminder
      - changed everything
      - changed the world
      - forever changed
      - nothing short of
      - paradigm shift
      - transformative
      - reimagine
      - reimagines
      - reimagined
      - what if I told you
      - the real question is
    defaultSeverity: error

  heres-why:
    description: "The explainer tic that announces an explanation instead of giving one."
    # NOT CLAIMED: "here" used deictically. "Here the observer measures the interval" is
    # ordinary exposition and cannot match, because every phrase below requires the
    # contraction or the copula plus a following word.
    kind: phrase-list
    phrases:
      - "here's why"
      - here is why
      - "here's how"
      - here is how
      - "here's what"
      - here is what
      - "here's the thing"
      - "but here's"
      - "and here's"
    defaultSeverity: error

  unverified-count:
    description: "A spelled-out count of a site object that drifts as the edition grows."
    # WHY THIS RULE EXISTS, and it is not a style rule. De-slopping toward specificity
    # MANUFACTURES FACTUAL CLAIMS: vague copy cannot be wrong, specific copy can. The homepage
    # hero "When each path is uncertain, what can still be predictable?" was bad writing that
    # was unfalsifiable; its replacement heading "Six laboratories and a reading path" was
    # better writing that was FALSE, contradicted by its own next paragraph, which enumerated
    # five. Two inherited counts in the same block - "six explanatory passages and thirteen
    # foundation lessons" - matched no population that could be constructed either. All three
    # shipped and were caught in review. This rule is built against that defect, not a
    # synthetic one.
    #
    # NOT CLAIMED: digits. "1905", "§ 3", "0.8 micrometres" and every measured quantity in this
    # edition are numerals and must never be touched by a voice rule; only spelled-out cardinals
    # immediately preceding a drifting-object noun can match.
    #
    # NOT CLAIMED, and this was MEASURED rather than guessed: "routes" and "experiments".
    # With both in the noun list the rule produced 6 findings across 16,918 scanned items and
    # 5 were false: "These are two accounts of one emission, not two experiments", "The two
    # routes to D agree", "Three routes toward a molecular number", "it does not provide two
    # independent experiments", and a fieldset legend "the two diffusion routes". Every one is
    # a distinction fixed by the physics, not a count of site objects that grows as the
    # edition does. Dropping the two nouns leaves the single true positive. This is the same
    # correction D-2026-09-19-theater-points-compounds records for "data points": scope the
    # rule to what it is for, rather than fire it across legitimate domain prose and then
    # blind it with exceptions.
    #
    # NOT CLAIMED: "papers". Four is fixed by the subject - the four papers Einstein sent to
    # Annalen der Physik in 1905 - and cannot drift as the edition grows, so "four papers" is
    # a permanent fact rather than an unverified count. Laboratories, lessons and passages all
    # change every time one lands, which is exactly what makes a count of them a liability.
    #
    # A count that HAS been verified is not forbidden; it goes through
    # content/editorial/voice-overrides.yaml with the command that produced it, which is the
    # repo's designed escape hatch and the same shape as every other exemption here. Naming the
    # exemption is the point; blinding the rule is what D-2026-09-19-theater-points-compounds
    # forbids.
    kind: regex
    pattern: "(?<![\\p{L}])(?:[Tt]wo|[Tt]hree|[Ff]our|[Ff]ive|[Ss]ix|[Ss]even|[Ee]ight|[Nn]ine|[Tt]en|[Ee]leven|[Tt]welve|[Tt]hirteen|[Ff]ourteen|[Ff]ifteen|[Ss]ixteen|[Ss]eventeen|[Ee]ighteen|[Nn]ineteen|[Tt]wenty)(?:\\s+[A-Za-z-]+)?\\s+(?:[Ll]aborator(?:y|ies)|[Ll]essons?|[Pp]assages?|[Ii]nstruments?|[Jj]ourneys?|[Tt]ours?|[Ff]oundations?)(?![\\p{L}])"
    defaultSeverity: flag
    quotationExempt: true
    codeSpanExempt: true
    translationSeverity: flag
    repair: "Verify the count and record the command that produced it, or write the sentence without a number."
