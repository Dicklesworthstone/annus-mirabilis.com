    text: "According to the conception of the phenomena set forth here, deviations from Stokes’s rule are conceivable in the following cases: 1. when the number of energy quanta per unit volume simultaneously undergoing transformation is so large that an energy quantum of the generated light can receive its energy from several generating energy quanta; 2. when the generating (or generated) light does not have the energetic character belonging to a “black radiation” within the range of validity of Wien’s law, that is, when, e.g., the exciting light is produced by a body of so high a temperature that Wien’s law no longer holds for the wavelength in question."
