plain:
  - lesson: hyperbolic-functions-rapidity
    latex: "\\operatorname{cosh}x"
    reason: "x here is any number the function is taken of, not the relativity paper's coordinate x."
  - lesson: hyperbolic-functions-rapidity
    latex: "\\operatorname{sinh}x"
    reason: "x here is any number the function is taken of, not the relativity paper's coordinate x."
  - lesson: hyperbolic-functions-rapidity
    latex: "\\operatorname{cosh}^2 x - \\operatorname{sinh}^2 x = 1"
    reason: "x here is any number the identity holds for, not the relativity paper's coordinate x."
  - lesson: hyperbolic-functions-rapidity
    latex: "v/c = \\operatorname{tanh}\\varphi"
    reason: "φ is the rapidity, which the relativity paper does not print; its φ is a propagation angle, so the formula stays in the ink rather than colour the rapidity as an angle."
  - lesson: hyperbolic-functions-rapidity
    latex: "\\operatorname{cosh}\\varphi"
