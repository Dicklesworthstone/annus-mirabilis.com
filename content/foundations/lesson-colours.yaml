# Lesson formulas read against their lessons (dispatch 275).
#
# A lesson's inline formula is coloured only where it is listed under `coloured`: its paper and
# section are a backlink of the lesson (an argument passage that names it), every atom resolves there
# (src/equations/printed/inlineTerms.ts over modernScope.ts), and each binding was read against the
# lesson and found to mean that quantity. Resolving is not the same as being right: a lesson is a
# general tool, so its x in cosh x resolves to the relativity paper's coordinate and is not it.
# Those are listed under `plain`, each with its reason, and stay in the ink. Every other lesson
# formula stays in the ink with a reason the page states (src/components/foundations/lessonFormulas.ts).
#
# The colour is the lessons' own palette (data-paper="foundations"), so a quantity is one colour on
# a lesson page, in its equation records and its prose alike.
#
# Reviewed by TopazPrairie (agent) on 2026-09-26, binding by binding; not a human review.
