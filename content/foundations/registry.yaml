# Canonical registry of foundation-library ids (am-found-library-infra-002t).
#
# Source of truth: the canonical id table and partition check in the epic
# am-ep-foundations-z1e ("Canonical id table and partition"), which fixes
# 36 nodes + 10 bridges = 46 ids, each with exactly one owning bead. This
# file transcribes that table; it does not invent ids, owners, or clusters.
#
# `status` reflects the real, observed state of content/foundations/*.json
# at the time this registry was written (2026-09-16), verified by reading
# each file's own `id` field, not by filename alone:
#   - 17 ids are `authored` (a matching content/foundations/<slug>.json
#     record exists with that exact id).
#   - `foundation:error-inference` is `planned`, even though
#     content/foundations/error-and-inference.json exists: that file's
#     internal id is "error-and-inference", not "error-inference", so it
#     does not match this registry entry. Flagged, not silently renamed
#     (renaming would edit a file owned by another bead's authoring lane).
#     See docs/decisions/foundation-library-scope.md.
#   - Every other id is `planned`: no matching file exists yet.
#
# `plannedCallers` is left empty for every entry. No real data exists yet
# about which future paper sections will call which foundation; inventing
# anchor ids would be exactly the fabrication AGENTS.md and the orchestrator
# forbid. Owning beads add their own plannedCallers entries as they author.
