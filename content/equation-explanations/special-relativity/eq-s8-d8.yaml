# special-relativity eq-s8-d8: what the display says, at every level (dispatch 281).
# Written from the German of s8-p7 (p. 914) and its plate; every step was checked by hand.
display: eq-s8-d8
paper: special-relativity
review: draft
inWords:
  - text: "The frequency of the incident light in the mirror's system"
    quantityId: waveFrequencyMoving
  - text: " is "
  - text: "its frequency in the stationary system"
    quantityId: waveFrequencyStationary
  - text: " times one minus "
  - text: "the speed"
    quantityId: frameSpeed
  - text: " over "
  - text: "the velocity of light"
    quantityId: speedOfLight
  - text: " times the cosine of "
  - text: "the angle of incidence"
    quantityId: propagationAngleStationary
  - text: ", divided by the square root of one minus the square of that ratio."
r0: "The frequency of the incident light in the mirror's system: Doppler's principle of § 7, applied to the light that falls on the mirror."
r1: "This completes the description of the incident light in $k$: amplitude, direction and frequency. It is § 7's Doppler principle (p. 911) for the mirror moving with $k$. The amplitude and the frequency change by the same factor."
r2:
  - latex: "\\nu' = \\nu \\frac{1 - \\cos \\varphi \\frac{v}{V}}{\\sqrt{1 - \\left( \\frac{v}{V} \\right)^2}}"
    why: "Doppler's principle, from § 7 (p. 911)."
  - latex: "\\nu' = \\nu \\frac{1 - \\frac{v}{V} \\cos \\varphi}{\\sqrt{1 - \\left( \\frac{v}{V} \\right)^2}}"
    why: "The same, with the factors of the numerator in the order this display prints them."
