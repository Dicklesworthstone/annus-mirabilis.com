# special-relativity eq-s7-d5: what the display says, at every level (dispatch 281).
# Written from the German of s7-p2 (p. 911) and its plate; every step was checked by hand.
display: eq-s7-d5
paper: special-relativity
review: draft
inWords:
  - text: "The direction cosine along the second axis in the moving system"
    quantityId: directionCosineMoving
  - text: " is "
  - text: "the stationary one"
    quantityId: directionCosineStationary
  - text: " divided by "
  - text: "the factor"
    quantityId: lorentzFactor
  - text: " and by one minus "
  - text: "the direction cosine along the motion"
    quantityId: directionCosineStationary
  - text: " times "
  - text: "the speed"
