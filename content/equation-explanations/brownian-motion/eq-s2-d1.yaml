# brownian-motion eq-s2-d1: what the display says, at every level (dispatch 282).
# Written from the German of s2-p1 and the plate of p. 551; the steps were checked by hand.
display: eq-s2-d1
paper: brownian-motion
inWords:
  - text: "How fast one of the variables that fix the state of a system"
    quantityId: stateVariable
  - text: " changes with "
  - text: "the time"
    quantityId: elapsedTime
  - text: " is given by "
  - text: "a function of the present values of all those variables"
    quantityId: stateVariableRate
  - text: "."
r0: "Section 2 begins with the kind of system its argument will use: one whose state is fixed by a list of variables, whose equations of change give each variable's rate as a function of the present values of them all, and whose flow in the space of those variables neither crowds together nor spreads out."
r1: "The section works in the framework of Einstein's two earlier papers on the foundations of thermodynamics, which the footnote cites and which, it says, a reader needs neither for this section nor for the results of the paper. Let $p_1 p_2 \\ldots p_l$ be state variables of a physical system which completely determine its momentary state, for example the coordinates and velocity components of all the atoms of the system. The complete system of the equations of change of those variables is taken to have the form $\\frac{\\partial p_\\nu}{\\partial t} = \\varphi_\\nu(p_1 \\ldots p_l)$, one equation for each $\\nu$ from 1 to $l$, and the same sentence adds the condition $\\sum \\frac{\\partial \\varphi_\\nu}{\\partial p_\\nu} = 0$. The first form says that where the system goes next is settled by where it is now, and not by the time or by its history. The second says that the flow in the space of the state variables has no sources and no sinks. Given both, the text says, the entropy of the system is the expression of the next display."
r2:
  - latex: "\\frac{\\partial p_\\nu}{\\partial t} = \\varphi_\\nu(p_1 \\ldots p_l) \\quad (\\nu = 1, 2 \\ldots l)"
    why: "As printed. There are $l$ equations, one for each state variable, and the right side of each holds only the present values $p_1 \\ldots p_l$."
  - latex: "\\sum \\frac{\\partial \\varphi_\\nu}{\\partial p_\\nu} = 0"
    why: "The condition printed in the same sentence, summed over the $l$ variables. Each term measures how much the flow along one variable's direction stretches as it moves; their sum vanishing means a set of states carried by the flow keeps its size."
r3: "The footnote to the section heading cites Einstein's own papers, Ann. d. Phys. 9, p. 417 (1902) and 11, p. 170 (1903), and says that for understanding the results of the present work, knowledge of those papers and of this section is dispensable. The section is the one place in the paper where the osmotic pressure of the first section is derived rather than assumed."
