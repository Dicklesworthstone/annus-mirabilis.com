# brownian-motion eq-s3-d4: what the display says, at every level (dispatch 282).
# Written from the German of s3-p4 and the plate of p. 554; the steps were checked by hand.
display: eq-s3-d4
paper: brownian-motion
review: draft
inWords:
  - text: "The force on one particle"
    quantityId: externalForcePerParticle
  - text: " times "
  - text: "the number of particles in unit volume"
    quantityId: numberDensity
  - text: ", less how steeply "
  - text: "the osmotic pressure"
    quantityId: osmoticPressure
  - text: " changes along the column, is zero."
r0: "The same equilibrium written with the osmotic pressure of the first two sections in it: the force on the particles of unit volume is balanced by the fall of the osmotic pressure across that volume."
r1: "Sections 1 and 2 gave the osmotic pressure of the suspended particles as $p = \\frac{R T}{N} \\nu$. The second term of equation (1) is exactly the derivative of that pressure with respect to $x$, since $R T / N$ does not vary along the column, so equation (1) can be written in this form. The sentence under it says what the form is for: the force $K$ is balanced by osmotic pressure forces. That is the point at which the argument of the first two sections enters the theory of diffusion. The equilibrium is the familiar one of a fluid in a field of force, with the osmotic pressure of the suspended substance playing the part of the pressure, and it holds only where that pressure law does, which is at great dilution."
r2:
  - latex: "p = \\frac{R T}{N} \\nu"
    why: "The osmotic pressure of the suspended particles, from sections 1 and 2."
  - latex: "\\frac{\\partial p}{\\partial x} = \\frac{R T}{N} \\frac{\\partial \\nu}{\\partial x}"
    why: "Its derivative along the column. The gas constant, the temperature and the number in a gram-molecule are the same everywhere, so only the number density is differentiated."
  - latex: "- K \\nu + \\frac{\\partial p}{\\partial x} = 0"
    why: "Equation (1) with that derivative in place of its second term."
  - latex: "K \\nu - \\frac{\\partial p}{\\partial x} = 0"
    why: "Multiplied by minus one, which is how the paper prints it: the force on the particles of unit volume against the fall of the osmotic pressure."
r3: "This is where the paper's heuristic becomes visible on the page. The pressure in the second term is van 't Hoff's osmotic pressure of 1887, stated for dissolved molecules (Z. physik. Chem. 1, 481; the margin at § 1's first display records that the paper names neither him nor his paper), and it is applied here to particles a microscope can see. § 1 says plainly how much that costs: nach der klassischen Theorie der Thermodynamik hat man nicht zu erwarten, daß auf die Wand eine Kraft wirke, because the free energy of the system does not appear to depend on where the wall and the suspended bodies are (s1-p2). The introduction states what hangs on it: if the motion is observed, classical thermodynamics is no longer exactly valid for microscopically distinguishable regions, and if the prediction fails, that is a serious argument against the molecular-kinetic conception of heat (s0-p2). Nothing in 1904 forced a physicist to grant visible particles an osmotic pressure, and a reader who wants the alternative on the table has it there."
