paper: brownian-motion
review: draft
inWords:
  - text: "The number of molecules in a gram-molecule"
    quantityId: avogadroNumberEstimate
  - text: " equals "
  - text: "the elapsed time"
    quantityId: observationInterval
  - text: " divided by the square of "
