# brownian-motion eq-s5-d1: what the display says, at every level (dispatch 279).
# Written from the German of s5-p1 (p. 559) and its plate; the steps were checked by hand.
display: eq-s5-d1
paper: brownian-motion
review: draft
inWords:
  - text: "The diffusion coefficient"
    quantityId: diffusionCoefficient
  - text: " equals "
  - text: "the gas constant"
    quantityId: molarGasConstant
  - text: " times "
  - text: "the absolute temperature"
    quantityId: temperature
  - text: ", divided by "
  - text: "the number of molecules in a gram-molecule"
    quantityId: avogadroConstant
  - text: ", and divided again by six pi times "
  - text: "the coefficient of friction of the liquid"
    quantityId: viscosity
  - text: " times "
  - text: "the radius of a particle"
    quantityId: particleRadius
  - text: "."
r0: "Section 3's value for the diffusion coefficient, brought forward. It ties the spreading of the suspended particles to the temperature, the stickiness of the liquid, and the size of a particle."
r1: "Section 5 opens by collecting the two results it needs, and this is the first: the value found in section 3 for the diffusion coefficient of a substance suspended in a liquid in the form of small spheres of radius $P$. Its route there was a balance of two processes running in opposite senses, the drift of the suspended substance under a force acting on each particle and the diffusion that the disordered molecular motion produces. The letter $k$ in it is the coefficient of friction of the liquid, its viscosity, and not Boltzmann's constant; this paper does not use $k$ for that. What the expression says is that the diffusion coefficient is inversely proportional to the viscosity and to the particle radius, and proportional to the absolute temperature, with the number of molecules in a gram-molecule standing in the denominator as the only quantity in it that was not measurable at the time."
r2:
  - latex: "\\frac{R T}{N}"
    why: "The energy per molecule at the working temperature. In section 3's first condition for equilibrium it is this quantity that converts the relative gradient of the suspended particles into the force acting on one of them. Section 5 prints neither that condition nor its letters for the force and the number density, which belong to section 3."
  - latex: "6 \\pi k P"
    why: "Stokes's resistance factor for a sphere: a particle of radius $P$ driven through a liquid whose coefficient of friction is $k$ settles at a velocity equal to the driving force divided by this. Section 3 takes it from the mechanics of a viscous liquid, not from anything molecular."
  - latex: "\\frac{R T}{N} \\cdot \\frac{1}{6 \\pi k P}"
    why: "Section 3's second condition sets the particles carried through unit cross-section by the force against those carried back by diffusion. Dividing the one condition by the other removes the force and the number density together, since both appear in each, and what is left is the energy per molecule divided by the resistance factor."
  - latex: "D = \\frac{R T}{N} \\frac{1}{6 \\pi k P} ."
    why: "That quotient is the diffusion coefficient: the printed line. Because the number density and its gradient cancel in the division, the result does not depend on how the particles happen to be distributed."
r3: "The letter $k$ here is the coefficient of friction of the liquid, its viscosity, and not Boltzmann's constant; this paper never uses $k$ for that, and the next paragraph reads its value for water at 17 degrees off the same line, which the receipt records as watch-viscosity-k (docs/provenance/ap-17-549.md). In modern notation $R/N$ is Boltzmann's constant, so the display reads $D = k_B T / (6 \\pi \\eta a)$ and goes under the name Stokes-Einstein. The resistance factor in it is not this paper's work: the footnote to the sentence that states the Stokes velocity sends the reader to Kirchhoff's Vorlesungen über Mechanik for the force a viscous liquid exerts on a moving sphere, so the molecular half of the argument is the energy per molecule and the hydrodynamic half is borrowed. W. Sutherland published a formula of this form in the same year, and this edition has read the pages: Phil. Mag. (6) 9, 781-785 (June 1905), whose p. 782 prints the diffusion coefficient as the gas constant times the temperature over six pi times the viscosity, the radius and the number of molecules in a gramme-molecule, multiplied by a factor in a coefficient of sliding friction that reduces to 1 when there is no slipping (sutherland-1905-phil-mag, read from page images on 2026-09-26). The June issue falls between Annalen's receipt of this paper on 11 May 1905 and its publication on 18 July, so the card carries it as parallel work rather than as a source, and the slip correction is Sutherland's own: it has no counterpart here."
