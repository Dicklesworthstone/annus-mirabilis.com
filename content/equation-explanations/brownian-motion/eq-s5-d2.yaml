r0: "Section 4's result, brought forward beside section 3's. The two share the diffusion coefficient, and that is what lets it be removed."
r1: "The second of the two results section 5 collects, found in section 4 for the mean of the displacements of the particles along the axis in the time $t$. It is repeated here unchanged. The point of setting the two lines side by side is that the diffusion coefficient occurs in both and is measurable in neither of the ways that matter for this paper: in section 3 it is expressed through the molecular quantities, and in section 4 through something a microscope can follow. Eliminating it between them leaves a relation between what can be watched and what cannot, which is the whole strategy of the paper."
r2:
  - latex: "\\lambda_x = \\sqrt{2 D t} ."
    why: "Section 4's result for the root of the arithmetic mean of the squares of the displacements along the axis, unchanged. It came from the solution of the diffusion equation for particles that all start together."
r3: "What the paper means by $\\lambda_x$ it states in words in § 4: die Wurzel aus dem arithmetischen Mittel der Quadrate, the root of the arithmetic mean of the squares, which later usage calls the root mean square. The arithmetic mean of the displacements themselves is a different and smaller number, about 0,80 of it for the distribution § 4 derives, so a figure from this line and a figure from a modern measurement are comparable only once both say which average they report. Whether the plate prints a mean bar over $x^2$ beneath the radical cannot be settled from the pinned scan: the receipt records a reading at 400 dpi as watch-mean-bar-lambda-p559, notes that the German sentence means the mean either way, and leaves the ruling to a reviewer with a better scan. The line also has a floor in time that it does not show, because § 4's $\\tau$ must be long enough for successive displacements to count as independent; below the time a particle takes to lose the memory of its velocity the motion is not diffusive and the mean square grows faster, which the margin note for § 4 records with the two modern measurements that reached that regime (note-bm-d-tau-and-the-ballistic-regime). M. von Smoluchowski published an independent kinetic treatment of the same motion in this journal the following year, Ann. Phys. (4) 21, 756-780 (1906); this edition registers its identity and not its content, so how his numerical factor stands to this one is not stated here."
