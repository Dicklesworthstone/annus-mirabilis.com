# brownian-motion eq-s5-d3: what the display says, at every level (dispatch 279).
# Written from the German of s5-p1 (p. 559) and its plate; the steps were checked by hand.
display: eq-s5-d3
paper: brownian-motion
inWords:
  - text: "The displacement along the axis"
    quantityId: rmsDisplacement1d
  - text: " is the square root of "
  - text: "the elapsed time"
    quantityId: observationInterval
  - text: ", times the square root of "
  - text: "the gas constant"
    quantityId: molarGasConstant
  - text: " times "
  - text: "the absolute temperature"
    quantityId: temperature
  - text: ", divided by "
  - text: "the number of molecules in a gram-molecule"
    quantityId: avogadroConstant
  - text: " and by three pi times "
  - text: "the coefficient of friction of the liquid"
    quantityId: viscosity
  - text: " times "
  - text: "the radius of a particle"
    quantityId: particleRadius
  - text: "."
r0: "Eliminate the diffusion coefficient between the two, and the displacement stands in terms of the temperature, the liquid's stickiness, the particle size, and the number of molecules in a gram-molecule. Everything but the last can be measured."
r1: "Putting the first line into the second removes the diffusion coefficient. The six pi becomes three pi because the factor two of $2 D t$ is absorbed. What the paper says of the result is that this equation lets one see how the displacement must depend on the temperature, the viscosity and the particle radius, and those dependences are worth stating carefully, because each runs through a square root. The displacement grows as the square root of the absolute temperature. It falls as the square root of the viscosity, so a liquid twice as viscous gives a displacement smaller by a factor of about 1.41, not by half. It falls in the same way with the particle radius. A reader who turns any of these into a proportionality without the root has changed the claim."
r2:
  - latex: "\\lambda_x = \\sqrt{2 D t}"
    why: "Section 4's result, from the preceding display."
  - latex: "2 D = 2 \\cdot \\frac{R T}{N} \\frac{1}{6 \\pi k P} = \\frac{R T}{N} \\frac{1}{3 \\pi k P}"
    why: "Twice section 3's diffusion coefficient: the two cancels against the six and leaves three."
  - latex: "\\lambda_x = \\sqrt{t \\cdot \\frac{R T}{N} \\frac{1}{3 \\pi k P}}"
    why: "Put that under the root in place of $2 D$."
  - latex: "\\lambda_x = \\sqrt{t} \\cdot \\sqrt{\\frac{R T}{N} \\frac{1}{3 \\pi k P}} ."
    why: "The root of a product is the product of the roots, so the time separates from the rest: the printed line, with everything that does not change during an observation gathered in the second factor."
