# light-quanta eq-s1-d5: what the display says, at every level (dispatch 279).
# Written from the German of s1-fn3, the page's footnote 2) (p. 135) and its plate; the steps were checked by hand.
display: eq-s1-d5
paper: light-quanta
inWords:
  - text: "The joint probability density of all "
  - text: "the amplitudes"
    quantityId: fourierAmplitude
  - text: " and all "
  - text: "the phases"
    quantityId: fourierPhase
  - text: " is a product of separate factors, each depending on one amplitude or on one phase alone."
r0: "Radiation is as disordered as possible when that density splits into separate factors, one for each amplitude and one for each phase. The value any one of them takes is then independent of the values of all the others."
r1: "The footnote now states its condition: the radiation is the most disordered conceivable when the density of the preceding display is a product of separate factors, one for each amplitude $A_\\nu$ that depends on it alone (the paper's F with subscripts 1, 2 and so on) and one for each phase $\\alpha_\\nu$ that depends on it alone (its f with the same subscripts). In the paper's words, the probability of a particular value of one amplitude or phase does not depend on the values the others have. It adds that the radiation of section 1 comes the closer to this condition the more each pair $A_\\nu$, $\\alpha_\\nu$ depends on emission and absorption by its own group of resonators. The footnote defines the condition; it does not show that the radiation in the enclosure meets it exactly."
r2:
  - latex: "A_\\nu"
    why: "For independent quantities the probability of a joint outcome is the product of the separate probabilities. So each amplitude gets a density of its own, depending on that amplitude alone; the paper writes these as F with the subscripts 1, 2 and so on."
  - latex: "\\alpha_\\nu"
    why: "The same for each phase, with a density of its own; the paper writes these as f with the same subscripts."
  - latex: "d W"
    why: "The condition as printed: the whole density f equals the product of all those separate factors. Put into the preceding display, the probability $d W$ splits into a product of separate probabilities, one for each amplitude and one for each phase."
r3: "In the sentence that follows, the plate of p. 135 prints 'A bez. x' where the sense requires α, the phases. The German face keeps the x as printed and marks it; the record is typo-x-for-alpha-p135 in docs/provenance/ap-17-132.md."
