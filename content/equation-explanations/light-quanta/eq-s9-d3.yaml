review: draft
inWords:
  - text: "The number of gram-molecules ionized"
    quantityId: ionizedGramMolecules
  - text: " equals "
  - text: "the quantity of light absorbed"
    quantityId: absorbedLightEnergy
  - text: " divided by "
  - text: "the gas constant R"
    quantityId: molarGasConstant
  - text: " times "
  - text: "the constant β"
    quantityId: wienConstantBeta
