# light-quanta eq-s8-d4: what the display says, at every level (dispatch 279).
# Written from the German of s8-p9 (p. 147) and its plate; the steps were checked by hand.
display: eq-s8-d4
paper: light-quanta
review: draft
inWords:
  - text: "The potential Π"
    quantityId: stoppingPotentialMagnitude
  - text: " times "
  - text: "the charge of a gram-equivalent"
    quantityId: gramEquivalentCharge
  - text: ", plus "
  - text: "the work per gram-equivalent"
    quantityId: workFunctionPerGramEquivalent
  - text: ", is at most "
