# light-quanta eq-s5-d5: what the display says, at every level (dispatch 279).
# Written from the German of s5-p6 (p. 141) and its plate; the steps were checked by hand.
display: eq-s5-d5
paper: light-quanta
inWords:
  - text: "Each entropy"
    quantityId: entropy
  - text: " function is "
  - text: "the same constant C"
    quantityId: universalEntropyConstant
  - text: " times the natural logarithm of "
  - text: "the probability"
    quantityId: configurationProbability
  - text: ", plus a constant: for the first system, for the second, and for the two together."
r0: "The only functions with that property are a constant times the logarithm, plus a constant, and the multiplying constant C is the same for both systems and for the pair. So C is a universal constant."
r1: "The paper goes from the preceding line to this one with the words \"and from this, finally\", without showing the step. The steps below fill it in for functions that can be differentiated, which the paper takes for granted. The multiplying constant $C$ turns out to be the same in all three lines. Since the two systems were any two systems, the paper concludes that $C$ is a universal constant. The added constants may differ, and the one for the pair is the sum of the other two. The paper writes $\\lg$ for the natural logarithm."
r2:
  - latex: "W_2 \\frac{d \\varphi}{d W} = \\frac{d \\varphi_1}{d W_1}"
    why: "Differentiate the preceding display with respect to $W_1$, holding $W_2$ fixed. By the chain rule the left side gives the rate of change of $\\varphi$, taken where $W = W_1 \\cdot W_2$, times $W_2$. The paper does not show this or the following steps."
  - latex: "W_1 \\frac{d \\varphi}{d W} = \\frac{d \\varphi_2}{d W_2}"
    why: "The same with respect to $W_2$, holding $W_1$ fixed."
  - latex: "W \\frac{d \\varphi}{d W} = W_1 \\frac{d \\varphi_1}{d W_1} = W_2 \\frac{d \\varphi_2}{d W_2}"
    why: "Multiply the first line by $W_1$ and the second by $W_2$, and use $W_1 \\cdot W_2 = W$."
  - latex: "W_1 \\frac{d \\varphi_1}{d W_1} = C"
    why: "The middle term depends only on $W_1$ and the last only on $W_2$. The two probabilities can be changed independently, so each term must equal one and the same constant, which is called $C$."
  - latex: "\\frac{d \\varphi_1}{d W_1} = \\frac{C}{W_1}"
    why: "Divide by $W_1$."
  - latex: "\\varphi_1(W_1) = C \\lg(W_1) + \\text{konst.}"
    why: "The function whose rate of change is $C$ divided by the variable is $C$ times the natural logarithm, plus a constant. The same reasoning gives $\\varphi_2$ and $\\varphi$, with the same $C$: the printed lines."
