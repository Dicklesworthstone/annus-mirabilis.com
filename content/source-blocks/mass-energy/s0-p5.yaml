diplomaticText: "Ein System von ebenen Lichtwellen besitze, auf das Koordinatensystem (x, y, z) bezogen, die Energie l; die Strahlrichtung (Wellennormale) bilde den Winkel \\varphi mit der x-Achse des Systems. Führt man ein neues, gegen das System (x, y, z) in gleichförmiger Paralleltranslation begriffenes Koordinatensystem (\\xi, \\eta, \\zeta) ein, dessen Ursprung sich mit der Geschwindigkeit v längs der x-Achse bewegt, so besitzt die genannte Lichtmenge — im System (\\xi, \\eta, \\zeta) gemessen — die Energie: wobei V die Lichtgeschwindigkeit bedeutet. Von diesem Resultat machen wir im folgenden Gebrauch."
