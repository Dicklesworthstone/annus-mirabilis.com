diplomaticText: "Dieser Körper sende in einer mit der x-Achse den Winkel \\varphi bildenden Richtung ebene Lichtwellen von der Energie L/2 (relativ zu (x, y, z) gemessen) und gleichzeitig eine gleich große Lichtmenge nach der entgegengesetzten Richtung. Hierbei bleibt der Körper in Ruhe in bezug auf das System (x, y, z). Für diesen Vorgang muß das Energieprinzip gelten und zwar (nach dem Prinzip der Relativität) in bezug auf beide Koordinatensysteme. Nennen wir E_1 bez. H_1 die Energie des Körpers nach der Lichtaussendung relativ zum System (x, y, z) bez. (\\xi, \\eta, \\zeta) gemessen, so erhalten wir mit Benutzung der oben angegebenen Relation: Durch Subtraktion erhält man aus diesen Gleichungen: Die beiden in diesem Ausdruck auftretenden Differenzen von der Form H - E haben einfache physikalische Bedeutungen. H und E sind Energiewerte desselben Körpers, bezogen auf zwei relativ zueinander bewegte Koordinatensysteme, wobei der Körper in dem einen System (System (x, y, z)) ruht. Es ist also klar, daß die Differenz H - E sich von der kinetischen Energie K des Körpers in bezug auf das andere System (System (\\xi, \\eta, \\zeta)) nur durch eine additive Konstante C unterscheiden kann, welche von der Wahl der willkürlichen additiven Konstanten der Energien H und E abhängt. Wir können also setzen: da C sich während der Lichtaussendung nicht ändert. Wir erhalten also: Die kinetische Energie des Körpers in bezug auf (\\xi, \\eta, \\zeta) nimmt infolge der Lichtaussendung ab, und zwar um einen von den Qualitäten des Körpers unabhängigen Betrag. Die Differenz K_0 - K_1 hängt ferner von der Geschwindigkeit ebenso ab wie die kinetische Energie des Elektrons (l. c. § 10)."
