diplomaticText: "Es könnte scheinen, daß alle die Definition der „Zeit“ betreffenden Schwierigkeiten dadurch überwunden werden könnten, daß ich an Stelle der „Zeit“ die „Stellung des kleinen Zeigers meiner Uhr“ setze. Eine solche Definition genügt in der Tat, wenn es sich darum handelt, eine Zeit zu definieren ausschließlich für den Ort, an welchem sich die Uhr eben befindet; die Definition genügt aber nicht mehr, sobald es sich darum handelt, an verschiedenen Orten stattfindende Ereignisreihen miteinander zeitlich zu verknüpfen, oder — was auf dasselbe hinausläuft — Ereignisse zeitlich zu werten, welche in von der Uhr entfernten Orten stattfinden."
