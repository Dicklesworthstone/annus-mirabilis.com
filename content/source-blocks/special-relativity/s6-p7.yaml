diplomaticText: "Analoges gilt über die „magnetomotorischen Kräfte“. Man sieht, daß in der entwickelten Theorie die elektromotorische Kraft nur die Rolle eines Hilfsbegriffes spielt, welcher seine Einführung dem Umstande verdankt, daß die elektrischen und magnetischen Kräfte keine von dem Bewegungszustande des Koordinatensystems unabhängige Existenz besitzen."
