diplomaticText: "Hieraus ergibt sich folgende eigentümliche Konsequenz. Sind in den Punkten A und B von K ruhende, im ruhenden System betrachtet, synchron gehende Uhren vorhanden, und bewegt man die Uhr in A mit der Geschwindigkeit v auf der Verbindungslinie nach B, so gehen nach Ankunft dieser Uhr in B die beiden Uhren nicht mehr synchron, sondern die von A nach B bewegte Uhr geht gegenüber der von Anfang an in B befindlichen um \\frac{1}{2} t v^2 / V^2 Sek. (bis auf Größen vierter und höherer Ordnung) nach, wenn t die Zeit ist, welche die Uhr von A nach B braucht."
