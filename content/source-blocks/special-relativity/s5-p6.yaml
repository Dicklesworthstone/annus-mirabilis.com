diplomaticText: "Es folgt ferner, daß die Lichtgeschwindigkeit V durch Zusammensetzung mit einer „Unterlichtgeschwindigkeit“ nicht geändert werden kann. Man erhält für diesen Fall: Wir hätten die Formel für U für den Fall, daß v und w gleiche Richtung besitzen, auch durch Zusammensetzen zweier Transformationen gemäß § 3 erhalten können. Führen wir neben den in § 3 figurierenden Systemen K und k noch ein drittes, zu k in Parallelbewegung begriffenes Koordinatensystem k' ein, dessen Anfangspunkt sich auf der \\Xi-Achse mit der Geschwindigkeit w bewegt, so erhalten wir zwischen den Größen x, y, z, t und den entsprechenden Größen von k' Gleichungen, welche sich von den in § 3 gefundenen nur dadurch unterscheiden, daß an Stelle von „v“ die Größe tritt; man sieht daraus, daß solche Paralleltransformationen — wie dies sein muß — eine Gruppe bilden."
