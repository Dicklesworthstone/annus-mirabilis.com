diplomaticText: "Da die Beziehungen zwischen x', y', z' und x, y, z die Zeit t nicht enthalten, so ruhen die Systeme K und K' gegeneinander, und es ist klar, daß die Transformation von K auf K' die identische Transformation sein muß. Es ist also: Wir fragen nun nach der Bedeutung von \\varphi(v). Wir fassen das Stück der H-Achse des Systems k ins Auge, das zwischen \\xi = 0, \\eta = 0, \\zeta = 0 und \\xi = 0, \\eta = l, \\zeta = 0 gelegen ist. Dieses Stück der H-Achse ist ein relativ zum System K mit der Geschwindigkeit v senkrecht zu seiner Achse bewegter Stab, dessen Enden in K die Koordinaten besitzen: und Die Länge des Stabes, in K gemessen, ist also l/\\varphi(v); damit ist die Bedeutung der Funktion \\varphi gegeben. Aus Symmetriegründen ist nun einleuchtend, daß die im ruhenden System gemessene Länge eines bestimmten Stabes, welcher senkrecht zu seiner Achse bewegt ist, nur von der Geschwindigkeit, nicht aber von der Richtung und dem Sinne der Bewegung abhängig sein kann. Es ändert sich also die im ruhenden System gemessene Länge des bewegten Stabes nicht, wenn v mit -v vertauscht wird. Hieraus folgt: oder Aus dieser und der vorhin gefundenen Relation folgt, daß \\varphi(v) = 1 sein muß, so daß die gefundenen Transformationsgleichungen übergehen in: wobei"
