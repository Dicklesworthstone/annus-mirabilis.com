diplomaticText: "Im Systeme K befinde sich sehr ferne vom Koordinatenursprung eine Quelle elektrodynamischer Wellen, welche in einem den Koordinatenursprung enthaltenden Raumteil mit genügender Annäherung durch die Gleichungen dargestellt sei: Hierbei sind (X_0, Y_0, Z_0) und (L_0, M_0, N_0) die Vektoren, welche die Amplitude des Wellenzuges bestimmen, a, b, c die Richtungskosinus der Wellennormalen."
