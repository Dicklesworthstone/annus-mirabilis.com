diplomaticText: "2. Ist ein punktförmiger elektrischer Einheitspol in einem elektromagnetischen Felde bewegt, so ist die auf ihn wirkende Kraft gleich der an dem Orte des Einheitspoles vorhandenen elektrischen Kraft, welche man durch Transformation des Feldes auf ein relativ zum elektrischen Einheitspol ruhendes Koordinatensystem erhält. (Neue Ausdrucksweise.)"
