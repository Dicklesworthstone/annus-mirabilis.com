diplomaticText: "Wir gehen aus von den Gleichungen: wobei die 4\\pi-fache Dichte der Elektrizität und (u_x, u_y, u_z) den Geschwindigkeitsvektor der Elektrizität bedeutet. Denkt man sich die elektrischen Massen unveränderlich an kleine, starre Körper (Ionen, Elektronen) gebunden, so sind diese Gleichungen die elektromagnetische Grundlage der Lorentzschen Elektrodynamik und Optik bewegter Körper."
