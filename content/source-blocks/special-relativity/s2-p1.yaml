diplomaticText: "Die folgenden Überlegungen stützen sich auf das Relativitätsprinzip und auf das Prinzip der Konstanz der Lichtgeschwindigkeit, welche beiden Prinzipien wir folgendermaßen definieren.\u000a1. Die Gesetze, nach denen sich die Zustände der physikalischen Systeme ändern, sind unabhängig davon, auf welches von zwei relativ zueinander in gleichförmiger Translationsbewegung befindlichen Koordinatensystemen diese Zustandsänderungen bezogen werden.\u000a2. Jeder Lichtstrahl bewegt sich im „ruhenden“ Koordinatensystem mit der bestimmten Geschwindigkeit V, unabhängig davon, ob dieser Lichtstrahl von einem ruhenden oder bewegten Körper emittiert ist. Hierbei ist wobei „Zeitdauer“ im Sinne der Definition des § 1 aufzufassen ist."
