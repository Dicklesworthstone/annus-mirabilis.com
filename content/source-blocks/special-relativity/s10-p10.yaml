diplomaticText: "Wir bestimmen die kinetische Energie des Elektrons. Bewegt sich ein Elektron vom Koordinatenursprung des Systems K aus mit der Anfangsgeschwindigkeit 0 beständig auf der X-Achse unter der Wirkung einer elektrostatischen Kraft X, so ist klar, daß die dem elektrostatischen Felde entzogene Energie den Wert \\int \\varepsilon X d x hat. Da das Elektron langsam beschleunigt sein soll und infolgedessen keine Energie in Form von Strahlung abgeben möge, so muß die dem elektrostatischen Felde entzogene Energie gleich der Bewegungsenergie W des Elektrons gesetzt werden. Man erhält daher, indem man beachtet, daß während des ganzen betrachteten Bewegungsvorganges die erste der Gleichungen (A) gilt:"
