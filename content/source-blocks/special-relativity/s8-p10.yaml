diplomaticText: "Die auf die Flächeneinheit des Spiegels pro Zeiteinheit auftreffende (im ruhenden System gemessene) Energie ist offenbar A^2/8\\pi (V \\cos \\varphi - v). Die von der Flächeneinheit des Spiegels in der Zeiteinheit sich entfernende Energie ist A'''^2/8\\pi (- V \\cos \\varphi''' + v). Die Differenz dieser beiden Ausdrücke ist nach dem Energieprinzip die vom Lichtdrucke in der Zeiteinheit geleistete Arbeit. Setzt man die letztere gleich dem Produkt P \\cdot v, wobei P der Lichtdruck ist, so erhält man: In erster Annäherung erhält man in Übereinstimmung mit der Erfahrung und mit anderen Theorien"
