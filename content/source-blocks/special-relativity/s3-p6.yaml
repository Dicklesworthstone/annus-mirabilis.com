diplomaticText: "Setzen wir x' = x - v t, so ist klar, daß einem im System k ruhenden Punkte ein bestimmtes, von der Zeit unabhängiges Wertsystem x', y, z zukommt. Wir bestimmen zuerst \\tau als Funktion von x', y, z und t. Zu diesem Zwecke haben wir in Gleichungen auszudrücken, daß \\tau nichts anderes ist als der Inbegriff der Angaben von im System k ruhenden Uhren, welche nach der im § 1 gegebenen Regel synchron gemacht worden sind."
