diplomaticText: "Wir nehmen an, daß diese Definition des Synchronismus in widerspruchsfreier Weise möglich sei, und zwar für beliebig viele Punkte, daß also allgemein die Beziehungen gelten:\u000a1. Wenn die Uhr in B synchron mit der Uhr in A läuft, so läuft die Uhr in A synchron mit der Uhr in B.\u000a2. Wenn die Uhr in A sowohl mit der Uhr in B als auch mit der Uhr in C synchron läuft, so laufen auch die Uhren in B und C synchron relativ zueinander."
