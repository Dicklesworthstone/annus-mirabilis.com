diplomaticText: "Es möge noch kurz bemerkt werden, daß aus den entwickelten Gleichungen leicht der folgende wichtige Satz gefolgert werden kann: Bewegt sich ein elektrisch geladener Körper beliebig im Raume und ändert sich hierbei seine Ladung nicht, von einem mit dem Körper bewegten Koordinatensystem aus betrachtet, so bleibt seine Ladung auch — von dem „ruhenden“ System K aus betrachtet — konstant."
