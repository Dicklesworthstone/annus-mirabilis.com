diplomaticText: "Aus der Gleichung für \\omega' folgt: Ist ein Beobachter relativ zu einer unendlich fernen Lichtquelle von der Frequenz \\nu mit der Geschwindigkeit v derart bewegt, daß die Verbindungslinie „Lichtquelle–Beobachter“ mit der auf ein relativ zur Lichtquelle ruhendes Koordinatensystem bezogenen Geschwindigkeit des Beobachters den Winkel \\varphi bildet, so ist die von dem Beobachter wahrgenommene Frequenz \\nu' des Lichtes durch die Gleichung gegeben: Dies ist das Doppelersche Prinzip für beliebige Geschwindigkeiten. Für \\varphi = 0 nimmt die Gleichung die übersichtliche Form an: Man sieht, daß — im Gegensatz zu der üblichen Auffassung — für v = -\\infty, \\nu = \\infty ist."
