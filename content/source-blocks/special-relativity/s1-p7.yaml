diplomaticText: "Befindet sich im Punkte A des Raumes eine Uhr, so kann ein in A befindlicher Beobachter die Ereignisse in der unmittelbaren Umgebung von A zeitlich werten durch Aufsuchen der mit diesen Ereignissen gleichzeitigen Uhrzeigerstellungen. Befindet sich auch im Punkte B des Raumes eine Uhr — wir wollen hinzufügen, „eine Uhr von genau derselben Beschaffenheit wie die in A befindliche“ — so ist auch eine zeitliche Wertung der Ereignisse in der unmittelbaren Umgebung von B durch einen in B befindlichen Beobachter möglich. Es ist aber ohne weitere Festsetzung nicht möglich, ein Ereignis in A mit einem Ereignis in B zeitlich zu vergleichen; wir haben bisher nur eine „A-Zeit“ und eine „B-Zeit“, aber keine für A und B gemeinsame „Zeit“ definiert. Die letztere Zeit kann nun definiert werden, indem man durch Definition festsetzt, daß die „Zeit“, welche das Licht braucht, um von A nach B zu gelangen, gleich ist der „Zeit“, welche es braucht, um von B nach A zu gelangen. Es gehe nämlich ein Lichtstrahl zur „A-Zeit“ t_A von A nach B ab, werde zur „B-Zeit“ t_B in B gegen A zu reflektiert und gelange zur „A-Zeit“ t'_A nach A zurück. Die beiden Uhren laufen definitionsgemäß synchron, wenn"
