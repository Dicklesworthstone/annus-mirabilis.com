diplomaticText: "Eine analoge Überlegung — auf die H- und Z-Achse angewandt — liefert, wenn man beachtet, daß sich das Licht längs dieser Achsen vom ruhenden System aus betrachtet stets mit der Geschwindigkeit \\sqrt{V^2 - v^2} fortpflanzt: Aus diesen Gleichungen folgt, da \\tau eine lineare Funktion ist: wobei a eine vorläufig unbekannte Funktion \\varphi(v) ist und der Kürze halber angenommen ist, daß im Anfangspunkte von k für \\tau = 0 t = 0 sei."
