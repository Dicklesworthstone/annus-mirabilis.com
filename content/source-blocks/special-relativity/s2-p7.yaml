diplomaticText: "Wir denken uns ferner, daß sich bei jeder Uhr ein mit ihr bewegter Beobachter befinde, und daß diese Beobachter auf die beiden Uhren das im § 1 aufgestellte Kriterium für den synchronen Gang zweier Uhren anwenden. Zur Zeit1) t_A gehe ein Lichtstrahl von A aus, werde zur Zeit t_B in B reflektiert und gelange zur Zeit t'_A nach A zurück. Unter Berücksichtigung des Prinzipes von der Konstanz der Lichtgeschwindigkeit finden wir: und wobei r_{AB} die Länge des bewegten Stabes — im ruhenden System gemessen — bedeutet. Mit dem bewegten Stabe bewegte Beobachter würden also die beiden Uhren nicht synchron gehend finden, während im ruhenden System befindliche Beobachter die Uhren als synchron laufend erklären würden."
