diplomaticText: "Gesucht ist die Bewegung des Punktes relativ zum System K. Führt man in die Bewegungsgleichungen des Punktes mit Hilfe der in § 3 entwickelten Transformationsgleichungen die Größen x, y, z, t ein, so erhält man: Das Gesetz vom Parallelogramm der Geschwindigkeiten gilt also nach unserer Theorie nur in erster Annäherung. Wir setzen: und \\alpha ist dann als der Winkel zwischen den Geschwindigkeiten v und w anzusehen. Nach einfacher Rechnung ergibt sich: Es ist bemerkenswert, daß v und w in symmetrischer Weise in den Ausdruck für die resultierende Geschwindigkeit eingehen. Hat auch w die Richtung der X-Achse (\\Xi-Achse), so erhalten wir: Aus dieser Gleichung folgt, daß aus der Zusammensetzung zweier Geschwindigkeiten, welche kleiner sind als V, stets eine Geschwindigkeit kleiner als V resultiert. Setzt man nämlich v = V - \\varkappa, w = V - \\lambda, wobei \\varkappa und \\lambda positiv und kleiner als V seien, so ist:"
