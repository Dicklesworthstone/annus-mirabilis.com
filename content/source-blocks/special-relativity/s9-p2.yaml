diplomaticText: "Transformiert man diese Gleichungen, welche im System K gelten mögen, mit Hilfe der Transformationsgleichungen von § 3 und § 6 auf das System k, so erhält man die Gleichungen: wobei Da — wie aus dem Additionstheorem der Geschwindigkeiten (§ 5) folgt — der Vektor (u_\\xi, u_\\eta, u_\\zeta) nichts anderes ist als die Geschwindigkeit der elektrischen Massen im System k gemessen, so ist damit gezeigt, daß unter Zugrundelegung unserer kinematischen Prinzipien die elektrodynamische Grundlage der Lorentzschen Theorie der Elektrodynamik bewegter Körper dem Relativitätsprinzip entspricht."
