diplomaticText: "Es werde nun dem Anfangspunkte des einen der beiden Systeme (k) eine (konstante) Geschwindigkeit v in Richtung der wachsenden x des anderen, ruhenden Systems (K) erteilt, welche sich auch den Koordinatenachsen, dem betreffenden Maßstabe sowie den Uhren mitteilen möge. Jeder Zeit t des ruhenden Systems K entspricht dann eine bestimmte Lage der Achsen des bewegten Systems und wir sind aus Symmetriegründen befugt anzunehmen, daß die Bewegung von k so beschaffen sein kann, daß die Achsen des bewegten Systems zur Zeit t (es ist mit „t“ immer eine Zeit des ruhenden Systems bezeichnet) den Achsen des ruhenden Systems parallel seien."
