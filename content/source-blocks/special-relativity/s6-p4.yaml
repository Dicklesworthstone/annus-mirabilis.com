diplomaticText: "Offenbar müssen nun die beiden für das System k gefundenen Gleichungssysteme genau dasselbe ausdrücken, da beide Gleichungssysteme den Maxwell-Hertzschen Gleichungen für das System K äquivalent sind. Da die Gleichungen beider Systeme ferner bis auf die die Vektoren darstellenden Symbole übereinstimmen, so folgt, daß die in den Gleichungssystemen an entsprechenden Stellen auftretenden Funktionen bis auf einen für alle Funktionen des einen Gleichungssystems gemeinsamen, von \\xi, \\eta, \\zeta und \\tau unabhängigen, eventuell von v abhängigen Faktor \\psi(v) übereinstimmen müssen. Es gelten also die Beziehungen:"
