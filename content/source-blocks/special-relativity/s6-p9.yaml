diplomaticText: "1. Ist ein punktförmiger elektrischer Einheitspol in einem elektromagnetischen Felde bewegt, so wirkt auf ihn außer der elektrischen Kraft eine „elektromotorische Kraft“, welche unter Vernachlässigung von mit der zweiten und höheren Potenzen von v/V multiplizierten Gliedern gleich ist dem mit der Lichtgeschwindigkeit dividierten Vektorprodukt der Bewegungsgeschwindigkeit des Einheitspoles und der magnetischen Kraft. (Alte Ausdrucksweise.)"
