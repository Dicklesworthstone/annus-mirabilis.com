diplomaticText: "Da A^2/8\\pi gleich der Lichtenergie pro Volumeneinheit ist, so haben wir nach dem Relativitätsprinzip A'^2/8\\pi als die Lichtenergie im bewegten System zu betrachten. Es wäre daher A'^2/A^2 das Verhältnis der „bewegt gemessenen“ und „ruhend gemessenen“ Energie eines bestimmten Lichtkomplexes, wenn das Volumen eines Lichtkomplexes in K gemessen und in k gemessen das gleiche wäre. Dies ist jedoch nicht der Fall. Sind a, b, c die Richtungskosinus der Wellennormalen des Lichtes im ruhenden System, so wandert durch die Oberflächenelemente der mit Lichtgeschwindigkeit bewegten Kugelfläche keine Energie hindurch; wir können daher sagen, daß diese Fläche dauernd denselben Lichtkomplex umschließt. Wir fragen nach der Energiemenge, welche diese Fläche im System k betrachtet umschließt, d. h. nach der Energie des Lichtkomplexes relativ zum System k."
