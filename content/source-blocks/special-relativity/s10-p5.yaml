diplomaticText: "Aus der oben gemachten Voraussetzung in Verbindung mit dem Relativitätsprinzip ist klar, daß sich das Elektron in der unmittelbar folgenden Zeit (für kleine Werte von t) vom System k aus betrachtet nach den Gleichungen bewegt: wobei die Zeichen \\xi, \\eta, \\zeta, \\tau, X', Y', Z' sich auf das System k beziehen. Setzen wir noch fest, daß für t = x = y = z = 0 \\tau = \\xi = \\eta = \\zeta = 0 sein soll, so gelten die Transformationsgleichungen der §§ 3 und 6, so daß gilt:"
