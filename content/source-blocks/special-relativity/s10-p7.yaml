diplomaticText: "Wir fragen nun in Anlehnung an die übliche Betrachtungsweise nach der „longitudinalen“ und „transversalen“ Masse des bewegten Elektrons. Wir schreiben die Gleichungen (A) in der Form und bemerken zunächst, daß \\varepsilon X', \\varepsilon Y', \\varepsilon Z' die Komponenten der auf das Elektron wirkenden ponderomotorischen Kraft sind, und zwar in einem in diesem Moment mit dem Elektron mit gleicher Geschwindigkeit wie dieses bewegten System betrachtet. (Diese Kraft könnte beispielsweise mit einer im letzten System ruhenden Federwage gemessen werden.) Wenn wir nun diese Kraft schlechtweg „die auf das Elektron wirkende Kraft“ nennen und die Gleichung aufrechterhalten, und wenn wir ferner festsetzen, daß die Beschleunigungen im ruhenden System K gemessen werden sollen, so erhalten wir aus obigen Gleichungen:"
