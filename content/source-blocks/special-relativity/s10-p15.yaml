diplomaticText: "1. Aus der zweiten Gleichung des Systems (A) folgt, daß eine elektrische Kraft Y und eine magnetische Kraft N dann gleich stark ablenkend wirken auf ein mit der Geschwindigkeit v bewegtes Elektron, wenn Y = N \\cdot v/V. Man ersieht also, daß die Ermittelung der Geschwindigkeit des Elektrons aus dem Verhältnis der magnetischen Ablenkbarkeit A_m und der elektrischen Ablenkbarkeit A_e nach unserer Theorie für beliebige Geschwindigkeiten möglich ist durch Anwendung des Gesetzes:"
