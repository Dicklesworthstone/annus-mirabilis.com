diplomaticText: "Wir denken uns nun den Raum sowohl vom ruhenden System K aus mittels des ruhenden Maßstabes als auch vom bewegten System k mittels des mit ihm bewegten Maßstabes ausgemessen und so die Koordinaten x, y, z bez. \\xi, \\eta, \\zeta ermittelt. Es werde ferner mittels der im ruhenden System befindlichen ruhenden Uhren durch Lichtsignale in der in § 1 angegebenen Weise die Zeit t des ruhenden Systems für alle Punkte des letzteren bestimmt, in denen sich Uhren befinden; ebenso werde die Zeit \\tau des bewegten Systems für alle Punkte des bewegten Systems, in welchen sich relativ zu letzterem ruhende Uhren befinden, bestimmt durch Anwendung der in § 1 genannten Methode der Lichtsignale zwischen den Punkten, in denen sich die letzteren Uhren befinden."
