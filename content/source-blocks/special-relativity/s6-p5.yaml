diplomaticText: "Bildet man nun die Umkehrung dieses Gleichungssystems, erstens durch Auflösen der soeben erhaltenen Gleichungen, zweitens durch Anwendung der Gleichungen auf die inverse Transformation (von k auf K), welche durch die Geschwindigkeit -v charakterisiert ist, so folgt, indem man berücksichtigt, daß die beiden so erhaltenen Gleichungssysteme identisch sein müssen: Ferner folgt aus Symmetriegründen1) es ist also und unsere Gleichungen nehmen die Form an: Zur Interpretation dieser Gleichungen bemerken wir folgendes. Es liegt eine punktförmige Elektrizitätsmenge vor, welche im ruhenden System K gemessen von der Größe „eins“ sei, d. h. im ruhenden System ruhend auf eine gleiche Elektrizitätsmenge im Abstand 1 cm die Kraft 1 Dyn ausübe. Nach dem Relativitätsprinzip ist diese elektrische Masse auch im bewegten System gemessen von der Größe „eins“. Ruht diese Elektrizitätsmenge relativ zum ruhenden System, so ist definitionsgemäß der Vektor (X, Y, Z) gleich der auf sie wirkenden Kraft. Ruht die Elektrizitätsmenge gegenüber dem bewegten System (wenigstens in dem betreffenden Augenblick), so ist die auf sie wirkende, in dem bewegten System gemessene Kraft gleich dem Vektor (X', Y', Z'). Die ersten drei der obigen Gleichungen lassen sich mithin auf folgende zwei Weisen in Worte kleiden:"
