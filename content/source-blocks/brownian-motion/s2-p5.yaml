diplomaticText: "Aus der in den zitierten Arbeiten gegebenen molekularen Theorie der Wärme läßt sich aber leicht folgern1), daß d B/B bez. d B'/B gleich ist der Wahrscheinlichkeit dafür, daß sich in einem beliebig herausgegriffenen Zeitpunkte die Teilchenschwerpunkte in den Gebieten (d x_1 \\ldots d z_n) bez. in den Gebieten (d x'_1 \\ldots d z'_n) befinden. Sind nun die Bewegungen der einzelnen Teilchen (mit genügender Annäherung) voneinander unabhängig, ist die Flüssigkeit homogen und wirken auf die Teilchen keine Kräfte, so müssen bei gleicher Größe der Gebiete die den beiden Gebietssystemen zukommenden Wahrscheinlichkeiten einander gleich sein, so daß gilt: Aus dieser und aus der zuletzt gefundenen Gleichung folgt aber"
