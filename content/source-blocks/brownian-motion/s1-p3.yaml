diplomaticText: "Vom Standpunkte der molekularkinetischen Wärmetheorie aus kommt man aber zu einer anderen Auffassung. Nach dieser Theorie unterscheidet sich eingelöstes Molekül von einem suspendierten Körper lediglich durch die Größe, und man sieht nicht ein, warum einer Anzahl suspendierter Körper nicht derselbe osmotische Druck entsprechen sollte, wie der nämlichen Anzahl gelöster Moleküle. Man wird anzunehmen haben, daß die suspendierten Körper infolge der Molekularbewegung der Flüssigkeit eine wenn auch sehr langsame ungeordnete Bewegung in der Flüssigkeit ausführen; werden sie durch die Wand verhindert, das Volumen V^* zu verlassen, so werden sie auf die Wand Kräfte ausüben, ebenso wie gelöste Moleküle. Sind also n suspendierte Körper im Volumen V^*, also n/V^* = \\nu in der Volumeneinheit vorhanden, und sind benachbarte unter ihnen genügend weit voneinander entfernt, so wird ihnen ein osmotischer Druck p entsprechen von der Größe: wobei N die Anzahl der in einem Gramm-Molekül enthaltenen wirklichen Moleküle bedeutet. Im nächsten Paragraph soll gezeigt werden, daß die molekularkinetische Theorie der Wärme wirklich zu dieser erweiterten Auffassung des osmotischen Druckes führt."
