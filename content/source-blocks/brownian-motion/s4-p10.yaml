diplomaticText: "An diese Entwicklung läßt sich noch eine wichtige Überlegung anknüpfen. Wir haben angenommen, daß die einzelnen Teilchen alle auf dasselbe Koordinatensystem bezogen seien. Dies ist jedoch nicht nötig, da die Bewegungen der einzelnen Teilchen voneinander unabhängig sind. Wir wollen nun die Bewegung jedes Teilchens auf ein Koordinatensystem beziehen, dessen Ursprung mit der Lage des Schwerpunktes des betreffenden Teilchens zur Zeit t = 0 zusammenfällt, mit dem Unterschiede, daß jetzt f(x, t) d x die Anzahl der Teilchen bedeutet, deren X-Koordinaten von der Zeit t = 0 bis zur Zeit t = t um eine Größe gewachsen ist, welche zwischen x und x + d x liegt. Auch in diesem Falle ändert sich also die Funktion f gemäß Gleichung (1). Ferner muß offenbar für x \\gtrless 0 und t = 0sein. Das Problem, welches mit dem Problem der Diffusion von einem Punkte aus (unter Vernachlässigung der Wechselwirkung der diffundierenden Teilchen) übereinstimmt, ist nun mathematisch vollkommen bestimmt; seine Lösung ist:"
