diplomaticText: "In einer Flüssigkeit seien suspendierte Teilchen regellos verteilt. Wir wollen den dynamischen Gleichgewichtszustand derselben untersuchen unter der Voraussetzung, daß auf die einzelnen Teilchen eine Kraft K wirkt, welche vom Orte, nicht aber von der Zeit abhängt. Der Einfachheit halber werde angenommen, daß die Kraft überall die Richtung der X-Achse habe."
