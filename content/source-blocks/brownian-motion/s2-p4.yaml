diplomaticText: "Wir nennen x_1, y_1, z_1 die rechtwinkligen Koordinaten des Schwerpunktes des ersten Teilchens, x_2, y_2, z_2 die des zweiten etc., x_n, y_n, z_n die des letzten Teilchens und geben für die Schwerpunkte der Teilchen die unendlich kleinen parallelepipedförmigen Gebiete d x_1 d y_1 d z_1, d x_2 d y_2 d z_2 \\ldots d x_n d y_n d z_n, welche alle in V^* gelegen seien. Gesucht sei der Wert des im Ausdruck für F auftretenden Integrales mit der Beschränkung, daß die Teilchenschwerpunkte in den ihnen soeben zugewiesenen Gebieten liegen. Dies Integral läßt sich jedenfalls auf die Form bringen, wobei J von d x_1 d y_1 etc., sowie von V^*, d. h. von der Lage der semipermeabeln Wand, unabhängig ist. J ist aber auch unabhängig von der speziellen Wahl der Lagen der Schwerpunktsgebiete und von dem Werte von V^*, wie sogleich gezeigt werden soll. Sei nämlich ein zweites System von unendlich kleinen Gebieten für die Teilchenschwerpunkte gegeben und bezeichnet durch d x'_1 d y'_1 d z'_2, d x'_2 d y'_2 d z'_2 \\ldots d x'_n d y'_n d z'_n, welche Gebiete sich von den ursprünglich gegebenen nur durch ihre Lage, nicht aber durch ihre Größe unterscheiden mögen und ebenfalls alle in V^* enthalten seien, so gilt analog: wobei Es ist also:"
