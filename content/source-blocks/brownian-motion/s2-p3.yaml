diplomaticText: "Wäre nun auch das molekulare Bild bis in alle Einzelheiten festgelegt, so böte doch die Ausrechnung des Integrales B solche Schwierigkeiten, daß an eine exakte Berechnung von F kaum gedacht werden könnte. Wir brauchen jedoch hier nur zu wissen, wie F von der Größe des Volumens V^* abhängt, in welchem alle gelösten Moleküle bez. suspendierten Körper (im folgenden kurz „Teilchen“ genannt) enthalten sind."
