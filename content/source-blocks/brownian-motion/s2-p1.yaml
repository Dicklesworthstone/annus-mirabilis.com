diplomaticText: "Sind p_1 p_2 \\ldots p_l Zustandsvariable eines physikalischen Systems, welche den momentanen Zustand desselben vollkommen bestimmen (z. B. die Koordinaten und Geschwindigkeitskomponenten aller Atome des Systems) und ist das vollständige System der Veränderungsgleichungen dieser Zustandsvariabeln von der Form gegeben, wobei \\sum \\frac{\\partial \\varphi_\\nu}{\\partial p_\\nu} = 0, so ist die Entropie des Systems durch den Ausdruck gegeben: Hierbei bedeutet T die absolute Temperatur, \\bar{E} die Energie des Systems, E die Energie als Funktion der p_\\nu. Das Integral ist über alle mit den Bedingungen des Problems vereinbaren Wertekombinationen der p_\\nu zu erstrecken. \\varkappa ist mit der oben erwähnten Konstanten N durch die Relation 2 \\varkappa N = R verbunden. Für die freie Energie F erhalten wir daher:"
