diplomaticText: "Die Gleichung (1) benutzen wir, um den Diffusionskoeffizienten der suspendierten Substanz zu ermitteln. Wir können den eben betrachteten dynamischen Gleichgewichtszustand als die Superposition zweier in umgekehrtem Sinne verlaufender Prozesse auffassen, nämlich\u000a1. einer Bewegung der suspendierten Substanz unter der Wirkung der auf jedes einzelne suspendierte Teilchen wirkenden Kraft K,\u000a2. eines Diffusionsvorganges, welcher als Folge der ungeordneten Bewegungen der Teilchen infolge der Molekularbewegung der Wärme aufzufassen ist."
