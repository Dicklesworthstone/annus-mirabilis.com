diplomaticText: "Sind hingegen statt der gelösten Substanz in dem Teilvolumen V^* der Flüssigkeit kleine suspendierte Körper vorhanden, welche ebenfalls nicht durch die für das Lösungsmittel durchlässige Wand hindurchtreten können, so hat man nach der klassischen Theorie der Thermodynamik — wenigstens bei Vernachlässigung der uns hier nicht interessierenden Schwerkraft — nicht zu erwarten, daß auf die Wand eine Kraft wirke; denn die „freie Energie“ des Systems scheint nach der üblichen Auffassung nicht von der Lage der Wand und der suspendierten Körper abzuhängen, sondern nur von den Gesamtmassen und Qualitäten der suspendierten Substanz, der Flüssigkeit und der Wand, sowie von Druck und Temperatur. Es kämen allerdings für die Berechnung der freien Energie noch Energie und Entropie der Grenzflächen in Betracht (Kapillarkräfte); hiervon können wir jedoch absehen, indem bei den ins Auge zu fassenden Lagenänderungen der Wand und der suspendierten Körper Änderungen der Größe und Beschaffenheit der Berührungsflächen nicht eintreten mögen."
