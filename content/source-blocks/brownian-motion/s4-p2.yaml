diplomaticText: "Es muß offenbar angenommen werden, daß jedes einzelne Teilchen eine Bewegung ausführe, welche unabhängig ist von der Bewegung aller anderen Teilchen; es werden auch die Bewegungen eines und desselben Teilchens in verschiedenen Zeitintervallen als voneinander unabhängige Vorgänge aufzufassen sein, solange wir diese Zeitintervalle nicht zu klein gewählt denken."
