diplomaticText: "Seien nun in einer Flüssigkeit im ganzen n suspendierte Teilchen vorhanden. In einem Zeitintervall \\tau werden sich die X-Koordinaten der einzelnen Teilchen um \\Delta vergrößern, wobei \\Delta für jedes Teilchen einen anderen (positiven oder negativen) Wert hat. Es wird für \\Delta ein gewisses Häufigkeitsgesetz gelten; die Anzahl d n der Teilchen, welche in dem Zeitintervall \\tau eine Verschiebung erfahren, welche zwischen \\Delta und \\Delta + d \\Delta liegt, wird durch eine Gleichung von der Form ausdrückbar sein, wobei und \\varphi nur für sehr kleine Werte von \\Delta von Null verschieden ist und die Bedingung erfüllt."
