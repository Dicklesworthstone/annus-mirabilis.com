diplomaticText: "Es sei \\nu die Anzahl der suspendierten Teilchen pro Volumeneinheit, so ist im Falle des thermodynamischen Gleichgewichtes \\nu eine solche Funktion von x, daß für eine beliebige virtuelle Verrückung \\delta x der suspendierten Substanz die Variation der freien Energie verschwindet. Man hat also: Es werde angenommen, daß die Flüssigkeit senkrecht zur X-Achse den Querschnitt 1 habe und durch die Ebenen x = 0 und x = l begrenzt sei. Man hat dann: und Die gesuchte Gleichgewichtsbedingung ist also: oder Die letzte Gleichung sagt aus, daß der Kraft K durch osmotische Druckkräfte das Gleichgewicht geleistet wird."
