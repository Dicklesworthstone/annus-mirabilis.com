diplomaticText: "Es sei \\nu = f(x, t) die Anzahl der Teilchen pro Volumeneinheit, wir berechnen die Verteilung der Teilchen zur Zeit t + \\tau aus deren Verteilung zur Zeit t. Aus der Definition der Funktion \\varphi(\\Delta) ergibt sich leicht die Anzahl der Teilchen, welche sich zur Zeit t + \\tau zwischen zwei zur X-Achse senkrechten Ebenen mit den Abszissen x und x + d x befinden. Man erhält:Nun können wir aber, da \\tau sehr klein ist, setzen:Ferner entwickeln wir f(x + \\Delta, t) nach Potenzen von \\Delta:Diese Entwicklung können wir unter dem Integral vornehmen, da zu letzterem nur sehr kleine Werte von \\Delta etwas beitragen. Wir erhalten:Auf der rechten Seite verschwindet wegen \\varphi(x) = \\varphi(-x) das zweite, vierte etc. Glied, während von dem ersten, dritten, fünften etc. Gliede jedes folgende gegen das vorhergehende sehr klein ist. Wir erhalten aus dieser Gleichung, indem wir berücksichtigen, daßund indem wirsetzen und nur das erste und dritte Glied der rechten Seite berücksichtigen:"
