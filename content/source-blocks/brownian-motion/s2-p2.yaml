diplomaticText: "Wir denken uns nun eine in dem Volumen V eingeschlossene Flüssigkeit; in dem Teilvolumen V^* von V mögen sich n gelöste Moleküle bez. suspendierte Körper befinden, welche im Volumen V^* durch eine semipermeabele Wand festgehalten seien; es werden hierdurch die Integrationsgrenzen des in den Ausdrücken für S und F auftretenden Integrales B beeinflußt. Das Gesamtvolumen der gelösten Moleküle bez. suspendierten Körper sei klein gegen V^*. Dies System werde im Sinne der erwähnten Theorie durch die Zustandsvariabeln p_1 \\ldots p_l vollständig dargestellt."
