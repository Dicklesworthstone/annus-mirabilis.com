diplomaticText: "Es liege eine Strahlung vor, welche das Volumen v einnehme. Wir nehmen an, daß die wahrnehmbaren Eigenschaften der vorliegenden Strahlung vollkommen bestimmt seien, wenn die Strahlungsdichte \\varrho(\\nu) für alle Frequenzen gegeben ist.1) Da Strahlungen von verschiedenen Frequenzen als ohne Arbeitsleistung und ohne Wärmezufuhr voneinander trennbar anzusehen sind, so ist die Entropie der Strahlung in der Form darstellbar, wobei \\varphi eine Funktion der Variabeln \\varrho und \\nu bedeutet. Es kann \\varphi auf eine Funktion von nur einer Variabeln reduziert werden durch Formulierung der Aussage, daß durch adiabatische Kompression einer Strahlung zwischen spiegelnden Wänden, deren Entropie nicht geändert wird. Wir wollen jedoch hierauf nicht eintreten, sondern sogleich untersuchen, wie die Funktion \\varphi aus dem Strahlungsgesetz des schwarzen Körpers ermittelt werden kann."
