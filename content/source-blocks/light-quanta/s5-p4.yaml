diplomaticText: "Dem betrachteten System, welches z. B. ein ideales Gas oder eine verdünnte Lösung sein kann, kommt eine gewisse Entropie S_0 zu. Wir denken uns einen Teil des Volumens v_0 von der Größe v und alle n beweglichen Punkte in das Volumen v versetzt, ohne daß an dem System sonst etwas geändert wird. Diesem Zustand kommt offenbar ein anderer Wert der Entropie (S) zu, und wir wollen nun die Entropiedifferenz mit Hilfe des Boltzmannschen Prinzips bestimmen."
