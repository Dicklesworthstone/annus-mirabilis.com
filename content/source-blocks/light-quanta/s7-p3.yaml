diplomaticText: "Abweichungen von der Stokesschen Regel sind nach der dargelegten Auffassung der Phänomene in folgenden Fällen denkbar: 1. wenn die Anzahl der gleichzeitig in Umwandlung begriffenen Energiequanten pro Volumeneinheit so groß ist, daß ein Energiequant des erzeugten Lichtes seine Energie von mehreren erzeugenden Energiequanten erhalten kann; 2. wenn das erzeugende (oder erzeugte) Licht nicht von derjenigen energetischen Beschaffenheit ist, die einer „schwarzen Strahlung“ aus dem Gültigkeitsbereich des Wienschen Gesetzes zukommt, wenn also z. B. das erregende Licht von einem Körper so hoher Temperatur erzeugt ist, daß für die in Betracht kommende Wellenlänge das Wiensche Gesetz nicht mehr gilt."
