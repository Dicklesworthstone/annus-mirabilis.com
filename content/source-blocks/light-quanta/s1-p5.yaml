diplomaticText: "Soll die Strahlungsenergie von der Frequenz \\nu nicht beständig im Ganzen weder vermindert noch vermehrt werden, so muß gelten: Diese als Bedingung des dynamischen Gleichgewichtes gefundene Beziehung entbehrt nicht nur der Übereinstimmung mit der Erfahrung, sondern sie besagt auch, daß in unserem Bilde von einer bestimmten Energieverteilung zwischen Äther und Materie nicht die Rede sein kann. Je weiter nämlich der Schwingungszahlenbereich der Resonatoren gewählt wird, desto größer wird die Strahlungsenergie des Raumes, und wir erhalten in der Grenze"
