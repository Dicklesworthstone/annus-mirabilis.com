diplomaticText: "Diese Voraussetzung läßt sich folgendermaßen formulieren. Wir entwickeln die Z-Komponente der elektrischen Kraft (Z) in einem beliebigen Punkte des betreffenden Raumes zwischen den Zeitgrenzen t = 0 und t = T (wobei T eine relativ zu allen in Betracht zu ziehenden Schwingungsdauern sehr große Zeit bedeute) in eine Fouriersche Reihe wobei A_\\nu \\geqq 0 und 0 \\leqq \\alpha_\\nu \\leqq 2 \\pi. Denkt man sich in demselben Raumpunkte eine solche Entwickelung beliebig oft bei zufällig gewählten Anfangspunkten der Zeit ausgeführt, so wird man für die Größen A_\\nu und \\alpha_\\nu verschiedene Wertsysteme erhalten. Es existieren dann für die Häufigkeit der verschiedenen Wertekombinationen der Größen A_\\nu und \\alpha_\\nu (statistische) Wahrscheinlichkeiten d W von der Form: Die Strahlung ist dann eine denkbar ungeordnetste, wenn d. h. wenn die Wahrscheinlichkeit eines bestimmten Wertes einer der Größen A bez. \\alpha von den Werten, welche die anderen Größen A bez. x besitzen, unabhängig ist. Mit je größerer Annäherung die Bedingung erfüllt ist, daß die einzelnen Paare von Größen A_\\nu und \\alpha_\\nu von Emissions- und Absorptionsprozessen besonderer Resonatorengruppen abhängen, mit desto größerer Annäherung wird also in dem von uns betrachteten Falle die Strahlung als eine „denkbar ungeordnetste“ anzusehen sein."
