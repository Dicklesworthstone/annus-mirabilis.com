diplomaticText: "Diese Gleichung zeigt, daß die Entropie einer monochromatischen Strahlung von genügend kleiner Dichte nach dem gleichen Gesetze mit dem Volumen variiert wie die Entropie eines idealen Gases oder die einer verdünnten Lösung. Die soeben gefundene Gleichung soll im folgenden interpretiert werden unter Zugrundelegung des von Hrn. Boltzmann in die Physik eingeführten Prinzips, nach welchem die Entropie eines Systems eine Funktion der Wahrscheinlichkeit seines Zustandes ist."
