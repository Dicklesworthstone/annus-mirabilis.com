diplomaticText: "Es werde monochromatisches Licht durch Photolumineszenz in Licht anderer Frequenz verwandelt und gemäß dem eben erlangten Resultat angenommen, daß sowohl das erzeugende wie das erzeugte Licht aus Energiequanten von der Größe (R/N) \\beta \\nu bestehe, wobei \\nu die betreffende Frequenz bedeutet. Der Verwandlungsprozeß wird dann folgendermaßen zu deuten sein. Jedes erzeugende Energiequant von der Frequenz \\nu_1 wird absorbiert und gibt — wenigstens bei genügend kleiner Verteilungsdichte der erzeugenden Energiequanten — für sich allein Anlaß zur Entstehung eines Lichtquants von der Frequenz \\nu_2; eventuell können bei der Absorption des erzeugenden Lichtquants auch gleichzeitig Lichtquanten von den Frequenzen \\nu_3, \\nu_4 etc. sowie Energie anderer Art (z. B. Wärme) entstehen. Unter Vermittelung von was für Zwischenprozessen dies Endresultat zustande kommt, ist gleichgültig. Wenn die photolumineszierende Substanz nicht als eine beständige Quelle von Energie anzusehen ist, so kann nach dem Energieprinzip die Energie eines erzeugten Energiequants nicht größer sein als die eines erzeugenden Lichtquants; es muß also die Bezeichnung gelten: oder Dies ist die bekannte Stokessche Regel."
