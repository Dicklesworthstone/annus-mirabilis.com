diplomaticText: "Wenn es einen Sinn hat, von der Wahrscheinlichkeit eines Zustandes eines Systems zu reden, wenn ferner jede Entropiezunahme als ein Übergang zu einem wahrscheinlicheren Zustande aufgefaßt werden kann, so ist die Entropie S_1 eines Systems eine Funktion der Wahrscheinlichkeit W_1 seines momentanen Zustandes. Liegen also zwei nicht miteinander in Wechselwirkung stehende Systeme S_1 und S_2 vor, so kann man setzen: Betrachtet man diese beiden Systeme als ein einziges System von der Entropie S und der Wahrscheinlichkeit W, so ist: und Die letztere Beziehung sagt aus, daß die Zustände der beiden Systeme voneinander unabhängige Ereignisse sind."
