diplomaticText: "Wir behandeln zunächst folgenden Spezialfall. In einem Volumen v_0 sei eine Anzahl (n) beweglicher Punkte (z. B. Moleküle) vorhanden, auf welche sich unsere Überlegung beziehen soll. Außer diesen können in dem Raume noch beliebig viele andere bewegliche Punkte irgendwelcher Art vorhanden sein. Über das Gesetz, nach dem sich die betrachteten Punkte in dem Raume bewegen, sei nichts vorausgesetzt, als daß in bezug auf diese Bewegung kein Raumteil (und keine Richtung) von den anderen ausgezeichnet sei. Die Anzahl der betrachteten (ersterwähnten) beweglichen Punkte sei ferner so klein, daß von einer Wirkung der Punkte aufeinander abgesehen werden kann."
