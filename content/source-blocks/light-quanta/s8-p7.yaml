diplomaticText: "Mit den von Hrn. Lenard beobachteten Eigenschaften der lichtelektrischen Wirkung steht unsere Auffassung, soweit ich sehe, nicht im Widerspruch. Wenn jedes Energiequant des erregenden Lichtes unabhängig von allen übrigen seine Energie an Elektronen abgibt, so wird die Geschwindigkeitsverteilung der Elektronen, d. h. die Qualität der erzeugten Kathodenstrahlung von der Intensität des erregenden Lichtes unabhängig sein; andererseits wird die Anzahl der den Körper verlassenden Elektronen der Intensität des erregenden Lichtes unter sonst gleichen Umständen proportional sein.1)"
