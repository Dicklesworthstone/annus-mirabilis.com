diplomaticText: "Bei Berechnung der Entropie auf molekulartheoretischem Wege wird häufig das Wort „Wahrscheinlichkeit“ in einer Bedeutung angewendet, die sich nicht mit der Definition der Wahrscheinlichkeit deckt, wie sie in der Wahrscheinlichkeitsrechnung gegeben wird. Insbesondere werden die „Fälle gleicher Wahrscheinlichkeit“ häufig hypothetisch festgesetzt in Fällen, wo die angewendeten theoretischen Bilder bestimmt genug sind, um statt jener hypothetischen Festsetzung eine Deduktion zu geben. Ich will in einer besonderen Arbeit zeigen, daß man bei Betrachtungen über thermische Vorgänge mit der sogenannten „statistischen Wahrscheinlichkeit“ vollkommen auskommt und hoffe dadurch eine logische Schwierigkeit zu beseitigen, welche der Durchführung des Boltzmannschen Prinzips noch im Wege steht. Hier aber soll nur dessen allgemeine Formulierung und dessen Anwendung auf ganz spezielle Fälle gegeben werden."
