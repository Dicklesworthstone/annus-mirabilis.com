diplomaticText: "Eine obere Grenze für die Ionisierungsarbeit gewinnt man auch aus den Ionisierungsspannungen in verdünnten Gasen. Nach J. Stark1) ist die kleinste gemessene Ionisierungsspannung (an Platinanoden) für Luft ca. 10 Volt.2) Es ergibt sich also für J die obere Grenze 9{,}6 \\cdot 10^{12}, welche nahezu gleich der eben gefundenen ist. Es ergibt sich noch eine andere Konsequenz, deren Prüfung durch das Experiment mir von großer Wichtigkeit zu sein scheint. Wenn jedes absorbierte Lichtenergiequant ein Molekül ionisiert, so muß zwischen der absorbierten Lichtmenge L und der Anzahl j der durch dieselbe ionisierten Grammoleküle die Beziehung bestehen: Diese Beziehung muß, wenn unsere Auffassung der Wirklichkeit entspricht, für jedes Gas gelten, welches (bei der betreffenden Frequenz) keine merkliche nicht von Ionisation begleitete Absorption aufweist."
