diplomaticText: "Besonders hervorzuheben ist, daß bei schwacher Belichtung die erzeugte Lichtmenge der erregenden unter sonst gleichen Umständen nach unserer Auffassung der erregenden Lichtstärke proportional sein muß, da jedes erregende Energiequant einen Elementarprozeß von der oben angedeuteten Art verursachen wird, unabhängig von der Wirkung der anderen erregenden Energiequanten. Insbesondere wird es keine untere Grenze für die Intensität des erregenden Lichtes geben, unterhalb welcher das Licht unfähig wäre, lichterregend zu wirken."
