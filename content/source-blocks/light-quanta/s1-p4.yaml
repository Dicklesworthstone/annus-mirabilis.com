diplomaticText: "Eine ähnliche Überlegung machen wir jetzt bezüglich der Wechselwirkung der Resonatoren und der im Raume vorhandenen Strahlung. Hr. Planck hat für diesen Fall die Bedingung des dynamischen Gleichgewichtes abgeleitet1) unter der Voraussetzung, daß die Strahlung als ein denkbar ungeordnetster Prozeß2) betrachtet werden kann. Er fand: \\overline{E}_\\nu ist hierbei die mittlere Energie eines Resonators von der Eigenfrequenz \\nu (pro Schwingungskomponente), L die Lichtgeschwindigkeit, \\nu die Frequenz und \\varrho_\\nu d \\nu die Energie pro Volumeinheit desjenigen Teiles der Strahlung, dessen Schwingungszahl zwischen \\nu und \\nu + d \\nu liegt."
