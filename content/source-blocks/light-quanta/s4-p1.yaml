diplomaticText: "Aus den bisherigen Beobachtungen über die „schwarze Strahlung“ geht zwar hervor, daß das ursprünglich von Hrn. W. Wien für die „schwarze Strahlung“ aufgestellte Gesetz nicht genau gültig ist. Dasselbe wurde aber für große Werte von \\nu/T sehr vollkommen durch das Experiment bestätigt. Wir legen diese Formel unseren Rechnungen zugrunde, behalten aber im Sinne, daß unsere Resultate nur innerhalb gewisser Grenzen gelten."
