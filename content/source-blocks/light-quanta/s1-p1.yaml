diplomaticText: "Wir stellen uns zunächst auf den Standpunkt der Maxwellschen Theorie und Elektronentheorie und betrachten folgenden Fall. In einem von vollkommen reflektierenden Wänden eingeschlossenen Raumes befinde sich eine Anzahl Gasmoleküle und Elektronen, welche freibeweglich sind und aufeinander konservative Kräfte ausüben, wenn sie einander sehr nahe kommen, d. h. miteinander wie Gasmoleküle nach der kinetischen Gastheorie zusammenstoßen können.1) Eine Anzahl Elektronen sei ferner an voneinander weit entfernte Punkte des Raumes gekettet durch nach diesen Punkten gerichtete, den Elongationen proportionale Kräfte. Auch diese Elektronen sollen mit den freien Molekülen und Elektronen in konservative Wechselwirkung treten, wenn ihnen letztere sehr nahe kommen. Wir nennen die an Raumpunkte geketteten Elektronen „Resonatoren“; sie senden elektromagnetische Wellen bestimmter Periode aus und absorbieren solche."
