diplomaticText: "Wir werden anzunehmen haben, daß bei der Ionisierung eines Gases durch ultraviolettes Licht je ein absorbiertes Lichtenergiequant zur Ionisierung je eines Gasmoleküles verwendet wird. Hieraus folgt zunächst, daß die Ionisierungsarbeit (d. h. die zur Ionisierung theoretisch nötige Arbeit) eines Moleküles nicht größer sein kann als die Energie eines absorbierten wirksamen Lichtenergiequantes. Bezeichnet man mit J die (theoretische) Ionisierungsarbeit pro Grammäquivalent, so muß also sein: Nach Messungen Lenards ist aber die größte wirksame Wellenlänge für Luft ca. 1{,}9 \\cdot 10^{-5} cm, also"
