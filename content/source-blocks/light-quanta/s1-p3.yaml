diplomaticText: "Wir sehen vorläufig von der von den Resonatoren emittierten und absorbierten Strahlung ab und fragen nach der der Wechselwirkung (den Zusammenstößen) von Molekülen und Elektronen entsprechenden Bedingung für das dynamische Gleichgewicht. Die kinetische Gastheorie liefert für letzteres die Bedingung, daß die mittlere lebendige Kraft eines Resonatorelektrons gleich der mittleren kinetischen Energie der fortschreitenden Bewegung eines Gasmoleküles sein muß. Zerlegen wir die Bewegung des Resonatorelektrons in drei aufeinander senkrechte Schwingungsbewegungen, so finden wir für den Mittelwert \\overline{E} der Energie einer solchen geradlinigen Schwingungsbewegung wobei R die absolute Gaskonstante, N die Anzahl der „wirklichen Moleküle“ in einem Grammäquivalent und T die absolute Temperatur bedeutet. Die Energie \\overline{E} ist nämlich wegen der Gleichheit der zeitlichen Mittelwerte von kinetischer und potentieller Energie des Resonators 2/3 mal so groß wie die lebendige Kraft eines freien, einatomigen Gasmoleküles. Würde nun durch irgend eine Ursache — in unserem Falle durch Strahlungsvorgänge — bewirkt, daß die Energie eines Resonators einen größeren oder kleineren zeitlichen Mittelwert als \\overline{E} besitzt, so würden die Zusammenstöße mit den freien Elektronen und Molekülen zu einer im Mittel von Null verschiedenen Energieabgabe an das Gas bez. Energieaufnahme von dem Gas führen. Es ist also in dem von uns betrachteten Falle dynamisches Gleichgewicht nur dann möglich, wenn jeder Resonator die mittlere Energie \\overline{E} besitzt."
