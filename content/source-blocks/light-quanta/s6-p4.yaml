diplomaticText: "Wenn sich nun monochromatische Strahlung (von hinreichend kleiner Dichte) bezüglich der Abhängigkeit der Entropie vom Volumen wie ein diskontinuierliches Medium verhält, welches aus Energiequanten von der Größe R \\beta \\nu / N besteht, so liegt es nahe, zu untersuchen, ob auch die Gesetze der Erzeugung und Verwandlung des Lichtes so beschaffen sind, wie wenn das Licht aus derartigen Energiequanten bestünde. Mit dieser Frage wollen wir uns im folgenden beschäftigen."
