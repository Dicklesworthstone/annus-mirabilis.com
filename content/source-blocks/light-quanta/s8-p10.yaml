diplomaticText: "Für die Kathodenlumineszenz, welche den inversen Vorgang zu dem eben betrachteten bildet, erhält man durch eine der durchgeführten analoge Betrachtung: Bei den von Hrn. Lenard untersuchten Substanzen ist P E stets bedeutend größer als R \\beta \\nu, da die Spannung, welche die Kathodenstrahlen durchlaufen haben müssen, um eben sichtbares Licht erzeugen zu können, in einigen Fällen einige Hundert, in anderen Tausende von Volts beträgt.2) Es ist also anzunehmen, daß die kinetische Energie eines Elektrons zur Erzeugung vieler Lichtenergiequanten verwendet wird."
