diplomaticText: "Nach der Auffassung, daß das erregende Licht aus Energiequanten von der Energie (R/N) \\beta \\nu bestehe, läßt sich die Erzeugung von Kathodenstrahlen durch Licht folgendermaßen auffassen. In die oberflächliche Schicht des Körpers dringen Energiequanten ein, und deren Energie verwandelt sich wenigstens zum Teil in kinetische Energie von Elektronen. Die einfachste Vorstellung ist die, daß ein Lichtquant seine ganze Energie an ein einziges Elektron abgibt; wir wollen annehmen, daß dies vorkomme. Es soll jedoch nicht ausgeschlossen sein, daß Elektronen die Energie von Lichtquanten nur teilweise aufnehmen. Ein im Innern des Körpers mit kinetischer Energie versehenes Elektron wird, wenn es die Oberfläche erreicht hat, einen Teil seiner kinetischen Energie eingebüßt haben. Außerdem wird anzunehmen sein, daß jedes Elektron beim Verlassen des Körpers eine (für den Körper charakteristische) Arbeit P zu leisten hat, wenn es den Körper verläßt. Mit der größten Normalgeschwindigkeit werden die unmittelbar an der Oberfläche normal zu dieser erregten Elektronen den Körper verlassen. Die kinetische Energie solcher Elektronen ist"
