uncertainty:
  type: quoted-mass-error-energy-error-unreported
  perRow: true
  description: "The quoted mass errors are ±0.0006 and ±0.0004 in the source's O16 mass units. Bainbridge describes the first agreement in terms of probable error. These quantities are not relabelled as standard deviations or 95 percent confidence intervals. No numerical uncertainty is supplied for the energy gains. A discrepancy divided by the quoted mass error is a descriptive ratio only, not a significance statistic or a complete uncertainty budget."
notes: "The mass unit is the historical physical oxygen-16 scale (oxygen-16 assigned mass 16), exactly as stated on p. 123. It is not the modern carbon-12 unified atomic mass unit, and no conversion between these scales is performed. The energy-equivalent masses are Bainbridge's printed conditional calculations, not a second independent measurement. The measured mass differences come from separate mass-spectrograph results; their printed aggregate values are not reconstructed from the energy law. The first reaction agrees within the quoted mass error. Bainbridge judges the second unsatisfactory and conditions its interpretation on the lithium-6 reaction assignment, momentum conservation and extrapolated range-energy calibration. These are two different reported reactions, not repeated observations for a pooled fit. Observation dates are not supplied by this letter."
