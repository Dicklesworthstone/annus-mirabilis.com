      source: "Bainbridge, Physical Review 44, lower left and right columns and references 1, 3, 4 and 5; visually inspected original page, Internet Archive leaf n60."
    description: "Conditional interpretation of Lewis, Livingston and Lawrence's observations as lithium-6 capturing a deuteron and producing two alpha particles. The energy estimate uses extrapolated range-energy data and conservation of momentum. The mass difference uses Aston's helium value and Bainbridge's deuterium and lithium-6 values. The letter does not date these separate observations."
