    description: "Lithium-7 plus a proton produces two alpha particles. Bainbridge compares the energy inferred from Cockcroft and Walton's observations with a mass difference using Aston's helium and hydrogen values and his own lithium-7 value. The letter does not give observation dates; its 16 June 1933 dateline and 15 July publication are not observation dates."
  - id: lithium-6-deuteron
    publicationId: bainbridge-1933-physical-review
    observationDateUnavailable:
