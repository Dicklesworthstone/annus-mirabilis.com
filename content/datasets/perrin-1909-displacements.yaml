uncertainty:
  type: printed-rounding-only
  value: 5.0e-13
  description: "Half the last printed place is 0.05 square micrometres for 50.2 and 113.5, and 0.5 square micrometres for 128 and 144. The stored value is the larger rounding allowance, in square metres. These are transcription precision limits, not experimental error bars or confidence intervals. Perrin gives no uncertainty for each row here; pp. 78-79 discuss finite sampling and position-reading error, which biases mean squares upward."
notes: "Only the first series is transcribed, because p. 77 states its temperature and viscosity together. The second series has a different viscosity and is not pooled with it. Page 76 defines the observed statistic from squared horizontal displacements; the values here are those printed in the mean-square column, not values recovered from Perrin's inferred molecular number or from Einstein's equation. The four intervals use the same fifty grains and are not four independent experiments. The source lists 0.212 micrometre as the radius, not the diameter. The model comparison uses the separately accepted laboratory diffusivity and today's constants when the source preset is applied. It makes no fit and does not certify the model's assumptions."
