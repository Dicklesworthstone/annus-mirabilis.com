uncertainty:
  type: printed-rounding-only
  value: 0.0005
  description: "Half the last printed place is 0.0005 fringe, a transcription rounding allowance only. The table reports no experimental uncertainty or confidence interval. Its differences from the mean are not error bars. Common apparatus and flow-normalization errors are not independent across the rows."
notes: "Printed sum 4.373 and mean 0.23016 fringe. The source's approximately 0.46 reversal displacement doubles the one-direction mean; it is not a second independent observation. Page 388 gives the tube length rounded to 1.487 m, whereas the calculation on p. 394 explicitly uses 1.4875 m. Page 395 selects the 526 nm E line from sunlight, not monochromatic illumination. Numerical refractive index and light speed are not supplied on these calculation pages: the interactive comparison explicitly uses assumed n = 1.333 and modern SI c. The source's printed predictions, 0.4597 (full drag, p. 395) and 0.2022 (Fresnel, p. 398), remain separate. Pages 398-399 identify an unmeasured difference between bulk mean water speed and faster central water crossed by the rays; no correction is fitted here."
