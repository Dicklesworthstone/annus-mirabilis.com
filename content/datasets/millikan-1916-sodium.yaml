uncertainty:
  type: stated-and-reading
  value: 0.02
  description: "Millikan puts the maximum error in locating any intercept at about two hundredths of a volt (p. 372) and says no potential departs from the line by more than .01 volt (p. 374). Reading the printed figure adds about ±0.007 V and ±0.10e13 Hz for each point. The 2,535 row is printed (p. 382), so it carries no reading error."
notes: "Millikan prints no table of sodium stopping potentials, and no Table IV. The sodium points appear only in Fig. 6 (p. 373), as the intercepts of the photocurrent-potential curves on the potential axis plotted against frequency. They are signed, and they are uncorrected for the contact E.M.F. between the sodium and the copper-oxide collector, which he gives as 2.51 volts at the time (p. 383). Rows 1-5 are read from the figure; row 6 (2,535) is the value p. 382 prints, 'ν = 118.2 × 10¹³' and 'observed V₀ ... .52 volt', which the figure reading (118.17, +0.517) agrees with. Table I's fifth heading, 3,126, is printed 3,125 in the text (pp. 372, 374, 382) and 3,120 on p. 375, and its fourth, 3,650, is printed 3,651 on p. 374. Every read frequency agrees with c/λ to within 0.36 percent. His slope: 4.124 × 10⁻¹⁵ volt-frequencies from Fig. 6 (p. 374), 4.128 × 10⁻¹⁵ with Table II, giving h = 6.569 × 10⁻²⁷ erg s with e = 4.774 × 10⁻¹⁰ (p. 375). A line through these five read points before 2,535, the five he says fixed the slope, has slope 4.103 × 10⁻¹⁵ on c/λ frequencies, with residuals up to 0.025 V. Revision 1 (2026-09-16, 'Editorial Team') was withdrawn on 2026-09-24 because its rows could not be traced to the page; this revision replaces it."
