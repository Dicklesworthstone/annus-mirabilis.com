id: millikan-1916-sodium
title: "Millikan (1916) Direct Photoelectric Determination of Planck's h (Sodium)"
evidenceStatus: withdrawn
withdrawal:
  date: "2026-09-24"
  reason: "The six rows this laboratory used to plot could not be traced to Millikan's printed table. No image of the page was recorded, and the row for 312.6 nm gives a frequency 2.7 percent away from the speed of light divided by that wavelength while its voltage still sits on the fitted line, which is what a voltage computed from the frequency does and a reading from the page would not. They are withdrawn until his table is read from a scan of the journal."
