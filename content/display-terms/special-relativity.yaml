  # Section 7. The plane wave in K and its description in k: the Doppler principle and aberration.
  # eq-s7-d1: (X_0, Y_0, Z_0) and (L_0, M_0, N_0) are 'the vectors that determine the amplitude of
  #   the wave train' (s7-p1-s2), so each triple binds one amplitude vector; section 7's A (eq-s7-d11)
  #   is the amplitude of the electric or magnetic force, lightAmplitudeStationary. a, b, c are the
  #   wave normal's direction cosines, and capital Phi the phase. Its ten quantities exceed the nine
  #   colours, so it is a shared view (716a2115): coloured, with the chips' names telling repeats apart.
