  # § 9. The Maxwell-Hertz equations with convection current: u is the velocity of the electricity
  #   (u_x, u_y, u_z in K; u_ξ, u_η, u_ζ in k), and ϱ, which p. 916 prints as "die 4π-fache Dichte der
  #   Elektrizität" (4π times its density, Gaussian units), is bound to the charge density of each system.
  - display: eq-s9-d1
    latex: "\\begin{aligned} \\frac{1}{V} \\left\\{ u_x \\varrho + \\frac{\\partial X}{\\partial t} \\right\\} &= \\frac{\\partial N}{\\partial y} - \\frac{\\partial M}{\\partial z} , &\\qquad \\frac{1}{V} \\frac{\\partial L}{\\partial t} &= \\frac{\\partial Y}{\\partial z} - \\frac{\\partial Z}{\\partial y} , \\\\ \\frac{1}{V} \\left\\{ u_y \\varrho + \\frac{\\partial Y}{\\partial t} \\right\\} &= \\frac{\\partial L}{\\partial z} - \\frac{\\partial N}{\\partial x} , &\\qquad \\frac{1}{V} \\frac{\\partial M}{\\partial t} &= \\frac{\\partial Z}{\\partial x} - \\frac{\\partial X}{\\partial z} , \\\\ \\frac{1}{V} \\left\\{ u_z \\varrho + \\frac{\\partial Z}{\\partial t} \\right\\} &= \\frac{\\partial M}{\\partial x} - \\frac{\\partial L}{\\partial y} , &\\qquad \\frac{1}{V} \\frac{\\partial N}{\\partial t} &= \\frac{\\partial X}{\\partial y} - \\frac{\\partial Y}{\\partial x} , \\end{aligned}"
    spoken: "Six equations, in three rows of two. First row: one over V times, in braces, u sub x times rho plus the partial derivative of X with respect to t, equals the partial derivative of N with respect to y minus the partial derivative of M with respect to z; and one over V times the partial derivative of L with respect to t equals the partial derivative of Y with respect to z minus the partial derivative of Z with respect to y. Second row: one over V times, in braces, u sub y times rho plus the partial derivative of Y with respect to t, equals the partial derivative of L with respect to z minus the partial derivative of N with respect to x; and one over V times the partial derivative of M with respect to t equals the partial derivative of Z with respect to x minus the partial derivative of X with respect to z. Third row: one over V times, in braces, u sub z times rho plus the partial derivative of Z with respect to t, equals the partial derivative of M with respect to x minus the partial derivative of L with respect to y; and one over V times the partial derivative of N with respect to t equals the partial derivative of X with respect to y minus the partial derivative of Y with respect to x."
    terms:
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "u_x"
        quantityId: chargeVelocityStationary
      - glyph: "\\varrho"
        quantityId: chargeDensityStationary
      - glyph: "X"
        quantityId: electricFieldStationary
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "N"
        quantityId: magneticFieldStationary
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "M"
        quantityId: magneticFieldStationary
      - glyph: "z"
        quantityId: coordinatePositionStationary
      - glyph: "L"
        quantityId: magneticFieldStationary
      - glyph: "Y"
        quantityId: electricFieldStationary
      - glyph: "Z"
        quantityId: electricFieldStationary
      - glyph: "u_y"
        quantityId: chargeVelocityStationary
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "u_z"
        quantityId: chargeVelocityStationary
  - display: eq-s9-d2
    latex: "\\varrho = \\frac{\\partial X}{\\partial x} + \\frac{\\partial Y}{\\partial y} + \\frac{\\partial Z}{\\partial z}"
    spoken: "rho equals the partial derivative of X with respect to x plus the partial derivative of Y with respect to y plus the partial derivative of Z with respect to z."
    terms:
