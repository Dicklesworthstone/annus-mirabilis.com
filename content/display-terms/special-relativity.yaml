  # eq-s9-d3: the right-hand column prints no 1/V before the time derivatives, the print's own error
  #   (receipt err-typo-p916-1); the spoken form reads what is printed.
  - display: eq-s9-d3
    latex: "\\begin{aligned} \\frac{1}{V} \\left\\{ u_\\xi \\varrho' + \\frac{\\partial X'}{\\partial \\tau} \\right\\} &= \\frac{\\partial N'}{\\partial \\eta} - \\frac{\\partial M'}{\\partial \\zeta} , &\\qquad \\frac{\\partial L'}{\\partial \\tau} &= \\frac{\\partial Y'}{\\partial \\zeta} - \\frac{\\partial Z'}{\\partial \\eta} , \\\\ \\frac{1}{V} \\left\\{ u_\\eta \\varrho' + \\frac{\\partial Y'}{\\partial \\tau} \\right\\} &= \\frac{\\partial L'}{\\partial \\zeta} - \\frac{\\partial N'}{\\partial \\xi} , &\\qquad \\frac{\\partial M'}{\\partial \\tau} &= \\frac{\\partial Z'}{\\partial \\xi} - \\frac{\\partial X'}{\\partial \\zeta} , \\\\ \\frac{1}{V} \\left\\{ u_\\zeta \\varrho' + \\frac{\\partial Z'}{\\partial \\tau} \\right\\} &= \\frac{\\partial M'}{\\partial \\xi} - \\frac{\\partial L'}{\\partial \\eta} , &\\qquad \\frac{\\partial N'}{\\partial \\tau} &= \\frac{\\partial X'}{\\partial \\eta} - \\frac{\\partial Y'}{\\partial \\xi} , \\end{aligned}"
    spoken: "Six equations, in three rows of two. First row: one over V times, in braces, u sub xi times rho prime plus the partial derivative of X prime with respect to tau, equals the partial derivative of N prime with respect to eta minus the partial derivative of M prime with respect to zeta; and the partial derivative of L prime with respect to tau equals the partial derivative of Y prime with respect to zeta minus the partial derivative of Z prime with respect to eta. Second row: one over V times, in braces, u sub eta times rho prime plus the partial derivative of Y prime with respect to tau, equals the partial derivative of L prime with respect to zeta minus the partial derivative of N prime with respect to xi; and the partial derivative of M prime with respect to tau equals the partial derivative of Z prime with respect to xi minus the partial derivative of X prime with respect to zeta. Third row: one over V times, in braces, u sub zeta times rho prime plus the partial derivative of Z prime with respect to tau, equals the partial derivative of M prime with respect to xi minus the partial derivative of L prime with respect to eta; and the partial derivative of N prime with respect to tau equals the partial derivative of X prime with respect to eta minus the partial derivative of Y prime with respect to xi."
    terms:
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "u_\\xi"
        quantityId: chargeVelocityMoving
      - glyph: "\\varrho'"
        quantityId: chargeDensityMoving
      - glyph: "X'"
        quantityId: electricFieldMoving
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "N'"
        quantityId: magneticFieldMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "M'"
        quantityId: magneticFieldMoving
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "L'"
        quantityId: magneticFieldMoving
      - glyph: "Y'"
        quantityId: electricFieldMoving
      - glyph: "Z'"
        quantityId: electricFieldMoving
      - glyph: "u_\\eta"
        quantityId: chargeVelocityMoving
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "u_\\zeta"
        quantityId: chargeVelocityMoving
  - display: eq-s9-d4
    latex: "\\begin{aligned} \\frac{u_x - v}{1 - \\frac{u_x v}{V^2}} &= u_\\xi , \\\\ \\frac{u_y}{\\beta \\left( 1 - \\frac{u_x v}{V^2} \\right)} &= u_\\eta , &\\qquad \\varrho' = \\frac{\\partial X'}{\\partial \\xi} + \\frac{\\partial Y'}{\\partial \\eta} + \\frac{\\partial Z'}{\\partial \\zeta} = \\beta \\left( 1 - \\frac{v u_x}{V^2} \\right) \\varrho . \\\\ \\frac{u_z}{\\beta \\left( 1 - \\frac{u_x v}{V^2} \\right)} &= u_\\zeta . \\end{aligned}"
    spoken: "Four equations. u sub x minus v, divided by one minus u sub x times v over V squared, equals u sub xi. u sub y divided by beta times the quantity one minus u sub x times v over V squared, equals u sub eta; and rho prime equals the partial derivative of X prime with respect to xi plus the partial derivative of Y prime with respect to eta plus the partial derivative of Z prime with respect to zeta, which equals beta times the quantity one minus v times u sub x over V squared, times rho. u sub z divided by beta times the quantity one minus u sub x times v over V squared, equals u sub zeta."
    terms:
      - glyph: "u_x"
        quantityId: chargeVelocityStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "u_\\xi"
        quantityId: chargeVelocityMoving
      - glyph: "u_y"
        quantityId: chargeVelocityStationary
      - glyph: "\\beta"
        quantityId: lorentzFactor
