# Printed displays of Zur Elektrodynamik bewegter Körper (ap-17-891), in colour.
# One entry per display (src/equations/printed/displayTerms.ts reads and checks this file):
#   latex          a copy of the display's printed LaTeX, byte for byte as its source block has it;
#   spoken         the authored spoken form, in the letters Einstein printed;
#   terms          each printed glyph (one letter with its subscripts and decorations) and the exact
#                  canonical quantity id it binds here; the notation concordance must agree where it
#                  has an entry in the display's scope;
#   notQuantities  glyphs that name no quantity, each with its reason (also allowed once, file-wide).
# Every letter in a display is bound or declared. Adding an entry needs no code change.
#
# Paper 3's letters change meaning by section (content/notation/special-relativity.yaml). Einstein's
# beta is the modern gamma (lorentzFactor, never speedRatio); tau is the moving system's time
# coordinate, never a proper time; V is the speed of light; the Galilean auxiliary x' of section 3
# is not the moving-frame coordinate; and L, N, K, E and P each mean different things in different
# sections.
#
# The entries follow the paper's order: Part I (sections 1 to 5), then Part II (sections 6 to 10).
paper: special-relativity
notQuantities:
  - glyph: "d"
    reason: "The differential d of d^2x/dt^2 and of the integrals of section 10, an operator."
  - glyph: "\\pi"
    reason: "The number pi of the Gaussian energy density A^2/8 pi, section 8."
displays:
  # ---- Part I, sections 1 to 5 ----

  # Sections 1 and 2. The light-signal rule for synchronous clocks, and the relativity of lengths and times.
  # eq-s1-d1: § 1's definition of synchronous clocks. t_A, t_B and t'_A are readings of the resting system's
  #   clocks at A and B (concordance sr.tA, sr.tB and sr.tAret, all coordinateTimeStationary).
  - display: eq-s1-d1
    latex: "t_B - t_A = t'_A - t_B ."
    spoken: "t sub B minus t sub A equals t prime sub A minus t sub B."
    terms:
      - glyph: "t_B"
        quantityId: coordinateTimeStationary
      - glyph: "t_A"
        quantityId: coordinateTimeStationary
      - glyph: "t'_A"
        quantityId: coordinateTimeStationary
  - display: eq-s1-d2
    latex: "\\frac{2 \\overline{AB}}{t'_A - t_A} = V"
    spoken: "Two times the distance A B, divided by t prime sub A minus t sub A, equals V."
    terms:
      - glyph: "\\overline{AB}"
        quantityId: eventSeparationSpatial
      - glyph: "t'_A"
        quantityId: coordinateTimeStationary
      - glyph: "t_A"
        quantityId: coordinateTimeStationary
      - glyph: "V"
        quantityId: speedOfLight
  # eq-s2-d1: the definition of velocity in words (Geschwindigkeit, Lichtweg, Zeitdauer); it prints no letter to bind.
  - display: eq-s2-d1
    latex: "\\text{Geschwindigkeit} = \\frac{\\text{Lichtweg}}{\\text{Zeitdauer}} ,"
    spoken: "Geschwindigkeit equals Lichtweg divided by Zeitdauer: velocity equals light path divided by time interval."
    terms: []
  # eq-s2-d2 and eq-s2-d3: § 2's moving rod, timed with the resting system's clocks at its ends. The
  #   concordance's t_A, t_B and t'_A entries are scoped to § 1; in § 2 the same letters are again readings of
  #   those clocks, so they bind the same quantity. r_AB is the rod's length measured in the resting system.
  - display: eq-s2-d2
    latex: "t_B - t_A = \\frac{r_{AB}}{V - v}"
    spoken: "t sub B minus t sub A equals r sub A B divided by V minus v."
    terms:
      - glyph: "t_B"
        quantityId: coordinateTimeStationary
      - glyph: "t_A"
        quantityId: coordinateTimeStationary
      - glyph: "r_{AB}"
        quantityId: lengthMeasuredStationary
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
  - display: eq-s2-d3
    latex: "t'_A - t_B = \\frac{r_{AB}}{V + v} ,"
    spoken: "t prime sub A minus t sub B equals r sub A B divided by V plus v."
    terms:
      - glyph: "t'_A"
        quantityId: coordinateTimeStationary
      - glyph: "t_B"
        quantityId: coordinateTimeStationary
      - glyph: "r_{AB}"
        quantityId: lengthMeasuredStationary
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed

  # Section 3. The transformation of coordinates and times from the resting system K to the system k in uniform translation.
  # eq-s3-d1 to eq-s3-d14: tau is k's time coordinate and xi, eta, zeta its coordinates; x' is the Galilean
  #   auxiliary x - vt (sr.xprime.auxiliaryGalileanCoordinate), not a moving-frame coordinate. tau_0, tau_1, tau_2 are
  #   the readings of k's clock at the origin when the ray leaves, is reflected, and returns.
  - display: eq-s3-d1
    latex: "\\frac{1}{2}(\\tau_0 + \\tau_2) = \\tau_1"
    spoken: "One half of the quantity tau sub zero plus tau sub two equals tau sub one."
    terms:
      - glyph: "\\tau_0"
        quantityId: coordinateTimeMoving
      - glyph: "\\tau_2"
        quantityId: coordinateTimeMoving
      - glyph: "\\tau_1"
        quantityId: coordinateTimeMoving
  - display: eq-s3-d2
    latex: "\\begin{aligned} &\\frac{1}{2}\\left[ \\tau(0,0,0,t) + \\tau\\left( 0,0,0,\\left\\{ t + \\frac{x'}{V-v} + \\frac{x'}{V+v} \\right\\} \\right) \\right] \\\\ &= \\tau\\left( x',0,0,t + \\frac{x'}{V-v} \\right). \\end{aligned}"
    spoken: "One half of: tau of zero, zero, zero, t, plus tau of zero, zero, zero, and t plus x prime over V minus v plus x prime over V plus v; equals tau of x prime, zero, zero, and t plus x prime over V minus v."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
  - display: eq-s3-d3
    latex: "\\frac{1}{2}\\left( \\frac{1}{V-v} + \\frac{1}{V+v} \\right) \\frac{\\partial \\tau}{\\partial t} = \\frac{\\partial \\tau}{\\partial x'} + \\frac{1}{V-v} \\frac{\\partial \\tau}{\\partial t} ,"
    spoken: "One half of the quantity one over V minus v plus one over V plus v, times the partial derivative of tau with respect to t, equals the partial derivative of tau with respect to x prime plus one over V minus v times the partial derivative of tau with respect to t."
    terms:
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
  - display: eq-s3-d4
    latex: "\\frac{\\partial \\tau}{\\partial x'} + \\frac{v}{V^2 - v^2} \\frac{\\partial \\tau}{\\partial t} = 0 ."
    spoken: "The partial derivative of tau with respect to x prime, plus v over V squared minus v squared times the partial derivative of tau with respect to t, equals zero."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "t"
        quantityId: coordinateTimeStationary
  - display: eq-s3-d5
    latex: "\\begin{aligned} \\frac{\\partial \\tau}{\\partial y} &= 0 \\\\ \\frac{\\partial \\tau}{\\partial z} &= 0 . \\end{aligned}"
    spoken: "The partial derivative of tau with respect to y equals zero, and the partial derivative of tau with respect to z equals zero."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "z"
        quantityId: coordinatePositionStationary
  - display: eq-s3-d6
    latex: "\\tau = a\\left( t - \\frac{v}{V^2 - v^2} x' \\right) ,"
    spoken: "tau equals a times the quantity t minus v over V squared minus v squared times x prime."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "a"
        quantityId: transformationCoefficientA
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
  - display: eq-s3-d7
    latex: "\\xi = V \\tau ,"
    spoken: "xi equals V tau."
    terms:
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
  - display: eq-s3-d8
    latex: "\\xi = a V \\left( t - \\frac{v}{V^2 - v^2} x' \\right) ."
    spoken: "xi equals a V times the quantity t minus v over V squared minus v squared times x prime."
    terms:
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "a"
        quantityId: transformationCoefficientA
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
  - display: eq-s3-d9
    latex: "\\frac{x'}{V-v} = t ."
    spoken: "x prime over V minus v equals t."
    terms:
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "t"
        quantityId: coordinateTimeStationary
  - display: eq-s3-d10
    latex: "\\xi = a \\frac{V^2}{V^2 - v^2} x' ."
    spoken: "xi equals a times V squared over V squared minus v squared, times x prime."
    terms:
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "a"
        quantityId: transformationCoefficientA
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
  - display: eq-s3-d11
    latex: "\\eta = V \\tau = a V \\left( t - \\frac{v}{V^2 - v^2} x' \\right) ,"
    spoken: "eta equals V tau, which equals a V times the quantity t minus v over V squared minus v squared times x prime."
    terms:
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "a"
        quantityId: transformationCoefficientA
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
  - display: eq-s3-d12
    latex: "\\frac{y}{\\sqrt{V^2 - v^2}} = t ; \\quad x' = 0 ;"
    spoken: "y over the square root of V squared minus v squared equals t; and x prime equals zero."
    terms:
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "x'"
        quantityId: auxiliaryGalileanCoordinate
  - display: eq-s3-d13
    latex: "\\eta = a \\frac{V}{\\sqrt{V^2 - v^2}} y"
    spoken: "eta equals a times V over the square root of V squared minus v squared, times y."
    terms:
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "a"
        quantityId: transformationCoefficientA
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "y"
        quantityId: coordinatePositionStationary
  - display: eq-s3-d14
    latex: "\\zeta = a \\frac{V}{\\sqrt{V^2 - v^2}} z ."
    spoken: "zeta equals a times V over the square root of V squared minus v squared, times z."
    terms:
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "a"
        quantityId: transformationCoefficientA
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "z"
        quantityId: coordinatePositionStationary
  # eq-s3-d15 and eq-s3-d16: the transformation with the function phi(v) not yet determined. Einstein's beta
  #   is the modern gamma (lorentzFactor, sr.beta.lorentzFactor), never v over V.
  - display: eq-s3-d15
    latex: "\\begin{aligned} \\tau &= \\varphi(v) \\beta \\left( t - \\frac{v}{V^2} x \\right) , \\\\ \\xi &= \\varphi(v) \\beta (x - v t), \\\\ \\eta &= \\varphi(v) y, \\\\ \\zeta &= \\varphi(v) z, \\end{aligned}"
    spoken: "tau equals phi of v times beta times the quantity t minus v over V squared times x; xi equals phi of v times beta times the quantity x minus v t; eta equals phi of v times y; zeta equals phi of v times z."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "\\varphi"
        quantityId: scaleFactorUnknown
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "z"
        quantityId: coordinatePositionStationary
  - display: eq-s3-d16
    latex: "\\beta = \\frac{1}{\\sqrt{1 - \\left( \\frac{v}{V} \\right)^2}}"
    spoken: "beta equals one divided by the square root of one minus the square of v over V."
    terms:
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
  # eq-s3-d17 and eq-s3-d18: a spherical wave sent from the common origin at t = tau = 0, in K and in k.
  - display: eq-s3-d17
    latex: "x^2 + y^2 + z^2 = V^2 t^2 ."
    spoken: "x squared plus y squared plus z squared equals V squared t squared."
    terms:
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "z"
        quantityId: coordinatePositionStationary
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "t"
        quantityId: coordinateTimeStationary
  - display: eq-s3-d18
    latex: "\\xi^2 + \\eta^2 + \\zeta^2 = V^2 \\tau^2 ."
    spoken: "xi squared plus eta squared plus zeta squared equals V squared tau squared."
    terms:
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
  # eq-s3-d19: t', x', y', z' are the time and coordinates of a third system K', moving with -v relative to k and
  #   so resting relative to K (p. 901); the transformation from K to K' is the identity (p. 902). They bind the
  #   resting system's quantities, as the s3-p18 concordance entries (sr.tprime.timeThirdSystem and the three
  #   coordinate entries) read them, and are not the Galilean auxiliary x' of this section's other paragraphs.
  - display: eq-s3-d19
    latex: "\\begin{aligned} t' &= \\varphi(-v) \\beta(-v) \\left\\{ \\tau + \\frac{v}{V^2} \\xi \\right\\} &&= \\varphi(v) \\varphi(-v) t , \\\\ x' &= \\varphi(-v) \\beta(-v) \\{ \\xi + v \\tau \\} &&= \\varphi(v) \\varphi(-v) x , \\\\ y' &= \\varphi(-v) \\eta &&= \\varphi(v) \\varphi(-v) y , \\\\ z' &= \\varphi(-v) \\zeta &&= \\varphi(v) \\varphi(-v) z . \\end{aligned}"
    spoken: "t prime equals phi of minus v times beta of minus v times, in braces, tau plus v over V squared times xi; which equals phi of v times phi of minus v times t. x prime equals phi of minus v times beta of minus v times, in braces, xi plus v tau; which equals phi of v times phi of minus v times x. y prime equals phi of minus v times eta; which equals phi of v times phi of minus v times y. z prime equals phi of minus v times zeta; which equals phi of v times phi of minus v times z."
    terms:
      - glyph: "t'"
        quantityId: coordinateTimeStationary
      - glyph: "\\varphi"
        quantityId: scaleFactorUnknown
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "x'"
        quantityId: coordinatePositionStationary
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "y'"
        quantityId: coordinatePositionStationary
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "z'"
        quantityId: coordinatePositionStationary
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "z"
        quantityId: coordinatePositionStationary
  - display: eq-s3-d20
    latex: "\\varphi(v) \\varphi(-v) = 1 ."
    spoken: "phi of v times phi of minus v equals one."
    terms:
      - glyph: "\\varphi"
        quantityId: scaleFactorUnknown
      - glyph: "v"
        quantityId: frameSpeed
  # eq-s3-d21 to eq-s3-d24: the ends of a rod of rest length l along k's H-axis, in K's coordinates at time t (p. 902).
  - display: eq-s3-d21
    latex: "x_1 = v t, \\quad y_1 = \\frac{l}{\\varphi(v)}, \\quad z_1 = 0"
    spoken: "x sub one equals v t; y sub one equals l over phi of v; z sub one equals zero."
    terms:
      - glyph: "x_1"
        quantityId: coordinatePositionStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "y_1"
        quantityId: coordinatePositionStationary
      - glyph: "l"
        quantityId: lengthProper
      - glyph: "\\varphi"
        quantityId: scaleFactorUnknown
      - glyph: "z_1"
        quantityId: coordinatePositionStationary
  - display: eq-s3-d22
    latex: "x_2 = v t, \\quad y_2 = 0, \\quad z_2 = 0 ."
    spoken: "x sub two equals v t; y sub two equals zero; z sub two equals zero."
    terms:
      - glyph: "x_2"
        quantityId: coordinatePositionStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "y_2"
        quantityId: coordinatePositionStationary
      - glyph: "z_2"
        quantityId: coordinatePositionStationary
  - display: eq-s3-d23
    latex: "\\frac{l}{\\varphi(v)} = \\frac{l}{\\varphi(-v)} ,"
    spoken: "l over phi of v equals l over phi of minus v."
    terms:
      - glyph: "l"
        quantityId: lengthProper
      - glyph: "\\varphi"
        quantityId: scaleFactorUnknown
      - glyph: "v"
        quantityId: frameSpeed
  - display: eq-s3-d24
    latex: "\\varphi(v) = \\varphi(-v) ."
    spoken: "phi of v equals phi of minus v."
    terms:
      - glyph: "\\varphi"
        quantityId: scaleFactorUnknown
      - glyph: "v"
        quantityId: frameSpeed
  # eq-s3-d25 and eq-s3-d26: the transformation with phi(v) = 1, and beta defined again (p. 902).
  - display: eq-s3-d25
    latex: "\\begin{aligned} \\tau &= \\beta\\left( t - \\frac{v}{V^2} x \\right), \\\\ \\xi &= \\beta(x - v t), \\\\ \\eta &= y, \\\\ \\zeta &= z, \\end{aligned}"
    spoken: "tau equals beta times the quantity t minus v over V squared times x; xi equals beta times the quantity x minus v t; eta equals y; zeta equals z."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "z"
        quantityId: coordinatePositionStationary
  - display: eq-s3-d26
    latex: "\\beta = \\frac{1}{\\sqrt{1 - \\left( \\frac{v}{V} \\right)^2}} ,"
    spoken: "beta equals one divided by the square root of one minus the square of v over V."
    terms:
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight

  # Section 4. The physical meaning of the equations: a moving rigid sphere, and a moving clock.
  # eq-s4-d1 to eq-s4-d3: a sphere of radius R at rest in k (xi, eta, zeta its coordinates), written in K's
  #   coordinates at the time t = 0, is an ellipsoid (p. 903).
  - display: eq-s4-d1
    latex: "\\xi^2 + \\eta^2 + \\zeta^2 = R^2 ."
    spoken: "xi squared plus eta squared plus zeta squared equals R squared."
    terms:
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "R"
        quantityId: sphereRadius
  - display: eq-s4-d2
    latex: "\\frac{x^2}{\\left( \\sqrt{1 - \\left( \\frac{v}{V} \\right)^2} \\right)^2} + y^2 + z^2 = R^2 ."
    spoken: "x squared, divided by the square of the square root of one minus the square of v over V, plus y squared plus z squared, equals R squared."
    terms:
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "z"
        quantityId: coordinatePositionStationary
      - glyph: "R"
        quantityId: sphereRadius
  - display: eq-s4-d3
    latex: "R \\sqrt{1 - \\left( \\frac{v}{V} \\right)^2} , \\quad R , \\quad R ."
    spoken: "R times the square root of one minus the square of v over V; R; R."
    terms:
      - glyph: "R"
        quantityId: sphereRadius
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
  # eq-s4-d4 to eq-s4-d6: the clock at the origin of k, which shows tau, seen from K (p. 904). Here tau is
  #   still the moving system's time coordinate; at the clock's own place it is that clock's reading.
  - display: eq-s4-d4
    latex: "\\tau = \\frac{1}{\\sqrt{1 - \\left( \\frac{v}{V} \\right)^2}} \\left( t - \\frac{v}{V^2} x \\right)"
    spoken: "tau equals one divided by the square root of one minus the square of v over V, times the quantity t minus v over V squared times x."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "x"
        quantityId: coordinatePositionStationary
  - display: eq-s4-d5
    latex: "x = v t ."
    spoken: "x equals v t."
    terms:
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "t"
        quantityId: coordinateTimeStationary
  - display: eq-s4-d6
    latex: "\\tau = t \\sqrt{1 - \\left( \\frac{v}{V} \\right)^2} = t - \\left( 1 - \\sqrt{1 - \\left( \\frac{v}{V} \\right)^2} \\right) t ,"
    spoken: "tau equals t times the square root of one minus the square of v over V, which equals t minus the quantity one minus the square root of one minus the square of v over V, times t."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight

  # Section 5. The addition theorem of velocities.
  # eq-s5-d1: a point moving uniformly in k; w_xi and w_eta are its velocity components along k's axes.
  - display: eq-s5-d1
    latex: "\\begin{aligned} \\xi &= w_\\xi \\tau , \\\\ \\eta &= w_\\eta \\tau , \\\\ \\zeta &= 0 , \\end{aligned}"
    spoken: "xi equals w sub xi times tau; eta equals w sub eta times tau; zeta equals zero."
    terms:
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "w_\\xi"
        quantityId: velocityComponentXMoving
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "w_\\eta"
        quantityId: velocityComponentYMoving
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
  - display: eq-s5-d2
    latex: "\\begin{aligned} x &= \\frac{w_\\xi + v}{1 + \\frac{v w_\\xi}{V^2}} t , \\\\ y &= \\frac{\\sqrt{1 - \\left( \\frac{v}{V} \\right)^2}}{1 + \\frac{v w_\\xi}{V^2}} w_\\eta t , \\\\ z &= 0 . \\end{aligned}"
    spoken: "x equals w sub xi plus v, divided by one plus v times w sub xi over V squared, times t; y equals the square root of one minus the square of v over V, divided by one plus v times w sub xi over V squared, times w sub eta times t; z equals zero."
    terms:
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "w_\\xi"
        quantityId: velocityComponentXMoving
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "w_\\eta"
        quantityId: velocityComponentYMoving
      - glyph: "z"
        quantityId: coordinatePositionStationary
  - display: eq-s5-d3
    latex: "\\begin{aligned} U^2 &= \\left( \\frac{d x}{d t} \\right)^2 + \\left( \\frac{d y}{d t} \\right)^2 , \\\\ w^2 &= w_\\xi^2 + w_\\eta^2 \\end{aligned}"
    spoken: "U squared equals the square of d x over d t plus the square of d y over d t; w squared equals w sub xi squared plus w sub eta squared."
    terms:
      - glyph: "U"
        quantityId: velocityComposed
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "w"
        quantityId: velocityInMovingFrame
      - glyph: "w_\\xi"
        quantityId: velocityComponentXMoving
      - glyph: "w_\\eta"
        quantityId: velocityComponentYMoving
  # eq-s5-d4: p. 905 prints Latin subscripts, w_y over w_x, where the display above defines the components as
  #   w_xi and w_eta; a suspected misprint (docs/provenance/ap-17-891.md, err-typo-p905-1). The transcription keeps
  #   the printed letters, and they bind the components they stand for.
  - display: eq-s5-d4
    latex: "\\alpha = \\operatorname{arctg} \\frac{w_y}{w_x} ;"
    spoken: "alpha equals the arc tangent of w sub y over w sub x."
    terms:
      - glyph: "\\alpha"
        quantityId: velocityDirectionAngle
      - glyph: "w_y"
        quantityId: velocityComponentYMoving
      - glyph: "w_x"
        quantityId: velocityComponentXMoving
  - display: eq-s5-d5
    latex: "U = \\frac{\\sqrt{(v^2 + w^2 + 2 v w \\cos \\alpha) - \\left( \\frac{v w \\sin \\alpha}{V} \\right)^2}}{1 + \\frac{v w \\cos \\alpha}{V^2}} ."
    spoken: "U equals the square root of: v squared plus w squared plus two v w cosine alpha, minus the square of v w sine alpha over V; all divided by one plus v w cosine alpha over V squared."
    terms:
      - glyph: "U"
        quantityId: velocityComposed
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "w"
        quantityId: velocityInMovingFrame
      - glyph: "\\alpha"
        quantityId: velocityDirectionAngle
      - glyph: "V"
        quantityId: speedOfLight
  - display: eq-s5-d6
    latex: "U = \\frac{v + w}{1 + \\frac{v w}{V^2}} ."
    spoken: "U equals v plus w, divided by one plus v w over V squared."
    terms:
      - glyph: "U"
        quantityId: velocityComposed
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "w"
        quantityId: velocityInMovingFrame
      - glyph: "V"
        quantityId: speedOfLight
  # eq-s5-d7: with v = V - kappa and w = V - lambda, kappa and lambda the amounts by which each speed falls short
  #   of V (speedDeficitFromLight serves both letters).
  - display: eq-s5-d7
    latex: "U = V \\frac{2 V - \\varkappa - \\lambda}{2 V - \\varkappa - \\lambda + \\frac{\\varkappa \\lambda}{V}} < V ."
    spoken: "U equals V times: two V minus kappa minus lambda, divided by two V minus kappa minus lambda plus kappa lambda over V; and this is less than V."
    terms:
      - glyph: "U"
        quantityId: velocityComposed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "\\varkappa"
        quantityId: speedDeficitFromLight
      - glyph: "\\lambda"
        quantityId: speedDeficitFromLight
  - display: eq-s5-d8
    latex: "U = \\frac{V + w}{1 + \\frac{w}{V}} = V ."
    spoken: "U equals V plus w, divided by one plus w over V, which equals V."
    terms:
      - glyph: "U"
        quantityId: velocityComposed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "w"
        quantityId: velocityInMovingFrame
  - display: eq-s5-d9
    latex: "\\frac{v + w}{1 + \\frac{v w}{V^2}}"
    spoken: "v plus w, divided by one plus v w over V squared."
    terms:
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "w"
        quantityId: velocityInMovingFrame
      - glyph: "V"
        quantityId: speedOfLight

  # ---- Part II, sections 6 to 10 ----

  # Section 6. The Maxwell-Hertz equations for empty space, transformed by section 3's equations.
  - display: eq-s6-d1
    latex: "\\begin{aligned} \\frac{1}{V} \\frac{\\partial X}{\\partial t} &= \\frac{\\partial N}{\\partial y} - \\frac{\\partial M}{\\partial z} , &\\qquad \\frac{1}{V} \\frac{\\partial L}{\\partial t} &= \\frac{\\partial Y}{\\partial z} - \\frac{\\partial Z}{\\partial y} , \\\\ \\frac{1}{V} \\frac{\\partial Y}{\\partial t} &= \\frac{\\partial L}{\\partial z} - \\frac{\\partial N}{\\partial x} , &\\qquad \\frac{1}{V} \\frac{\\partial M}{\\partial t} &= \\frac{\\partial Z}{\\partial x} - \\frac{\\partial X}{\\partial z} , \\\\ \\frac{1}{V} \\frac{\\partial Z}{\\partial t} &= \\frac{\\partial M}{\\partial x} - \\frac{\\partial L}{\\partial y} , &\\qquad \\frac{1}{V} \\frac{\\partial N}{\\partial t} &= \\frac{\\partial X}{\\partial y} - \\frac{\\partial Y}{\\partial x} , \\end{aligned}"
    spoken: "Six equations, in three rows of two. First row: one over V times the partial derivative of X with respect to t equals the partial derivative of N with respect to y minus the partial derivative of M with respect to z; and one over V times the partial derivative of L with respect to t equals the partial derivative of Y with respect to z minus the partial derivative of Z with respect to y. Second row: one over V times the partial derivative of Y with respect to t equals the partial derivative of L with respect to z minus the partial derivative of N with respect to x; and one over V times the partial derivative of M with respect to t equals the partial derivative of Z with respect to x minus the partial derivative of X with respect to z. Third row: one over V times the partial derivative of Z with respect to t equals the partial derivative of M with respect to x minus the partial derivative of L with respect to y; and one over V times the partial derivative of N with respect to t equals the partial derivative of X with respect to y minus the partial derivative of Y with respect to x."
    terms:
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "X"
        quantityId: electricFieldStationary
      - glyph: "Y"
        quantityId: electricFieldStationary
      - glyph: "Z"
        quantityId: electricFieldStationary
      - glyph: "L"
        quantityId: magneticFieldStationary
      - glyph: "M"
        quantityId: magneticFieldStationary
      - glyph: "N"
        quantityId: magneticFieldStationary
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "z"
        quantityId: coordinatePositionStationary
  - display: eq-s6-d2
    latex: "\\begin{aligned} \\frac{1}{V} \\frac{\\partial X}{\\partial \\tau} &= \\frac{\\partial \\beta \\left( N - \\frac{v}{V} Y \\right)}{\\partial \\eta} - \\frac{\\partial \\beta \\left( M + \\frac{v}{V} Z \\right)}{\\partial \\zeta} , \\\\ \\frac{1}{V} \\frac{\\partial \\beta \\left( Y - \\frac{v}{V} N \\right)}{\\partial \\tau} &= \\frac{\\partial L}{\\partial \\zeta} - \\frac{\\partial \\beta \\left( N - \\frac{v}{V} Y \\right)}{\\partial \\xi} , \\\\ \\frac{1}{V} \\frac{\\partial \\beta \\left( Z + \\frac{v}{V} M \\right)}{\\partial \\tau} &= \\frac{\\partial \\beta \\left( M + \\frac{v}{V} Z \\right)}{\\partial \\xi} - \\frac{\\partial L}{\\partial \\eta} , \\\\ \\frac{1}{V} \\frac{\\partial L}{\\partial \\tau} &= \\frac{\\partial \\beta \\left( Y - \\frac{v}{V} N \\right)}{\\partial \\zeta} - \\frac{\\partial \\beta \\left( Z + \\frac{v}{V} M \\right)}{\\partial \\eta} , \\\\ \\frac{1}{V} \\frac{\\partial \\beta \\left( M + \\frac{v}{V} Z \\right)}{\\partial \\tau} &= \\frac{\\partial \\beta \\left( Z + \\frac{v}{V} M \\right)}{\\partial \\xi} - \\frac{\\partial X}{\\partial \\zeta} , \\\\ \\frac{1}{V} \\frac{\\partial \\beta \\left( N - \\frac{v}{V} Y \\right)}{\\partial \\tau} &= \\frac{\\partial X}{\\partial \\eta} - \\frac{\\partial \\beta \\left( Y - \\frac{v}{V} N \\right)}{\\partial \\xi} , \\end{aligned}"
    spoken: "Six equations. First: one over V times the partial derivative of X with respect to tau equals the partial derivative with respect to eta of beta times the quantity N minus v over V times Y, minus the partial derivative with respect to zeta of beta times the quantity M plus v over V times Z. Second: one over V times the partial derivative with respect to tau of beta times the quantity Y minus v over V times N equals the partial derivative of L with respect to zeta, minus the partial derivative with respect to xi of beta times the quantity N minus v over V times Y. Third: one over V times the partial derivative with respect to tau of beta times the quantity Z plus v over V times M equals the partial derivative with respect to xi of beta times the quantity M plus v over V times Z, minus the partial derivative of L with respect to eta. Fourth: one over V times the partial derivative of L with respect to tau equals the partial derivative with respect to zeta of beta times the quantity Y minus v over V times N, minus the partial derivative with respect to eta of beta times the quantity Z plus v over V times M. Fifth: one over V times the partial derivative with respect to tau of beta times the quantity M plus v over V times Z equals the partial derivative with respect to xi of beta times the quantity Z plus v over V times M, minus the partial derivative of X with respect to zeta. Sixth: one over V times the partial derivative with respect to tau of beta times the quantity N minus v over V times Y equals the partial derivative of X with respect to eta, minus the partial derivative with respect to xi of beta times the quantity Y minus v over V times N."
    terms:
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "X"
        quantityId: electricFieldStationary
      - glyph: "Y"
        quantityId: electricFieldStationary
      - glyph: "Z"
        quantityId: electricFieldStationary
      - glyph: "L"
        quantityId: magneticFieldStationary
      - glyph: "M"
        quantityId: magneticFieldStationary
      - glyph: "N"
        quantityId: magneticFieldStationary
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
  - display: eq-s6-d3
    latex: "\\beta = \\frac{1}{\\sqrt{1 - \\left( \\frac{v}{V} \\right)^2}} ."
    spoken: "beta equals one divided by the square root of one minus the square of v over V."
    terms:
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
  - display: eq-s6-d4
    latex: "\\begin{aligned} \\frac{1}{V} \\frac{\\partial X'}{\\partial \\tau} &= \\frac{\\partial N'}{\\partial \\eta} - \\frac{\\partial M'}{\\partial \\zeta} , &\\qquad \\frac{1}{V} \\frac{\\partial L'}{\\partial \\tau} &= \\frac{\\partial Y'}{\\partial \\zeta} - \\frac{\\partial Z'}{\\partial \\eta} , \\\\ \\frac{1}{V} \\frac{\\partial Y'}{\\partial \\tau} &= \\frac{\\partial L'}{\\partial \\zeta} - \\frac{\\partial N'}{\\partial \\xi} , &\\qquad \\frac{1}{V} \\frac{\\partial M'}{\\partial \\tau} &= \\frac{\\partial Z'}{\\partial \\xi} - \\frac{\\partial X'}{\\partial \\zeta} , \\\\ \\frac{1}{V} \\frac{\\partial Z'}{\\partial \\tau} &= \\frac{\\partial M'}{\\partial \\xi} - \\frac{\\partial L'}{\\partial \\eta} , &\\qquad \\frac{1}{V} \\frac{\\partial N'}{\\partial \\tau} &= \\frac{\\partial X'}{\\partial \\eta} - \\frac{\\partial Y'}{\\partial \\xi} . \\end{aligned}"
    spoken: "Six equations, in three rows of two. First row: one over V times the partial derivative of X prime with respect to tau equals the partial derivative of N prime with respect to eta minus the partial derivative of M prime with respect to zeta; and one over V times the partial derivative of L prime with respect to tau equals the partial derivative of Y prime with respect to zeta minus the partial derivative of Z prime with respect to eta. Second row: one over V times the partial derivative of Y prime with respect to tau equals the partial derivative of L prime with respect to zeta minus the partial derivative of N prime with respect to xi; and one over V times the partial derivative of M prime with respect to tau equals the partial derivative of Z prime with respect to xi minus the partial derivative of X prime with respect to zeta. Third row: one over V times the partial derivative of Z prime with respect to tau equals the partial derivative of M prime with respect to xi minus the partial derivative of L prime with respect to eta; and one over V times the partial derivative of N prime with respect to tau equals the partial derivative of X prime with respect to eta minus the partial derivative of Y prime with respect to xi."
    terms:
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "X'"
        quantityId: electricFieldMoving
      - glyph: "Y'"
        quantityId: electricFieldMoving
      - glyph: "Z'"
        quantityId: electricFieldMoving
      - glyph: "L'"
        quantityId: magneticFieldMoving
      - glyph: "M'"
        quantityId: magneticFieldMoving
      - glyph: "N'"
        quantityId: magneticFieldMoving
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
  # eq-s6-d5: psi(v) is the common factor the transformed fields may still carry (concordance
  #   sr.psi.fieldScaleFactorUnknown), not the phi(v) of section 3.
  - display: eq-s6-d5
    latex: "\\begin{aligned} X' &= \\psi(v) X , &\\qquad L' &= \\psi(v) L , \\\\ Y' &= \\psi(v) \\beta \\left( Y - \\frac{v}{V} N \\right) , &\\qquad M' &= \\psi(v) \\beta \\left( M + \\frac{v}{V} Z \\right) , \\\\ Z' &= \\psi(v) \\beta \\left( Z + \\frac{v}{V} M \\right) , &\\qquad N' &= \\psi(v) \\beta \\left( N - \\frac{v}{V} Y \\right) . \\end{aligned}"
    spoken: "Six equations, in three rows of two. First row: X prime equals psi of v times X; and L prime equals psi of v times L. Second row: Y prime equals psi of v times beta times the quantity Y minus v over V times N; and M prime equals psi of v times beta times the quantity M plus v over V times Z. Third row: Z prime equals psi of v times beta times the quantity Z plus v over V times M; and N prime equals psi of v times beta times the quantity N minus v over V times Y."
    terms:
      - glyph: "\\psi"
        quantityId: fieldScaleFactorUnknown
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "\\beta"
        quantityId: lorentzFactor
