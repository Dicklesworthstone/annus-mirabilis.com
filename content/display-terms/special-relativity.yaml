    spoken: "Seven equations, in three rows. First row: X equals X zero times sine capital Phi; and L equals L zero times sine capital Phi. Second row: Y equals Y zero times sine capital Phi; M equals M zero times sine capital Phi; and capital Phi equals omega times the quantity: t minus, a x plus b y plus c z, over V. Third row: Z equals Z zero times sine capital Phi; and N equals N zero times sine capital Phi."
