  # eq-s7-d2: Phi' binds wavePhase too, a single frame-independent record by design (see its
  #   description), so the invariance section 7 argues from stays a checkable result.
  - display: eq-s7-d2
    latex: "\\begin{aligned} X' &= X_0 \\sin \\Phi' , &\\qquad L' &= L_0 \\sin \\Phi' , \\\\ Y' &= \\beta \\left( Y_0 - \\frac{v}{V} N_0 \\right) \\sin \\Phi' , &\\qquad M' &= \\beta \\left( M_0 + \\frac{v}{V} Z_0 \\right) \\sin \\Phi' , \\\\ Z' &= \\beta \\left( Z_0 + \\frac{v}{V} M_0 \\right) \\sin \\Phi' , &\\qquad N' &= \\beta \\left( N_0 - \\frac{v}{V} Y_0 \\right) \\sin \\Phi' , \\\\ \\Phi' &= \\omega' \\left( \\tau - \\frac{a' \\xi + b' \\eta + c' \\zeta}{V} \\right) , \\end{aligned}"
