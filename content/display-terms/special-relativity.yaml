      - glyph: "Z"
        quantityId: electricFieldStationary
      - glyph: "M"
        quantityId: magneticFieldStationary
  # eq-s10-d4: the z row prints μβ³ where the paper's own steps give μβ² (receipt err-typo-p919-1);
  #   the binding and the spoken form read what is printed.
  - display: eq-s10-d4
    latex: "\\begin{aligned} \\mu \\beta^3 \\frac{d^2 x}{d t^2} &= \\varepsilon X = \\varepsilon X' , \\\\ \\mu \\beta^2 \\frac{d^2 y}{d t^2} &= \\varepsilon \\beta \\left( Y - \\frac{v}{V} N \\right) = \\varepsilon Y' , \\\\ \\mu \\beta^3 \\frac{d^2 z}{d t^2} &= \\varepsilon \\beta \\left( Z + \\frac{v}{V} M \\right) = \\varepsilon Z' \\end{aligned}"
    spoken: "Three equations. mu beta cubed times the second derivative of x with respect to t equals epsilon X, which equals epsilon X prime. mu beta squared times the second derivative of y with respect to t equals epsilon beta times the quantity Y minus v over V times N, which equals epsilon Y prime. mu beta cubed times the second derivative of z with respect to t equals epsilon beta times the quantity Z plus v over V times M, which equals epsilon Z prime."
