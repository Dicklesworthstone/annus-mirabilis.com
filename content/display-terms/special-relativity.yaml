  # § 10. The dynamics of the slowly accelerated electron: μ is its mass and ε its charge; v is the
  #   speed of the system k in which the electron is momentarily at rest, as the concordance reads v
  #   through Part II; X', Y', Z' are the field in k. eq-s10-d9 (A_m/A_e, p. 920's magnetic and electric
  #   deflectabilities) waits for the orchestrator's ruling on registering those two quantities.
  - display: eq-s10-d1
    latex: "\\begin{aligned} \\mu \\frac{d^2 x}{d t^2} &= \\varepsilon X \\\\ \\mu \\frac{d^2 y}{d t^2} &= \\varepsilon Y \\\\ \\mu \\frac{d^2 z}{d t^2} &= \\varepsilon Z , \\end{aligned}"
    spoken: "Three equations. mu times the second derivative of x with respect to t equals epsilon times X; mu times the second derivative of y with respect to t equals epsilon times Y; mu times the second derivative of z with respect to t equals epsilon times Z."
    terms:
      - glyph: "\\mu"
        quantityId: electronMass
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "\\varepsilon"
        quantityId: electronCharge
      - glyph: "X"
        quantityId: electricFieldStationary
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "Y"
        quantityId: electricFieldStationary
      - glyph: "z"
        quantityId: coordinatePositionStationary
      - glyph: "Z"
        quantityId: electricFieldStationary
  - display: eq-s10-d2
    latex: "\\begin{aligned} \\mu \\frac{d^2 \\xi}{d \\tau^2} &= \\varepsilon X' , \\\\ \\mu \\frac{d^2 \\eta}{d \\tau^2} &= \\varepsilon Y' , \\\\ \\mu \\frac{d^2 \\zeta}{d \\tau^2} &= \\varepsilon Z' , \\end{aligned}"
    spoken: "Three equations. mu times the second derivative of xi with respect to tau equals epsilon times X prime; mu times the second derivative of eta with respect to tau equals epsilon times Y prime; mu times the second derivative of zeta with respect to tau equals epsilon times Z prime."
    terms:
      - glyph: "\\mu"
        quantityId: electronMass
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "\\varepsilon"
        quantityId: electronCharge
      - glyph: "X'"
        quantityId: electricFieldMoving
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "Y'"
        quantityId: electricFieldMoving
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "Z'"
        quantityId: electricFieldMoving
  - display: eq-s10-d3
    latex: "\\begin{aligned} \\tau &= \\beta \\left( t - \\frac{v}{V^2} x \\right) , \\\\ \\xi &= \\beta (x - v t) , &\\qquad X' &= X , \\\\ \\eta &= y , &\\qquad Y' &= \\beta \\left( Y - \\frac{v}{V} N \\right) , \\\\ \\zeta &= z , &\\qquad Z' &= \\beta \\left( Z + \\frac{v}{V} M \\right) . \\end{aligned}"
    spoken: "Seven equations. tau equals beta times the quantity t minus v over V squared times x. xi equals beta times the quantity x minus v t; and X prime equals X. eta equals y; and Y prime equals beta times the quantity Y minus v over V times N. zeta equals z; and Z prime equals beta times the quantity Z plus v over V times M."
    terms:
      - glyph: "\\tau"
        quantityId: coordinateTimeMoving
      - glyph: "\\beta"
        quantityId: lorentzFactor
      - glyph: "t"
        quantityId: coordinateTimeStationary
      - glyph: "v"
        quantityId: frameSpeed
      - glyph: "V"
        quantityId: speedOfLight
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "\\xi"
        quantityId: coordinatePositionMoving
      - glyph: "X'"
        quantityId: electricFieldMoving
      - glyph: "X"
        quantityId: electricFieldStationary
      - glyph: "\\eta"
        quantityId: coordinatePositionMoving
      - glyph: "y"
        quantityId: coordinatePositionStationary
      - glyph: "Y'"
        quantityId: electricFieldMoving
      - glyph: "Y"
        quantityId: electricFieldStationary
      - glyph: "N"
        quantityId: magneticFieldStationary
      - glyph: "\\zeta"
        quantityId: coordinatePositionMoving
      - glyph: "z"
        quantityId: coordinatePositionStationary
      - glyph: "Z'"
        quantityId: electricFieldMoving
      - glyph: "Z"
        quantityId: electricFieldStationary
      - glyph: "M"
        quantityId: magneticFieldStationary
  - display: eq-A
    latex: "\\left\\{ \\begin{aligned} \\frac{d^2 x}{d t^2} &= \\frac{\\varepsilon}{\\mu} \\frac{1}{\\beta^3} X , \\\\ \\frac{d^2 y}{d t^2} &= \\frac{\\varepsilon}{\\mu} \\frac{1}{\\beta} \\left( Y - \\frac{v}{V} N \\right) , \\\\ \\frac{d^2 z}{d t^2} &= \\frac{\\varepsilon}{\\mu} \\frac{1}{\\beta} \\left( Z + \\frac{v}{V} M \\right) . \\end{aligned} \\right."
    spoken: "Equations A: three equations joined by a brace. The second derivative of x with respect to t equals epsilon over mu, times one over beta cubed, times X. The second derivative of y with respect to t equals epsilon over mu, times one over beta, times the quantity Y minus v over V times N. The second derivative of z with respect to t equals epsilon over mu, times one over beta, times the quantity Z plus v over V times M."
    terms:
      - glyph: "x"
        quantityId: coordinatePositionStationary
      - glyph: "t"
        quantityId: coordinateTimeStationary
