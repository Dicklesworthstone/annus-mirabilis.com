        quantityId: frequencyEnergyDensity
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "\\nu"
        quantityId: frequency
      - glyph: "L"
        quantityId: speedOfLight
      - glyph: "T"
        quantityId: temperature
  - display: eq-s1-d8
    latex: "\\int_0^\\infty \\varrho_\\nu d \\nu = \\frac{R}{N} \\frac{8 \\pi}{L^3} T \\int_0^\\infty \\nu^2 d \\nu = \\infty."
    spoken: "The integral from zero to infinity of rho sub nu d nu equals R over N, times eight pi over L cubed, times T, times the integral from zero to infinity of nu squared d nu, which is infinite."
    terms:
      - glyph: "\\varrho_\\nu"
        quantityId: frequencyEnergyDensity
      - glyph: "\\nu"
        quantityId: frequency
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "L"
        quantityId: speedOfLight
      - glyph: "T"
        quantityId: temperature
  - display: eq-s2-d1
    latex: "\\varrho_\\nu = \\frac{\\alpha \\nu^3}{e^{\\frac{\\beta \\nu}{T}} - 1},"
    spoken: "rho sub nu equals alpha nu cubed, divided by: e to the power beta nu over T, minus one."
    terms:
      - glyph: "\\varrho_\\nu"
        quantityId: frequencyEnergyDensity
      - glyph: "\\alpha"
        quantityId: wienConstantAlpha
      - glyph: "\\nu"
        quantityId: frequency
      - glyph: "\\beta"
