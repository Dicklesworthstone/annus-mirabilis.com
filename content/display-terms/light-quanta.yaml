# Printed displays of Über einen die Erzeugung und Verwandlung des Lichtes betreffenden heuristischen
# Gesichtspunkt (ap-17-132), in colour. The fields are mass-energy.yaml's; src/equations/printed/displayTerms.ts
# checks them. A glyph binds in its display's scope, as the notation concordance reads it there:
#   L is the speed of light in §§ 1-2 and the absorbed light energy in § 9;
#   T is the temperature, except in § 1's footnote 2) (s1-fn3), where it is the long averaging interval;
#   S is the radiation entropy in §§ 3, 4 and 6 and a gas's entropy in § 5;
#   E is the radiation energy in §§ 3, 4 and 6, a system's energy in § 5's footnote, and a
#   gram-equivalent's charge in § 8;
#   phi is the entropy per unit volume and frequency in §§ 3-4 and entropy as a function of probability in § 5;
#   rho, printed with or without its subscript nu, is the energy density per unit frequency;
#   alpha and beta are the constants of Planck's and Wien's formulas wherever they stand alone.
# Glyphs that name no quantity anywhere in the paper:
paper: light-quanta
notQuantities:
  - glyph: "\\pi"
    reason: "the number π"
  - glyph: "d"
    reason: "the sign of a differential (d nu, d S, d W)"
  - glyph: "e"
    reason: "the base of the natural logarithms, raised to a power"
  - glyph: "\\delta"
    reason: "the sign of a variation, in § 3's condition for the entropy's maximum"
displays:
  - display: eq-s1-d1
    latex: "\\overline{E} = \\frac{R}{N} T,"
    spoken: "E bar equals R over N, times T."
    terms:
      - glyph: "\\overline{E}"
        quantityId: meanResonatorEnergy
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "T"
        quantityId: temperature
  - display: eq-s1-d2
    latex: "\\overline{E}_\\nu = \\frac{L^3}{8 \\pi \\nu^2} \\varrho_\\nu."
    spoken: "E bar sub nu equals L cubed over eight pi nu squared, times rho sub nu."
    terms:
      - glyph: "\\overline{E}_\\nu"
        quantityId: meanResonatorEnergyAtFrequency
      - glyph: "L"
        quantityId: speedOfLight
      - glyph: "\\nu"
        quantityId: frequency
      - glyph: "\\varrho_\\nu"
        quantityId: frequencyEnergyDensity
  - display: eq-s1-d3
    latex: "Z = \\sum_{\\nu = 1}^{\\nu = \\infty} A_\\nu \\sin\\left(2 \\pi \\nu \\frac{t}{T} + \\alpha_\\nu\\right) ,"
    spoken: "Z equals the sum, from nu equals one to nu equals infinity, of A sub nu times the sine of: two pi nu t over T, plus alpha sub nu."
    terms:
      - glyph: "Z"
        quantityId: radiationElectricField
      - glyph: "\\nu"
        quantityId: frequency
      - glyph: "A_\\nu"
        quantityId: fourierAmplitude
      - glyph: "t"
        quantityId: elapsedTime
      - glyph: "T"
        quantityId: longAveragingInterval
      - glyph: "\\alpha_\\nu"
        quantityId: fourierPhase
  - display: eq-s1-d4
    latex: "d W = f(A_1 A_2 \\ldots \\alpha_1 \\alpha_2 \\ldots) d A_1 d A_2 \\ldots d \\alpha_1 d \\alpha_2 \\ldots"
    spoken: "d W equals f of A one, A two, and so on, alpha one, alpha two, and so on, times d A one, d A two, and so on, d alpha one, d alpha two, and so on."
    terms:
      - glyph: "W"
        quantityId: configurationProbability
      - glyph: "A_1"
        quantityId: fourierAmplitude
      - glyph: "A_2"
        quantityId: fourierAmplitude
      - glyph: "\\alpha_1"
        quantityId: fourierPhase
      - glyph: "\\alpha_2"
        quantityId: fourierPhase
    notQuantities:
      - glyph: "f"
        reason: "a probability density named as a function, as concordance entries lq.f.probabilityDensity, lq.F_nu and lq.f_nu read it"
  - display: eq-s1-d5
    latex: "f(A_1, A_2 \\ldots \\alpha_1, \\alpha_2 \\ldots) = F_1(A_1) F_2(A_2) \\ldots f_1(\\alpha_1) \\cdot f_2(\\alpha_2) \\ldots ,"
    spoken: "f of A one, A two, and so on, alpha one, alpha two, and so on, equals capital F one of A one, times capital F two of A two, and so on, times f one of alpha one, times f two of alpha two, and so on."
    terms:
      - glyph: "A_1"
        quantityId: fourierAmplitude
      - glyph: "A_2"
        quantityId: fourierAmplitude
      - glyph: "\\alpha_1"
        quantityId: fourierPhase
      - glyph: "\\alpha_2"
        quantityId: fourierPhase
    notQuantities:
      - glyph: "f"
        reason: "a probability density named as a function, as concordance entries lq.f.probabilityDensity, lq.F_nu and lq.f_nu read it"
      - glyph: "F_1"
        reason: "a probability density named as a function, as concordance entries lq.f.probabilityDensity, lq.F_nu and lq.f_nu read it"
      - glyph: "F_2"
        reason: "a probability density named as a function, as concordance entries lq.f.probabilityDensity, lq.F_nu and lq.f_nu read it"
      - glyph: "f_1"
        reason: "a probability density named as a function, as concordance entries lq.f.probabilityDensity, lq.F_nu and lq.f_nu read it"
      - glyph: "f_2"
        reason: "a probability density named as a function, as concordance entries lq.f.probabilityDensity, lq.F_nu and lq.f_nu read it"
  - display: eq-s1-d6
    latex: "\\frac{R}{N} T = \\overline{E} = \\overline{E}_\\nu = \\frac{L^3}{8 \\pi \\nu^2} \\varrho_\\nu,"
    spoken: "R over N times T equals E bar, which equals E bar sub nu, which equals L cubed over eight pi nu squared, times rho sub nu."
    terms:
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "\\overline{E}"
        quantityId: meanResonatorEnergy
      - glyph: "\\overline{E}_\\nu"
        quantityId: meanResonatorEnergyAtFrequency
      - glyph: "L"
        quantityId: speedOfLight
      - glyph: "\\nu"
        quantityId: frequency
      - glyph: "\\varrho_\\nu"
        quantityId: frequencyEnergyDensity
  - display: eq-s1-d7
