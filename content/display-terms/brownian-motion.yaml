# Printed displays of Über die von der molekularkinetischen Theorie der Wärme geforderte Bewegung von
# in ruhenden Flüssigkeiten suspendierten Teilchen (ap-17-549), in colour.
# One entry per display (src/equations/printed/displayTerms.ts reads and checks this file):
#   latex          a copy of the display's printed LaTeX, byte for byte as its source block has it;
#   spoken         the authored spoken form, in the letters Einstein printed;
#   terms          each printed glyph (one letter with its subscripts and decorations) and the exact
#                  canonical quantity id it binds here; the notation concordance
#                  (content/notation/brownian-motion.yaml) must agree where it has an entry in the
#                  display's scope;
#   notQuantities  glyphs that name no quantity, each with its reason (also allowed once, file-wide).
# Every letter in a display is bound or declared. Adding an entry needs no code change.
# Paper 2's own letters: k is the viscosity (never Boltzmann's constant), P the particle radius,
# ν a number density of particles (an index only in § 2's equations of motion), and φ the
# transition kernel of § 4.
paper: brownian-motion
# Glyphs that name no quantity in any display of this paper.
notQuantities:
  - glyph: "d"
    reason: "the differential d of an integral or a derivative: an operation, not a quantity"
  - glyph: "e"
    reason: "e, the base of the natural logarithm: a number, not a quantity"
  - glyph: "x"
    reason: "the coordinate along the X-axis, which the concordance reads as a coordinate label, not a quantity (bm.x.coordinate)"
  - glyph: "\\delta"
    reason: "the variation δ of a virtual displacement, an operator (concordance bm.delta.variationOperator)"
  - glyph: "\\pi"
    reason: "the number π"
displays:
  # § 1. p is the osmotic pressure, V^* the partial volume, z the gram-molecules of solute, n the
  #   number of suspended particles and ν = n/V^* their number density.
  - display: eq-s1-d1
    latex: "p V^* = R T z."
    spoken: "p times V star equals R T z."
    terms:
      - glyph: "p"
        quantityId: osmoticPressure
      - glyph: "V^*"
        quantityId: volume
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "z"
        quantityId: soluteAmount
  - display: eq-s1-d2
    latex: "p = \\frac{R T}{V^*} \\frac{n}{N} = \\frac{R T}{N} \\cdot \\nu,"
    spoken: "p equals R T over V star, times n over N; and this equals R T over N, times nu."
    terms:
      - glyph: "p"
        quantityId: osmoticPressure
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "V^*"
        quantityId: volume
      - glyph: "n"
        quantityId: particleCount
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "\\nu"
        quantityId: numberDensity
  # § 2. p_1 … p_l are the state variables of the whole system and φ_ν their rates; ν is
  #   the index over them (concordance bm.nu.index) until s2-p7, where it is § 1's number density again.
  #   The printed κ (\varkappa) is Boltzmann's constant, as the concordance reads § 2's κ
  #   (bm.kappa.entropyConstant, which writes it \kappa).
  - display: eq-s2-d1
    latex: "\\frac{\\partial p_\\nu}{\\partial t} = \\varphi_\\nu(p_1 \\ldots p_l) \\quad (\\nu = 1, 2 \\ldots l)"
    spoken: "The partial derivative of p nu with respect to t equals phi nu of p one through p l, for nu equal to one, two, through l."
    terms:
      - glyph: "p_\\nu"
        quantityId: stateVariable
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "\\varphi_\\nu"
        quantityId: stateVariableRate
      - glyph: "p_1"
        quantityId: stateVariable
      - glyph: "p_l"
        quantityId: stateVariable
    notQuantities:
      - glyph: "\\nu"
        reason: "the index over the state variables, running from 1 to l (concordance bm.nu.index)"
      - glyph: "l"
        reason: "the number of state variables, the index's last value: a count, not a quantity"
  - display: eq-s2-d2
    latex: "S = \\frac{\\bar{E}}{T} + 2 \\varkappa \\lg \\int e^{-\\frac{E}{2 \\varkappa T}} d p_1 \\ldots d p_l."
    spoken: "S equals E bar over T, plus two kappa times the logarithm of the integral of e to the minus E over two kappa T, d p one through d p l."
    terms:
      - glyph: "S"
        quantityId: entropy
      - glyph: "\\bar{E}"
        quantityId: systemEnergy
      - glyph: "\\varkappa"
        quantityId: boltzmannConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "E"
        quantityId: microstateEnergy
      - glyph: "p_1"
        quantityId: stateVariable
      - glyph: "p_l"
        quantityId: stateVariable
  - display: eq-s2-d3
    latex: "F = -\\frac{R}{N} T \\lg \\int e^{-\\frac{E N}{R T}} d p_1 \\ldots d p_l = -\\frac{R T}{N} \\lg B."
    spoken: "F equals minus R over N, times T, times the logarithm of the integral of e to the minus E N over R T, d p one through d p l; and this equals minus R T over N, times the logarithm of B."
    terms:
      - glyph: "F"
        quantityId: freeEnergy
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "E"
        quantityId: microstateEnergy
      - glyph: "p_1"
        quantityId: stateVariable
      - glyph: "p_l"
        quantityId: stateVariable
      - glyph: "B"
        quantityId: configurationIntegral
  # From s2-p4, x_1, y_1 … z_n are the coordinates of the n particles' centres of gravity, and the
  #   primed ones the same coordinates in the second system of regions; B and J are the configuration
  #   integral and its factor, primed where they are taken over the primed regions.
  - display: eq-s2-d4
    latex: "d B = d x_1 d y_1 \\ldots d z_n \\cdot J"
    spoken: "d B equals d x one, d y one, through d z n, times J."
    terms:
      - glyph: "B"
        quantityId: configurationIntegral
      - glyph: "x_1"
        quantityId: latentPosition1d
      - glyph: "y_1"
        quantityId: latentPosition1d
      - glyph: "z_n"
        quantityId: latentPosition1d
      - glyph: "J"
        quantityId: configurationIntegralFactor
  - display: eq-s2-d5
    latex: "d B' = d x'_1 d y'_1 \\ldots d z'_n \\cdot J',"
    spoken: "d B prime equals d x prime one, d y prime one, through d z prime n, times J prime."
    terms:
      - glyph: "B'"
        quantityId: configurationIntegral
      - glyph: "x'_1"
        quantityId: latentPosition1d
      - glyph: "y'_1"
        quantityId: latentPosition1d
      - glyph: "z'_n"
        quantityId: latentPosition1d
      - glyph: "J'"
        quantityId: configurationIntegralFactor
  - display: eq-s2-d6
    latex: "d x_1 d y_1 \\ldots d z_n = d x'_1 d y'_1 \\ldots d z'_n."
    spoken: "d x one, d y one, through d z n equals d x prime one, d y prime one, through d z prime n."
    terms:
      - glyph: "x_1"
        quantityId: latentPosition1d
      - glyph: "y_1"
        quantityId: latentPosition1d
      - glyph: "z_n"
        quantityId: latentPosition1d
      - glyph: "x'_1"
        quantityId: latentPosition1d
      - glyph: "y'_1"
        quantityId: latentPosition1d
      - glyph: "z'_n"
        quantityId: latentPosition1d
  - display: eq-s2-d7
    latex: "\\frac{d B}{d B'} = \\frac{J}{J'}."
    spoken: "d B over d B prime equals J over J prime."
    terms:
      - glyph: "B"
        quantityId: configurationIntegral
      - glyph: "B'"
        quantityId: configurationIntegral
      - glyph: "J"
        quantityId: configurationIntegralFactor
      - glyph: "J'"
        quantityId: configurationIntegralFactor
  - display: eq-s2-d8
    latex: "\\frac{d B}{B} = \\frac{d B'}{B}."
    spoken: "d B over B equals d B prime over B."
    terms:
      - glyph: "B"
        quantityId: configurationIntegral
      - glyph: "B'"
        quantityId: configurationIntegral
  - display: eq-s2-d9
    latex: "J = J'."
    spoken: "J equals J prime."
    terms:
      - glyph: "J"
        quantityId: configurationIntegralFactor
      - glyph: "J'"
        quantityId: configurationIntegralFactor
  # s2-p7: V^{*n} is V^* to the power n, so the V there is the partial volume V^*.
  - display: eq-s2-d10
    latex: "B = \\int J d x_1 \\ldots d z_n = J V^{*n}"
    spoken: "B equals the integral of J, d x one through d z n, and this equals J times V star to the n."
    terms:
      - glyph: "B"
        quantityId: configurationIntegral
      - glyph: "J"
        quantityId: configurationIntegralFactor
      - glyph: "x_1"
        quantityId: latentPosition1d
      - glyph: "z_n"
        quantityId: latentPosition1d
      - glyph: "V"
        quantityId: volume
      - glyph: "n"
        quantityId: particleCount
  - display: eq-s2-d11
    latex: "F = -\\frac{R T}{N} \\{ \\lg J + n \\lg V^* \\}"
    spoken: "F equals minus R T over N, times, in braces, the logarithm of J plus n times the logarithm of V star."
    terms:
      - glyph: "F"
        quantityId: freeEnergy
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "J"
        quantityId: configurationIntegralFactor
      - glyph: "n"
        quantityId: particleCount
      - glyph: "V^*"
        quantityId: volume
  # ν here is § 1's number density n/V^* (concordance bm.nu.numberDensity, scope bm-s2-p7).
  - display: eq-s2-d12
    latex: "p = -\\frac{\\partial F}{\\partial V^*} = \\frac{R T}{V^*} \\frac{n}{N} = \\frac{R T}{N} \\nu."
    spoken: "p equals minus the partial derivative of F with respect to V star; this equals R T over V star, times n over N; and this equals R T over N, times nu."
    terms:
      - glyph: "p"
        quantityId: osmoticPressure
      - glyph: "F"
        quantityId: freeEnergy
      - glyph: "V^*"
        quantityId: volume
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "n"
        quantityId: particleCount
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "\\nu"
        quantityId: numberDensity
  # § 3. K is the force on each particle, ν their number density, l the length of the column, and
  #   E the energy of the system, whose variation δE is the work of K. From s3-p6, k is the viscosity
  #   (concordance bm.k.viscosity), never Boltzmann's constant, P the particle's radius, μ its mass and
  #   D the coefficient of diffusion.
  - display: eq-s3-d1
    latex: "\\delta F = \\delta E - T \\delta S = 0."
    spoken: "delta F equals delta E minus T delta S, and this equals zero."
    terms:
      - glyph: "F"
        quantityId: freeEnergy
      - glyph: "E"
        quantityId: systemEnergy
      - glyph: "T"
        quantityId: temperature
      - glyph: "S"
        quantityId: entropy
  - display: eq-s3-d2
    latex: "\\delta E = -\\int_0^l K \\nu \\delta x d x"
    spoken: "delta E equals minus the integral from zero to l of K nu delta x, d x."
    terms:
      - glyph: "E"
        quantityId: systemEnergy
      - glyph: "l"
        quantityId: columnLength
      - glyph: "K"
        quantityId: externalForcePerParticle
      - glyph: "\\nu"
        quantityId: numberDensity
  - display: eq-s3-d3
    latex: "\\delta S = \\int_0^l R \\frac{\\nu}{N} \\frac{\\partial \\delta x}{\\partial x} d x = -\\frac{R}{N} \\int_0^l \\frac{\\partial \\nu}{\\partial x} \\delta x d x."
    spoken: "delta S equals the integral from zero to l of R times nu over N times the partial derivative of delta x with respect to x, d x; and this equals minus R over N times the integral from zero to l of the partial derivative of nu with respect to x, times delta x, d x."
    terms:
      - glyph: "S"
        quantityId: entropy
      - glyph: "l"
        quantityId: columnLength
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "\\nu"
        quantityId: numberDensity
      - glyph: "N"
        quantityId: avogadroConstant
  - display: eq-s3-1
    latex: "-K \\nu + \\frac{R T}{N} \\frac{\\partial \\nu}{\\partial x} = 0"
    spoken: "Minus K nu, plus R T over N times the partial derivative of nu with respect to x, equals zero."
    terms:
      - glyph: "K"
        quantityId: externalForcePerParticle
      - glyph: "\\nu"
        quantityId: numberDensity
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "N"
        quantityId: avogadroConstant
  - display: eq-s3-d4
    latex: "K \\nu - \\frac{\\partial p}{\\partial x} = 0."
    spoken: "K nu minus the partial derivative of p with respect to x equals zero."
    terms:
      - glyph: "K"
        quantityId: externalForcePerParticle
      - glyph: "\\nu"
        quantityId: numberDensity
      - glyph: "p"
        quantityId: osmoticPressure
  - display: eq-s3-d5
    latex: "\\frac{K}{6 \\pi k P},"
    spoken: "K over six pi k P."
    terms:
      - glyph: "K"
        quantityId: externalForcePerParticle
      - glyph: "k"
        quantityId: viscosity
      - glyph: "P"
        quantityId: particleRadius
  - display: eq-s3-d6
    latex: "\\frac{\\nu K}{6 \\pi k P}"
    spoken: "nu K over six pi k P."
    terms:
      - glyph: "\\nu"
        quantityId: numberDensity
      - glyph: "K"
        quantityId: externalForcePerParticle
      - glyph: "k"
        quantityId: viscosity
      - glyph: "P"
        quantityId: particleRadius
  - display: eq-s3-d7
    latex: "-D \\frac{\\partial (\\mu \\nu)}{\\partial x} \\quad \\text{Gramm}"
    spoken: "Minus D times the partial derivative of mu nu with respect to x, in grams."
    terms:
      - glyph: "D"
        quantityId: diffusionCoefficient
      - glyph: "\\mu"
        quantityId: particleMass
      - glyph: "\\nu"
        quantityId: numberDensity
  - display: eq-s3-d8
    latex: "-D \\frac{\\partial \\nu}{\\partial x}"
    spoken: "Minus D times the partial derivative of nu with respect to x."
    terms:
      - glyph: "D"
        quantityId: diffusionCoefficient
      - glyph: "\\nu"
        quantityId: numberDensity
  - display: eq-2
    latex: "\\frac{\\nu K}{6 \\pi k P} - D \\frac{\\partial \\nu}{\\partial x} = 0."
    spoken: "nu K over six pi k P, minus D times the partial derivative of nu with respect to x, equals zero."
    terms:
      - glyph: "\\nu"
        quantityId: numberDensity
      - glyph: "K"
        quantityId: externalForcePerParticle
      - glyph: "k"
        quantityId: viscosity
      - glyph: "P"
        quantityId: particleRadius
      - glyph: "D"
        quantityId: diffusionCoefficient
  - display: eq-s3-d9
    latex: "D = \\frac{R T}{N} \\frac{1}{6 \\pi k P}."
    spoken: "D equals R T over N, times one over six pi k P."
    terms:
      - glyph: "D"
        quantityId: diffusionCoefficient
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "k"
        quantityId: viscosity
      - glyph: "P"
        quantityId: particleRadius
  # § 4. Δ is a particle's displacement in the interval τ, φ(Δ) its probability density (the
  #   transition kernel; the concordance's bm.phi.transitionKernel is written for the expression φ(Δ), so
  #   it has no opinion on the letter), n the number of particles, f(x, t) their number density, t the
  #   time and D the coefficient of diffusion. In s4-p11 λ_x is the root mean square displacement along
  #   the X-axis and the overlined x^2 the mean of the squared displacement.
  - display: eq-s4-d1
    latex: "d n = n \\varphi(\\Delta) d \\Delta"
    spoken: "d n equals n times phi of Delta, d Delta."
    terms:
      - glyph: "n"
        quantityId: particleCount
      - glyph: "\\varphi"
        quantityId: transitionKernel
      - glyph: "\\Delta"
        quantityId: displacementIncrement
  - display: eq-s4-d2
    latex: "\\int_{-\\infty}^{+\\infty} \\varphi(\\Delta) d \\Delta = 1"
    spoken: "The integral from minus infinity to plus infinity of phi of Delta, d Delta, equals one."
    terms:
      - glyph: "\\varphi"
        quantityId: transitionKernel
      - glyph: "\\Delta"
        quantityId: displacementIncrement
  - display: eq-s4-d3
    latex: "\\varphi(\\Delta) = \\varphi(-\\Delta)"
    spoken: "phi of Delta equals phi of minus Delta."
    terms:
      - glyph: "\\varphi"
        quantityId: transitionKernel
      - glyph: "\\Delta"
        quantityId: displacementIncrement
  - display: eq-s4-d4
    latex: "f(x, t + \\tau) d x = d x \\cdot \\int_{\\Delta = -\\infty}^{\\Delta = +\\infty} f(x + \\Delta) \\varphi(\\Delta) d \\Delta."
    spoken: "f of x and t plus tau, d x, equals d x times the integral, from Delta equals minus infinity to Delta equals plus infinity, of f of x plus Delta, times phi of Delta, d Delta."
    terms:
      - glyph: "f"
        quantityId: numberDensity
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "\\tau"
        quantityId: stepInterval
      - glyph: "\\Delta"
        quantityId: displacementIncrement
      - glyph: "\\varphi"
        quantityId: transitionKernel
  - display: eq-s4-d5
    latex: "f(x, t + \\tau) = f(x, t) + \\tau \\frac{\\partial f}{\\partial t}."
    spoken: "f of x and t plus tau equals f of x and t, plus tau times the partial derivative of f with respect to t."
    terms:
      - glyph: "f"
        quantityId: numberDensity
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "\\tau"
        quantityId: stepInterval
  - display: eq-s4-d6
    latex: "f(x + \\Delta, t) = f(x, t) + \\Delta \\frac{\\partial f(x, t)}{\\partial x} + \\frac{\\Delta^2}{2!} \\frac{\\partial^2 f(x, t)}{\\partial x^2} \\ldots \\text{ in inf.}"
    spoken: "f of x plus Delta and t equals f of x and t, plus Delta times the partial derivative of f of x and t with respect to x, plus Delta squared over two factorial times the second partial derivative of f of x and t with respect to x, and so on, in infinitum."
    terms:
      - glyph: "f"
        quantityId: numberDensity
      - glyph: "\\Delta"
        quantityId: displacementIncrement
      - glyph: "t"
        quantityId: observationInterval
  - display: eq-s4-d7
    latex: "\\begin{aligned} f + \\frac{\\partial f}{\\partial t} \\cdot \\tau = f \\cdot \\int_{-\\infty}^{+\\infty} \\varphi(\\Delta) d \\Delta &+ \\frac{\\partial f}{\\partial x} \\int_{-\\infty}^{+\\infty} \\Delta \\varphi(\\Delta) d \\Delta \\\\ &+ \\frac{\\partial^2 f}{\\partial x^2} \\int_{-\\infty}^{+\\infty} \\frac{\\Delta^2}{2} \\varphi(\\Delta) d \\Delta \\ldots \\end{aligned}"
    spoken: "f plus the partial derivative of f with respect to t, times tau, equals f times the integral from minus infinity to plus infinity of phi of Delta, d Delta; plus the partial derivative of f with respect to x, times the integral from minus infinity to plus infinity of Delta times phi of Delta, d Delta; plus the second partial derivative of f with respect to x, times the integral from minus infinity to plus infinity of Delta squared over two, times phi of Delta, d Delta; and so on."
    terms:
      - glyph: "f"
        quantityId: numberDensity
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "\\tau"
        quantityId: stepInterval
      - glyph: "\\varphi"
        quantityId: transitionKernel
      - glyph: "\\Delta"
        quantityId: displacementIncrement
  - display: eq-s4-d8
    latex: "\\int_{-\\infty}^{+\\infty} \\varphi(\\Delta) d \\Delta = 1,"
    spoken: "The integral from minus infinity to plus infinity of phi of Delta, d Delta, equals one."
    terms:
      - glyph: "\\varphi"
        quantityId: transitionKernel
      - glyph: "\\Delta"
        quantityId: displacementIncrement
  - display: eq-s4-d9
    latex: "\\frac{1}{\\tau} \\int_{-\\infty}^{+\\infty} \\frac{\\Delta^2}{2} \\varphi(\\Delta) d \\Delta = D"
    spoken: "One over tau, times the integral from minus infinity to plus infinity of Delta squared over two, times phi of Delta, d Delta, equals D."
    terms:
      - glyph: "\\tau"
        quantityId: stepInterval
      - glyph: "\\Delta"
        quantityId: displacementIncrement
      - glyph: "\\varphi"
        quantityId: transitionKernel
      - glyph: "D"
        quantityId: diffusionCoefficient
  - display: eq-s4-1
    latex: "\\frac{\\partial f}{\\partial t} = D \\frac{\\partial^2 f}{\\partial x^2}."
    spoken: "The partial derivative of f with respect to t equals D times the second partial derivative of f with respect to x."
    terms:
      - glyph: "f"
        quantityId: numberDensity
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "D"
        quantityId: diffusionCoefficient
  - display: eq-s4-d10
    latex: "f(x, t) = 0 \\quad \\text{und} \\quad \\int_{-\\infty}^{+\\infty} f(x, t) d x = n"
    spoken: "f of x and t equals zero, and the integral from minus infinity to plus infinity of f of x and t, d x, equals n."
    terms:
      - glyph: "f"
        quantityId: numberDensity
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "n"
        quantityId: particleCount
  - display: eq-s4-d11
    latex: "f(x, t) = \\frac{n}{\\sqrt{4 \\pi D}} \\frac{e^{-\\frac{x^2}{4 D t}}}{\\sqrt{t}}."
    spoken: "f of x and t equals n over the square root of four pi D, times e to the minus x squared over four D t, divided by the square root of t."
    terms:
      - glyph: "f"
        quantityId: numberDensity
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "n"
        quantityId: particleCount
      - glyph: "D"
        quantityId: diffusionCoefficient
  - display: eq-s4-d12
    latex: "\\lambda_x = \\sqrt{\\overline{x^2}} = \\sqrt{2 D t}."
    spoken: "lambda x equals the square root of the mean of x squared, and this equals the square root of two D t."
    terms:
      - glyph: "\\lambda_x"
        quantityId: rmsDisplacement1d
      - glyph: "\\overline{x^2}"
        quantityId: meanSquareDisplacement1d
      - glyph: "D"
        quantityId: diffusionCoefficient
      - glyph: "t"
        quantityId: observationInterval
  # § 5. k is the viscosity and P the particle's radius (concordance bm.k.viscosity,
  #   bm.P.particleRadius), λ_x the root mean square displacement along the X-axis in the time t.
  #   eq-s5-d5 (N = t/λ_x^2 · RT/3πkP) is held out: marking λ_x where it takes an exponent changes the
  #   MathML (compilePrintedDisplay refuses, display-terms-mathml-changed), the limit relativity's A'^2
  #   meets. It is added once the marker handles a scripted letter with an exponent.
  - display: eq-s5-d1
    latex: "D = \\frac{R T}{N} \\frac{1}{6 \\pi k P}."
    spoken: "D equals R T over N, times one over six pi k P."
    terms:
      - glyph: "D"
        quantityId: diffusionCoefficient
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "k"
        quantityId: viscosity
      - glyph: "P"
        quantityId: particleRadius
  - display: eq-s5-d2
    latex: "\\lambda_x = \\sqrt{2 D t}."
    spoken: "lambda x equals the square root of two D t."
    terms:
      - glyph: "\\lambda_x"
        quantityId: rmsDisplacement1d
      - glyph: "D"
        quantityId: diffusionCoefficient
      - glyph: "t"
        quantityId: observationInterval
  - display: eq-s5-d3
    latex: "\\lambda_x = \\sqrt{t} \\cdot \\sqrt{\\frac{R T}{N} \\frac{1}{3 \\pi k P}}."
    spoken: "lambda x equals the square root of t, times the square root of R T over N times one over three pi k P."
    terms:
      - glyph: "\\lambda_x"
        quantityId: rmsDisplacement1d
      - glyph: "t"
        quantityId: observationInterval
      - glyph: "R"
        quantityId: molarGasConstant
      - glyph: "T"
        quantityId: temperature
      - glyph: "N"
        quantityId: avogadroConstant
      - glyph: "k"
        quantityId: viscosity
      - glyph: "P"
        quantityId: particleRadius
  - display: eq-s5-d4
