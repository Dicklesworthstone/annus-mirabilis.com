title: "Change what you hold fixed"
label: "A contemporary methodological reading, not Einstein's method."
r0Summary: "A comparison is defined by what changes and what stays fixed. Radiation entropy and Brownian spreading show how stating those constraints changes the question, the calculation and the conclusion."
