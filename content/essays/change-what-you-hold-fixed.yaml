transferExamples:
  -
    id: "change-what-you-hold-fixed-partial-derivatives"
    domain: "Mathematics: name the held variable"
    example: "The change of entropy with volume at fixed energy is a different derivative from the change of entropy with volume at fixed temperature. The subscript specifying the held variable is part of the question, even if the numerator and denominator look the same."
    sharedMove: "Identify the allowed family of neighbouring states before calculating a rate of change. With several variables linked by a relation, a change in one variable generally needs a statement about the others."
    whereItStops: "Writing a derivative does not establish that a laboratory can realise its constraints. A mathematically defined comparison and a physically achievable process require separate arguments."
  -
    id: "change-what-you-hold-fixed-single-variable-ablation"
    domain: "Software: compare one change"
    example: "Compare a program with and without one optimisation on a declared workload, while recording the build, input and execution conditions. A difference in runtime answers a question about those two configurations under those conditions."
    sharedMove: "State the factor changed, the quantities held fixed and the output compared. This prevents a result from one workload or configuration being silently transferred to another."
    whereItStops: "Caches, scheduling, data layout and timing variation can couple apparently separate factors. Repeated trials and an adequate comparison design are still needed; naming one changed variable does not prove that every other influence stayed fixed."
  -
    id: "change-what-you-hold-fixed-one-load-at-a-time"
    domain: "Engineering: vary one load"
    example: "A model can vary a mechanical load while holding geometry and material properties fixed. The resulting comparison isolates a relation inside that model and gives a clear question to bring to an experiment."
    sharedMove: "Separate the declared controlled quantities from quantities derived by the model. Record when a physical change would also alter something the calculation held constant."
    whereItStops: "A real change in temperature may also change viscosity, geometry or other material properties. Keeping viscosity fixed while varying temperature can be a useful model comparison, but its physical accuracy needs independent support."
limits:
  - "This is a contemporary reading of the arguments. It does not reconstruct a checklist that Einstein followed."
  - "These examples do not claim that scientific discovery has one algorithm."
  - "The radiation comparison fixes energy, frequency and bandwidth and requires both states to remain within the dilute Wien regime. It is not the trajectory of light compressed by a moving reflecting wall."
  - "The Brownian radius comparison uses dilute suspended spheres, the Stokes drag model and the same observation interval. Its declared viscosity is a model input, not a measured value assigned to water."
