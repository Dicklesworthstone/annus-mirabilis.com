transferExamples:
  -
    id: "subtract-what-you-do-not-know-common-sensor-offset"
    domain: "Measurement: a common sensor offset"
    example: "Suppose a sensor adds the same unknown offset to two readings of a changing quantity. Subtracting the first reading from the second cancels that offset and leaves the change, even though neither absolute value is known."
    sharedMove: "Keep the unknown term in both accounts until the subtraction shows which part disappears. With two sensors, equal offsets need an additional reason; matching model numbers do not establish that their offsets are identical."
    whereItStops: "Drift between readings or different offsets between sensors survive as an error in the difference. Subtraction also leaves random measurement noise, so cancelling a common offset does not remove every source of uncertainty."
  -
    id: "subtract-what-you-do-not-know-relative-timing"
    domain: "Timing: compare arrivals on a shared clock"
    example: "Two receivers record arrivals using one shared clock with an unknown time origin. Their arrival-time difference can be known without knowing that origin."
    sharedMove: "The same additive time offset appears in both timestamps and cancels. The conclusion is about a difference of arrival times, not either absolute arrival time."
    whereItStops: "Receivers using separate clocks do not automatically share an offset. Clock drift, changing transmission delays or an unknown difference between the clocks remains in the result; a second subtraction does not remove a term that is not common."
  -
    id: "subtract-what-you-do-not-know-matched-baseline"
    domain: "Data analysis: subtract a matched baseline"
    example: "Measure an instrument's background under stated conditions, then compare a signal measurement made under those same conditions. Removing the background can isolate a change hidden in a larger total."
    sharedMove: "Write the signal-plus-background and background accounts before subtracting. Ask which terms are justified as common, rather than treating the label baseline as a guarantee."
    whereItStops: "If the treatment changes the background, the subtraction combines the signal with that background change. A baseline measured under different conditions cannot repair this missing information merely by being subtracted."
limits:
  - "This is a contemporary reading of the arguments. It does not reconstruct a checklist that Einstein followed."
  - "These examples do not claim that scientific discovery has one algorithm."
  - "The body's absolute energies remain symbolic. The argument does not insert a mass-energy relation as an initial value."
  - "The light-energy transformation and conservation in both inertial frames are admitted premises. Interpreting the subtraction as a kinetic-energy change separately assumes that the additive offset remains unchanged."
  - "The mass comparison uses the low-speed coefficient. A finite-speed quadratic approximation is not the exact energy difference."
  - "The account of the Ives and Stachel–Torretti disagreement follows the edition's sourced historical note and the abstracts it records. It does not adjudicate their full arguments."
