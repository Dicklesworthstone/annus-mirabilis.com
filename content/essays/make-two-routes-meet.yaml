title: "Make two routes meet"
label: "A contemporary methodological reading, not Einstein's method."
r0Summary: "The Brownian paper connects a diffusion coefficient found from equilibrium and drag with the coefficient governing a spreading distribution. Following what each route supplies shows how their meeting produces a measurable displacement law, and what further evidence a molecular-number inference needs."
