label: "A contemporary methodological reading, not Einstein's method."
r0Summary: "Einstein compares the volume dependence of dilute radiation's entropy with the entropy of independent points. Following the shared logarithm, the role of independence and the matching coefficients shows what that analogy suggests about an energy scale, and where its claim ends."
