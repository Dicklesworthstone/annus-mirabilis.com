transferExamples:
  -
    id: "take-a-limit-without-losing-the-claim-small-angle-response"
    domain: "Engineering: keep the first response term"
    example: "For an ideal pendulum the restoring torque contains sin θ. With θ measured in radians, replacing sin θ by θ preserves the leading response as the amplitude approaches zero; the first omitted term has cubic order in θ."
    sharedMove: "Identify the dimensionless small quantity, state the retained order and compare the resulting prediction with the fuller model over the intended operating range."
    whereItStops: "A small-angle limit supplies no universal acceptable amplitude. The permitted error depends on the quantity being predicted, and damping, driving and mechanical imperfections require additional assumptions."
  -
    id: "take-a-limit-without-losing-the-claim-asymptotic-work"
    domain: "Software: separate eventual growth from a finite run"
    example: "An operation count proportional to n log n eventually grows more slowly than one proportional to n² when their positive coefficients stay fixed. That comparison leaves the crossover size and the time of a particular run unspecified."
    sharedMove: "State what tends to a limit, what remains fixed and which conclusion follows. An eventual ordering does not supply a measurement at the input size a user has."
    whereItStops: "Operation counts require a declared cost model. Constants, data layout, memory traffic and different workloads can matter at practical sizes; an asymptotic argument does not replace measurements of an implementation."
  -
    id: "take-a-limit-without-losing-the-claim-difference-quotient"
    domain: "Measurement: retain the quantity a quotient estimates"
    example: "A difference quotient compares a change in an output with a change in its input. In a smooth mathematical model its limit can be a derivative even though the numerator and denominator both approach zero."
    sharedMove: "Form the quantity of interest before taking the limit, and keep its units and held variables visible. The limit of a quotient cannot be recovered by replacing its numerator and denominator separately with zero."
    whereItStops: "In measured or rounded data, smaller increments can make noise and cancellation dominate. A mathematical derivative does not promise that arbitrarily fine measurements improve an estimate."
limits:
  - "This is a contemporary reading of the arguments. It does not reconstruct a checklist that Einstein followed."
  - "These examples do not claim that scientific discovery has one algorithm."
  - "The exact mass-energy difference uses symmetric emission and the same additive energy offset before and after emission. The low-speed step identifies a coefficient under those premises; it does not establish the unchanged-offset premise."
  - "The Wien comparison uses matched spectral constants. Its relative spectral discrepancy is pointwise and is not an error bound on an integrated entropy difference."
  - "The radiation entropy comparison fixes energy, frequency and bandwidth, fixes the entropy-density integration constant by the zero-density condition, and requires both compared states to remain in the admitted Wien regime."
  - "The diffusion limit describes the stated ideal model. Extrapolating its apparent-speed quotient to zero interval does not determine a physical particle's instantaneous velocity."
