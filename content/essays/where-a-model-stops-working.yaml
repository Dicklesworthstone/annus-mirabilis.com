title: "Where a model stops working"
label: "A contemporary methodological reading, not Einstein's method."
r0Summary: "A model makes predictions for specified quantities under specified conditions. Brownian observation, photoelectric emission and reflection from a moving mirror show how to identify a failed extension while keeping the predictions supported within the model's domain."
