transferExamples:
  -
    id: "where-a-model-stops-working-operating-envelope"
    domain: "Engineering: declare an operating range"
    example: "A linear calibration relates a sensor's signal to the measured quantity over a stated range and set of environmental conditions. Saturation beyond that range can invalidate an extrapolated reading while leaving the calibration useful inside its supported range."
    sharedMove: "Attach the conditions of use to the prediction and identify what mechanism the extension would need to include."
    whereItStops: "A declared range needs evidence and uncertainty. Naming a range after seeing inconvenient measurements does not establish that the model describes observations inside it."
  -
    id: "where-a-model-stops-working-bounded-software-model"
    domain: "Software: distinguish a precondition from a result"
    example: "A routine for a sorted sequence can use that ordering to avoid examining every element. Passing an unsorted sequence violates the premise of its search argument; returning an index does not show that the premise was satisfied."
    sharedMove: "State which property the procedure assumes, which property it establishes and what happens when the required input condition is absent."
    whereItStops: "Program preconditions are often exact and inspectable. Physical approximations usually need empirical tolerances, uncertain measurements and judgments about omitted mechanisms."
  -
    id: "where-a-model-stops-working-measurement-chain"
    domain: "Measurement: model the instrument as well as the object"
    example: "A measurement can average an evolving signal over an exposure and then add readout error. A model for the underlying signal and a model for the recorded data therefore make different predictions even when they describe the same experiment."
    sharedMove: "Locate a discrepancy in the chain from physical process to observation to estimate before choosing which assumption to revise."
    whereItStops: "A detailed observation model can also fail. Its noise independence, exposure profile and calibration must be checked; additional parameters do not establish that it describes a real instrument."
limits:
  - "This is a contemporary reading of the arguments. It does not reconstruct a checklist that Einstein followed."
  - "These examples do not claim that scientific discovery has one algorithm."
  - "The Brownian diffusion relation assumes an interval on which independent increments are an adequate description. This essay supplies no measured inertial crossover time or hydrodynamic correction."
  - "The camera example is a later synthetic observation model with zero drift, zero exposure duration and independent position errors of equal variance. Its symbolic expectations are not measurements from the 1905 paper."
  - "The photoelectric equality describes complete transfer of one quantum and the maximum kinetic energy under the declared escape-work model. It does not determine real-material yields or a universal current-voltage curve."
  - "The mirror has a prescribed constant speed and ideal reflection. Its energy ledger includes mechanical work but does not calculate a finite mirror's acceleration or self-consistent recoil."
  - "A scope condition must be stated and supported. Persistent disagreement within the declared domain remains a reason to investigate or revise a model."
