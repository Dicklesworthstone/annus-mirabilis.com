title: "Ask what must stay unchanged"
label: "A contemporary methodological reading, not Einstein's method."
r0Summary: "Changing an observer changes coordinates and measured quantities while preserving the physical event being described. Requiring the same light-propagation law in both frames constrains the coordinate map, and keeping the same wave phase connects frequency change with aberration."
