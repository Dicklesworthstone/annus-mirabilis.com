transferExamples:
  -
    id: "what-a-measurement-means-network-clock-offset"
    domain: "Software: network clock offset"
    example: "Imagine two computers exchanging timestamped messages, with clock offset constant during the exchange. An offset estimate can assign half the round-trip delay to each direction after removing the server's processing interval. That estimate depends on an assumption about the path delays."
    sharedMove: "Separate the recorded timestamps from the delay model used to infer clock offset. If the forward delay exceeds the return delay, the equal-delay estimate is biased by half that difference. A single exchange cannot determine both the true offset and the directional asymmetry."
    whereItStops: "Network delays are properties of a physical communication system and can be investigated with additional information. Equal light-travel times in Einstein's construction define synchronisation within the theory. Network latency is not a model of relativistic time dilation."
  -
    id: "what-a-measurement-means-clinical-protocol"
    domain: "Medicine: a measurement protocol"
    example: "Consider a hypothetical pressure measurement whose protocol specifies posture, a rest interval and the instrument setup. The record should include those conditions so that another measurement can be compared on the same basis."
    sharedMove: "A named quantity becomes reproducible through an explicit procedure. Changing the procedure may change the readings even when the label on the output stays the same."
    whereItStops: "This is an analogy about measurement, not advice for taking or interpreting a clinical reading. A reproducible protocol alone does not establish a diagnosis, and the required clinical procedure must come from the relevant clinical guidance."
  -
    id: "what-a-measurement-means-engineering-calibration"
    domain: "Engineering: calibration"
    example: "A sensor's output voltage becomes a reported temperature through a calibration relation established by comparison with reference measurements. The reading, the calibration relation and its applicable range are different parts of the account."
    sharedMove: "Write down the comparison chain connecting the recorded signal to the reported quantity. This makes it possible to ask which part would need checking if two instruments disagreed."
    whereItStops: "Traceability describes how a result relates to stated references. It does not establish that the sensor model remains appropriate outside its calibration conditions, or that a whole engineering model is correct."
limits:
  - "This is a contemporary reading of the arguments. It does not reconstruct a checklist that Einstein followed."
  - "These examples do not claim that scientific discovery has one algorithm."
  - "The signal procedure defines synchronisation within the stated inertial-frame assumptions. It does not make arbitrary conventions into new physical predictions."
  - "The Brownian apparent-speed discussion is a consequence of the ideal diffusion model used here. The 1905 paper's explicit warning that observation intervals must not be too short should not be replaced by an attributed quotation about instantaneous velocity."
