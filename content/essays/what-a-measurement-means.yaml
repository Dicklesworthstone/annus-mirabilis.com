title: "What does a measurement really mean?"
label: "A contemporary methodological reading, not Einstein's method."
r0Summary: "A measured quantity comes with a procedure: clocks exchange signals, and particle positions are compared over a chosen interval. Separating the record from the rule used to interpret it makes the assumptions available for inspection."
