  - lab: sr-08
    glyph: "\\mathbf{E}"
    quantityId: electricFieldStationary
    reason: "In E · B = 0, E is the electric field vector."
  - lab: sr-08
    glyph: "\\mathbf{B}"
    quantityId: magneticFieldStationary
    reason: "In E · B = 0, B is the magnetic field vector."
