    quantityId: localizationErrorStd
    reason: "σ is the standard deviation of the Gaussian localization error the camera model adds, ε_i ∼ N(0, σ²)."
  - lab: bm-08
    glyph: "V"
    quantityId: displacementVariance1d
    reason: "In D = (V − 2σ²) / (2(Δt − T_e/3)), V is the per-coordinate variance of the independent pair displacements, a displacement variance."
  - lab: bm-08
    glyph: "\\gamma_0"
    quantityId: displacementVariance1d
    reason: "γ_0 = 2D(Δt − T_e/3) + 2σ² is the per-coordinate variance of the drift-subtracted increments, as the lab says."
  - lab: lq-01
