    reason: "In ⟨I⟩ = (κ/2)[a_1² + a_2² + 2 a_1 a_2 cos δ], δ is the phase difference between the two waves (δ = 0 in phase, δ = π half a wave), a phase, not § 3's sign of a variation."
  - lab: lq-01
    glyph: "a_1"
