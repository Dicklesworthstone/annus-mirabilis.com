    quantityId: electricFieldStationary
    reason: "In R_e = γ m v² / (|q| E), E is the transverse electric field that deflects the electron."
  - lab: sr-13
    glyph: "P"
    quantityId: acceleratingPotential
    reason: "The lab writes P = W / e ≈ 127,75 kV for the potential difference that accelerates the electron from rest to 0.6c."
  - lab: sr-13
    glyph: "q"
    quantityId: electronCharge
    reason: "In R_e = γ m v² / (|q| E), q is the electron's charge, as e is in P = W / e; the paper's q elsewhere is a Doppler factor, which the lab never writes."

unread: []

exceptions:
  - lab: sr-03
    glyph: "A"
    reason: "A names the end of the moving rod where the first clock sits and the light signal starts, a point and not a quantity, as in § 2."
  - lab: sr-03
    glyph: "B"
    reason: "B names the rod's other end, where the second clock sits and the signal is reflected, a point and not a quantity. The modern scope's registry letter makes it a magnetic field."
  - lab: sr-03
    glyph: "\\Delta"
    reason: "Δ marks the difference between two events' coordinates, as in s² = Δx² + Δy² + Δz² − c²Δt²: a sign of difference, not a quantity; the coordinate after it is coloured."
  - lab: bm-04
    glyph: "\\pi"
    reason: "The number π in Stokes's drag 6 π k P, a constant of geometry and no quantity."
  - lab: bm-06
    glyph: "\\pi"
    reason: "The number π in Stokes's drag 6 π η a and in the Gaussian's 1/√(4 π D t), a constant of geometry and no quantity."
  - lab: sr-03
    glyph: "E_1"
    reason: "E_1 names one of two events between which the lab measures the squared interval, a point of spacetime and not a quantity."
  - lab: sr-03
    glyph: "E_2"
    reason: "E_2 names the other event of the pair, a point of spacetime and not a quantity."
  - lab: lq-06
    glyph: "e"
    reason: "e is the base of the exponential in Wien's α ν³ e^(−βν/T), a number and no quantity; the modern scope's registry letter makes it the elementary charge."
  - lab: bm-05
    glyph: "j"
    reason: "j counts the steps in the sum Σ_{j=1}^{n} Δ_j, an index and no quantity."
  - lab: lq-04
    glyph: "\\Delta"
    reason: "Δ marks the change of the entropy in ΔS = k_B (E / h ν) ln(V / V_0), a sign of difference; the entropy after it is coloured."
  - lab: me-03
    glyph: "\\Delta"
    reason: "Δ marks a change, of the body's mass in Δm = −L/c² and of the isolated system's energy and mass, a sign; the quantity after it is coloured."
  - lab: bm-06
    glyph: "\\Delta"
    reason: "Δ marks the grid's steps in r = D Δt / (Δx)², a sign of difference; the paper's Δ, the displacement in one interval, is not written here."
  - lab: bm-08
    glyph: "\\Delta"
    reason: "Δ marks the frame interval Δt, a sign of difference; the paper's Δ, the displacement in one interval, is not written here."
