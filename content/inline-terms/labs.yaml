    reason: "a_1 is the amplitude of the first wave at the point where the two superpose."
  - lab: lq-01
    glyph: "a_2"
    quantityId: waveAmplitude
    reason: "a_2 is the amplitude of the second wave at that point."
  - lab: lq-02
    glyph: "\\nu_c"
    quantityId: frequency
