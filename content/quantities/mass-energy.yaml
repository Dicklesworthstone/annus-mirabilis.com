# Paper 4 (mass-energy equivalence) plus the 1906 box thought experiment.
# am-not-quantity-registry-2f7. Dimension order: [length, mass, time, temperature, current, amount].

- id: emittedEnergyRestFrame
  name: Emitted energy (object rest frame)
  description: >
    The energy L emitted by a body as radiation, measured in the body's own rest frame.
    Rejected bare spelling emittedEnergyRest.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: object-rest
  colorRole: energy

- id: energyRatio
  name: Energy ratio of the two pulses in the moving frame
  description: The energy of the first emitted pulse divided by the energy of the opposite pulse, both measured by the moving observer.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: bodyEnergyRestBefore
  name: Body energy before emission (stationary system)
  description: >
    The body's energy in the stationary system before it emits radiation, as printed in
    paper 4. Carries frame: stationary-system (the system in which the body happens to be at
    rest before emission), not frame: object-rest; it does not end in the "Rest" or
    "RestFrame" id suffix and this choice is intentional.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: energy

- id: bodyEnergyRestAfter
  name: Body energy after emission (stationary system)
  description: The body's energy in the stationary system after it emits radiation, as printed in paper 4.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: energy

- id: bodyEnergyMovingBefore
  name: Body energy before emission (moving system)
  description: The same body's energy before emission, as measured in a system moving relative to it, per paper 4's printed derivation.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: bodyEnergyMovingAfter
  name: Body energy after emission (moving system)
  description: The same body's energy after emission, as measured in a system moving relative to it, per paper 4's printed derivation.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: kineticEnergyBefore
  name: Body kinetic energy before emission (moving system)
  description: The body's kinetic energy relative to the moving system before it emits radiation, as printed in paper 4.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: kineticEnergyAfter
  name: Body kinetic energy after emission (moving system)
  description: The body's kinetic energy relative to the moving system after it emits radiation, as printed in paper 4.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: kineticEnergyDifference
  name: Body kinetic energy difference (moving system)
  description: The difference between kineticEnergyBefore and kineticEnergyAfter, the quantity paper 4's argument isolates.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: additiveEnergyConstant
  name: Additive energy constant
  description: >
    Paper 4's printed additive constant relating a body's energy in the stationary and moving
    systems, C or C'. Always symbolic on the historical derivation route; its value is never
    fixed by the argument, only its cancellation. Rejected bare spelling additiveConstant.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: energy

- id: emissionAngle
  name: Emission angle
  description: The angle at which a body emits radiation relative to its direction of motion, as printed in paper 4.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: angle
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: space-geometry

- id: quadraticKineticDifference
  name: Quadratic kinetic-energy approximation
  description: >
    The second-order approximation (1/2) L (v/c)^2 of the kinetic-energy difference, printed
    as neglecting magnitudes of fourth and higher order. Distinct from the exact difference.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: quadraticRelativeDiscrepancy
  name: Quadratic relative discrepancy
  description: The relative difference between the exact kinetic-energy difference and its quadratic approximation.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: statistical

- id: proxyExcessOverLimit
  name: Proxy excess over the limiting coefficient
  description: >
    The finite-speed mass proxy divided by L/c^2, minus one. About (3/4)(v/c)^2 at small speed.
    Never labeled the exact mass loss.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: statistical

- id: naiveGammaMinusOne
  name: Naive Lorentz-factor excess
  description: >
    The cancellation-prone evaluation 1/sqrt(1-beta^2) - 1, published only as a diagnostic.
    It never feeds the proxy or the limiting coefficient.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: statistical

- id: finiteSpeedMassProxy
  name: Finite-speed mass proxy
  description: >
    Paper 4's printed proxy quantity L/(V^2(1-v^2/V^2)) before taking the v -> 0 limit that
    isolates inertialMassDecrease.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material

- id: inertialMassDecrease
  name: Inertial mass decrease
  description: >
    Paper 4's printed L/V^2, the limit of finiteSpeedMassProxy as v approaches 0: the decrease
    in a body's inertial mass corresponding to the emitted energy L. Rejected bare spelling
    massLossCoefficient.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material
- id: bodyMassBefore
  name: Body mass before emission
  description: >
    The body's inertial mass before it emits the two light pulses, paper 4's reconstruction in
    modern notation (m_0). Its difference from bodyMassAfter is inertialMassDecrease.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material
- id: bodyMassAfter
  name: Body mass after emission
  description: >
    The body's inertial mass after it has emitted the light pulses (m_1), paper 4 in modern
    notation.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material

- id: massChangeSigned
  name: Signed mass change
  description: A body's signed change in mass (increase or decrease) accompanying an energy change, generalizing inertialMassDecrease's sign convention.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material

- id: invariantMassSystem
  name: Invariant mass of a system
  description: The frame-invariant mass of a multi-body or multi-photon system, used in modern-lens treatments of paper 4's result.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material

- id: boxMass
  name: Box mass
  description: The mass of the box in Einstein's 1906 box-and-pulse thought experiment.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material

- id: initialEmitterMass
  name: Initial emitter rest mass in the modern emission model
  description: The independently specified rest mass M₀ of an isolated emitter before emission; used only after the modern four-momentum relation is admitted.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material
- id: initialEmitterEnergy
  name: Initial emitter energy
  description: M₀c² in the initial emitter rest frame, an assumption of the modern model rather than a historical derivation premise.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: energy
- id: remainingEmitterEnergy
  name: Remaining emitter energy
  description: The emitter energy M₀c² − L in the original rest frame after emission, including recoil kinetic energy.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: energy
- id: remainingEmitterMass
  name: Remaining emitter invariant mass
  description: The invariant mass of the remaining four-momentum; a zero result explicitly identifies a null remnant or no remnant, not a massive rest frame.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material
- id: emitterMassChange
  name: Modern emitter rest-mass change
  description: Remaining emitter invariant mass minus initial emitter mass, evaluated without subtracting nearly equal masses. Directed emission includes recoil kinetic energy in the rest-mass loss.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material
- id: emitterRecoilVelocity
  name: Remaining emitter x velocity
  description: Signed c²p/E in the initial emitter rest frame. At a lightlike endpoint this is energy-transport velocity, not a massive inertial observer; absent when no emitter remains.
  dimensionStatus: declared
  dimension: [1, 0, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: space-geometry
- id: emitterKineticEnergy
  name: Emitter recoil kinetic energy
  description: Remaining total energy minus remaining rest energy, computed by rationalizing the difference; at a null endpoint all remaining energy is non-rest energy.
  dimensionStatus: declared
  dimension: [2, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: energy
- id: radiationMomentum
  name: Net radiation x momentum
  description: The sum of the emitted pulses' x momenta in the initial emitter rest frame, L/c for directed pulses and zero for equal opposite pulses.
  dimensionStatus: declared
  dimension: [1, 1, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: space-geometry
- id: emitterMomentum
  name: Remaining emitter x momentum
  description: The momentum opposite to the emitted radiation, fixed by conservation in the initial emitter rest frame.
  dimensionStatus: declared
  dimension: [1, 1, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: space-geometry
- id: emittedRestEnergyFraction
  name: Fraction of initial rest energy emitted
  description: L/(M₀c²), the energy-budget coordinate of the modern isolated-emission model.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: energy

- id: boxLength
  name: Box length
  description: The length of the box in the 1906 thought experiment, along the axis the light pulse travels.
  dimensionStatus: declared
  dimension: [1, 0, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: space-geometry

- id: pulseFlightTime
  name: Pulse flight time
  description: The time the light pulse takes to cross the box in the 1906 thought experiment.
  dimensionStatus: declared
  dimension: [0, 0, 1, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: time-rate

- id: pulseMomentum
  name: Pulse momentum
  description: The momentum E/c carried by the light pulse in the 1906 thought experiment.
  dimensionStatus: declared
  dimension: [1, 1, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: energy

- id: recoilSpeed
  name: Recoil speed
  description: The box's recoil speed from emitting the light pulse in the 1906 thought experiment.
  dimensionStatus: declared
  dimension: [1, 0, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: space-geometry

- id: centerOfMassShift
  name: Center-of-mass shift
  description: >
    The apparent shift in the system's center of mass in the 1906 thought experiment, which
    Einstein's argument requires to vanish by assigning mass to the transported energy.
    Rejected bare spelling comShift; an output may keep a short output id but binds this quantity.
  dimensionStatus: declared
  dimension: [1, 0, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: space-geometry

- id: lightMassAssigned
  name: Mass assigned to transported light energy
  description: The mass Einstein's 1906 argument assigns to the light energy in transit, so that the system's center of mass stays fixed.
  dimensionStatus: declared
  dimension: [0, 1, 0, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: material
