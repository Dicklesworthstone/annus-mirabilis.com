    electric or magnetic force.
  dimensionStatus: declared
  dimension: [1, 1, -3, 0, -1, 0]
  gaussianDimension: ["-1/2", "1/2", -1, 0, 0, 0]
  mathematicalKind: vector
  frame: stationary-system
  colorRole: field

- id: magneticFieldAmplitudeStationary
  name: Magnetic field amplitude (stationary system)
  description: >
    Section 7's printed (L_0, M_0, N_0), the other vector that determines the amplitude of the wave
    train: the plane wave's magnetic field in K is L = L_0 sin Phi, and likewise for M and N. A
    vector of component amplitudes, distinct from lightAmplitudeStationary, the scalar A.
  dimensionStatus: declared
  dimension: [0, 1, -2, 0, -1, 0]
  gaussianDimension: ["-1/2", "1/2", -1, 0, 0, 0]
  mathematicalKind: vector
