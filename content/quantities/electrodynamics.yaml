- id: radiationForceAbsorbed
  name: Push of light on an absorbing surface
  description: >
    The force P/c on a surface that absorbs a beam of power P arriving head on, in the
    foundation lesson on momentum and energy of light. Distinct from radiationForce, paper 3's
