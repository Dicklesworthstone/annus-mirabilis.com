# Paper 3 electrodynamics: fields, sources, waves, the moving electron.
# am-not-quantity-registry-2f7. Dimension order: [length, mass, time, temperature, current, amount].
# magneticDeflectability and electricDeflectability, once reserved for am-sre-equations-2g3h, are
# records with dimensionStatus undefined-in-source: p. 920 names them and defines neither.

