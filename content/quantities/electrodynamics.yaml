  dimensionStatus: declared
  dimension: [-1, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: energy

- id: lightEnergyDensityMoving
  name: Light energy density (moving system)
  description: >
    The energy per unit volume of the same light wave, as the moving system k measures it (u').
  dimensionStatus: declared
  dimension: [-1, 1, -2, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: energy

- id: waveFrequencyReflectedStationary
  name: Reflected light frequency (stationary system)
  description: >
    The frequency of light reflected from a moving mirror, as the stationary system measures it
    (nu_ref). Its ratio to the incident frequency is reflectedFrequencyRatio.
  dimensionStatus: declared
  dimension: [0, 0, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: time-rate

- id: waveFrequencyReflectedMoving
  name: Reflected light frequency (moving system)
  description: >
    Section 8's printed nu'': the frequency of the light reflected from the mirror, as the moving
    system k measures it, the mirror being at rest in k. It equals the incident nu' there; the
    stationary system's measure of the same reflected light is waveFrequencyReflectedStationary.
  dimensionStatus: declared
  dimension: [0, 0, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: time-rate

- id: lightAmplitudeReflectedMoving
  name: Reflected light amplitude (moving system)
  description: >
    Section 8's printed A'': the field amplitude of the light reflected from the mirror, as the
    moving system k measures it. It equals the incident A' there. Distinct from
    lightAmplitudeMoving, the incident wave's amplitude in k.
  dimensionStatus: declared
  dimension: [1, 1, -3, 0, -1, 0]
  gaussianDimension: ["-1/2", "1/2", -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: moving-system
  colorRole: field

- id: lightAmplitudeReflectedStationary
  name: Reflected light amplitude (stationary system)
  description: >
    Section 8's printed A''': the field amplitude of the light reflected from the moving mirror, as
    the stationary system K measures it. Distinct from lightAmplitudeStationary, the incident
    wave's amplitude in K; the two enter section 8's energy balance for the light pressure.
  dimensionStatus: declared
  dimension: [1, 1, -3, 0, -1, 0]
  gaussianDimension: ["-1/2", "1/2", -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: field

- id: propagationAngleReflectedMoving
  name: Reflected propagation angle (moving system)
  description: >
    Section 8's printed phi'': the angle between the reflected light's wave normal and the direction
    of motion, in the moving system k, where cos phi'' = -cos phi'. Distinct from
    propagationAngleMoving, the incident wave's angle in k.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: angle
  mathematicalKind: scalar
  frame: moving-system
  colorRole: space-geometry

- id: propagationAngleReflectedStationary
  name: Reflected propagation angle (stationary system)
  description: >
    Section 8's printed phi''': the angle between the reflected light's wave normal and the
    direction of motion, in the stationary system K. Distinct from propagationAngleStationary, the
    incident wave's angle in K.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: angle
  mathematicalKind: scalar
  frame: stationary-system
  colorRole: space-geometry

- id: wavePhase
  name: Wave phase
  description: >
    The phase of a plane wave at a named event, phi = k.x - omega*t in K and
    phi' = k'.x' - omega'*t' in k. One record, not a frame-tagged pair: the phase is a scalar
    with the same value in both frames, and that invariance is the single fact section 7
    derives the Doppler principle and aberration from. am-sr-09-doppler-aberration-rabd binds
    this id for both frames of its phaseAtEvent output, so their agreement stays a testable
    result rather than an identity this registry asserts.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: angle
  mathematicalKind: scalar
  frame: frame-independent
  formatting: >
    A phase is compared as printed and never reduced modulo 2*pi first, because that would
    hide a genuine 2*pi disagreement, and never compared through its cosine.
  colorRole: field

- id: dopplerFactor
  name: Doppler factor
  description: The ratio by which a moving-mirror or moving-source frequency is scaled, as printed in section 7's Doppler derivation.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: field

- id: classicalObserverDopplerFactor
  name: Classical observer Doppler factor
  description: Frequency ratio for an observer moving through a still medium, 1 - beta cos theta. Right for sound; first-order agreement with light.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: field

- id: classicalSourceDopplerFactor
  name: Classical source Doppler factor
  description: Frequency ratio for a source moving through a still medium, 1 / (1 + beta cos theta). Right for sound; first-order agreement with light.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: field

- id: recedingDopplerFactor
  name: Receding line-of-sight Doppler factor
  description: Relativistic frequency ratio along the boost, sqrt((1-beta)/(1+beta)), independent of the current ray angle.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: field

- id: approachingDopplerFactor
  name: Approaching line-of-sight Doppler factor
  description: Relativistic frequency ratio against the boost, sqrt((1+beta)/(1-beta)), independent of the current ray angle.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: field

- id: reflectedFrequencyRatio
  name: Reflected frequency ratio
  description: The ratio of a wave's frequency after reflection off a moving mirror to its frequency before, as printed in section 7's radiation-pressure derivation.
  dimensionStatus: declared
  dimension: [0, 0, 0, 0, 0, 0]
  dimensionlessKind: ratio
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: field

- id: mirrorSpeed
  name: Mirror speed
  description: A moving mirror's speed, as used in section 7's radiation-pressure derivation.
  dimensionStatus: declared
  dimension: [1, 0, -1, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
  colorRole: space-geometry

- id: interceptedPower
  name: Intercepted power
  description: The radiant power a moving mirror intercepts, as printed in section 7.
  dimensionStatus: declared
  dimension: [2, 1, -3, 0, 0, 0]
  mathematicalKind: scalar
  frame: not-applicable
