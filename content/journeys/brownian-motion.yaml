    paperId: brownian-motion
    section: s5
    targetAnchor: arg-bm-inference
    pointer: 'The paper closes §5 by turning the relation around: measure the displacement, and the one unknown left is the number of molecules.'
exercises: []
ppeTask:
  promptId: bm-predict-perturb-explain-radius
  task: Predict first. The tracer ensemble shows how far a particle typically gets in one second. If you double the particle's radius, does that distance halve, fall by less than half, or stay the same?
  perturbPrompt: Open the tracer ensemble, change the radius from 0.5 to 1 micrometre, apply it, and read the one-second displacement again.
  explainPrompt: Explain the factor you saw. Say what the radius does to the drag, what the drag does to D, and how the distance depends on D.
doors:
  frontDoor:
    id: door-bm-front
    title: The paper's balance, §§1 to 3
    arrivesAtEquationId: eq-model-bm-diffusivity-molar
    arrivesAtLabel: the diffusion coefficient of a suspended sphere, D = RT/(6πηaN), the paper's relation in today's letters
    href: /papers/brownian-motion/s3/#arg-bm-diffusivity
    summary: Grant that a visible particle presses on a membrane the way a dissolved molecule does, pull on the particles with a force, and let the crowd settle. The force cancels between the two ways of counting what crosses a plane each second, and the coefficient left behind depends on the temperature, the viscosity of the liquid and the radius of the particle alone.
  sideDoors:
    - id: door-bm-walk
      title: 'Follow one particle: the walk'
      arrivesAtEquationId: eq-model-bm-diffusivity-molar
      arrivesAtLabel: the diffusion coefficient of a suspended sphere, D = RT/(6πηaN), the paper's relation in today's letters
      href: /lab/bm-05/
      summary: 'Write the loop instead: many short independent steps, each as likely to go one way as the other. The mean square of the total grows in proportion to the time, and the coefficient of that growth is the same D the balance fixes, which is why the spreading a microscope can watch measures the quantity the thermodynamic argument computes.'
