    pointer: The second route, force against drag, is the paper's §3. Its result is the diffusion coefficient that §5 turns into a displacement.
  - id: jump-bm-move
    label: 'Read the argument: why independent steps add'
    paperId: brownian-motion
    section: s4
    targetAnchor: arg-bm-independent-steps
    pointer: The move is in §4, where a particle's displacements over successive intervals are taken to be independent of each other.
  - id: jump-bm-inference
