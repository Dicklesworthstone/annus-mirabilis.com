  sideDoors:
    - id: door-lq-programmer
      title: The microstate counter
      arrivesAtEquationId: eq-model-lq-effective-count
      arrivesAtLabel: the effective count n = (N/R)(E/βν), the power to which the probability W raises V/V₀
      href: /lab/lq-05/?n=60&f=0.5&view=logarithmic&locked=0&seed=12345&trials=10000
      summary: 'Write the loop: the chance that n labelled points all sit in a fraction f of the box is f to the power n. Given that the entropy of dilute radiation changes with volume like (E/βν) ln f, invert it to a count. The same loop shows what happens when the points are not independent. In the modern lens the count is E/hν, with h = Rβ/N.'
