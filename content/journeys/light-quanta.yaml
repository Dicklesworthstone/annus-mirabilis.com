    claim: Section 8 of the paper puts a number to the prediction. Light of frequency 1.03 × 10¹⁵ per second, with the cost of leaving the metal neglected, should give electrons that a potential of about 4.3 volts can stop, which the paper says agrees in order of magnitude with Lenard's results. Set the frequency and the exit cost in the laboratory below and read the stopping potential it computes.
    instrumentId: lq-08
    quantityId: stoppingPotentialMagnitude
    expected: about 4.3 volts at 1.03 × 10¹⁵ per second, with the exit cost neglected
    comparisonKind: printed-prediction
