ppeTask:
  promptId: me-predict-perturb-explain-joule
  task: Predict first. A body gives off one joule of light. Does its mass fall by about a gram, about a microgram, or by far less than either?
  perturbPrompt: Open the boundary ledger with one joule emitted and the boundary around the body alone, and read the change in mass. Then move the boundary around the body and its light together, and read it again.
  explainPrompt: Explain both readings. Say what you divide the energy by and why the first answer is so small, and why the second is zero.
