    provenance: Section 8 of Zur Elektrodynamik bewegter Körper, received 30 June 1905, published 26 September 1905. The mass-energy paper was received 27 September 1905 and rests on it.
    sourceAnchor: /papers/special-relativity/s8/
naggingFact: A body that gives off light in one direction recoils. If it gives off equal pulses in opposite directions it does not recoil, and yet the two pulses carry different energies as a moving observer measures them.
firstHonestQuestion: If you already know how the energy of a light pulse changes between frames, what does the conservation of energy force you to say about the body that gave it off?
stages: []
forks:
  - id: arg-fork-field-or-energy
    afterStageId: step-05
    question: 'How far does the claim reach: to the energy of a charged body''s field, or to energy of every kind?'
    varies: theoretical-postulate
    branches:
      - id: arg-branch-field-mass
        label: Only the field's energy has inertia
        proponent:
          name: J. J. Thomson, 1881
          cardId: thomson-1881-electromagnetic-mass
        hypothesis: A charged body's field adds to its inertia, so inertia belongs to the energy of the electromagnetic field. The light in this argument is field energy, so its leaving lowers the inertia, and nothing follows about energy of other kinds.
        worksWhen: For charged bodies and their fields, where the added inertia can be calculated. How much it adds depends on the model of the charge.
        steps:
          - text: 'Start from Thomson''s result: a moving charged sphere carries a magnetic field whose energy makes it harder to accelerate.'
          - text: Read the paper's argument the same way. The energy that leaves is light, which is field energy, so the lost inertia can be booked to the field.
          - text: 'Ask what would tell this apart from the paper''s claim: a body whose energy of another kind changes by enough to weigh.'
        outcome:
          type: undecided-on-available-evidence
          insufficiency: The 1904 shelf carries no measurement of a body whose non-electromagnetic energy changes by enough to weigh, so it cannot separate a claim about field energy from a claim about energy as such.
          whatWouldDecide:
            name: Cockcroft and Walton's lithium disintegration
            recordId: cockcroft-walton-1932-lithium
            year: 1932
            status: later
          plainLanguage: On the evidence of 1904 this branch is neither refuted nor confirmed. It is a narrower claim than the paper's, and the measurement that bears on it came twenty-seven years later.
      - id: arg-branch-energy-as-such
        label: Energy of every kind has inertia
        hypothesis: The inertia of a body depends on its energy content, whatever form that energy takes.
        worksWhen: Wherever the paper's premises hold. Its last step, from light to energy of any form, is the one sentence in the paper that goes beyond the calculation.
        steps:
          - text: 'Find where the argument used the fact that the energy left as light: only in the rule for how the light''s energy changes between frames. What it concluded is about the body''s energy of motion.'
          - text: Conclude, as the paper does, that the mass of a body is a measure of its energy content.
        outcome:
          type: papers-route
          plainLanguage: 'This is the paper''s statement, and it is a stated inference: the paper calls it evident that nothing depends on the energy leaving as radiation.'
  - id: arg-fork-poincare-fluid
    afterStageId: step-05
    question: 'Two accounts of the same bookkeeping: does a fictitious fluid carried by the light save the centre of mass, or did the body''s own inertia change?'
    varies: theoretical-postulate
    branches:
      - id: arg-branch-fictitious-fluid
        label: Give the radiation a fictitious fluid
        proponent:
          name: Henri Poincaré, 1900
          cardId: poincare-1900-fictitious-fluid
        hypothesis: 'Keep the centre of mass moving uniformly by treating the radiation''s energy as a fluid that carries mass: its energy divided by the square of the speed of light. The question is the field''s bookkeeping, not the emitting body''s inertia.'
        worksWhen: Wherever the question is how the centre of mass of a body and its radiation moves. Within that scope it gives the same numbers as the paper's route.
        steps:
          - text: Let a body give off a pulse of radiation. It recoils, and unless the travelling radiation is counted as carrying mass, the centre of mass of the body and the radiation together moves.
          - text: Give the radiation a mass equal to its energy divided by the square of the speed of light, and the centre of mass moves uniformly again.
          - text: Now ask what the body lost. The fluid accounts for the radiation. It does not say what happened to the body, and that is the question this route answers.
        outcome:
          type: empirically-equivalent-not-refuted
          scopeNote: The centre-of-mass bookkeeping of emission and absorption treated in Poincaré's 1900 paper.
          plainLanguage: 'Within its scope the fluid gives the same numbers, and nothing on the 1904 shelf refutes it. It says something different: it gives mass to the light and leaves the body''s inertia alone, where the paper''s route says the body''s inertia changed.'
      - id: arg-branch-energy-has-inertia
        label: Energy has inertia
        hypothesis: The energy the body gave off was part of its inertia, so its mass fell by that energy divided by the square of the speed of light.
        worksWhen: 'Under the two-ledger argument''s premises: the light-energy transformation, energy conservation in both frames, and an offset between the ledgers that the emission does not change.'
        steps:
          - text: 'Read the slow-speed result as a statement about the body: its energy of motion changed as though its mass had fallen by L/V².'
          - text: 'Generalise, as the paper does in one sentence, from light to any energy leaving the body: the mass of a body is a measure of its energy content.'
        outcome:
          type: papers-route
          plainLanguage: This is the paper's conclusion. Its last step, from light to any form of energy, is a stated inference and not a further derivation.
move:
  label: Read the coefficient as a lost mass
  chainId: me-low-speed-coefficient
  stepId: identify
  r0Summary:
    text: Seen by an observer moving past, the body carries less energy of motion after giving off light than before, at the same speed, just as a slightly lighter body would when the motion is slow, so, within the paper's stated premises, giving off energy lowers the body's mass by an amount set by that energy.
    reviewState: draft
worldChecks:
