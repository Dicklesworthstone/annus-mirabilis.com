exercises:
  - id: me-mass-given-up-formula
    role: instrumented
    prompt: A body gives off an energy L as light. By how much does its mass fall? Write it using L and V, the paper’s letters for the energy given off and the speed of light.
  - id: me-pulse-sum
    role: instrumented
    prompt: In the moving frame one pulse carries (L/2)(1 − (v/V)cos φ)/√(1 − (v/V)²) and the other (L/2)(1 + (v/V)cos φ)/√(1 − (v/V)²). Add them. Write the total using only L, v and V.
  - id: me-equal-and-opposite
    role: explanation
    prompt: Why does the argument have the body give off two equal pulses in opposite directions, rather than one?
ppeTask:
  promptId: me-predict-perturb-explain-joule
  task: Predict first. A body gives off one joule of light. Does its mass fall by about a gram, about a microgram, or by far less than either?
  perturbPrompt: Open the boundary ledger with one joule emitted and the boundary around the body alone, and read the change in mass. Then move the boundary around the body and its light together, and read it again.
  explainPrompt: Explain both readings. Say what you divide the energy by and why the first answer is so small, and why the second is zero.
