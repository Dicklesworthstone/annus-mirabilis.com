    claim: The paper ends with a number and a suggestion. A change of energy L changes the mass by L/9·10²⁰, with the energy in erg and the mass in grams, and bodies whose energy content changes a great deal, radium salts for instance, might test it. The ledger below lets one joule of light leave a body. Move its boundary and read the mass that goes with it.
    instrumentId: me-03
    quantityId: massChange
    expected: L/9·10²⁰ grams for an energy L in erg
    comparisonKind: printed-prediction
    staticWorkedExample:
