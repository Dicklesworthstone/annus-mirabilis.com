sourceJumps:
  - id: jump-sr-s0-magnet-conductor
    label: 'Read the opening: the magnet and the conductor'
    paperId: special-relativity
    section: s0
    targetAnchor: arg-sr-magnet-conductor
    pointer: The paper opens on the same apparatus this route opens on, and calls the two accounts of it an asymmetry that does not attach to the phenomena. The same paragraph states the two principles it will keep.
  - id: jump-sr-s1-synchronization
    label: 'Read section 1: what the time of a distant event means'
    paperId: special-relativity
    section: s1
    targetAnchor: arg-sr-synchronization
    pointer: The move. Section 1 lays down, by definition, that light takes the same time out and back between two clocks, and so fixes what it means for clocks at different places to agree.
  - id: jump-sr-s2-rod-events
    label: 'Read section 2: a length is a pair of events'
    paperId: special-relativity
    section: s2
    targetAnchor: arg-sr-rod-events
    pointer: Measuring a moving rod means marking where its ends are at one time, and section 1 has just made that phrase depend on the frame the marks are made in. The paper draws the consequence before it has any transformation to point at.
  - id: jump-sr-s3-lorentz-map
    label: 'Read section 3: the map the two principles leave'
    paperId: special-relativity
    section: s3
    targetAnchor: arg-sr-lorentz-map
    pointer: With the clock rule granted, the paper asks what relation between one observer's coordinates and another's keeps light at the same speed in both directions, and finds the relations forced up to a scale it then fixes.
  - id: jump-sr-s4-clock-and-length
    label: 'Read section 4: moving clocks and moving rods'
    paperId: special-relativity
    section: s4
    targetAnchor: arg-sr-clock-and-length
    pointer: 'The two results a reader has worked by hand here, taken from the map rather than assumed: what a moving clock reads, and what a moving rod measures, each stated with the procedure that measures it.'
  - id: jump-sr-s5-velocity-composition
    label: 'Read section 5: how two speeds combine'
    paperId: special-relativity
    section: s5
    targetAnchor: arg-sr-velocity-composition
    pointer: Adding speeds keeps the denominator the ordinary rule leaves out, so two speeds below the speed of light compose to a speed below it, which is the exercise in this route's last step.
exercises:
  - id: sr-composed-speed
    role: instrumented
    prompt: Section 5 of the paper asks how speeds combine. A body moves at speed w relative to a system k, in the direction in which k itself moves at speed v relative to you. How fast does the body move relative to you? Write it using v, w and c, the speed of light, which the paper writes V.
  - id: sr-clock-speed-from-readings
    role: instrumented
    prompt: A clock moving past you in a straight line reads τ while your clocks read t. How fast is it moving? Write v using t, tau for τ, and c, the speed of light, which the paper writes V.
  - id: sr-moving-clock-reading
    role: instrumented
    prompt: Your clocks advance by t while a clock moving past you at speed v runs between two of its own ticks. What does the moving clock read? Write it using t, v and c, the speed of light.
  - id: sr-neither-observer-wrong
    role: explanation
    prompt: 'Two observers in uniform motion relative to each other set their clocks by the same rule, and disagree about which distant events happen at the same time. In two or three sentences: why is neither of them wrong?'
  - id: sr-ppe-two-paths-one-reading
    role: explanation
    prompt: 'Explain what you saw: why the clock that went out and back and the clock that circled read the same when they returned, and what the printed second-order form is.'
ppeTask:
  promptId: ppe-special-relativity-s4
  task: Predict first. One clock goes out and back at 0.6 of the speed of light while the resting clocks advance 10 s; another circles at the same speed for the same 10 s. When each returns to the clock that stayed, which reads less, or do they read the same?
  perturbPrompt: In the laboratory at step 08, press “Out and back at 0.6c” and read the moving clock; then press “Constant-speed circle at 0.6c” and read it again. Last, press “Low speed, β = 10⁻⁴” and set the exact loss per second beside the printed second-order form.
  explainPrompt: Explain why the two paths give the same reading, and say what the laboratory computes rather than measures.
doors:
  frontDoor:
    id: door-sr-front
    title: The paper's construction from the clock-setting rule, § 3
    arrivesAtEquationId: eq-model-sr-map-time
    arrivesAtLabel: 'the map of § 3: x′ = γ(x − vt) and t′ = γ(t − vx/c²), with γ = 1/√(1 − v²/c²), which the paper writes ξ = β(x − vt) and τ = β(t − vx/V²)'
    href: /papers/special-relativity/s3/#arg-sr-lorentz-map
    summary: Set the moving system's clocks by the rule of § 1, ask what time τ an event must have for light to take equal times out and back, and solve. An unknown factor φ(v) is left, and the paper fixes it at 1 with a third system moving back at −v, and a rod set across the motion whose measured length cannot depend on the direction of travel.
  sideDoors:
    - id: door-sr-requirements
      title: The map from its requirements
      arrivesAtEquationId: eq-model-sr-map-time
      arrivesAtLabel: 'the map of § 3: x′ = γ(x − vt) and t′ = γ(t − vx/c²), with γ = 1/√(1 − v²/c²), which the paper writes ξ = β(x − vt) and τ = β(t − vx/V²)'
      href: /lab/sr-04/
      summary: 'Start from a candidate map x′ = a(x − vt), t′ = bt + dx with unknown coefficients, and add requirements one at a time: light at c in both directions, a map back of the same kind, no preferred direction in space, and nothing changed at v = 0. One map survives. Writing it as a table of coefficients is a later way of seeing it; the paper solves equations.'
