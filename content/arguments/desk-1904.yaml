objects:
  - id: object-spectrum
    title: A radiation spectrum
    question: How is the energy shared among the colors?
    description: >-
      A hot cavity offers a spectrum to measure. Wave optics and electromagnetic theory
      have earned their place, yet sharing thermal energy equally among an unlimited
      set of oscillations creates a problem. Light acting on matter adds a different
      set of observations to explain.
    unresolved: >-
      What limits the energy assigned to high frequencies? What do the constants in
      the radiation law mean? Why does changing a light source's intensity fail to
      change the emitted electrons' speed in the way a simple accumulation picture suggests?
    responses:
      - >-
        Compare energy in narrow frequency bands at controlled temperatures. For light
        falling on a surface, distinguish the amount of charge emitted from the energy
        needed to stop it. A brighter source and a different frequency are different changes.
      - >-
        A wave description has strong support from interference and diffraction. It is
        reasonable to try to keep that success while changing how matter exchanges energy.
        A failure of equal energy sharing does not by itself decide how light propagates.
      - >-
        Test one allocation against the spectrum over a wider frequency range, then ask
        whether the same assumptions account for emission and fluorescence. Agreement
        in one band leaves other bands and other kinds of measurement open.
