  - id: object-microscope
    title: A microscope observation
    question: What should count as the amount of motion?
    description: >-
      Suspended particles move irregularly. Before choosing a cause, decide what the
      microscope can record and how several signed displacements should be compared.
      Motion that averages to zero can still have a nonzero spread.
    unresolved: >-
      Is the motion molecular in origin? Which statistic can be measured repeatably,
      and how can currents, changes of temperature, and the act of observing be separated
      from the motion one hopes to explain?
    responses:
      - >-
        Record positions at stated times, with a length calibration and a direction
        convention. Compare signed displacement, distance from the starting point,
        and squared displacement. A path between two recorded positions remains unobserved.
      - >-
        Molecular agitation is a plausible interpretation, but visible motion alone
        does not establish it. Currents or uneven heating can also move particles.
        Opposite displacements cancelling in an average is a property of the arithmetic,
        not evidence that every particle stood still.
      - >-
        Repeat observations while controlling particle size, liquid, temperature and
        elapsed time. Ask for a quantitative relation that competing explanations
        do not all predict. The four marks below only compare statistics; they do not
        supply that physical relation or a molecular-number measurement.
    cardIds:
