# SR-02 refuses a relative speed outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Relative speed", typed at 300000000 m/s.
# The manifest declares it at least -284802835.1 and at most 284802835.1, for the stated reason "No inertial observer moves at or beyond the speed of light; the teaching range stays inside 0.95c", so 300000000 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. Three hundred million metres per second is faster than light, and no conductor or magnet moves at it. The declared maximum is 0.95c written in metres per second, so a value this large crosses the teaching range and the physical bound together.
#
# No other control is supplied, so the refusal can only be coming from speed: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "sr-02-speed-outside-declared-range-refused"
kind: "adversarial"
title: "SR-02 refuses Relative speed at 300000000 m/s, outside the range it declares"
description: "SR-02 declares its control \"Relative speed\" as at least -284802835.1 and at most 284802835.1 m/s, for the reason \"No inertial observer moves at or beyond the speed of light; the teaching range stays inside 0.95c\". A reader who types 300000000 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 300000000 m/s to be mistaken for a result this instrument vouches for. Three hundred million metres per second is faster than light, and no conductor or magnet moves at it. The declared maximum is 0.95c written in metres per second, so a value this large crosses the teaching range and the physical bound together. The scenario passes only when the refusal arrives as a declared-range limit on speed, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.sr-02"
inputs:
  speed:
    value: 300000000
    unit: "m/s"
expected:
  status:
    outputId: "speed"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
