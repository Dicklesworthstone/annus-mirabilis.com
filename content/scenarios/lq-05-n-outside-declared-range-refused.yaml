# LQ-05 refuses a number of particles outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Number of Particles", typed at 100 .
# The manifest declares it at least 1 and at most 60, for the stated reason "From a count small enough to list every arrangement to one where only the logarithm is readable", so 100 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. A hundred particles is not many. The declared maximum is sixty because the configuration count this instrument displays is two to the n, and past sixty that integer stops being exactly representable, so the number shown would quietly cease to be the number counted.
#
# No other control is supplied, so the refusal can only be coming from n: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "lq-05-n-outside-declared-range-refused"
kind: "adversarial"
title: "LQ-05 refuses Number of Particles at 100 , outside the range it declares"
description: "LQ-05 declares its control \"Number of Particles\" as at least 1 and at most 60 , for the reason \"From a count small enough to list every arrangement to one where only the logarithm is readable\". A reader who types 100 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 100  to be mistaken for a result this instrument vouches for. A hundred particles is not many. The declared maximum is sixty because the configuration count this instrument displays is two to the n, and past sixty that integer stops being exactly representable, so the number shown would quietly cease to be the number counted. The scenario passes only when the refusal arrives as a declared-range limit on n, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.lq-05"
inputs:
  n:
    value: 100
    unit: ""
expected:
  status:
    outputId: "n"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
