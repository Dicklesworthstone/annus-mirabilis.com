expected:
  outputs:
    - outputId: deltaF
      value: 0
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-30
        rationale: "Exactly zero: no extra room, so no entropy of arrangement is gained. An absolute tolerance against an exact zero, nine decades below the free energies this model produces."
    - outputId: pressure
      value: 8.094745087e-9
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "2 k_B T over 1e-18 m^3, and exactly twice the two-particles-double record's 4.0473725435e-9 because that case has twice the volume. The number the zero above must not be allowed to suppress."
    - outputId: factorRatioDouble
      value: 1
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-15
        rationale: "1^2 = 1. Pinned so the zero free energy is visibly ln(1) and not an unrelated zero."
    - outputId: lockedClusterPressure
      value: 4.0473725435e-9
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "Exactly half the independent pressure, as in every two-particle case: one object instead of two in the same volume."
    - outputId: pressureAgreementResidual
      value: 0
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-24
        rationale: "Exactly zero: the counting route and n k_B T agree at a ratio of one too, which is the case where an implementation confusing the derivative with the difference would diverge most."
