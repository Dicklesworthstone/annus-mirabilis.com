    unit: "K"
expected:
  outputs:
    - outputId: factorRatioLog10
      value: 301029.9956639812
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "10^6 log10(2). The only form in which this ratio exists, and the reason the record is here."
    - outputId: factorRatioNaturalLog
      value: 693147.1805599453
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "10^6 ln 2. Pinned beside the base-ten form because the free energy below is k_B T times this number, so the two must agree with each other and not only with 2."
    - outputId: deltaF
      value: -2.8054248672027592e-15
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "-10^6 k_B T ln 2: representable, although the count is not. The quantity a reader is shown."
    - outputId: pressure
      value: 0.00202368627175
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "10^6 k_B T over 2e-18 m^3, about two millipascals. Ordinary, beside a ratio of 10^301030."
    - outputId: lockedClusterPressure
      value: 2.02368627175e-9
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "Identical to the two-particle record's locked value, because one cluster in the same volume presses the same however many particles it contains. A factor of 10^6 below the independent pressure, which is what the independence premise is worth here."
    - outputId: pressureAgreementResidual
      value: 0
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-18
        rationale: "Exactly zero again, fifteen decades below the two-millipascal pressure. The agreement between counting and n k_B T holds across six orders of magnitude."
