# BM-04 refuses a viscosity outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Viscosity", typed at 0.06 mPa s.
# The manifest declares it at least 0.0002 and at most 0.05, for the stated reason "Liquids in which a slow sphere feels smooth, Stokes drag", so 0.06 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. A liquid of 60 mPa s exists, and Stokes drag applies to it. What stops here is the instrument's declared range, which was chosen so the kick strength and the drag stay comparable on the same plot.
#
# No other control is supplied, so the refusal can only be coming from eta: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "bm-04-eta-outside-declared-range-refused"
kind: "adversarial"
title: "BM-04 refuses Viscosity at 0.06 mPa s, outside the range it declares"
description: "BM-04 declares its control \"Viscosity\" as at least 0.0002 and at most 0.05 mPa s, for the reason \"Liquids in which a slow sphere feels smooth, Stokes drag\". A reader who types 0.06 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 0.06 mPa s to be mistaken for a result this instrument vouches for. A liquid of 60 mPa s exists, and Stokes drag applies to it. What stops here is the instrument's declared range, which was chosen so the kick strength and the drag stay comparable on the same plot. The scenario passes only when the refusal arrives as a declared-range limit on eta, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.bm-04"
inputs:
  eta:
    value: 0.06
    unit: "mPa s"
expected:
  status:
    outputId: "eta"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
