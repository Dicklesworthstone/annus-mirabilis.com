# BM-02 refuses a particle radius (micrometres) outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Particle radius (micrometres)", typed at 0 um.
# The manifest declares it above 0, for the stated reason "A radius must be positive", so 0 is below its declared minimum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. A particle of zero radius is not a small particle. Stokes drag is proportional to the radius, so at zero the drag vanishes and the model has nothing to describe; the gate refuses rather than dividing by it.
#
# No other control is supplied, so the refusal can only be coming from a_um: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "bm-02-a_um-outside-declared-range-refused"
kind: "adversarial"
title: "BM-02 refuses Particle radius (micrometres) at 0 um, outside the range it declares"
description: "BM-02 declares its control \"Particle radius (micrometres)\" as above 0 um, for the reason \"A radius must be positive\". A reader who types 0 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 0 um to be mistaken for a result this instrument vouches for. A particle of zero radius is not a small particle. Stokes drag is proportional to the radius, so at zero the drag vanishes and the model has nothing to describe; the gate refuses rather than dividing by it. The scenario passes only when the refusal arrives as a declared-range limit on a_um, with below-min as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.bm-02"
inputs:
  a_um:
    value: 0
    unit: "um"
expected:
  status:
    outputId: "a_um"
    status: "outside-model-domain"
    reasonCode: "below-min"
modelVersion: 1
schemaVersion: 1
