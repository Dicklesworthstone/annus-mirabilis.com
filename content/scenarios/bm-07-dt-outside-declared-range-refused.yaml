# BM-07 refuses a frame spacing outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Frame spacing", typed at 32 s.
# The manifest declares it at least 0.25 and at most 16, for the stated reason "Whole multiples of the quarter-second recording grid, up to 16 s", so 32 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. A thirty-two-second frame spacing is an ordinary microscope setting. The inference here declares at most sixteen, because the estimator's bias with the exposure model it uses was characterised within that range and not beyond it.
#
# No other control is supplied, so the refusal can only be coming from dt: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "bm-07-dt-outside-declared-range-refused"
kind: "adversarial"
title: "BM-07 refuses Frame spacing at 32 s, outside the range it declares"
description: "BM-07 declares its control \"Frame spacing\" as at least 0.25 and at most 16 s, for the reason \"Whole multiples of the quarter-second recording grid, up to 16 s\". A reader who types 32 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 32 s to be mistaken for a result this instrument vouches for. A thirty-two-second frame spacing is an ordinary microscope setting. The inference here declares at most sixteen, because the estimator's bias with the exposure model it uses was characterised within that range and not beyond it. The scenario passes only when the refusal arrives as a declared-range limit on dt, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.bm-07"
inputs:
  dt:
    value: 32
    unit: "s"
expected:
  status:
    outputId: "dt"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
