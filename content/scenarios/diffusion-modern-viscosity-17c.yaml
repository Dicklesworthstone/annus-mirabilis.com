    reason: "The paper names water at 17 C as its liquid and states 1.35e-2 poise for it. This is the modern reference value for that liquid at that temperature, so the two can be compared at the paper's own stated conditions rather than at a convenient modern temperature."
    sensitivity: "The diffusivity goes as 1/eta and the displacement as 1/sqrt(eta), so a one per cent error in this value moves D by one per cent and the displacement by half a per cent."
