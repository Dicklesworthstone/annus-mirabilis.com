expected:
  outputs:
    - outputId: planckEstimate
      value: 6.528033721435288e-34
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "h from the fitted slope times the elementary charge. A tight tolerance because the arithmetic is deterministic given the rows; the PHYSICAL uncertainty is the standard error pinned below, which is five decades larger and is the number a reader should compare against."
    - outputId: planckStandardError
      value: 1.3785833356781923e-35
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "2.11 per cent of the estimate. Pinned so the 1.48 per cent shortfall below cannot be cited as a discrepancy: it is 0.711 of this."
    - outputId: slopeVoltsPerTerahertz
      value: 0.004074478171072421
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "The fitted slope of intercept potential against frequency, which is h/e and is unaffected by the unknown contact E.M.F. common to every reading."
    - outputId: referenceSlopeVoltsPerTerahertz
      value: 0.004135667696923859
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "h/e from the 2019 SI definitions, both exact, so this number is arithmetic rather than measurement. Pinned as the comparison's other side."
    - outputId: relativeSlopeDifference
      value: -0.014795561523705314
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-9
        rationale: "The fitted slope's shortfall against the defined one: 1.48 per cent low. Negative, and pinned as a signed value because the direction is part of the result."
    - outputId: rowsFitted
      value: 5
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-9
        rationale: "The count the dataset's own declared fit names, read from the file. Pinned so a dataset revision that changed the row selection turns this red rather than silently refitting: the denominator of this measurement is part of it."
