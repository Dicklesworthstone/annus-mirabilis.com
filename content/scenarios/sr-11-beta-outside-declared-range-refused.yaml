# SR-11 refuses a mirror speed ratio (v/c) outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Mirror speed ratio (v/c)", typed at 0.96 dimensionless.
# The manifest declares it at least -0.95 and at most 0.95, for the stated reason "No inertial observer moves at or beyond the speed of light; the teaching range stays inside 0.95c", so 0.96 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. A mirror moving at 0.96c is physically possible and the reflection law this instrument uses holds there. The range stops at 0.95, which is a limit this instrument sets for itself rather than one the physics imposes.
#
# No other control is supplied, so the refusal can only be coming from beta: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "sr-11-beta-outside-declared-range-refused"
kind: "adversarial"
title: "SR-11 refuses Mirror speed ratio (v/c) at 0.96 dimensionless, outside the range it declares"
description: "SR-11 declares its control \"Mirror speed ratio (v/c)\" as at least -0.95 and at most 0.95 dimensionless, for the reason \"No inertial observer moves at or beyond the speed of light; the teaching range stays inside 0.95c\". A reader who types 0.96 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 0.96 dimensionless to be mistaken for a result this instrument vouches for. A mirror moving at 0.96c is physically possible and the reflection law this instrument uses holds there. The range stops at 0.95, which is a limit this instrument sets for itself rather than one the physics imposes. The scenario passes only when the refusal arrives as a declared-range limit on beta, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.sr-11"
inputs:
  beta:
    value: 0.96
    unit: "dimensionless"
expected:
  status:
    outputId: "beta"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
