expected:
  outputs:
    - outputId: radiusCurvatureElectric
      value: 2.299495278112889
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "The radius an electron at 0.6c takes in 1e5 V/m transverse, eighteen times the magnetic radius of sr-13-magnetic-radius-0.01t. Pinned so the ratio between the two records is checkable."
    - outputId: acceleratingPotential
      value: 127749.7376729383
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "The relativistic potential at 0.6c, 128 kilovolts."
    - outputId: acceleratingPotentialNewtonian
      value: 91979.81112451557
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "92 kilovolts Newtonian: a 39 per cent discrepancy here against 388 per cent at 0.95c in sr-13-energy-0.95. The pair of speeds shows the discrepancy growing, which is why the measurements chased the highest speeds available."
    - outputId: lorentzFactor
      value: 1.25
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-15
        rationale: "Exactly 5/4, the factor in both the radius and the potential."
