# BM-06 refuses a radius outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Radius", typed at 2e-05 um.
# The manifest declares it at least 1e-08 and at most 1e-05, for the stated reason "Particle sizes from ten nanometres to ten micrometres, where Stokes drag holds", so 2e-05 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. A twenty-micrometre sphere is a real object. It is outside this instrument's declared range because the dilute Stokes regime it models, and the displacement scale it plots, were chosen for particles ten times smaller.
#
# No other control is supplied, so the refusal can only be coming from a: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "bm-06-a-outside-declared-range-refused"
kind: "adversarial"
title: "BM-06 refuses Radius at 2e-05 um, outside the range it declares"
description: "BM-06 declares its control \"Radius\" as at least 1e-08 and at most 1e-05 um, for the reason \"Particle sizes from ten nanometres to ten micrometres, where Stokes drag holds\". A reader who types 2e-05 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 2e-05 um to be mistaken for a result this instrument vouches for. A twenty-micrometre sphere is a real object. It is outside this instrument's declared range because the dilute Stokes regime it models, and the displacement scale it plots, were chosen for particles ten times smaller. The scenario passes only when the refusal arrives as a declared-range limit on a, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.bm-06"
inputs:
  a:
    value: 2e-05
    unit: "um"
expected:
  status:
    outputId: "a"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
