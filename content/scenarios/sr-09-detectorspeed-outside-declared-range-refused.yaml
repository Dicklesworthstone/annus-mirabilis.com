# SR-09 refuses a detector speed outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Detector speed", typed at 1 c.
# The manifest declares it above -1 and below 1, for the stated reason "A detector is a body in the apparatus, and no body moves at or beyond the speed of light", so 1 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. A detector is a body in the apparatus, and the declared interval is open at c for that reason. This is the physical bound rather than a drawing range.
#
# No other control is supplied, so the refusal can only be coming from detectorSpeed: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "sr-09-detectorspeed-outside-declared-range-refused"
kind: "adversarial"
title: "SR-09 refuses Detector speed at 1 c, outside the range it declares"
description: "SR-09 declares its control \"Detector speed\" as above -1 and below 1 c, for the reason \"A detector is a body in the apparatus, and no body moves at or beyond the speed of light\". A reader who types 1 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 1 c to be mistaken for a result this instrument vouches for. A detector is a body in the apparatus, and the declared interval is open at c for that reason. This is the physical bound rather than a drawing range. The scenario passes only when the refusal arrives as a declared-range limit on detectorSpeed, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.sr-09"
inputs:
  detectorSpeed:
    value: 1
    unit: "c"
expected:
  status:
    outputId: "detectorSpeed"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
