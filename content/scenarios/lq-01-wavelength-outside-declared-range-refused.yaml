# LQ-01 refuses a wavelength outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Wavelength", typed at 10 .
# The manifest declares it at least 0.2 and at most 5, for the stated reason "Positive wavelength in scale-free display units", so 10 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. There is no physical bound here at all: the superposition is drawn in arbitrary units. The range is a drawing range, and the refusal says so rather than rescaling the axes silently.
#
# No other control is supplied, so the refusal can only be coming from wavelength: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "lq-01-wavelength-outside-declared-range-refused"
kind: "adversarial"
title: "LQ-01 refuses Wavelength at 10 , outside the range it declares"
description: "LQ-01 declares its control \"Wavelength\" as at least 0.2 and at most 5 , for the reason \"Positive wavelength in scale-free display units\". A reader who types 10 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 10  to be mistaken for a result this instrument vouches for. There is no physical bound here at all: the superposition is drawn in arbitrary units. The range is a drawing range, and the refusal says so rather than rescaling the axes silently. The scenario passes only when the refusal arrives as a declared-range limit on wavelength, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.lq-01"
inputs:
  wavelength:
    value: 10
    unit: ""
expected:
  status:
    outputId: "wavelength"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
