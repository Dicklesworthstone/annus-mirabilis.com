# SR-04 refuses a frame speed outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Frame speed", typed at 1 c.
# The manifest declares it above -1 and below 1, for the stated reason "No inertial observer at |v| >= c", so 1 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. Here the declared domain states a physical bound rather than a drawing range. The interval is open at 1 because there is no inertial observer at |v| = c, where the Lorentz factor has no value at all, so the gate refuses instead of reporting an infinity.
#
# No other control is supplied, so the refusal can only be coming from vOverC: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "sr-04-voverc-outside-declared-range-refused"
kind: "adversarial"
title: "SR-04 refuses Frame speed at 1 c, outside the range it declares"
description: "SR-04 declares its control \"Frame speed\" as above -1 and below 1 c, for the reason \"No inertial observer at |v| >= c\". A reader who types 1 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 1 c to be mistaken for a result this instrument vouches for. Here the declared domain states a physical bound rather than a drawing range. The interval is open at 1 because there is no inertial observer at |v| = c, where the Lorentz factor has no value at all, so the gate refuses instead of reporting an infinity. The scenario passes only when the refusal arrives as a declared-range limit on vOverC, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.sr-04"
inputs:
  vOverC:
    value: 1
    unit: "c"
expected:
  status:
    outputId: "vOverC"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
