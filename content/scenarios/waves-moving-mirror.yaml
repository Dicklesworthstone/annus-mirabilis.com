id: waves-moving-mirror
kind: modern-golden
title: Moving mirror electrodynamics and energy balance at beta = 0.6c
description: >
  Normal incidence reflection from a receding mirror moving at beta = 0.6c.
  Frequency ratio nu'''/nu = 0.25, intercepted power = 0.4*I*Am, reflected power = 0.1*I*Am,
  radiation force = 0.5*I*Am/c, and work rate = 0.3*I*Am. Energy balance closes with zero residual.
provenance:
  paper: special-relativity
  sectionId: s8
  printedPage: 915
constantSetId: modern-si-2019
owner: waves
inputs:
  beta:
    value: 0.6
    unit: dimensionless
  phi:
    value: 0.0
    unit: rad
expected:
  outputs:
    - outputId: reflectedFrequencyRatio
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Reflected frequency ratio (1 - beta)/(1 + beta) = 0.4 / 1.6 = 0.25."
      value: 0.25
    - outputId: incidentPower
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Intercepted power u*c*Am*(1 - beta) = 0.4."
      value: 0.4
    - outputId: reflectedPower
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Reflected power carried away = 0.1."
      value: 0.1
    - outputId: workRate
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Mechanical work rate done on mirror P*v*Am = 0.3."
      value: 0.3
    - outputId: radiationForce
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Radiation force in K = 0.5."
      value: 0.5
modelVersion: 1
schemaVersion: 1
