expected:
  outputs:
    - outputId: kineticEnergy
      value: 1.803261690871817e-13
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "(gamma - 1) m c^2 with gamma 3.202563076101742 and the electron rest mass. The relativistic value."
    - outputId: kineticEnergyNewtonian
      value: 3.694431486820763e-14
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "Half m v squared at 0.95c, smaller by a factor of 4.88. Pinned in the same record because the discrepancy, not the value, is what section 10's expression is for."
    - outputId: acceleratingPotential
      value: 1125507.4207203905
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "The kinetic energy divided by the elementary charge: 1.13 megavolts. The quantity an experimenter sets, which is what makes the discrepancy measurable rather than theoretical."
    - outputId: acceleratingPotentialNewtonian
      value: 230588.2764996536
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "231 kilovolts by the Newtonian expression. A fivefold error in a quantity a laboratory dials in, which is why this preset exists beside the overlays."
    - outputId: longitudinalMass
      value: 2.992141120838839e-29
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "gamma^3 times the rest mass, about 16.8 times its value at 0.6c. Pinned so the cube is checkable against the 0.6c record rather than asserted."
    - outputId: transverseMassComoving
      value: 9.342957655282047e-30
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "gamma^2 times the rest mass: section 10's printed transverse mass at this speed."
    - outputId: transverseMassLaboratory
      value: 2.9173375928178693e-30
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "gamma times the rest mass, the modern transverse mass. Pinned with its partner so the ratio is again exactly gamma, now 3.2026 rather than 1.25."
    - outputId: lorentzFactor
      value: 3.202563076101742
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "1/sqrt(1 - 0.9025). The common factor in every quantity above, pinned so an error in it is distinguishable from an error in one of them."
