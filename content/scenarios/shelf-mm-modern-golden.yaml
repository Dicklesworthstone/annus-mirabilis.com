      tolerance:
        relative: 1.0e-5
        rationale: "Shelf instrument golden fixture at v = 30 km/s, L = 11 m, lambda = 550 nm yielding 0.400554 fringe."
    - outputId: beta
      value: 1.0006922855944561e-4
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-6
        rationale: "Dimensionless wind speed ratio beta = 30000 / 299792458."
