# SR-07 refuses a validation boost v/c outside the range its manifest declares (am-nxbq, items 2 and 3).
#
# WHICH CONTROL VALUE A READER MOVES TO REACH IT: the control "Validation boost v/c", typed at 0.96 1.
# The manifest declares it at least -0.95 and at most 0.95, for the stated reason "Teaching validation stays inside |v/c| <= 0.95; |v| >= c is refused", so 0.96 is above its declared maximum.
#
# WHAT THE REFUSAL DOES AND DOES NOT CLAIM. The validation boost is a check on the derivation steps, and 0.96c would be a valid boost to check with. The range stops at 0.95 because that is where the step-by-step numbers the page prints were authored.
#
# No other control is supplied, so the refusal can only be coming from boostBeta: the declared-domain gate
# skips a setting the request does not carry. The code is outside-model-domain, which is a model limit
# rather than malformed input, and the reader is shown the range and its reason and keeps the last
# legal state. The code itself is in `expected.status`, which is data; the prose names it in ordinary
# language, because a raw status identifier in visitor-facing text is what the voice rule
# status-enum-leak refuses.
id: "sr-07-boostbeta-outside-declared-range-refused"
kind: "adversarial"
title: "SR-07 refuses Validation boost v/c at 0.96 1, outside the range it declares"
description: "SR-07 declares its control \"Validation boost v/c\" as at least -0.95 and at most 0.95 1, for the reason \"Teaching validation stays inside |v/c| <= 0.95; |v| >= c is refused\". A reader who types 0.96 is asking for a setting the instrument does not model. The declared-domain gate every laboratory shares refuses because the setting lies outside the range the model declares, naming the control and the range as the page writes them, so no number is produced at a setting the model does not stand behind."
plausibleMistake: "That a value just past the end of the control is close enough to compute anyway, because the arithmetic would succeed and return something finite. A number produced outside a model's declared range is not that model's answer, and nothing on the page would separate it from one that is."
intendedFailure: "The gate refuses before any quantity is formed, so nothing is computed at 0.96 1 to be mistaken for a result this instrument vouches for. The validation boost is a check on the derivation steps, and 0.96c would be a valid boost to check with. The range stops at 0.95 because that is where the step-by-step numbers the page prints were authored. The scenario passes only when the refusal arrives as a declared-range limit on boostBeta, with above-max as the bound broken; a run that returned numbers fails here, and so does one that refused on a different control or on the other side of the range."
constantSetId: "modern-si-2019"
owner: "declaredDomain.sr-07"
inputs:
  boostBeta:
    value: 0.96
    unit: "1"
expected:
  status:
    outputId: "boostBeta"
    status: "outside-model-domain"
    reasonCode: "above-max"
modelVersion: 1
schemaVersion: 1
