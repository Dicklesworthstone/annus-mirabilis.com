id: waves-light-complex
kind: modern-golden
title: Finite light complex transformation and adversarial countermodel comparison
description: >
  Transformation of a finite light complex volume and total energy under Lorentz boost at beta = 0.6.
  At theta = 0 (longitudinal): q = 0.5, q^2 = 0.25, volume factor 1/q = 2, total energy factor 0.5.
  Material contraction countermodel treats the light complex as a material volume contracting by 1/gamma = 0.8 at all angles.
  At theta = 0: physical light factor is 0.5 vs countermodel 0.8.
  At cos theta = 0 (transverse in stationary frame): light factor is gamma = 1.25 vs countermodel 1/gamma = 0.8 (discriminating case).
  At cos theta = beta (transverse in moving frame): light factor is 1/gamma = 0.8, coinciding degenerately with the countermodel.
provenance:
  paper: special-relativity
  sectionId: s8
  printedPage: 913
constantSetId: modern-si-2019
owner: waves
inputs:
  beta:
    value: 0.6
    unit: dimensionless
  theta:
    value: 0.0
    unit: rad
expected:
  outputs:
    - outputId: energyFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Physical energy factor q = gamma * (1 - beta) = 0.5."
      value: 0.5
    - outputId: volumeFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Physical light complex volume factor 1/q = 2.0."
      value: 2.0
    - outputId: countermodelFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Material contraction countermodel 1/gamma = 0.8."
      value: 0.8
    - outputId: numericVolumeFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Independent numerical simultaneous-slice volume integral agrees with 1/q."
      value: 2.0
modelVersion: 1
schemaVersion: 1
