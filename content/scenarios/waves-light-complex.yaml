id: waves-light-complex
kind: modern-golden
title: Finite light complex transformation and adversarial countermodel comparison
description: >
  Transformation of a finite light complex volume and total energy under Lorentz boost at beta = 0.6.
  At theta = 0 (longitudinal): q = 0.5, q^2 = 0.25, volume factor 1/q = 2, total energy factor 0.5.
  The rigid-body countermodel keeps light's energy density q^2 but gives the packet a rod's volume 1/gamma = 0.8, so its energy factor is q^2/gamma.
  At theta = 0: physical light factor is 0.5 vs countermodel 0.2.
  At cos theta = 0 (transverse in stationary frame): q = gamma, so both give 1.25 (non-discriminating case).
  At cos theta = beta (transverse in moving frame): light factor is 1/gamma = 0.8 vs countermodel 0.512 (discriminating case).
provenance:
  paper: special-relativity
  sectionId: s8
  printedPage: 913
constantSetId: modern-si-2019
owner: waves
inputs:
  beta:
    value: 0.6
    unit: dimensionless
  theta:
    value: 0.0
    unit: rad
expected:
  outputs:
    - outputId: energyFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Physical energy factor q = gamma * (1 - beta) = 0.5."
      value: 0.5
    - outputId: volumeFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Physical light complex volume factor 1/q = 2.0."
      value: 2.0
    - outputId: countermodelFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Rigid-body countermodel q^2/gamma = 0.25 x 0.8 = 0.2."
      value: 0.2
    - outputId: numericVolumeFactor
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-12
        rationale: "Independent numerical simultaneous-slice volume integral agrees with 1/q."
      value: 2.0
modelVersion: 1
schemaVersion: 1
