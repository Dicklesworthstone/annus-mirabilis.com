# The existing temperature round trip is retained, but it alone cannot answer the results card's
# derivative question. The accepted owner now evaluates entropy density at rho ± 0.0001 rho at
# fixed frequency and volume, and compares that secant with independently inverted 1/T.
# The 1e-8 comparison tolerance is the LQ-04 bead's numerical tolerance, not an error bound on
# Wien's approximation or observational uncertainty. Both probes remain in the selected domain.
id: "lq-04-derived-temperature"
kind: "modern-golden"
title: "LQ-04: compare the entropy density slope with inverse temperature"
description: "At 600 THz and the energy generated by a reference temperature of 3000 K, the owner samples the entropy density at rho ± 0.0001 rho. The numerical slope agrees with 1/T to a relative tolerance of 1e-8 at both accepted states. This checks the local numerical consistency of the Wien entropy formula, without supplying independent experimental evidence or fixing its integration constant. The unchanged volume also retains the temperature round trip and exactly zero entropy change."
constantSetId: "modern-si-2019"
owner: "lq04.workbench"
inputs:
  volumeRatio:
    value: 1
    unit: "1"
  frequency:
    value: 6.0e14
    unit: "Hz"
  bandwidth:
    value: 1.0e12
    unit: "Hz"
  referenceVolume:
    value: 0.001
    unit: "m^3"
  referenceTemperature:
    value: 3000
    unit: "K"
expected:
  outputs:
    - outputId: initialTemperature
      value: 2999.999999999998
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "The round trip: 3000 K generated the energy, and inverting Wien's law on that energy returns this. The residual of 2e-15 relative is floating-point, and the tolerance is set to admit that and nothing larger, because a systematic error here would move every other reading together."
    - outputId: finalTemperature
      value: 2999.999999999998
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "Identical to the initial temperature, bit for bit, because the volume did not change. Asserting both is what shows the two ends of the calculation are the same calculation."
    - outputId: radiationEntropy
      value: 0
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-30
        rationale: "Exactly zero, not merely small: the logarithm of one vanishes. Absolute tolerance, since a relative one cannot bound an exact zero, and tight enough that an accumulated rounding error would not pass as a computed identity."
    - outputId: initialX
      value: 9.598486146732448
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "h nu / k T at the derived temperature, well above the laboratory's declared Wien threshold of 4.6052, which is why this state has an answer at all."
    - outputId: initialEntropyDensitySlope
      value: 0.0003333333333333333
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-8
        rationale: "The independently sampled entropy-density secant must resolve 1/3000 per kelvin to the bead's declared relative tolerance at density half-spacing 0.0001 rho."
    - outputId: finalEntropyDensitySlope
      value: 0.0003333333333333333
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-8
        rationale: "The second accepted state's entropy-density slope must also meet the declared numerical tolerance; the unchanged volume makes the physical states identical."
    - outputId: initialInverseTemperature
      value: 0.0003333333333333333
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "Inverse temperature comes from the density-to-temperature kernel, independently of the entropy-density subtraction."
    - outputId: finalInverseTemperature
      value: 0.0003333333333333333
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-12
        rationale: "The unchanged volume gives the same inverse temperature at the compared state."
    - outputId: initialEntropySlopeDensityStep
      value: 9.055615274270315e-22
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-9
        rationale: "The actual binary64 density half-spacing must represent the declared 0.0001 rho probe, allowing rounding in the difference of its two endpoints."
    - outputId: finalEntropySlopeDensityStep
      value: 9.055615274270315e-22
      comparisonKind: tolerance
      tolerance:
        relative: 1.0e-9
        rationale: "Both states use the same declared density probe at unchanged volume."
    - outputId: initialEntropySlopeRelativeDiscrepancy
      value: 0
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-8
        rationale: "The reported nonnegative discrepancy is bounded by the declared relative comparison tolerance, rather than required to vanish exactly."
    - outputId: finalEntropySlopeRelativeDiscrepancy
      value: 0
      comparisonKind: tolerance
      tolerance:
        absolute: 1.0e-8
        rationale: "The reported discrepancy at the second state must also stay within the same numerical tolerance."
modelVersion: 1
schemaVersion: 1
