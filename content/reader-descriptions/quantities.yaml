# What each quantity is, in a reader's words (dispatch 250). Checked by
# src/content/quantities/readerDescriptions.ts: every key a registered quantity id
# (content/quantities/), every value a sentence with no author's shorthand in it.
#
# A printed display's inspector shows this line when no model record linked to the display says
# what the term does there. The registry's own `description` stays the authors' note, with its
# rejected spellings and neighbouring ids, and is never shown to readers.
#
# A quantity id can serve several papers, so each line says what the quantity is in general. What
# the printed letter means in one passage comes from the notation concordance, beside this line.
# The symbol itself is shown above it, so these lines name no Greek letters.
quantities:
  auxiliaryGalileanCoordinate: "A helper coordinate, x minus v t: a point's distance from the moving system's origin, measured with the stationary system's rods and clocks. It is not the moving system's own coordinate."
  avogadroConstant: "The number of molecules in one gram-molecule, today's mole, of any substance."
  boltzmannConstant: "The gas constant per molecule: the gas constant divided by the number of molecules in a gram-molecule."
  chargeDensityMoving: "The density of electric charge, charge per unit volume, as measured in the moving system k."
  chargeDensityStationary: "The density of electric charge, charge per unit volume, as measured in the stationary system K."
  chargeVelocityMoving: "The velocity with which electric charge moves, as measured in the moving system k."
  chargeVelocityStationary: "The velocity with which electric charge moves, as measured in the stationary system K."
  columnLength: "The length of a cylindrical column of liquid, measured along the x-axis."
  configurationIntegral: "An integral over every possible microscopic state of a system, from which its thermodynamic properties follow. Its dimension depends on the coordinates chosen."
  configurationIntegralFactor: "The part of the configuration integral that does not depend on where the suspended particles are. Its dimension depends on the coordinates chosen."
  configurationProbability: "How probable one state of a system is, compared with another. As a ratio of probabilities it is a pure number."
  coordinatePositionMoving: "A point's position, its coordinates along the three axes, as measured in the moving system k with rods at rest there."
  coordinatePositionStationary: "A point's position, its coordinates along the three axes, as measured in the stationary system K with rods at rest there."
  coordinateTimeMoving: "The time of an event read from the clocks of the moving system k, which are synchronized in k. It is a coordinate, not the time a moving clock has run."
  coordinateTimeStationary: "The time of an event read from the clocks of the stationary system K, which are synchronized in K."
  diffusionCoefficient: "How fast suspended particles spread through a liquid: the mean square displacement along one axis grows by twice this coefficient in each unit of time."
  directionCosineMoving: "The cosine of the angle between a light wave's direction of travel and one of the axes, as measured in the moving system k."
  directionCosineStationary: "The cosine of the angle between a light wave's direction of travel and one of the axes, as measured in the stationary system K."
  displacementIncrement: "How far one particle moves along one axis in a given interval of time."
  elapsedTime: "The time variable in which a process is followed, counted from a chosen starting instant."
  electricDeflectability: "How strongly an electric force turns a moving electron from its path. The paper uses it only in a ratio with the magnetic deflectability."
  electricFieldAmplitudeStationary: "The largest value each component of a plane light wave's electric force reaches, as measured in the stationary system K."
  electricFieldMoving: "The electric force at a point, the force on a unit charge at rest there, as measured in the moving system k."
  electricFieldStationary: "The electric force at a point, the force on a unit charge at rest there, as measured in the stationary system K."
  electronCharge: "The electric charge of an electron."
  electronMass: "The mass of an electron, as long as it moves slowly."
  entropy: "The thermodynamic entropy of a body: a state quantity whose change in a reversible process at a fixed temperature is the heat taken in divided by that temperature."
  eventSeparationSpatial: "The distance between the places of two events, such as the stations A and B at which clocks are compared."
  externalForcePerParticle: "A force from outside, such as gravity, acting on each suspended particle."
  fieldScaleFactorUnknown: "A factor common to all the transformed electric and magnetic forces, left open at first and later shown to equal 1."
  fieldTimeCoordinate: "The time at which the distribution of the particles is read, counted from the instant when every particle is at its starting point."
  fourierAmplitude: "The strength of one frequency component, when a varying electric force is split into regular oscillations of many frequencies."
  fourierPhase: "Where in its cycle one frequency component starts, when a varying electric force is split into regular oscillations of many frequencies."
  frameSpeed: "The speed at which one coordinate system moves relative to the other, along their common x-axis."
  freeEnergy: "The free energy of a system, its energy minus its temperature times its entropy: the most work it can do at a fixed temperature."
  frequency: "How many oscillations occur each second."
  frequencyEnergyDensity: "The energy of radiation per unit volume, for each unit interval of frequency."
  gramEquivalentCharge: "The electric charge carried by one gram-equivalent of ions: for monovalent ions, one gram-molecule of them."
  independentPointCount: "The number of points or molecules that move independently of one another in a gas-like model."
  ionizationWorkPerGramEquivalent: "The work needed to ionize one gram-equivalent of a gas."
  ionizedGramMolecules: "The amount of gas ionized, counted in gram-molecules."
  lagrangeMultiplier: "A quantity introduced to hold the total energy fixed while the entropy is made as large as possible. It turns out to be one divided by the temperature."
  latentPosition1d: "A particle's true position along one axis, as distinct from where an observation records it."
  lengthMeasuredStationary: "The length of a moving rod as found from the stationary system: the distance between where its two ends are at one time of the stationary clocks."
  lengthProper: "A rod's length measured with a measuring rod at rest beside it, in the rod's own rest system."
  lightAmplitudeMoving: "The amplitude of a light wave's electric or magnetic force, as measured in the moving system k."
  lightAmplitudeReflectedMoving: "The amplitude of the light reflected by the mirror, as measured in the moving system k, in which the mirror is at rest."
  lightAmplitudeReflectedStationary: "The amplitude of the light reflected by the moving mirror, as measured in the stationary system K."
  lightAmplitudeStationary: "The amplitude of a light wave's electric or magnetic force, as measured in the stationary system K."
  lightComplexVolumeMoving: "The volume enclosed by a surface that moves with a piece of light, as measured in the moving system k."
  lightComplexVolumeStationary: "The volume enclosed by a surface that moves with a piece of light, as measured in the stationary system K."
  lightSphereRadius: "The radius of a spherical surface formed by light, such as a wave spreading from a point at the speed of light."
  longAveragingInterval: "A long stretch of time over which a varying quantity is averaged. Although it is printed with the letter used for temperature, it is a time."
  lorentzFactor: "One divided by the square root of one minus the square of the ratio of a speed to the speed of light. It is 1 at rest and grows without bound as the speed approaches that of light."
  magneticDeflectability: "How strongly a magnetic force turns a moving electron from its path. The paper uses it only in a ratio with the electric deflectability."
  magneticFieldAmplitudeStationary: "The largest value each component of a plane light wave's magnetic force reaches, as measured in the stationary system K."
  magneticFieldMoving: "The magnetic force at a point, as measured in the moving system k."
  magneticFieldStationary: "The magnetic force at a point, as measured in the stationary system K."
  meanResonatorEnergy: "The average energy of a resonator, an electric oscillator that exchanges energy with the radiation and the molecules around it, at a given temperature."
  meanResonatorEnergyAtFrequency: "The average energy of a resonator of one particular frequency, in the radiation around it."
  meanSquareDisplacement1d: "The average of the squares of the particles' displacements along one axis."
  microstateEnergy: "The energy of a system when its microscopic state, every position and velocity, is given."
  molarGasConstant: "The gas constant of the ideal gas law, for one gram-molecule of gas."
  numberDensity: "The number of particles in each unit of volume."
  observationInterval: "The time over which a particle is observed."
  osmoticPressure: "The pressure that dissolved or suspended particles exert on a wall that lets the liquid through but not them."
  particleCount: "The number of particles counted."
  particleMass: "The mass of one suspended particle."
  particleRadius: "The radius of one suspended particle, taken to be a sphere."
  pressure: "The pressure of a gas: the force it exerts on each unit area of the walls of its container."
  propagationAngleMoving: "The angle between a light wave's direction of travel and the direction of the relative motion, as measured in the moving system k."
  propagationAngleReflectedMoving: "The angle between the reflected light's direction of travel and the direction of motion, as measured in the moving system k."
  propagationAngleReflectedStationary: "The angle between the reflected light's direction of travel and the direction of motion, as measured in the stationary system K."
  propagationAngleStationary: "The angle between a light wave's direction of travel and the direction of the relative motion, as measured in the stationary system K."
  radiationElectricField: "The electric force of radiation at a point, varying rapidly in time."
  radiationEnergy: "The total energy of the radiation in a region, not per unit volume."
  radiationEntropy: "The total entropy of the radiation in a region, not per unit volume."
  radiationPressureMirror: "The pressure light exerts on a perfectly reflecting mirror."
  rmsDisplacement1d: "The square root of the mean square displacement along one axis: a typical distance a particle has moved."
  scaleFactorUnknown: "A function of the speed, left open at first in the transformation and later shown to equal 1."
  soluteAmount: "The amount of dissolved substance, counted in gram-molecules."
  spectralEntropyDensity: "The entropy of radiation per unit volume, for each unit interval of frequency."
  speedDeficitFromLight: "How much a speed falls short of the speed of light."
  speedOfLight: "The speed of light in empty space."
  sphereRadius: "The radius of a sphere, measured at rest."
  stateVariable: "One of the coordinates that fix a system's microscopic state. Its dimension depends on which coordinate it is."
  stateVariableRate: "How fast one of a system's state variables changes with time. Its dimension depends on which variable it is."
  stepInterval: "A short interval of time, much shorter than any interval one can observe, yet long enough that a particle's motions in successive intervals are independent of each other."
  stoppingPotentialMagnitude: "The size of the voltage that just stops the fastest electrons set free by light."
  systemEnergy: "The internal energy of a system, as thermodynamics uses it."
  temperature: "Absolute temperature, counted from absolute zero."
  transformationCoefficientA: "A function of the speed, left open at first in the transformation equations and fixed later in the argument."
  transitionKernel: "The probability, per unit of length, that a particle is displaced by a given amount in one short interval."
  universalEntropyConstant: "A constant in the logarithmic law for entropy that is the same for every gas. It turns out to be the gas constant divided by the number of molecules in a gram-molecule."
  velocityComponentXMoving: "The component of a body's velocity along the direction of the relative motion, as measured in the moving system k."
  velocityComponentYMoving: "The component of a body's velocity across the direction of the relative motion, as measured in the moving system k."
  velocityComposed: "The velocity of a point in the stationary system K, when it moves with a known velocity in the moving system k."
  velocityDirectionAngle: "The angle between a point's velocity in the moving system and the direction in which that system moves."
  velocityInMovingFrame: "The velocity of a point as measured in the moving system k."
  viscosity: "The internal friction of a liquid, which resists its flow."
  volume: "A volume of space."
  waveAngularFrequencyMoving: "How fast a light wave's phase turns, in radians per second, as measured in the moving system k."
  waveAngularFrequencyStationary: "How fast a light wave's phase turns, in radians per second, as measured in the stationary system K."
  waveFrequencyMoving: "The frequency of a light wave, oscillations per second, as measured in the moving system k."
  waveFrequencyReflectedMoving: "The frequency of the light reflected by the mirror, as measured in the moving system k, in which the mirror is at rest."
  waveFrequencyStationary: "The frequency of a light wave, oscillations per second, as measured in the stationary system K."
  wavePhase: "How far through its cycle a plane wave is, at a given place and time. Both systems agree on its value at an event."
  wienConstantAlpha: "The constant in front of Wien's radiation law."
  wienConstantBeta: "The constant in the exponent of Wien's radiation law. In modern terms it is Planck's constant divided by Boltzmann's."
  workFunctionPerGramEquivalent: "The work electrons need to leave the body, counted per gram-equivalent."
