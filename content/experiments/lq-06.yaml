        - not-applicable
    visualAffordance: "Matching highlight links the subexpression N*E / (R*beta*nu) to n and reveals quantum energy"
    equivalentAffordance: "Choose a subexpression candidate and read the verification verdict"
    announcement: "Subexpression candidate evaluated against the entropy identity"
  - actionId: lq-06-compare-mean-energies
    family: radiation-entropy
    question: "How does the mean quantum energy 3*k_B*T over a Wien spectrum compare to the mean kinetic energy 3/2*k_B*T of a gas molecule?"
    inputs:
      - temperature
    commandClass: setup-change
    acceptedResult:
      outputs:
        - meanQuantumEnergyWienEv
        - moleculeMeanKineticEnergyEv
        - meanEnergyRatio
      allowedStatuses:
