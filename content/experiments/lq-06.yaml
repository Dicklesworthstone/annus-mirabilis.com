assumptions:
  - "Wien radiation entropy law Delta S = (E / beta*nu) ln(V/V0) holds in the dilute radiation regime."
  - "Boltzmann gas entropy principle Delta S = (R/N) n ln(V/V0) applies to n independent particles."
  - "The coefficient multiplying ln(V/V0) represents the same physical entropy capacity in both systems."
admittedDomain: "Monochromatic Wien-regime radiation and ideal gas comparison in identical volume transformations"
notModeled:
