    visualAffordance: "Two side-by-side energy bars showing a fixed 2:1 ratio between Wien quantum mean energy and molecule kinetic energy"
    equivalentAffordance: "Adjust temperature and verify the 2:1 ratio in the telemetry table"
    announcement: "Mean energy comparison updated; ratio remains exactly 2"
