# LQ-08 instrument manifest (am-lq-08-photoelectric-va5a).
id: lq-08
title: "LQ-08: Photoelectric Apparatus and Stopping Potential"
explanatoryQuestion: "What changes the energy of the emitted electrons, and what changes their number?"
sourceRefs:
  - paper: light-quanta
    id: s8
argumentIds:
  - arg-lq-photoelectric
  - arg-lq-stopping-potential
  - arg-lq-intensity-rate
  - arg-lq-threshold-frequency
schemaVersion: 1
parameters:
  - id: incidentPower
    label: "Optical Power"
    accessibleName: "Incident optical radiant power"
    accessibleDescription: "Sets the optical radiant power incident on the cathode in watts"
    quantityId: incidentPower
    displayUnit: "mW"
    modelDomain:
      min: 0.00001
      max: 0.1
      minInclusive: true
      maxInclusive: true
      reason: "Linear photoelectric regime before non-linear or space-charge saturation"
    visualRange:
      min: 0.0001
      max: 0.01
    default: 0.001
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: frequency
    label: "Light Frequency"
    accessibleName: "Monochromatic light frequency"
    accessibleDescription: "Sets the frequency of the incident monochromatic light in hertz"
    quantityId: frequency
    displayUnit: "THz"
    modelDomain:
      min: 2e14
      max: 3e15
      minInclusive: true
      maxInclusive: true
      reason: "Near-infrared to ultraviolet optical band"
    visualRange:
      min: 3e14
      max: 1.5e15
    default: 6e14
    mapping:
      kind: linear
    role: independent
    commandClass: physical-intervention
  - id: workFunction
    label: "Work Function"
    accessibleName: "Cathode metal work function"
    accessibleDescription: "Sets the escape work of the cathode material in electron-volts"
    quantityId: workFunction
    displayUnit: "eV"
    modelDomain:
      min: 1.0
      max: 6.5
      minInclusive: true
      maxInclusive: true
      reason: "Elemental metals work function range (e.g. Cs 2.14 eV to Pt 5.65 eV)"
    visualRange:
      min: 1.5
      max: 5.5
    default: 2.2
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: quantumEfficiency
    label: "Quantum Efficiency"
    accessibleName: "Cathode quantum efficiency"
    accessibleDescription: "Ratio of emitted electrons to incident photons"
    quantityId: quantumEfficiency
    displayUnit: ""
    modelDomain:
      min: 0.0001
      max: 1.0
      minInclusive: true
      maxInclusive: true
      reason: "Physical probability of electron emission per incident quantum"
    visualRange:
      min: 0.001
      max: 0.5
    default: 0.1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: collectorPotential
    label: "Collector Potential"
    accessibleName: "Collector electrode potential relative to cathode"
    accessibleDescription: "Sets the potential difference between collector and emitter electrodes in volts"
    quantityId: collectorPotential
    displayUnit: "V"
    modelDomain:
      min: -10
      max: 10
      minInclusive: true
      maxInclusive: true
      reason: "Retarding to accelerating bias voltage range"
    visualRange:
      min: -5
      max: 5
    default: 0
    mapping:
      kind: linear
    role: independent
    commandClass: measurement-change
outputs:
  - id: quantumEnergy
    quantityId: quantumEnergy
    allowedStatuses:
      - value
      - outside-domain
    primary: true
  - id: thresholdFrequency
    quantityId: thresholdFrequency
    allowedStatuses:
      - value
      - outside-domain
    primary: true
  - id: maxKineticEnergy
    quantityId: maxKineticEnergy
    allowedStatuses:
      - value
      - not-applicable
      - outside-domain
    primary: true
  - id: stoppingPotentialMagnitude
    quantityId: stoppingPotentialMagnitude
    allowedStatuses:
      - value
      - not-applicable
      - outside-domain
    primary: true
  - id: quantumRate
    quantityId: quantumRate
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: emissionRate
    quantityId: emissionRate
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: photocurrent
    quantityId: photocurrent
    allowedStatuses:
      - value
      - underdetermined
      - outside-domain
    primary: false
assumptions:
  - "Light energy is transferred to electrons in discrete quanta of magnitude E = h*nu."
  - "One absorbed light quantum transfers its full energy to at most one photoelectron."
  - "Electrons expend a characteristic surface escape work Phi leaving the cathode material."
  - "The fastest photoelectrons originate at the Fermi surface and undergo no inelastic collisions before escape."
admittedDomain: "Monochromatic light on clean metallic cathode in vacuum under single-photon photoelectric regime"
notModeled:
  - "Real-material electron energy distributions and yields"
  - "Contact potentials and surface states"
  - "Space charge"
  - "Reflection losses"
  - "Emission angles"
  - "Multi-photon or thermionic emission"
  - "The timing of individual emissions"
  - "Energy transfer models beyond the declared complete or partial cases"
  - "Any claim that the moving marks depict photons"
owner:
  kind: reference-evaluator
  kernelFunctions:
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/photoelectric.ts"
      exportName: "stoppingPotentialMagnitude"
  identifierBindings:
    - kernelFunction: "stoppingPotentialMagnitude"
      identifier: "nu"
      quantityId: "frequency"
    - kernelFunction: "stoppingPotentialMagnitude"
      identifier: "workFunctionJoules"
      quantityId: "workFunction"
views:
  - id: lq-08-energy-diagram
    kind: svg
    consumes:
      - quantumEnergy
      - workFunction
      - maxKineticEnergy
  - id: lq-08-stopping-plot
    kind: canvas
    requires:
      - canvas-2d
    consumes:
      - frequency
      - stoppingPotentialMagnitude
      - thresholdFrequency
  - id: lq-08-iv-curve
    kind: canvas
    requires:
      - canvas-2d
    consumes:
      - collectorPotential
      - photocurrent
  - id: lq-08-data-table
    kind: table
    consumes:
      - incidentPower
      - frequency
      - quantumRate
      - emissionRate
      - maxKineticEnergy
      - stoppingPotentialMagnitude
actions:
  - actionId: lq-08-sweep-frequency
    family: radiation-entropy
    question: "How does stopping potential change as light frequency increases?"
    inputs:
      - frequency
    commandClass: physical-intervention
    acceptedResult:
      outputs:
        - stoppingPotentialMagnitude
        - maxKineticEnergy
      allowedStatuses:
        - value
        - not-applicable
    visualAffordance: "Stopping potential line and kinetic energy bar update with frequency"
    equivalentAffordance: "Type a frequency and read the stopping potential value"
    announcement: "Stopping potential updated for selected frequency"
  - actionId: lq-08-sweep-power
    family: radiation-entropy
    question: "How does photoelectron emission rate change with optical power at fixed frequency?"
    inputs:
      - incidentPower
    commandClass: setup-change
    acceptedResult:
      outputs:
        - quantumRate
        - emissionRate
        - photocurrent
      allowedStatuses:
        - value
    visualAffordance: "Emission rate and saturation current scale linearly with power while stopping potential stays constant"
    equivalentAffordance: "Type an optical power and read the emission rate and current"
    announcement: "Emission rate updated; maximum electron energy is unchanged"
  - actionId: lq-08-compare-metals
    family: radiation-entropy
    question: "How do stopping lines compare between metals with different work functions?"
    inputs:
      - workFunction
    commandClass: setup-change
    acceptedResult:
      outputs:
        - thresholdFrequency
        - stoppingPotentialMagnitude
      allowedStatuses:
        - value
        - not-applicable
    visualAffordance: "Parallel stopping lines displaced horizontally by the difference in threshold frequencies"
    equivalentAffordance: "Select a metal work function and observe the threshold shift"
    announcement: "Metal work function updated; stopping line slope is invariant"
acceptanceCases:
  - photoelectric-einstein-1905-printed
  - photoelectric-sodium-millikan-1916
  - photoelectric-subthreshold-refusal
  - photoelectric-power-energy-invariance
defaultScenario: photoelectric-einstein-1905-printed
tapeModel:
  modelId: lq-08
  modelVersion: 1
teachingTapes:
  - tapeId: photoelectric-millikan-walkthrough
    title: "Millikan 1916 Sodium Line Verification"
presets:
  - presetId: lq-08-intensity-probe
    label: "The intensity probe (rate vs energy)"
    parameterValues:
      incidentPower: 0.001
      frequency: 6e14
      workFunction: 2.0
      quantumEfficiency: 0.1
      collectorPotential: 0
  - presetId: lq-08-historical-check
    label: "Einstein 1905 §8 check (Lenard spark order-of-magnitude)"
    parameterValues:
      incidentPower: 0.001
      frequency: 1.03e15
      workFunction: 0.0
      quantumEfficiency: 0.1
      collectorPotential: 0
  - presetId: lq-08-two-metals
    label: "Two metals comparison (2.0 eV vs 3.0 eV)"
    parameterValues:
      incidentPower: 0.001
      frequency: 8e14
      workFunction: 3.0
      quantumEfficiency: 0.1
      collectorPotential: 0
probes:
  - lq-08-threshold-cutoff-probe
  - lq-08-intensity-invariance-probe
  - lq-08-millikan-slope-comparison
weavePredicates:
  - lq08-s8-linear-frequency
  - lq08-s8-intensity-rate-independence
  - lq08-s8-printed-stopping-check
historicalOverlays:
  - millikan-1916-sodium
realRate:
  natural: false
embeddable: true
predictMode:
  enabled: true
  prompts:
    - promptId: lq-08-predict-double-power
      controlId: incidentPower
      question: "Make the lamp twice as bright without changing its frequency. What happens to the energy of the fastest electrons?"
      candidates:
        - id: energy-increases
          label: "It increases"
          description: "Greater wave intensity delivers more energy per electron."
          separatingAssumption: "Classical wave assumption: energy transfer depends on light intensity."
        - id: energy-unchanged
          label: "It stays the same"
          description: "Each electron absorbs exactly one light quantum whose energy depends on frequency alone."
          separatingAssumption: "Light-quantum assumption: one quantum transfers its energy to one electron, changing emission rate but not individual energy."
        - id: energy-decreases
          label: "It decreases"
          description: "Crowding more electrons slows individual electrons down through space charge."
          separatingAssumption: "Space-charge assumption: assumes collective electron repulsion degrades individual peak kinetic energy."
    - promptId: lq-08-predict-raise-frequency
      controlId: frequency
      question: "Raise the frequency while keeping the lamp's power the same. What happens to the number of quanta arriving each second?"
      candidates:
        - id: rate-rises
          label: "More arrive each second"
          description: "Higher-frequency light has greater penetrating power and frees electrons more readily."
          separatingAssumption: "Assumes higher frequency increases the quantum count per unit power."
        - id: rate-falls
          label: "Fewer arrive each second"
          description: "At fixed power, each quantum carries more energy, so fewer quanta arrive each second."
          separatingAssumption: "Light-quantum accounting: total power equals quantum rate times quantum energy, so rate falls as frequency rises."
        - id: rate-unchanged
          label: "The same number arrive each second"
          description: "Total power determines the total energy entering the metal per second, so the quantum count is conserved."
          separatingAssumption: "Assumes light delivers continuous energy with constant quantum rate at fixed power."
    - promptId: lq-08-predict-two-metals
      controlId: workFunction
      question: "Two different metals are lit by the same lamp. Plotted against frequency, are their stopping-potential lines parallel, crossing, or identical?"
      candidates:
        - id: lines-parallel
          label: "Parallel, with different starting thresholds"
          description: "The slope is a universal constant of radiation and charge, while the work function shifts the starting threshold."
          separatingAssumption: "Universal quantum slope: the stopping line slope is universal and independent of the material."
        - id: lines-crossing
          label: "Crossing"
          description: "Different metals couple differently to light, so each metal has its own characteristic slope."
          separatingAssumption: "Material-specific coupling: assumes frequency sensitivity depends on the metal electron structure."
        - id: lines-identical
          label: "Identical"
          description: "The photoelectric response is a universal property of free electrons in all conductors."
          separatingAssumption: "Free electron assumption: ignores the material-dependent surface escape barrier."
