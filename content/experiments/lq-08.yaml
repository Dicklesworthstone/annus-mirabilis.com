# LQ-08 instrument manifest (am-lq-08-photoelectric-va5a).
id: lq-08
title: "LQ-08: Photoelectric Apparatus and Stopping Potential"
explanatoryQuestion: "Why does increasing light intensity release more electrons without increasing their individual energy, while increasing frequency increases electron energy without requiring higher intensity?"
sourceRefs:
  - paper: light-quanta
    id: s8
argumentIds:
  - arg-lq-photoelectric
  - arg-lq-stopping-potential
  - arg-lq-intensity-rate
  - arg-lq-threshold-frequency
schemaVersion: 1
parameters:
  - id: incidentPower
    label: "Optical Power"
    accessibleName: "Incident optical radiant power"
    accessibleDescription: "Sets the optical radiant power incident on the cathode in watts"
    quantityId: incidentPower
    displayUnit: "mW"
    modelDomain:
      min: 0.00001
      max: 0.1
      minInclusive: true
      maxInclusive: true
      reason: "Linear photoelectric regime before non-linear or space-charge saturation"
    visualRange:
      min: 0.0001
      max: 0.01
    default: 0.001
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: frequency
    label: "Light Frequency"
    accessibleName: "Monochromatic light frequency"
    accessibleDescription: "Sets the frequency of the incident monochromatic light in hertz"
    quantityId: frequency
    displayUnit: "THz"
    modelDomain:
      min: 2e14
      max: 3e15
      minInclusive: true
      maxInclusive: true
      reason: "Near-infrared to ultraviolet optical band"
    visualRange:
      min: 3e14
      max: 1.5e15
    default: 6e14
    mapping:
      kind: linear
    role: independent
    commandClass: physical-intervention
  - id: workFunction
    label: "Work Function"
    accessibleName: "Cathode metal work function"
    accessibleDescription: "Sets the escape work of the cathode material in electron-volts"
    quantityId: workFunction
    displayUnit: "eV"
    modelDomain:
      min: 1.0
      max: 6.5
      minInclusive: true
      maxInclusive: true
      reason: "Elemental metals work function range (e.g. Cs 2.14 eV to Pt 5.65 eV)"
    visualRange:
      min: 1.5
      max: 5.5
    default: 2.2
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: quantumEfficiency
    label: "Quantum Efficiency"
    accessibleName: "Cathode quantum efficiency"
    accessibleDescription: "Ratio of emitted electrons to incident photons"
    quantityId: quantumEfficiency
    displayUnit: ""
    modelDomain:
      min: 0.0001
      max: 1.0
      minInclusive: true
      maxInclusive: true
      reason: "Physical probability of electron emission per incident quantum"
    visualRange:
      min: 0.001
      max: 0.5
    default: 0.1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: collectorPotential
    label: "Collector Potential"
    accessibleName: "Collector electrode potential relative to cathode"
    accessibleDescription: "Sets the potential difference between collector and emitter electrodes in volts"
    quantityId: collectorPotential
    displayUnit: "V"
    modelDomain:
      min: -10
      max: 10
      minInclusive: true
      maxInclusive: true
      reason: "Retarding to accelerating bias voltage range"
    visualRange:
      min: -5
      max: 5
    default: 0
    mapping:
      kind: linear
    role: independent
    commandClass: measurement-change
outputs:
  - id: quantumEnergy
    quantityId: quantumEnergy
    allowedStatuses:
      - value
      - outside-domain
    primary: true
  - id: thresholdFrequency
    quantityId: thresholdFrequency
    allowedStatuses:
      - value
      - outside-domain
    primary: true
  - id: maxKineticEnergy
    quantityId: maxKineticEnergy
    allowedStatuses:
      - value
      - not-applicable
      - outside-domain
    primary: true
  - id: stoppingPotentialMagnitude
    quantityId: stoppingPotentialMagnitude
    allowedStatuses:
      - value
      - not-applicable
      - outside-domain
    primary: true
  - id: quantumRate
    quantityId: quantumRate
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: emissionRate
    quantityId: emissionRate
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: photocurrent
    quantityId: photocurrent
    allowedStatuses:
      - value
      - underdetermined
      - outside-domain
    primary: false
assumptions:
  - "Light energy is transferred to electrons in discrete quanta of magnitude E = h*nu."
  - "One absorbed light quantum transfers its full energy to at most one photoelectron."
  - "Electrons expend a characteristic surface escape work Phi leaving the cathode material."
  - "The fastest photoelectrons originate at the Fermi surface and undergo no inelastic collisions before escape."
admittedDomain: "Monochromatic light on clean metallic cathode in vacuum under single-photon photoelectric regime"
notModeled:
  - "Multi-photon absorption processes at ultra-high laser intensities."
  - "Detailed angular distribution of emitted photoelectrons."
  - "Sub-surface electron-electron scattering and energy degradation spectrum."
  - "Surface oxidation layer work-function drift."
  - "Thermal tail of electron Fermi-Dirac distribution at T > 0 K."
owner:
  kind: reference-evaluator
  kernelFunctions:
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/photoelectric.ts"
      exportName: "stoppingPotentialMagnitude"
  identifierBindings:
    - kernelFunction: "stoppingPotentialMagnitude"
      identifier: "nu"
      quantityId: "frequency"
    - kernelFunction: "stoppingPotentialMagnitude"
      identifier: "workFunctionJoules"
      quantityId: "workFunction"
views:
  - id: lq-08-energy-diagram
    kind: svg
    consumes:
      - quantumEnergy
      - workFunction
      - maxKineticEnergy
  - id: lq-08-stopping-plot
    kind: canvas
    requires:
      - canvas-2d
    consumes:
      - frequency
      - stoppingPotentialMagnitude
      - thresholdFrequency
  - id: lq-08-iv-curve
    kind: canvas
    requires:
      - canvas-2d
    consumes:
      - collectorPotential
      - photocurrent
  - id: lq-08-data-table
    kind: table
    consumes:
      - incidentPower
      - frequency
      - quantumRate
      - emissionRate
      - maxKineticEnergy
      - stoppingPotentialMagnitude
actions:
  - actionId: lq-08-sweep-frequency
    family: radiation-entropy
    question: "How does stopping potential change as light frequency increases?"
    inputs:
      - frequency
    commandClass: physical-intervention
    acceptedResult:
      outputs:
        - stoppingPotentialMagnitude
        - maxKineticEnergy
      allowedStatuses:
        - value
        - not-applicable
    visualAffordance: "Stopping potential line and kinetic energy bar update with frequency"
    equivalentAffordance: "Type a frequency and read the stopping potential value"
    announcement: "Stopping potential updated for selected frequency"
  - actionId: lq-08-sweep-power
    family: radiation-entropy
    question: "How does photoelectron emission rate change with optical power at fixed frequency?"
    inputs:
      - incidentPower
    commandClass: setup-change
    acceptedResult:
      outputs:
        - quantumRate
        - emissionRate
        - photocurrent
      allowedStatuses:
        - value
    visualAffordance: "Emission rate and saturation current scale linearly with power while stopping potential stays constant"
    equivalentAffordance: "Type an optical power and read the emission rate and current"
    announcement: "Emission rate updated; maximum electron energy is unchanged"
  - actionId: lq-08-compare-metals
    family: radiation-entropy
    question: "How do stopping lines compare between metals with different work functions?"
    inputs:
      - workFunction
    commandClass: setup-change
    acceptedResult:
      outputs:
        - thresholdFrequency
        - stoppingPotentialMagnitude
      allowedStatuses:
        - value
        - not-applicable
    visualAffordance: "Parallel stopping lines displaced horizontally by the difference in threshold frequencies"
    equivalentAffordance: "Select a metal work function and observe the threshold shift"
    announcement: "Metal work function updated; stopping line slope is invariant"
acceptanceCases:
  - photoelectric-einstein-1905-printed
  - photoelectric-sodium-millikan-1916
  - photoelectric-subthreshold-refusal
  - photoelectric-power-energy-invariance
defaultScenario: photoelectric-einstein-1905-printed
tapeModel:
  modelId: photoelectric-apparatus-reference
  modelVersion: 1
teachingTapes:
  - tapeId: photoelectric-millikan-walkthrough
    title: "Millikan 1916 Sodium Line Verification"
presets:
  - presetId: lq-08-intensity-probe
    label: "The intensity probe (rate vs energy)"
    parameterValues:
      incidentPower: 0.002
      frequency: 6e14
      workFunction: 2.2
      quantumEfficiency: 0.1
      collectorPotential: 0
  - presetId: lq-08-historical-check
    label: "Einstein 1905 §8 check (Lenard spark order-of-magnitude)"
    parameterValues:
      incidentPower: 0.001
      frequency: 1.03e15
      workFunction: 0.0
      quantumEfficiency: 0.1
      collectorPotential: 0
  - presetId: lq-08-two-metals
    label: "Two metals comparison (Sodium vs Platinum)"
    parameterValues:
      incidentPower: 0.001
      frequency: 8e14
      workFunction: 5.65
      quantumEfficiency: 0.1
      collectorPotential: 0
probes:
  - lq-08-threshold-cutoff-probe
  - lq-08-intensity-invariance-probe
  - lq-08-millikan-slope-comparison
weavePredicates:
  - lq08-s8-linear-frequency
  - lq08-s8-intensity-rate-independence
  - lq08-s8-printed-stopping-check
historicalOverlays:
  - millikan-1916-sodium
realRate:
  natural: false
embeddable: true
predictMode:
  enabled: true
  prompts:
    - promptId: lq-08-predict-double-power
      controlId: incidentPower
      question: "If you double the incident light intensity while keeping frequency constant, does the maximum electron kinetic energy increase, decrease, or remain unchanged?"
      candidates:
        - id: lq-08-predict-double-power-increases
          label: "Maximum kinetic energy increases"
          description: "Higher wave intensity delivers greater wave amplitude and thus more kinetic energy per electron"
          separatingAssumption: "Classical wave assumption: energy transfer depends on wave intensity (electric field amplitude squared)."
        - id: lq-08-predict-double-power-unchanged
          label: "Maximum kinetic energy is unchanged"
          description: "Each electron absorbs exactly one quantum h*nu whose energy is determined by frequency alone"
          separatingAssumption: "Light-quantum assumption: one quantum transfers h*nu to one electron, changing emission rate but not individual energy."
        - id: lq-08-predict-double-power-decreases
          label: "Maximum kinetic energy decreases"
          description: "Crowding more photoelectrons in the beam slows individual electrons down through space charge"
          separatingAssumption: "Space-charge assumption: assumes collective electron repulsion degrades individual peak kinetic energies."
    - promptId: lq-08-predict-raise-frequency
      controlId: frequency
      question: "If you raise the frequency of the light while holding total optical power constant, does the photoelectron emission rate rise, fall, or stay unchanged?"
      candidates:
        - id: lq-08-predict-raise-frequency-rate-rises
          label: "Emission rate rises"
          description: "Higher-frequency light has greater penetrating power and frees electrons more readily"
          separatingAssumption: "Assumes higher photon energy increases the cross-section or yield per unit power."
        - id: lq-08-predict-raise-frequency-rate-falls
          label: "Emission rate falls"
          description: "At fixed total power P, higher frequency means each quantum carries more energy h*nu, so there are fewer quanta per second (N_dot = P / h*nu)"
          separatingAssumption: "Light-quantum accounting: total power equals quantum rate times quantum energy, so N_dot scales as 1/nu."
        - id: lq-08-predict-raise-frequency-rate-unchanged
          label: "Emission rate stays unchanged"
          description: "Total power determines the total energy entering the metal per second, so the electron count is conserved"
          separatingAssumption: "Assumes light delivers continuous energy that produces electrons at a rate proportional to power alone."
    - promptId: lq-08-predict-two-metals
      controlId: workFunction
      question: "When measuring stopping potential vs frequency for two different cathode metals, how will their stopping lines V_s(nu) relate?"
      candidates:
        - id: lq-08-predict-two-metals-parallel
          label: "Parallel lines with identical slope"
          description: "The slope is the universal constant h/e, while the work function Phi shifts the threshold frequency intercept"
          separatingAssumption: "Universal quantum slope: dV_s/dnu = h/e is a universal constant of radiation and charge, independent of the material."
        - id: lq-08-predict-two-metals-crossing
          label: "Lines with different slopes that cross"
          description: "Different metals couple differently to light, so each metal has its own characteristic slope"
          separatingAssumption: "Material-specific coupling: assumes the frequency sensitivity depends on the metal's electron structure."
        - id: lq-08-predict-two-metals-identical
          label: "Completely identical lines"
          description: "The photoelectric response is a universal property of free electrons in all conductors"
          separatingAssumption: "Free electron assumption: ignores the material-dependent surface escape barrier."
