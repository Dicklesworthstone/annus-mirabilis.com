    quantityId: incidentPower
    allowedStatuses:
      - value
      - outside-domain
    primary: true
  - id: fringeVisibility
    quantityId: visibility
    allowedStatuses:
      - value
    primary: false
  - id: fringeSpacing
    quantityId: fringeSpacing
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: pointSourceIntensity
    quantityId: incidentPower
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: shellPower
    quantityId: incidentPower
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: instantaneousCenterIntensity
    quantityId: incidentPower
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: smallAperturePower
    quantityId: incidentPower
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: exactDiskPower
    quantityId: incidentPower
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: relativeDifference
    quantityId: dimensionlessRatio
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: pathDifference
    quantityId: displacement1d
    allowedStatuses:
      - value
    primary: false
  - id: selectedPositionIntensity
    quantityId: incidentPower
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: screenIntensity
    quantityId: coordinate-intensity
    allowedStatuses:
      - value
      - outside-domain
    primary: false
assumptions:
  - "Linear superposition holds for the scalar wave field."
  - "The two sources are monochromatic and mutually coherent."
  - "Observation times are long compared with optical periods for time-averaged readouts."
  - "Energy radiates isotropically from point sources into non-absorbing free space."
admittedDomain: "Scalar wave propagation, coherent two-source interference, and spherical energy spreading with positive distance r > 0."
notModeled:
  - "Polarization and vector electromagnetic field components."
  - "Photon statistics, photon anti-bunching, or quantum optics."
  - "Absorption, emission, or quantum detection by matter."
  - "Non-monochromatic or finite-coherence-length light sources."
  - "Diffraction effects beyond the coherent two-source idealization."
  - "An absolute physical intensity scale unless a radiant power and detector geometry are declared."
owner:
  kind: reference-evaluator
  kernelFunctions:
    - displayRole: executing-source
      language: ts
      module: "src/physics/reference/radiation.ts"
      exportName: "twoSourceIntensity"
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/radiation.ts"
      exportName: "inverseSquareIntensity"
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/radiation.ts"
      exportName: "shellPowerIdentity"
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/radiation.ts"
      exportName: "fringeVisibility"
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/radiation.ts"
      exportName: "fringeSpacingSmallAngle"
views:
  - id: lq-01-interference-plot
    kind: svg
    consumes:
      - centerIntensity
      - fringeVisibility
      - fringeSpacing
      - screenIntensity
      - pathDifference
      - selectedPositionIntensity
  - id: lq-01-wavefront-view
    kind: svg
    consumes:
      - centerIntensity
      - pathDifference
  - id: lq-01-spreading-view
    kind: svg
    consumes:
      - pointSourceIntensity
      - shellPower
      - smallAperturePower
      - exactDiskPower
      - relativeDifference
  - id: lq-01-data-table
    kind: table
    consumes:
      - centerIntensity
      - fringeVisibility
      - fringeSpacing
      - pointSourceIntensity
      - shellPower
      - instantaneousCenterIntensity
      - smallAperturePower
      - exactDiskPower
      - relativeDifference
actions:
  - actionId: lq-01-set-phase-difference
    family: wave-optics
    question: "How does the relative phase between two coherent waves alter the interference pattern and center brightness?"
    inputs:
      - delta
      - A1
      - A2
    commandClass: physical-intervention
    acceptedResult:
      outputs:
        - centerIntensity
        - fringeVisibility
      allowedStatuses:
        - value
    visualAffordance: "Wave crests shift and center intensity transitions between constructive maximum and destructive zero"
    equivalentAffordance: "Read center intensity in data table as phase varies"
    announcement: "Phase difference updated: center intensity recalculated"
  - actionId: lq-01-select-screen-position
    family: wave-optics
    question: "How does the path difference from the two sources determine whether a screen position is bright or dark?"
    inputs:
      - screenPosition
    commandClass: measurement-change
    acceptedResult:
      outputs:
        - pathDifference
        - selectedPositionIntensity
      allowedStatuses:
        - value
    visualAffordance: "Screen marker highlights local path difference and interference fringe"
    equivalentAffordance: "Read path difference and intensity for chosen position in data table"
    announcement: "Screen position selected: path difference and intensity updated"
  - actionId: lq-01-toggle-readout-mode
    family: wave-optics
    question: "How does the time-averaged intensity recorded by optical detectors differ from the instantaneous squared field?"
    inputs:
      - readout
      - t
    commandClass: observer-change
    acceptedResult:
      outputs:
        - centerIntensity
        - instantaneousCenterIntensity
      allowedStatuses:
        - value
    visualAffordance: "Plot switches between stationary time-averaged envelope and rapid instantaneous oscillation"
    equivalentAffordance: "Read time-averaged vs instantaneous label and values in table"
    announcement: "Readout mode toggled: instantaneous vs time-averaged display updated"
  - actionId: lq-01-set-spreading-radius
    family: radiation-energy-accounting
    question: "How does geometric spherical spreading reduce intensity while strictly conserving total radiant power across any enclosing shell?"
    inputs:
      - r
      - P
    commandClass: physical-intervention
    acceptedResult:
      outputs:
        - pointSourceIntensity
        - shellPower
        - smallAperturePower
        - exactDiskPower
      allowedStatuses:
        - value
    visualAffordance: "Spherical shell radius expands with inverse-square color attenuation while total shell power remains constant"
    equivalentAffordance: "Read intensity and shell power in data table"
    announcement: "Spreading radius updated: intensity and enclosed shell power calculated"
