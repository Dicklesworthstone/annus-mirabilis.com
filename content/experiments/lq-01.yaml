    quantityId: phaseAngle
    displayUnit: "rad"
    modelDomain:
      min: 0
      max: 6.283185307179586
      minInclusive: true
      maxInclusive: true
      reason: "Time phase parameter for instantaneous snapshot"
    visualRange:
      min: 0
      max: 6.283185307179586
    default: 0
    mapping:
      kind: linear
    role: independent
    commandClass: observer-change
  - id: P
