    accessibleName: "Spreading sphere radius"
    accessibleDescription: "Distance from point source to observation sphere in meters"
    quantityId: displacement1d
    displayUnit: "m"
    modelDomain:
      min: 0.1
      max: 100
      minInclusive: true
      maxInclusive: true
      reason: "Strictly positive distance from source in meters"
    visualRange:
      min: 0.1
      max: 100
    default: 1
    mapping:
      kind: log
      base: 10
    role: independent
    commandClass: physical-intervention
  - id: mode
    label: "Laboratory mode"
    accessibleName: "Operating mode"
    accessibleDescription: "Choice between two-source interference and inverse-square spherical spreading"
    quantityId: measurementKind
    displayUnit: ""
    modelDomain:
      enumerated: []
      reason: "One of interference or spreading"
    visualRange:
      min: 0
      max: 1
    default: "interference"
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: screenPosition
    label: "Screen position"
    accessibleName: "Target screen position"
    accessibleDescription: "Selected position on observation screen (center, first-min, first-max)"
    quantityId: measurementKind
    displayUnit: ""
    modelDomain:
      enumerated: []
      reason: "One of center, first-min, or first-max"
    visualRange:
      min: 0
      max: 2
    default: "center"
    mapping:
      kind: linear
    role: independent
    commandClass: measurement-change
outputs:
