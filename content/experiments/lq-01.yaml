id: lq-01
title: "LQ-01: Wave Description and Energy Spreading"
explanatoryQuestion: "What does a continuous wave description of light explain well, and what exactly does its intensity measure?"
sourceRefs:
  - paper: light-quanta
    id: s0
argumentIds:
  - arg-lq-wave-success
  - arg-lq-time-averages
  - arg-lq-energy-spreading
schemaVersion: 1
parameters:
  - id: A1
    label: "Wave 1 amplitude"
    accessibleName: "First wave source amplitude"
    accessibleDescription: "Normalized electric field amplitude of first coherent source"
    quantityId: radiationElectricField
    displayUnit: ""
    modelDomain:
      min: 0
      max: 2
      minInclusive: true
      maxInclusive: true
      reason: "Normalized non-negative field amplitude"
    visualRange:
      min: 0
      max: 2
    default: 1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: A2
    label: "Wave 2 amplitude"
    accessibleName: "Second wave source amplitude"
    accessibleDescription: "Normalized electric field amplitude of second coherent source"
    quantityId: radiationElectricField
    displayUnit: ""
    modelDomain:
      min: 0
      max: 2
      minInclusive: true
      maxInclusive: true
      reason: "Normalized non-negative field amplitude"
    visualRange:
      min: 0
      max: 2
    default: 1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: delta
    label: "Relative phase"
    accessibleName: "Relative phase difference"
    accessibleDescription: "Phase difference between the two sources in radians"
    quantityId: phaseAngle
    displayUnit: "rad"
    modelDomain:
      min: 0
      max: 6.283185307179586
      minInclusive: true
      maxInclusive: true
      reason: "Phase difference over a full 2*pi cycle"
    visualRange:
      min: 0
      max: 6.283185307179586
    default: 0
    mapping:
      kind: linear
    role: independent
    commandClass: physical-intervention
  - id: wavelength
    label: "Wavelength"
    accessibleName: "Monochromatic light wavelength"
    accessibleDescription: "Wavelength of the monochromatic waves in display units"
    quantityId: wavelength
    displayUnit: ""
    modelDomain:
      min: 0.2
      max: 5
      minInclusive: true
      maxInclusive: true
      reason: "Positive wavelength in scale-free display units"
    visualRange:
      min: 0.2
      max: 5
    default: 1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: separation
    label: "Source separation"
    accessibleName: "Separation between sources"
    accessibleDescription: "Separation distance d between the two coherent sources in units of wavelength"
    quantityId: displacement1d
    displayUnit: "lambda"
    modelDomain:
      min: 0
      max: 10
      minInclusive: true
      maxInclusive: true
      reason: "Non-negative source separation in units of wavelength"
    visualRange:
      min: 0
      max: 10
    default: 3
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: screenDistance
    label: "Screen distance"
    accessibleName: "Distance to observation screen"
    accessibleDescription: "Distance D from source plane to observation screen in units of wavelength"
    quantityId: displacement1d
    displayUnit: "lambda"
    modelDomain:
      min: 10
      max: 1000
      minInclusive: true
      maxInclusive: true
      reason: "Strictly positive screen distance in units of wavelength"
    visualRange:
      min: 10
      max: 1000
    default: 100
    mapping:
      kind: log
      base: 10
    role: independent
    commandClass: setup-change
  - id: readout
    label: "Intensity readout"
    accessibleName: "Readout mode"
    accessibleDescription: "Choice between time-averaged intensity and instantaneous squared field"
    quantityId: measurementKind
    displayUnit: ""
    modelDomain:
      enumerated: []
      reason: "One of time-average or instantaneous"
    visualRange:
      min: 0
      max: 1
    default: "time-average"
    mapping:
      kind: linear
    role: independent
    commandClass: observer-change
  - id: t
    label: "Time phase"
    accessibleName: "Instantaneous snapshot phase"
