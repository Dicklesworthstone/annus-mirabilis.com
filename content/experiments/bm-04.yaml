  - bm04-probe-force-independence
  - bm04-probe-cfl-stability
weavePredicates:
  - bm04-s3-diffusion-coefficient
  - bm04-s3-force-balance
historicalOverlays: []
realRate:
  natural: false
embeddable: true
predictMode:
  enabled: true
  prompts:
    - promptId: bm-04-predict-force-dependence
      supportedCandidateId: bm-04-predict-force-dependence-unchanged
      controlId: F
      question: "If you double the external force pulling on the particles, does the steady-state diffusion coefficient D double, halve, or stay unchanged?"
      explanation: "At fixed temperature, viscosity and particle radius, the thermal diffusion coefficient stays unchanged. A stronger force changes directed drift, not the thermal diffusivity. The equilibrium length becomes shorter, but that is not a smaller diffusion coefficient."
      candidates:
        - id: bm-04-predict-force-dependence-double
          label: "D doubles"
          description: "A stronger force causes faster particle transport"
          separatingAssumption: "This takes faster transport by the force for faster spreading. The force sets the drift, u = μF; the diffusion coefficient D = μk_{B}T does not contain it."
        - id: bm-04-predict-force-dependence-unchanged
          label: "D stays unchanged"
          description: "Diffusion reflects thermal agitation and drag; the force drops out of the relation"
          separatingAssumption: "Follows from D = mu * k_B * T: the force drops out of the equilibrium quotient."
        - id: bm-04-predict-force-dependence-halves
          label: "D halves"
          description: "A stronger force compresses the distribution, reducing spreading"
          separatingAssumption: "This reads the shorter decay length λ as a smaller diffusivity. A stronger force compresses the profile, λ = k_{B}T/F, while D = μk_{B}T stays the same."
    - promptId: bm-04-predict-kicks-off
      supportedCandidateId: bm-04-predict-kicks-off-pileup
      controlId: m
      question: "In a hypothetical world where single molecular collisions cannot move particles (kicks off, m = 0), what happens to particles under a constant downward force?"
      candidates:
        - id: bm-04-predict-kicks-off-pileup
          label: "All particles drift to the bottom wall and remain stuck there"
          description: "Without thermal diffusion to oppose drift, particles accumulate irreversibly at the boundary"
          separatingAssumption: "Without diffusion flux to balance drift, the only steady state is complete wall pileup: Nägeli's model prediction."
        - id: bm-04-predict-kicks-off-equilibrium
          label: "Particles form an exponential equilibrium gradient just like with kicks"
          description: "Equilibrium is purely thermodynamic and does not depend on molecular collisions"
          separatingAssumption: "Assumes an exponential distribution can arise without a diffusive counter-flux."
        - id: bm-04-predict-kicks-off-bounce
          label: "Particles oscillate back and forth between walls"
          description: "Particles bounce elastically from the bottom wall"
          separatingAssumption: "Assumes elastic frictionless bouncing without viscous damping."
