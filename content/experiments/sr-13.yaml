predictMode:
  enabled: true
  prompts:
    - promptId: sr-13-predict-transverse-mass
      supportedCandidateId: answer-depends-on-definition
      controlId: initialSpeed
      question: "At 0.6c, is the electron harder to push sideways by a factor of 1.25 or 1.5625?"
      candidates:
        - id: answer-depends-on-definition
          label: "It depends on which frame's force you compare to acceleration (1.25 in lab, 1.5625 in comoving), but both predict the identical physical deflection."
          description: "In Einstein's 1905 source convention (comoving force / stationary acceleration), the transverse coefficient is gamma^2 = 1.5625. In Planck's 1906 laboratory convention (F = dp/dt), the coefficient is gamma = 1.25. Observable deflections and radii are identical."
          separatingAssumption: "Force is a convention-dependent definition connecting rest-frame dynamics to coordinate measurements."
        - id: answer-always-1-25
          label: "1.25 (gamma)"
          description: "Assumes only the modern relativistic momentum definition F = dp/dt."
          separatingAssumption: "Only the laboratory convention is considered valid."
        - id: answer-always-1-5625
          label: "1.5625 (gamma^2)"
          description: "Assumes Einstein's 1905 source convention combining comoving force with stationary acceleration."
          separatingAssumption: "Only the source convention is considered valid."
