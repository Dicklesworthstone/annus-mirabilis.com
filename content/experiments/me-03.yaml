acceptanceCases:
  - me-03-canonical
  - me-03-box-canonical
defaultScenario: me-03-box-canonical
tapeModel:
  modelId: me-03-box-1906-v1
  modelVersion: 1
teachingTapes:
  - tapeId: the-1906-box
    title: the 1906 box

predictMode:
  enabled: true
  prompts:
    - promptId: me-03-predict-sealed-box
      controlId: boundary
      question: "A sealed box holds a battery-powered lamp and a mirror. When the lamp lights up inside, does the box's total mass change?"
      candidates:
        - id: decreases
          label: "It decreases, because the lamp sends out energy."
          description: "Assumes radiation loss leaves the outer boundary."
          separatingAssumption: "Radiation energy crosses the sealed boundary."
        - id: stays-the-same
          label: "It stays the same, because the energy is still inside."
          description: "All energy remains inside the isolated system boundary."
          separatingAssumption: "No energy or matter crosses the external enclosure boundary."
        - id: increases
          label: "It increases, because light has been added."
          description: "Assumes radiant energy adds extra net mass to the system."
          separatingAssumption: "Energy generation adds new mass from outside."
      settledCandidateId: stays-the-same
      explanation: "The energy only moves inside the boundary. Light emitted by the lamp is absorbed by the mirror and walls inside the sealed enclosure, so no energy crosses the outer boundary and the box's total mass is unchanged."
    - promptId: me-03-predict-box-light-mass
      controlId: assignLightMass
      question: "When a light pulse traverses a closed box and hits the other side, what happens to the total center of mass of the system if light is assumed to carry no mass?"
      candidates:
        - id: com-shifts
          label: "The box moves and the center of mass permanently shifts, violating momentum conservation."
          description: "Without mass assigned to the photon, the box's recoil displacement moves the system center of mass with no external force."
          separatingAssumption: "Light carries momentum but no equivalent mass E/c^2."
        - id: com-stationary
          label: "The center of mass stays exactly stationary because the light pulse transfers mass E/c²."
          description: "Assigning inertial mass m = E/c^2 to the pulse exactly cancels the box's displacement, preserving the center of mass."
          separatingAssumption: "Energy transfer is equivalent to mass transfer m = E/c^2."
        - id: box-does-not-move
          label: "The box never moves because light pressure is a pure wave phenomenon with no mechanical recoil."
          description: "Rejects mechanical momentum transfer from light emission."
          separatingAssumption: "Radiation exerts no reaction force on an emitting body."
      settledCandidateId: com-stationary
      explanation: "Poincaré (1900) and Einstein (1906) showed that unless electromagnetic radiation carries mass m = E/c², an isolated system could propel its own center of mass through space without any external force."

captionReadings:
  r0: "Energy that leaves a body takes mass with it. Draw the line around the body and its light together, and nothing is lost."
  r1: "Three system boundaries: the emitting body alone, the emitted radiation, and the combined isolated enclosure. The energy-source cards trace mass loss across nuclear, radiant, chemical, and electrical transfers. In the 1906 photon-in-a-box mode (credit: Poincaré 1900), assigning mass E/c² to radiation preserves exact center-of-mass immobility."
  r2: "Each card's mass change Δm = ΔE / c² evaluated from its cited energy transfer. In closed but non-isolated systems (radium decay, light bulb), energy crosses without matter transfer; inside isolated systems, internal transfer leaves total mass unchanged. In the 1906 box argument, recoil displacement Δx = -E l / (M c²) requires light mass m = E/c² so total center of mass shift ΔX = 0."
  r3: "Einstein 1905 paper 4 conditional conclusions on radium and inertia conveyance; modern four-momentum invariant mass of two opposite pulses P_μ P^μ = (L/c)² giving system invariant mass m = L/c²; 1906 argument (credit: Poincaré 1900) establishing radiation inertia from center-of-mass immobility in a rigid box."
