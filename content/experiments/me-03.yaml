assumptions:
  - "Conservation of center-of-mass immobility for an isolated physical system."
  - "The 1905 mass-energy relation applied to closed and isolated boundaries."
  - "Nonrelativistic recoil approximation and flight time ell/c valid when E/(Mc^2) <= 10^-3."
  - "Radiation pressure delivers impulse E/c upon emission and absorption."

admittedDomain: "Closed thermodynamic systems with non-negative cited energy transfers and 1906 box systems with E/(Mc^2) <= 10^-3."

notModeled:
  - "gravitational weighing"
  - "wall stresses, or external work beyond declared inputs"
  - "nuclear and chemical mechanisms beyond cited energies"
  - "heat losses not declared"
  - "neutrino and solar-wind mass loss"
  - "the practical measurability of tiny mass changes"
  - "the 1905 argument's premises (inherited, not re-derived)"
  - "non-inertial or accelerated frames"

owner:
  kind: reference-evaluator
  kernelFunctions:
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/massEnergy.ts"
      exportName: "evaluateMe03"
      independentReferences:
        - experimentId: me-03
          quantityId: energyChange
    - displayRole: reference-implementation
      language: ts
      module: "src/physics/reference/massEnergy.ts"
      exportName: "evaluatePhotonBox"
      independentReferences:
        - experimentId: me-03
          quantityId: centerOfMassShift
  identifierBindings:
    - kernelFunction: evaluatePhotonBox
      identifier: M
      quantityId: boxMass
    - kernelFunction: evaluatePhotonBox
      identifier: ell
      quantityId: boxLength
    - kernelFunction: evaluatePhotonBox
      identifier: E
      quantityId: emittedEnergyRestFrame
    - kernelFunction: evaluatePhotonBox
      identifier: p
      quantityId: pulseMomentum
    - kernelFunction: evaluatePhotonBox
      identifier: v
      quantityId: recoilSpeed
    - kernelFunction: evaluatePhotonBox
      identifier: DeltaX
      quantityId: centerOfMassShift
  traceScenarioId: me-03-box-canonical
  traceRows:
