id: me-03
title: "ME-03: system-boundary energy ledger with cited energy-source cards"
explanatoryQuestion: "When energy leaves a body, which system loses mass, and which does not?"
sourceRefs:
  - paper: mass-energy
    id: s0
argumentIds:
  - arg-me-two-ledgers
schemaVersion: 1
parameters:
  - id: boundary
    label: "System boundary"
    accessibleName: "Selection of objects enclosed in the evaluated thermodynamic boundary"
    accessibleDescription: "Choose between evaluating the emitting body alone, the emitted radiation, or the combined isolated system."
    quantityId: systemBoundary
    displayUnit: ""
    modelDomain:
      enumerated:
        - body-alone
        - radiation
        - combined-isolated-system
      reason: "Three canonical thermodynamic boundaries defined in Paper 4."
    visualRange:
      min: 0
      max: 2
    default: "body-alone"
    mapping:
      kind: linear
    role: independent
    commandClass: measurement-change

  - id: disposition
    label: "Radiation disposition"
    accessibleName: "Whether emitted radiation escapes the system or is retained/absorbed"
    accessibleDescription: "Toggles between radiation escaping into the exterior environment versus being absorbed internally in an enclosure."
    quantityId: radiationDisposition
    displayUnit: ""
    modelDomain:
      enumerated:
        - escapes
        - retained
        - partly-retained
      reason: "Radiation either escapes across the boundary or is absorbed internally."
    visualRange:
      min: 0
      max: 2
    default: "escapes"
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change

  - id: emittedEnergy
    label: "Emitted radiation energy L"
    accessibleName: "Total energy emitted as radiation"
    accessibleDescription: "Positive energy radiated by the source body."
    quantityId: emittedEnergy
    displayUnit: "J"
    modelDomain:
      min: 0
      max: 1.0e28
      minInclusive: false
      maxInclusive: true
      reason: "Emitted energy L must be positive."
    visualRange:
      min: 0.1
      max: 10
    default: 1.0
    mapping:
      kind: log
      base: 10
    role: independent
    commandClass: setup-change

  - id: inputEnergy
    label: "External energy input Ein"
    accessibleName: "Energy supplied from outside into the enclosure"
    accessibleDescription: "Non-negative energy entering the system (e.g. electrical work through leads)."
    quantityId: inputEnergy
    displayUnit: "J"
    modelDomain:
      min: 0
      max: 1.0e28
      minInclusive: true
      maxInclusive: true
      reason: "Input energy cannot be negative."
    visualRange:
      min: 0
      max: 10
    default: 0.0
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change

  - id: cardId
    label: "Energy-source card"
    accessibleName: "Cited empirical energy-source case study"
    accessibleDescription: "Selects one of five cited real-world energy-loss examples or ideal sealed-box scenarios."
    quantityId: energySourceCard
    displayUnit: ""
    modelDomain:
      enumerated:
        - me-03-card-radium
        - me-03-card-sun
        - me-03-card-coal
        - me-03-card-candle
        - me-03-card-bulb
        - me-03-heated-sealed-box
        - me-03-sealed-lamp-and-mirror
      reason: "Seven cited card case studies."
    visualRange:
      min: 0
      max: 6
    default: "me-03-card-radium"
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change

  - id: mode
    label: "Formalism mode"
    accessibleName: "1905 energy accounting ledger or modern four-momentum invariant mass"
    accessibleDescription: "Selects 1905 paper 4 ledger mode or modern four-momentum invariant mass representation."
    quantityId: formalismMode
    displayUnit: ""
    modelDomain:
      enumerated:
        - "1905"
        - four-momentum
      reason: "Historical 1905 ledger versus modern four-momentum formalism."
    visualRange:
      min: 0
      max: 1
    default: "1905"
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change

  - id: pulseSystem
    label: "Pulse system geometry"
    accessibleName: "Geometry of pulse system for invariant mass computation"
    accessibleDescription: "Single pulse, two collinear pulses, or two opposite pulses."
    quantityId: pulseSystem
    displayUnit: ""
    modelDomain:
      enumerated:
        - single-pulse
        - two-collinear
        - two-opposite
      reason: "Three canonical radiation geometries."
    visualRange:
      min: 0
      max: 2
    default: "two-opposite"
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change

  - id: notation
    label: "Notation style"
    accessibleName: "1905 printed notation or modern notation"
    accessibleDescription: "Renders formulas in historical printed style or modern symbols."
    quantityId: notation
    displayUnit: ""
    modelDomain:
      enumerated:
        - printed
        - modern
      reason: "Notation representation switch."
    visualRange:
      min: 0
      max: 1
    default: "printed"
    mapping:
      kind: linear
    role: independent
    commandClass: presentation-change

derivedOutputs:
  - id: energyChange
    label: "Energy change ΔE"
    quantityId: energyChange
    unit: "J"
    displayUnit: "J"
    semanticKind: "energy-change"
    ownerId: "massEnergy.boundaryLedger"
    statuses:
      - value
      - outside-domain

  - id: massChange
    label: "Mass change Δm"
    quantityId: massChange
    unit: "kg"
    displayUnit: "kg"
    semanticKind: "mass-change"
    ownerId: "massEnergy.boundaryLedger"
    statuses:
      - value
      - not-applicable
      - outside-domain

  - id: radiationEnergyChange
    label: "Radiation energy ΔE_rad"
    quantityId: radiationEnergyChange
    unit: "J"
    displayUnit: "J"
    semanticKind: "radiation-energy-change"
    ownerId: "massEnergy.boundaryLedger"
    statuses:
      - value
      - outside-domain

  - id: radiationMassChange
    label: "Radiation mass Δm_rad"
    quantityId: radiationMassChange
    unit: "kg"
    displayUnit: "kg"
    semanticKind: "radiation-mass-change"
    ownerId: "massEnergy.boundaryLedger"
    statuses:
      - not-applicable
      - outside-domain

  - id: systemEnergyChange
    label: "Isolated system energy change"
    quantityId: systemEnergyChange
    unit: "J"
    displayUnit: "J"
    semanticKind: "system-energy-change"
    ownerId: "massEnergy.boundaryLedger"
    statuses:
      - value
      - outside-domain

  - id: systemMassChange
    label: "Isolated system mass change"
    quantityId: systemMassChange
    unit: "kg"
    displayUnit: "kg"
    semanticKind: "system-mass-change"
    ownerId: "massEnergy.boundaryLedger"
    statuses:
      - value
