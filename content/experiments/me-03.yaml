      expression: "E / c"
      value: 3.335641e-9
      unit: "kg·m/s"
      quantityId: pulseMomentum
    - label: Center-of-mass shift with light mass assigned
      expression: "0"
      value: 0
      unit: "m"
      quantityId: centerOfMassShift

views:
  - id: svg-boundary-ledger
    kind: svg
    consumes:
      - energyChange
      - massChange
      - systemEnergyChange
      - systemMassChange
  - id: table-boundary-ledger
    kind: table
    consumes:
      - energyChange
      - massChange
      - systemEnergyChange
      - systemMassChange
      - invariantMass
      - boxDisplacement
      - centerOfMassShift
      - recoilSpeed
      - pulseFlightTime
      - pulseMomentum
      - lightMassAssigned

actions:
  - actionId: select-system-boundary
    family: energy-accounting
    question: "When energy leaves a body, which system loses mass, and which does not?"
    inputs:
      - boundary
      - disposition
    commandClass: measurement-change
    acceptedResult:
      outputs:
        - energyChange
        - massChange
        - systemEnergyChange
        - systemMassChange
      allowedStatuses:
        - value
        - not-applicable
    visualAffordance: "Select system boundary and inspect energy crossing that boundary"
    equivalentAffordance: "Choose between evaluating the emitting body alone, the emitted radiation, or the combined isolated system."
    announcement: "System boundary updated; energy and mass changes recalculated"
  - actionId: toggle-box-light-mass
    family: energy-accounting
    question: "When a light pulse traverses a closed box, what happens to the center of mass if light has no mass?"
    inputs:
      - assignLightMass
    commandClass: setup-change
    acceptedResult:
      outputs:
        - centerOfMassShift
        - boxDisplacement
      allowedStatuses:
        - value
        - outside-domain
    visualAffordance: "Toggle mass assignment and inspect center-of-mass shift readout"
    equivalentAffordance: "Toggle light mass assignment to switch between stationary and shifting center of mass."
    announcement: "Light mass assignment updated"

presets:
  - presetId: me-03-sealed-lamp-and-mirror
    label: "Sealed lamp and mirror (Internal transfer)"
    description: "Combined isolated system where light is emitted and absorbed inside the enclosure; mass change is exactly 0."
    parameterValues:
      boundary: combined-isolated-system
      disposition: retained
      cardId: me-03-sealed-lamp-and-mirror
      mode: "1905"

  - presetId: me-03-heated-sealed-box
    label: "Heated sealed box (External energy input)"
    description: "Energy enters through leads while no matter crosses the sealed boundary; mass increases by Ein/c^2."
    parameterValues:
      boundary: combined-isolated-system
      disposition: retained
      inputEnergy: 1.0
      cardId: me-03-heated-sealed-box
      mode: "1905"

  - presetId: me-03-four-momentum-opposite-pulses
    label: "Four-momentum: Two opposite pulses"
    description: "Modern invariant mass of a system of two equal and opposite light pulses: m = L/c^2."
    parameterValues:
      mode: four-momentum
      pulseSystem: two-opposite
      emittedEnergy: 1.0

  - presetId: me-03-box-1906
    label: "1906 Photon-in-a-box thought experiment"
    description: "A light pulse traverses a closed box of length l and mass M. Poincaré (1900) and Einstein (1906) zero center-of-mass shift check."
    parameterValues:
      mode: box-1906
      boxMass: 1.0
      boxLength: 1.0
      pulseEnergy: 1.0
      assignLightMass: true
      magnification: 1.0e17

  - presetId: me-03-card-radium
