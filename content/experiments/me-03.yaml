  - id: assignLightMass
    label: "Assign inertia to radiation"
    accessibleName: "Whether the light pulse is assigned equivalent inertial mass m = E/c^2"
    accessibleDescription: "Toggling to false demonstrates the center-of-mass shift violation identified by Poincaré and Einstein."
    quantityId: lightMassAssigned
    displayUnit: ""
    modelDomain:
      enumerated:
        - 0
        - 1
      reason: "Binary toggle for radiation mass equivalence."
    visualRange:
