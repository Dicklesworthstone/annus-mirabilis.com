probes:
  - sr-03-probe-simultaneity
  - sr-03-probe-length-contraction
  - sr-03-probe-causal-order
weavePredicates:
  - sr03-s2-simultaneity-relativity
  - sr03-s4-rod-measurement
  - sr03-s4-sphere-ellipsoid
historicalOverlays: []
realRate:
  natural: false
embeddable: true
predictMode:
  enabled: true
  prompts:
    - promptId: sr-03-predict-endpoint-pair
      controlId: endpointPairId
      question: "At v = 0.6c, two events that mark the ends of a moving 10-ls rod are measured simultaneously in platform frame K (dt = 0, dx = 8 ls). What is their time separation dt' in the rod's rest frame k?"
      candidates:
        - id: earlier-trailing
          label: "Front end earlier (dt' < 0)"
          description: "The front end measurement occurs earlier than the rear end measurement in the rod frame."
          relation: "dt' = -gamma * v * dx / c^2"
          separatingAssumption: "Relativity of simultaneity: dt' = -gamma * v * dx / c^2 = -6.0 s."
        - id: still-simultaneous
          label: "Simultaneous in both frames (dt' = 0)"
          description: "Events simultaneous in one frame must be simultaneous in all frames."
          relation: "dt' = dt = 0"
          separatingAssumption: "Classical absolute time assumption."
        - id: later-trailing
          label: "Front end later (dt' > 0)"
          description: "The front end measurement occurs later than the rear end measurement in k."
          relation: "dt' > 0"
          separatingAssumption: "Reversed sign for Lorentz coordinate boost."
    - promptId: sr-03-predict-causal-order
      controlId: v
      question: "If two events have a timelike separation (s^2 < 0, so a subluminal signal could connect them), what happens to their time order when viewed from a frame moving at 0.95c?"
      candidates:
        - id: order-preserved
          label: "Order is invariant"
          description: "Every inertial frame agrees which event occurred first."
          relation: "sgn(dt') = sgn(dt)"
          separatingAssumption: "Lorentz invariance of timelike causal order."
        - id: order-reverses
          label: "Time order reverses"
          description: "At sufficiently high relative speed, the time order reverses."
          relation: "sgn(dt') = -sgn(dt)"
          separatingAssumption: "Confusing spacelike order dependence with timelike order invariance."
        - id: becomes-simultaneous
          label: "Becomes simultaneous"
          description: "There exists an inertial frame where the two events occur at the same time."
          relation: "dt' = 0"
          separatingAssumption: "Assuming simultaneity is reachable for timelike intervals."
acceptanceCases:
  - sr03-signature-0.6c
defaultScenario: sr03-signature-0.6c
tapeModel:
  modelId: sr-03
  modelVersion: 1
