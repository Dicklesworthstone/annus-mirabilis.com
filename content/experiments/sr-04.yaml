# SR-04 instrument manifest (am-sr-04-lorentz-map-px1k).
#
# Scope note (WildCrane, 2026-09-16): built against the real kinematics owner
# (src/physics/reference/kinematics.ts + kinematics/constraints.ts, am-ref-kinematics-tjq),
# which supplies the construction-constraint engine (solveCandidateFamily, checkCandidateMap).
# The sr-04:1904 mode now exposes only galileanVelocity through a guarded historical adapter,
# with symbolic light-speed fractions, typed settings and a complete static worked example.
# Its settings links reject other modes and never enable later construction controls.
# See BATCH_PENDING
# for the full list of what else is deferred (derivation-chain step rendering, the
# ExpressionActionPicker/CoefficientEditor primitives, predict mode, show-the-code, tapes,
# permalink, weave, captions R0-R3).
id: sr-04
title: "SR-04: Construct the Lorentz Map"
explanatoryQuestion: "What map between two inertial frames keeps both postulates, and what does each requirement decide?"
sourceRefs:
  - paper: special-relativity
    id: s3
argumentIds:
  - arg-sr-lorentz-map
  - arg-sr-transverse-and-inverse
schemaVersion: 1
parameters:
  - id: vOverC
    label: "Frame speed"
    accessibleName: "Relative speed of the primed frame, as a fraction of light speed"
    accessibleDescription: "Sets v/c for the light-ray tests, the transverse ray, and the constructed map"
    quantityId: frameSpeed
    displayUnit: "c"
    modelDomain:
      min: -1
      max: 1
      minInclusive: false
      maxInclusive: false
      reason: "No inertial observer at |v| >= c"
    numericalDomain:
      min: -0.95
      max: 0.95
      minInclusive: true
      maxInclusive: true
    visualRange:
      min: -0.95
      max: 0.95
    default: 0.6
    mapping:
      kind: linear
    role: independent
    commandClass: observer-change
  - id: observerSpeed
    label: "Slow-case observer speed"
    accessibleName: "Observer speed for the slow-object demonstration"
    accessibleDescription: "The ordinary-mechanics observer speed, in meters per second"
    quantityId: velocityInMovingFrame
    displayUnit: "m/s"
    modelDomain:
      min: -1e4
      max: 1e4
      minInclusive: true
      maxInclusive: true
      reason: "The slow case needs a slow observer; faster composition belongs to the velocity-composition laboratory"
    visualRange:
      min: -100
      max: 100
    default: 30
    mapping:
      kind: linear
    role: independent
    commandClass: measurement-change
  - id: objectSpeed
    label: "Slow-case object speed"
    accessibleName: "Object speed for the slow-object demonstration"
    accessibleDescription: "The ordinary-mechanics object speed, in meters per second"
    quantityId: velocityInMovingFrame
    displayUnit: "m/s"
    modelDomain:
      min: -1e4
      max: 1e4
      minInclusive: true
      maxInclusive: true
      reason: "The slow case needs a slow observer; faster composition belongs to the velocity-composition laboratory"
    visualRange:
      min: -100
      max: 100
    default: 10
    mapping:
      kind: linear
    role: independent
    commandClass: measurement-change
  - id: candidateA
    label: "Candidate coefficient a"
    accessibleName: "Longitudinal scale coefficient of the hand-built candidate map"
    accessibleDescription: "The x-scale coefficient a(v) of a candidate the reader is testing"
    quantityId: coordinatePositionMoving
    displayUnit: ""
    modelDomain:
      reason: "Any finite real; the candidate map is not the world"
    visualRange:
      min: -3
      max: 3
    default: 1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: candidateB
    label: "Candidate coefficient b"
    accessibleName: "Time-scale coefficient of the hand-built candidate map"
    accessibleDescription: "The t-scale coefficient b(v) of a candidate the reader is testing"
    quantityId: coordinateTimeMoving
    displayUnit: ""
    modelDomain:
      reason: "Any finite real; the candidate map is not the world"
    visualRange:
      min: -3
      max: 3
    default: 1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: candidateD
    label: "Candidate coefficient d"
    accessibleName: "Position-dependence coefficient of the candidate's time map"
    accessibleDescription: "The x-dependence coefficient d(v) of a candidate the reader is testing, in s/m"
    quantityId: coordinateTimeMoving
    displayUnit: "s/m"
    modelDomain:
      reason: "Any finite real; the candidate map is not the world"
    visualRange:
      min: -1e-8
      max: 1e-8
    default: 0
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: candidateTransverseScale
    label: "Candidate transverse scale"
    accessibleName: "Transverse coefficient of the hand-built candidate map"
    accessibleDescription: "The y and z scale coefficient of a candidate the reader is testing"
    quantityId: coordinatePositionMoving
    displayUnit: ""
    modelDomain:
      reason: "Any finite real; the candidate map is not the world"
    visualRange:
      min: -2
      max: 2
    default: 1
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
outputs:
  - id: slowCaseGalilean
    quantityId: velocityInMovingFrame
    allowedStatuses:
      - value
    primary: true
  - id: rightRayFraction
    quantityId: frameSpeed
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: leftRayFraction
    quantityId: frameSpeed
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: lorentzFactor
    quantityId: lorentzFactor
    allowedStatuses:
      - value
      - outside-domain
    primary: false
  - id: rapidity
    quantityId: rapidity
    allowedStatuses:
      - value
      - outside-domain
    primary: false
assumptions:
  - "Homogeneous space and time, uniform relative motion, inertial coordinates (linearity follows from these, not assumed with no argument)"
  - "Two inertial frames in standard configuration: origins coincide at t = t' = 0, relative motion along x"
  - "Both postulates (relativity, and one light speed for every inertial observer) are the constraints the map must satisfy; neither the Lorentz factor nor the Minkowski interval is assumed to derive it"
admittedDomain: "Two inertial frames related by a linear map, relative speed strictly below c."
notModeled:
  - "Non-aligned axes and rotations"
  - "Accelerated frames"
  - "Gravity"
  - "A fully rigorous derivation of linearity"
  - "Origins that do not coincide"
  - "Non-collinear composition (the velocity-composition laboratory)"
