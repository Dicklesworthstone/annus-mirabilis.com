    digestKind: host
    checkpointVersion: 1
    streamSemanticsVersion: 1
    seed: "0"
    streamPositions: []
    label: "Equal waves half a cycle apart"
    teachingNote: "A half-cycle phase shift reverses one field at the centre. Equal opposite fields cancel there, so the centre is dark. Look across the screen: interference redistributes intensity into bright and dark fringes; a dark point does not mean that energy has vanished."
    expectedDisplayValues:
      - label: "Centre intensity"
        outputId: centerIntensity
        value: 0
        unit: "1"
        constantSetId: modern-si-2019
      - label: "Fringe visibility"
        outputId: fringeVisibility
        value: 1
        unit: "1"
        constantSetId: modern-si-2019
  - actionIndex: 2
    stepIndex: 0
    simulatedTime: 0
    digest: "host:128ef223f2da4784"
    digestKind: host
    checkpointVersion: 1
    streamSemanticsVersion: 1
    seed: "0"
    streamPositions: []
    label: "Unequal waves cannot cancel completely"
    teachingNote: "Keep the half-cycle shift but halve the second field's amplitude. The remaining centre field has amplitude 1 − 0.5, giving intensity (1 − 0.5)² = 0.25. The fringe visibility falls to 0.8: unequal waves cannot cancel completely."
    expectedDisplayValues:
      - label: "Centre intensity"
        outputId: centerIntensity
        value: 0.25
        unit: "1"
        constantSetId: modern-si-2019
      - label: "Fringe visibility"
        outputId: fringeVisibility
        value: 0.8
        unit: "1"
        constantSetId: modern-si-2019
