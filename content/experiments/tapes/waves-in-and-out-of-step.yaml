    label: "Equal waves in step"
    teachingNote: "At the centre the two fields add to twice one field, so their time-averaged intensity is four times that of one wave alone. These intensities use a single wave of amplitude 1 as the unit. This continuous-field model shows a successful wave description; it makes no claim about how energy is emitted or absorbed."
    expectedDisplayValues:
      - label: "Centre intensity"
        outputId: centerIntensity
        value: 4
        unit: "1"
        constantSetId: modern-si-2019
      - label: "Fringe visibility"
        outputId: fringeVisibility
        value: 1
        unit: "1"
        constantSetId: modern-si-2019
  - actionIndex: 1
