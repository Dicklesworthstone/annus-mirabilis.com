    label: "The body and its radiation together"
    teachingNote: "Expand the boundary to include both the body and its radiation. The loss of 2 J by the body and the gain of 2 J by the radiation cancel. No energy enters or leaves the isolated enclosure, so its total energy and mass are unchanged."
