tapeId: stokes-rule-energy-budget
instrumentId: lq-07
title: "Stokes's Rule as an Energy Budget"
description: "Walkthrough of Einstein's 1905 §7 energy accounting for fluorescence emission and its deviation cases."
checkpoints:
  - id: step-1-incident
    title: "1. Incident Light Quantum"
    parameters:
      nu1: 850
      nu2: 850
      regime: standard-stokes
      multiQuantumK: 1
      absorbedPowerMicrowatts: 1.0
      quantumYield: 0.5
      channels: light-plus-heat
    caption: "Exciting UV light at nu1 = 850 THz supplies quanta of energy h*nu1 = 3.515 eV."
  - id: step-2-anti-stokes-disallowed
    title: "2. Anti-Stokes Disallowance"
    parameters:
      nu1: 850
      nu2: 900
      regime: standard-stokes
      multiQuantumK: 1
      absorbedPowerMicrowatts: 1.0
      quantumYield: 0.5
      channels: light-plus-heat
    caption: "Emitting at nu2 = 900 THz requires 3.722 eV, exceeding the absorbed quantum by 0.207 eV and is disallowed under single-quantum Stokes assumptions."
  - id: step-3-deviation-case-1
    title: "3. Deviation Case 1: Multi-Quantum Absorption"
    parameters:
      nu1: 850
      nu2: 900
      regime: deviation-multi-quantum
      multiQuantumK: 2
      absorbedPowerMicrowatts: 1.0
      quantumYield: 0.5
      channels: light-plus-heat
    caption: "If k = 2 quanta are absorbed per process, 7.031 eV is available, raising nu2,max to 1700 THz and allowing 900 THz emission."
  - id: step-4-weak-illumination
    title: "4. Weak-Illumination Linearity"
    parameters:
      nu1: 850
      nu2: 750
      regime: standard-stokes
      multiQuantumK: 1
      absorbedPowerMicrowatts: 0.000001
      quantumYield: 0.5
      channels: light-plus-heat
    caption: "Even at extreme low power (10^-12 W), emission is strictly proportional to absorbed power with no threshold."
