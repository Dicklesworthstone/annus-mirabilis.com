# Coin to bell: six checkpoints recorded through BM-05's real worker session.
# The first four observe one fixed coin trial; kernel changes retain the seed and variance
# for a common-random-numbers comparison. Gaussian draws use the pinned FrankenSim engine.
# Each SHA-256 digest binds every position in every walk, including unplotted steps, to the
# exact source, draw engine and stream allocation, plus the accepted scientific outputs.
# Execution cache counters are excluded. Restore verifies both isolated and live publications.
# Stream-position ranges are lossless: one registered Philox tile per walker, 0 through 1999.
