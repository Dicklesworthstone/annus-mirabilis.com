# A worked sequence through the actual LQ-05 controls: four independent points,
# ten independent points, then the same ten points locked to one shared position.
# Checkpoints bind the complete accepted settings; analytic probabilities come from the
# selected owner. The seeded placement sample is a synthetic illustration, not evidence.
tapeVersion: 2
tapeId: the-locked-positions
experimentId: lq-05
mode: "lq-05:default"
modelIdentity:
  modelId: lq05-independent-configurations-v1
  modelVersion: "1"
  artifactDigest: "host:sha256:a66038a871d5294289aa767721f4ada79be149a69125061732f4a53f8eae2529"
constantSetId: modern-si-2019
seed: "12345"
streamVersion: 1
allocationId: deterministic
initialConditions:
  n: 4
  f: 0.5
  view: "enumeration"
  locked: "false"
  seed: "12345"
  trials: 10000
events:
  - kind: prediction
    actionIndex: 1
    instrumentId: lq-05
    promptId: lq-05-predict-ten-points
    payload:
      form: candidate
      candidateId: lq-05-predict-ten-points-one-in-a-thousand
  - kind: control
    actionIndex: 2
    commandClass: setup-change
    commandId: set-ten-points
    parameterId: n
    value: 10
  - kind: control
    actionIndex: 3
    commandClass: setup-change
    commandId: lock-ten-points
    parameterId: locked
    value: "true"
checkpoints:
  - actionIndex: 0
    stepIndex: 1
    simulatedTime: 1
    digest: "host:0ccc309961571381"
    digestKind: host
    checkpointVersion: 1
    streamSemanticsVersion: 1
    seed: "12345"
    streamPositions: []
    label: "Four independent points in half a volume"
    teachingNote: "Each point makes its own choice. All four lie in the left half in one of 16 equally likely arrangements."
    expectedDisplayValues:
      - label: "W (four independent)"
        value: 0.0625
        outputId: configurationProbability
        unit: "1"
        constantSetId: modern-si-2019
  - actionIndex: 2
    stepIndex: 1
    simulatedTime: 1
    digest: "host:3e4c65a9eb19bf14"
    digestKind: host
    checkpointVersion: 1
    streamSemanticsVersion: 1
    seed: "12345"
    streamPositions: []
    label: "Ten independent points in half a volume"
    teachingNote: "Changing only the count to ten gives one chance in 1024. The points still choose independently."
    expectedDisplayValues:
      - label: "W (independent)"
        value: 0.0009765625
        outputId: configurationProbability
        unit: "1"
        constantSetId: modern-si-2019
  - actionIndex: 3
    stepIndex: 1
    simulatedTime: 1
    digest: "host:65f5a9dc5f10bdd8"
    digestKind: host
    checkpointVersion: 1
    streamSemanticsVersion: 1
    seed: "12345"
    streamPositions: []
    label: "The same ten points locked to one position"
    teachingNote: "Keep the count and volume fraction fixed, but switch on the lock. One shared placement decides all ten points, so the chance is one in two. Independence, not the number of labels, produced the earlier power."
    expectedDisplayValues:
      - label: "W (locked)"
        value: 0.5
        outputId: configurationProbability
        unit: "1"
        constantSetId: modern-si-2019
      - label: "Expected placements for one success"
        value: 2
        outputId: expectedTrialsToOne
        unit: "1"
        constantSetId: modern-si-2019
title: "The locked positions"
description: "Compare four independent points, ten independent points, and the same ten points locked to one shared position. The probability is (V/V0)^n only when the points are independent; the locked group gives V/V0."
isTeachingSequence: true
