    seed: "1905"
    streamPositions: []
    label: "Noisy, exposure-blurred camera observations"
    teachingNote: "Camera noise adds 2*sigma^2 variance and negative lag-1 covariance, and the two do not cancel: at these settings the exposure blur takes 7.157e-14 m2/s off the estimate while the localization noise puts 4e-14 back, so the naive estimator reads 3.9787e-13 where the true D is 4.2944e-13, 7.3 per cent low. Reading the naive number as D is the mistake this instrument exists to show."
    expectedDisplayValues:
      - label: "naive expectation"
        value: 3.9786666666666666e-13
        unit: "m2/s"
        constantSetId: modern-si-2019
