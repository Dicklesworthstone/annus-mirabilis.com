# Teaching tape "Camera noise and exposure bias" (am-bm-08-measurement-bias-h1ye).
#
# THE RECORDED NAIVE EXPECTATION WAS THE INPUT D (0.42944e-12), corrected 2026-09-28 to what
# BM-08's own evaluator gives at these settings. cameraMoments in
# src/physics/reference/inference/observation.ts computes
#   variance = 2 D (dt - exposure/3) + 2 sigma^2,  naiveExpectation = variance / (2 dt)
# which at D = 4.2944e-13, dt = 1, exposure = 0.5, sigma = 2e-7 is 3.9786666666666666e-13. The old
# value said the naive estimator recovers D exactly, which is the opposite of what this instrument
# is for. src/content/tapeNumbers.test.ts recomputes it.
