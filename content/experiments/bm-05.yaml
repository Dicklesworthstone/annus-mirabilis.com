    label: "Step distribution"
    accessibleName: "Per-step random distribution"
    accessibleDescription: "Which symmetric, finite-variance step law each walker draws from"
    quantityId: stepDistribution
    displayUnit: ""
    modelDomain:
      enumerated: ["coin", "uniform", "gaussian"]
      reason: "Symmetric, finite-variance step laws with a registered export kernel (src/physics/reference/diffusion/walkLaws.ts)"
    visualRange:
      min: 0
      max: 1
    default: "coin"
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: stepRms
    label: "Per-step RMS"
    accessibleName: "Root-mean-square size of one step"
    accessibleDescription: "Sets the step scale in micrometers"
    quantityId: stepRms
    displayUnit: "um"
    modelDomain:
      min: 1e-9
      max: 1e-3
      minInclusive: true
      maxInclusive: true
      reason: "The step sizes the lab draws, a nanometre up to a millimetre (src/experiments/bm05/parameters.ts)"
    visualRange:
      min: 1e-8
      max: 5e-6
    default: 5e-7
    mapping:
      kind: log
      base: 10
    role: independent
    commandClass: setup-change
  - id: tau
    label: "Interval between steps"
    accessibleName: "Time interval between successive steps"
    accessibleDescription: "Sets the step interval in seconds"
    quantityId: stepInterval
    displayUnit: "s"
    modelDomain:
      min: 1e-6
      max: 1e4
      minInclusive: true
      maxInclusive: true
      reason: "The intervals between steps the lab offers, a microsecond up to ten thousand seconds (src/experiments/bm05/parameters.ts)"
    visualRange:
      min: 0.001
      max: 10
    default: 0.1
    mapping:
      kind: log
      base: 10
    role: independent
    commandClass: setup-change
  - id: n
    label: "Steps shown"
    accessibleName: "Number of steps advanced so far"
    accessibleDescription: "How far into the recorded run the displayed statistics are read"
    quantityId: stepsShown
    displayUnit: "steps"
    modelDomain:
      min: 0
      max: 10000
      minInclusive: true
      maxInclusive: true
      reason: "Must not exceed the recorded run length runSteps (src/experiments/bm05/parameters.ts)"
    visualRange:
      min: 0
      max: 400
    default: 4
    mapping:
      kind: linear
    role: independent
    commandClass: measurement-change
  - id: walkers
    label: "Walkers"
    accessibleName: "Number of independent walkers"
    accessibleDescription: "Integer count of independent walkers in the ensemble"
    quantityId: walkerCount
    displayUnit: "walkers"
    modelDomain:
      min: 1
      max: 10000
      minInclusive: true
      maxInclusive: true
      reason: "What the lab runs quickly enough in a browser (src/experiments/bm05/parameters.ts)"
    visualRange:
      min: 1
      max: 10000
    default: 2000
    mapping:
      kind: log
      base: 10
    role: independent
    commandClass: setup-change
  - id: runSteps
    label: "Recorded steps per walker"
    accessibleName: "Total recorded run length"
    accessibleDescription: "How many steps are recorded before the run stops, in steps"
    quantityId: runLength
    displayUnit: "steps"
    modelDomain:
      min: 1
      max: 10000
      minInclusive: true
      maxInclusive: true
      reason: "What the lab runs quickly enough in a browser (src/experiments/bm05/parameters.ts)"
    visualRange:
      min: 1
      max: 400
    default: 400
    mapping:
      kind: log
      base: 10
    role: independent
    commandClass: setup-change
  - id: seed
    label: "Seed"
    accessibleName: "Random stream seed"
    accessibleDescription: "64-bit decimal seed identifying this run's random draws"
    quantityId: streamSeed
    displayUnit: ""
    modelDomain:
      enumerated: []
      reason: "Any canonical unsigned 64-bit decimal string; recorded, never guessed."
    visualRange:
      min: 0
      max: 1
    default: "1905"
    mapping:
      kind: linear
    role: independent
    commandClass: setup-change
  - id: bias
    label: "Asymmetric-deviation bias"
    accessibleName: "Biased-coin probability for the labeled asymmetric teaching deviation"
    accessibleDescription: "Probability of the positive step, used only by the analytic asymmetric-kernel deviation, never by the pure-diffusion model"
    quantityId: biasedStepProbability
    displayUnit: ""
    modelDomain:
      min: 0
      max: 1
      minInclusive: true
      maxInclusive: true
      reason: "A probability (src/experiments/bm05/parameters.ts)"
    visualRange:
      min: 0.5
      max: 1
    default: 0.6
    mapping:
      kind: linear
    role: independent
    commandClass: estimator-change
