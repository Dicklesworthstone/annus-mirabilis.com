actions:
  - actionId: bm-05-select-kernel
    family: probability-diffusion
    question: "At the same per-step variance, does switching the step distribution change the long-run histogram?"
    inputs:
      - kernel
    commandClass: setup-change
    acceptedResult:
      outputs:
        - histogramCounts
        - kolmogorovDistance
      allowedStatuses:
        - value
        - not-applicable
    visualAffordance: "Histogram and Gaussian overlay redraw for the chosen step distribution"
    equivalentAffordance: "Choose a step distribution from a list and read the bin counts in a table"
    announcement: "Step distribution changed; histogram updated"
  - actionId: bm-05-advance-steps
    family: probability-diffusion
    question: "As more steps accumulate, does the sampled histogram converge to the Gaussian of the same variance?"
    inputs:
      - n
    commandClass: measurement-change
    acceptedResult:
      outputs:
        - kolmogorovDistance
        - shapeTerm
      allowedStatuses:
        - value
        - not-applicable
    visualAffordance: "Step counter and convergence distance update for the chosen step count"
    equivalentAffordance: "Type or step through a step count and read the convergence distance and its bound in a table"
    announcement: "Steps shown updated"
  - actionId: bm-05-read-teaching-deviations
    family: probability-diffusion
    question: "What happens to the diffusion coefficient when the step law has a nonzero mean, infinite variance, or a badly taken continuum limit?"
    inputs:
      - bias
    commandClass: estimator-change
    acceptedResult:
      outputs:
        - biasedDrift
        - biasedCenteredDiffusion
        - biasedDiffusion
        - cauchyDiffusion
        - continuumLimit
      allowedStatuses:
        - value
        - outside-domain
    visualAffordance: "Labeled analytic values and refusal explanations appear beside the moments table"
    equivalentAffordance: "Read each teaching deviation's labeled value or refusal explanation in the accessible text"
    announcement: "Teaching deviation values available"
