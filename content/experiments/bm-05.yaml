assumptions:
  - "Independent steps, a symmetric finite-variance kernel, an unbounded line"
  - "No memory between steps and no drift in the pure-diffusion model"
  - "Fixed jumps are a mathematical device, not a claim about what a liquid does to a tracer"
admittedDomain: "Any symmetric, finite-variance, independent step law on an unbounded line, at a fixed step interval; the labeled asymmetric, heavy-tailed, and shrinking-interval deviations are explicitly outside this domain and computed analytically, never simulated."
notModeled:
  - "Collision mechanics"
  - "Correlated or remembered steps"
  - "Drift, except the labeled analytic asymmetric-kernel deviation"
  - "Boundaries"
  - "The ballistic regime"
  - "Heavy-tailed Levy flights (refused)"
  - "Interactions between walkers"
  - "Sampled biased or heavy-tailed walks (no registered upstream kernel exists for them)"
