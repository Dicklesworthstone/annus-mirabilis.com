# BM-05 instrument manifest (am-bm-05-random-steps-ntzl).
#
# Scope note (RubyTiger, 2026-09-17): this manifest is being built where none existed. The
# runtime (src/experiments/bm05/*, src/workers/operations/bm05.ts, src/app/lab/bm-05/*) was
# already substantially built and tested by a peer lane (PlumHawk) before this pass -- 13
# pre-existing tests, plus the kernel-id resolution test, the coin-to-bell teaching tape, and
# the bm05-s4-second-moment weave predicate PlumHawk added this cycle. This manifest reuses
# that runtime's own parameter ids, domains, defaults, output ids, predict prompt, teaching
# tape, and weave predicate verbatim (checked field-for-field by
# src/testing/bm05Manifest.test.ts), rather than restating a second, possibly-drifted copy.
#
# Deferred, not attempted in this change (a much larger lift, same scoping call PlumHawk made
# for this bead's runtime pass and WildCrane made for BM-01's manifest):
#   - The R0-R3 caption texts and content/editorial/readings-owners/am-bm-05-random-steps-ntzl.yaml.
#     The bead requires the readings-owners file to be added in the SAME change as real caption
#     text, never as an empty placeholder, so it is not started here. This is real editorial
#     writing across the histogram/overlay, sample-paths, moments-table, and step-counter
#     captions, the model-note headline, four typed-label summaries, and every preset/tape
#     description -- on the order of dozens of authored texts, not a mechanical transcription.
#   - predictMode's runtime wiring (am-inst-predict-mode-ti7m is still open); this manifest
#     declares the registered prompt bm-05-predict-step-shape so the shape exists to wire to.
#   - End-to-end tape replay through BM-05's session (am-inst-permalink-tape-s677 not built);
#     the coin-to-bell tape is schema-valid only (src/testing/bm05Tape.test.ts), per PlumHawk's
#     own note in content/experiments/tapes/coin-to-bell.yaml.
#   - Real §4 sentence ids for the weave predicate's targets (am-edn-inventory-brownian-slg
#     hasn't frozen them yet); the placeholder id "s4-second-moment" is reused verbatim from
#     src/experiments/bm05/definition.ts's BM05_WEAVE_PREDICATES, not invented here.
#
# outputs[].quantityId reuses each output's own BM05_OUTPUTS key as its quantity id (for example
# "stepSecondMoment", "kolmogorovDistance"), the same convention the bead's own prose uses for
# identifierBindings ("stepRms" bound to itself). A number of these do not yet have a separate
# entry in a canonical quantity registry (am-not-quantity-registry-2f7 is still open; see
# docs/FRANKENSIM_BINDING.md's own note that "walkStepCoordinate1d" has no existing id to bind
# to). "diffusionCoefficient" is the one exception, reusing BM-01's own registered quantity id
# for the same physical concept.
#
# acceptanceCases must be non-empty because several declared outputs allow a non-"value" status
# (kolmogorovDistance, shapeTerm, sumKurtosis, agreementBound, withinBound: "not-applicable" at
# n = 0, a point mass rather than a finite-width Gaussian comparison, exactly the "typed status,
# not a rendering accident" pattern; biasedDiffusion, cauchyDiffusion, continuumLimit:
# "outside-domain" for a nonzero-mean, infinite-variance, or ill-posed limiting request).
# content/scenarios/bm-05-gaussian-step-diffusivity.yaml is a real, value-only regression fixture
# (proving D = stepRms^2/(2*tau) = 1.25 um^2/s at BM-05's own defaults, the bead's own stated
# number) added in this same change, registered as diffusion.walkKernelDiffusivity in
# src/testing/scenario-registry/owners.ts. It cannot itself prove the non-"value" statuses:
# Scenario.expected.status exists in the schema (src/content/schemas/experiment.ts) but
# src/testing/scenario-registry/run.ts never reads it -- a real, pre-existing gap in that
# runner, not something this pass fabricates around. Those statuses are already proven directly
# against kernelDiffusivity/continuumLimit/coinWalkDistribution by
# src/testing/walkLaws.test.mjs's "analytical deviations distinguish drift, infinite variance,
# and the wrong continuum limit", which this manifest's tests cite rather than duplicate.
id: bm-05
title: "BM-05: Random Steps to Diffusion"
explanatoryQuestion: "How do many small independent random steps produce a deterministic spreading law, and what part of the step distribution sets the rate?"
sourceRefs:
  - paper: brownian-motion
    id: s4
  - paper: brownian-motion
    id: s5
argumentIds:
  - arg-bm-independent-steps
  - arg-bm-variance-of-sum
  - arg-bm-gaussian
  - arg-bm-diffusion-equation
schemaVersion: 1
parameters:
