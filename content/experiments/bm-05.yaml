realRate:
  natural: false
embeddable: true
predictMode:
  enabled: true
  prompts:
    - promptId: bm-05-predict-step-shape
      supportedCandidateId: same-bell-shape
      controlId: kernel
      question: "After many steps, what will changing the step law while keeping its variance do?"
      explanation: "After enough independent steps, the sum of zero-mean, finite-variance steps approaches a Gaussian whose spread depends only on the number of steps and the per-step variance, not on the step law's shape. To see it, inspect four steps, then compare the laws at 400 steps with the step RMS and interval unchanged, using both the mean square and the shape gap: a similar-looking histogram alone does not decide the question."
      candidates:
        - id: two-separate-piles
          label: "Keep two separate piles"
          description: "The two step laws never converge; the walk's spread keeps a visible trace of which law produced it."
          separatingAssumption: "That would hold if the two step laws produced genuinely different limiting distributions: a bias, or a variance that never settles. Coin, uniform, and Gaussian steps here are all zero-mean with the same finite variance, and the central limit theorem says any such step law converges to the same Gaussian after enough independent steps, so the two piles must merge rather than stay apart."
        - id: same-bell-shape
          label: "Approach the same bell shape and spread"
          description: "Both step laws converge to the same Gaussian, because only the per-step variance controls the limit."
          separatingAssumption: "This is what the central limit theorem guarantees for any zero-mean, finite-variance step law: after enough independent steps, the sum's distribution converges to a Gaussian whose spread depends only on the number of steps and the per-step variance, never on the step law's shape."
        - id: wider-bell
          label: "Make a wider bell despite the same variance"
          description: "The resulting spread is wider than the coin-step case even though the per-step variance matches."
          separatingAssumption: "That would hold if the resulting spread depended on some property of the step law beyond its variance, such as a heavier tail inflating the typical size. Holding the variance fixed already fixes the limiting Gaussian's width; a different step shape with the same variance converges to the identical spread, not a wider one."
