# no dedicated field for a per-distribution export-kernel-id map, but the bead requires one:
# "The manifest records the export kernel id for each distribution and the audit record's
# version, and a test fails if they disagree with docs/FRANKENSIM_BINDING.md." These three
# numbers and the pinned revision are checked against WALK_KERNELS and the binding doc by
# src/testing/bm05Manifest.test.ts.
provenance:
  exportKernelIds:
    coin: 0
    uniform: 1
    gaussian: 3
  frankenSimBindingRevision: "5bbbfae6f7de614422f6f97f5798a3e00f8ad813"
  frankenSimBindingDecision: "distinct-meaning"
