{"schemaVersion":1,"kind":"missing-step-chain","review":"draft","paper":"brownian-motion","argument":"arg-bm-independent-steps","title":"Why the mean square is tractable","routeLabel":"Pedagogical bridge, not the paper’s printed calculation","sourceLink":"/papers/brownian-motion/s4/#arg-bm-diffusion-equation","sourceLabel":"Compare the paper’s step-distribution route (explanation preview)","sourceNotice":"This is newly authored explanatory prose, not the German text or a translation. The two-step calculation below illustrates the pairwise argument for any finite number of steps.","premiseNotice":"Treat increments over the chosen intervals as independent, centred, and having the same finite second moment. In a Brownian model this is a coarse-grained assumption, not a claim about arbitrarily short times.","generalization":"For n steps, expand the square of their sum. There are n individual squared terms and cross terms for distinct pairs. Every cross average vanishes under independence and zero mean; equal step mean squares then give n times the one-step mean square. With t = nτ and D defined as the one-step mean square divided by 2τ, the result is 2Dt.","absoluteNote":"The mean absolute displacement is not a wrong answer. It also measures spreading, but absolute value does not distribute over addition, so it lacks this simple additive calculation. Neither absolute displacement nor RMS displacement is total path length.","modernNote":"Modern lens: inertia introduces a short-time regime in which successive motions need not be independent. Momentum relaxation time is a later dynamical interpretation, not a premise used in this teaching derivation.","premises":[{"id":"premise-independent-displacements","argument":"arg-bm-independent-steps","text":"The increments A and B are independent."},{"id":"premise-zero-mean-displacements","argument":"arg-bm-independent-steps","text":"Each increment has mean zero."},{"id":"premise-equal-second-moments","argument":"arg-bm-independent-steps","text":"Each increment has the same finite mean square, called l² in this worked bridge."}],"chain":{"id":"chain-bm-variance-of-sum","proofRouteId":"route-bm-variance-of-sum","routeKind":"pedagogical-reconstruction","target":"mean-square-additivity","entryAssumptions":[{"ref":"premise-independent-displacements","edgeType":"pedagogical-reconstruction"},{"ref":"premise-zero-mean-displacements","edgeType":"pedagogical-reconstruction"},{"ref":"premise-equal-second-moments","edgeType":"pedagogical-reconstruction"}],"steps":[{"id":"bm-variance-expand","tool":"foundation:probability-independence","from":{"kind":"average","argument":{"kind":"power","base":{"kind":"sum","args":[{"kind":"symbol","termId":"A","quantityId":"stepA"},{"kind":"symbol","termId":"B","quantityId":"stepB"}]},"exponent":{"num":2,"den":1}},"opId":"totalMeanSquare"},"to":{"kind":"average","argument":{"kind":"sum","args":[{"kind":"power","base":{"kind":"symbol","termId":"A","quantityId":"stepA"},"exponent":{"num":2,"den":1}},{"kind":"product","args":[{"kind":"number","value":"2"},{"kind":"symbol","termId":"A","quantityId":"stepA"},{"kind":"symbol","termId":"B","quantityId":"stepB"}],"opId":"crossProduct"},{"kind":"power","base":{"kind":"symbol","termId":"B","quantityId":"stepB"},"exponent":{"num":2,"den":1}}]},"opId":"totalMeanSquare"},"changedSubexpressionIds":["totalMeanSquare"],"rule":{"kind":"expand","params":{}},"reasonKind":"algebra","reasons":{"r0":"Two added steps produce three kinds of term, not just two squares.","r1":"Expand (A + B)² as A² + 2AB + B² before averaging. The 2AB term records how the two steps combine.","r2":"This algebra holds for every pair of step values, even correlated or biased ones. No probability assumption has been used yet."},"premiseRefs":[],"isMove":false,"verification":{"status":"authored-unverified"}},{"id":"bm-variance-average","tool":"foundation:mean-variance-rms","from":{"kind":"average","argument":{"kind":"sum","args":[{"kind":"power","base":{"kind":"symbol","termId":"A","quantityId":"stepA"},"exponent":{"num":2,"den":1}},{"kind":"product","args":[{"kind":"number","value":"2"},{"kind":"symbol","termId":"A","quantityId":"stepA"},{"kind":"symbol","termId":"B","quantityId":"stepB"}],"opId":"crossProduct"},{"kind":"power","base":{"kind":"symbol","termId":"B","quantityId":"stepB"},"exponent":{"num":2,"den":1}}]},"opId":"totalMeanSquare"},"to":{"kind":"sum","args":[{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"A","quantityId":"stepA"},"exponent":{"num":2,"den":1}}},{"kind":"group","argument":{"kind":"average","argument":{"kind":"product","args":[{"kind":"number","value":"2"},{"kind":"symbol","termId":"A","quantityId":"stepA"},{"kind":"symbol","termId":"B","quantityId":"stepB"}]}},"opId":"crossTerm"},{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"B","quantityId":"stepB"},"exponent":{"num":2,"den":1}}}],"opId":"totalMeanSquare"},"changedSubexpressionIds":["totalMeanSquare"],"rule":{"kind":"registered-identity","params":{"identityId":"linearity-of-average"}},"reasonKind":"probability","reasons":{"r0":"Averaging a sum is the same as adding its averages.","r1":"Apply linearity of expectation to the two squared terms and the cross term. Linearity does not require independence.","r2":"Finite second moments ensure these averages exist. Expectation distributes over addition and a fixed multiplier: ⟨A² + 2AB + B²⟩ = ⟨A²⟩ + 2⟨AB⟩ + ⟨B²⟩."},"premiseRefs":[],"isMove":false,"verification":{"status":"authored-unverified"},"layout":{"to":"terms"}},{"id":"bm-variance-cross","tool":"foundation:probability-independence","from":{"kind":"sum","args":[{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"A","quantityId":"stepA"},"exponent":{"num":2,"den":1}}},{"kind":"group","argument":{"kind":"average","argument":{"kind":"product","args":[{"kind":"number","value":"2"},{"kind":"symbol","termId":"A","quantityId":"stepA"},{"kind":"symbol","termId":"B","quantityId":"stepB"}]}},"opId":"crossTerm"},{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"B","quantityId":"stepB"},"exponent":{"num":2,"den":1}}}],"opId":"totalMeanSquare"},"to":{"kind":"sum","args":[{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"A","quantityId":"stepA"},"exponent":{"num":2,"den":1}}},{"kind":"group","argument":{"kind":"number","value":"0"},"opId":"crossTerm"},{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"B","quantityId":"stepB"},"exponent":{"num":2,"den":1}}}],"opId":"totalMeanSquare"},"changedSubexpressionIds":["crossTerm"],"rule":{"kind":"registered-identity","params":{"identityId":"independent-zero-mean-product-vanishes","citedPremises":["premise-independent-displacements","premise-zero-mean-displacements"]}},"reasonKind":"probability","reasons":{"r0":"Independent, unbiased steps have no average cross contribution.","r1":"Independence gives ⟨AB⟩ = ⟨A⟩⟨B⟩. The two means are zero, so the average cross term is zero. It is not zero in each individual outcome.","r2":"These are two separate premises. Zero marginal means alone do not force ⟨AB⟩ to vanish: when B always equals A, both means are zero but AB is always positive. Pairwise uncorrelated zero-mean steps would also suffice; independence is the stronger premise used here."},"premiseRefs":[{"ref":"premise-independent-displacements","edgeType":"pedagogical-reconstruction"},{"ref":"premise-zero-mean-displacements","edgeType":"pedagogical-reconstruction"}],"isMove":true,"moveLabel":"Cross terms average away under independence and zero mean.","verification":{"status":"authored-unverified"},"layout":{"from":"terms"}},{"id":"bm-variance-identical","tool":"foundation:mean-variance-rms","from":{"kind":"sum","args":[{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"A","quantityId":"stepA"},"exponent":{"num":2,"den":1}}},{"kind":"group","argument":{"kind":"number","value":"0"},"opId":"crossTerm"},{"kind":"average","argument":{"kind":"power","base":{"kind":"symbol","termId":"B","quantityId":"stepB"},"exponent":{"num":2,"den":1}}}],"opId":"totalMeanSquare"},"to":{"kind":"product","args":[{"kind":"number","value":"2"},{"kind":"power","base":{"kind":"symbol","termId":"l","quantityId":"stepRms"},"exponent":{"num":2,"den":1}}],"opId":"totalMeanSquare"},"changedSubexpressionIds":["totalMeanSquare"],"rule":{"kind":"substitute","params":{"targetId":"totalMeanSquare","replacement":{"kind":"product","args":[{"kind":"number","value":"2"},{"kind":"power","base":{"kind":"symbol","termId":"l","quantityId":"stepRms"},"exponent":{"num":2,"den":1}}],"opId":"totalMeanSquare"},"citedEquality":"Under the declared equal-second-moment premise, each retained average square is l squared and the cross term is zero."}},"reasonKind":"algebra","reasons":{"r0":"Two equal contributions give twice one contribution.","r1":"Here l² denotes the mean square of one step. The two remaining contributions are l² + l² = 2l².","r2":"For n increments the expansion contains n square terms and one ordered cross term for every i ≠ j. The same independence and centring argument eliminates each cross average. If every step has mean square l², the result is nl²."},"premiseRefs":[{"ref":"premise-equal-second-moments","edgeType":"pedagogical-reconstruction"}],"isMove":false,"verification":{"status":"authored-unverified"}}]},"transitions":[{"id":"bm-variance-expand","chainId":"chain-bm-variance-of-sum","fromStepId":"bm-variance-expand","toStepId":"bm-variance-expand","title":"Expand the square","changedSubexpressionIds":["totalMeanSquare"],"ruleIds":["expand"],"premiseIds":[],"workedCaseId":"two-signed-steps"},{"id":"bm-variance-average","chainId":"chain-bm-variance-of-sum","fromStepId":"bm-variance-average","toStepId":"bm-variance-average","title":"Average each contribution","changedSubexpressionIds":["totalMeanSquare"],"ruleIds":["registered-identity"],"premiseIds":[],"workedCaseId":"two-signed-steps"},{"id":"bm-variance-cross","chainId":"chain-bm-variance-of-sum","fromStepId":"bm-variance-cross","toStepId":"bm-variance-cross","title":"Why do the cross terms vanish?","changedSubexpressionIds":["crossTerm"],"ruleIds":["registered-identity"],"premiseIds":["premise-independent-displacements","premise-zero-mean-displacements"],"workedCaseId":"two-signed-steps"},{"id":"bm-variance-identical","chainId":"chain-bm-variance-of-sum","fromStepId":"bm-variance-identical","toStepId":"bm-variance-identical","title":"Add equal mean squares","changedSubexpressionIds":["totalMeanSquare"],"ruleIds":["substitute"],"premiseIds":["premise-equal-second-moments"],"workedCaseId":"two-signed-steps"}]}
