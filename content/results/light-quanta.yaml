# The results of the light-quanta paper, as the results face shows them (dispatch 240).
# Checked by src/content/results/resultCards.ts, in the form mass-energy.yaml set.
#
# The as-printed layer is never typed here: each entry names an anchor of the German face (a
# display, or sentences of a paragraph by their order in it) and the text is read from the face.
# Everything written here (the one-sentence reading, the decoder, the qualifications, the probe
# questions) is explanatory prose in the site's voice.
#
# A card's common wrong turns are not listed here: each record in content/misconceptions/light-quanta
# names the results it concerns in its resultIds, bound to the cards that quote a paragraph the
# record cites. "Used later" stays empty until the margin records exist to cite. Probes name the
# laboratory, the question, and a preset its manifest registers (content/experiments/lq-0N.yaml).
paper: light-quanta
review: draft
cards:
  - id: lq-classical-difficulty
    title: "The equilibrium the classical picture requires, and its infinite total"
    section: s1
    arguments: [arg-lq-classical-allocation, arg-lq-equilibrium-assumptions]
    printed:
      - anchor: s1-p5
        sentences: [1, 2]
    equations: [eq-model-lq-classical-density, eq-model-lq-cutoff-integral, eq-model-lq-cutoff-total]
    oneSentence: "If each resonator has the mean energy \\(\\frac{R}{N}T\\) that the kinetic theory of gases requires and the mean energy Planck derived for equilibrium with the radiation, the radiation must have the density \\(\\varrho_\\nu = \\frac{R}{N}\\frac{8\\pi\\nu^2}{L^3}T\\); the paper says this disagrees with experience, and that summed over all frequencies it gives an infinite energy, so the picture allows no definite distribution of energy between ether and matter."
    decoder:
      - symbol: "\\(\\overline{E}\\)"
        meaning: "The mean energy of one linear oscillation of a resonator electron, which the kinetic theory of gases sets equal to \\(\\frac{R}{N}T\\) in equilibrium with the gas."
      - symbol: "\\(\\overline{E}_\\nu\\)"
        meaning: "The mean energy of a resonator of eigenfrequency \\(\\nu\\), per component of oscillation, in Planck's condition for equilibrium with the radiation."
      - symbol: "\\(\\varrho_\\nu\\)"
        meaning: "The energy density of the radiation per unit frequency: \\(\\varrho_\\nu\\,d\\nu\\) is the energy per unit volume of the part of the radiation between \\(\\nu\\) and \\(\\nu + d\\nu\\)."
      - symbol: "\\(L\\)"
        meaning: "The speed of light, printed L in §§ 1 and 2 of this paper."
      - symbol: "\\(\\infty\\)"
        meaning: "The total over all frequencies: the wider the range of the resonators' frequencies is taken, the greater the radiation energy of the space, without limit."
    qualifications:
      - kind: premise
        text: "Two conditions of equilibrium are combined: the resonators with the molecules and electrons of the gas, from the kinetic theory, and the resonators with the radiation, which Planck derived on the assumption that radiation is a process as disordered as can be."
      - kind: comparison
        text: "§ 2 shows that the same relation is the limit of Planck's formula for long wavelengths and large radiation densities, where it does agree with experience."
    probes:
      - instrument: lq-02
        question: "Give every resonator the same mean energy whatever its frequency: how much energy does the radiation hold as the range of frequencies widens?"
    usedLater: []
    meanings:
      argumentStatus: "A consequence of two conditions of equilibrium, stated as a difficulty"
      modelStatus: "Within the picture of resonators, gas molecules and radiation that the section sets up"
      evidentialRole: "A theoretical difficulty, which the paper says disagrees with experience"
      historicalStatus: "Its ingredients, the kinetic theory and Planck's resonator condition, were published before 1905; the paper states the difficulty"
    selectionReason: "It is the difficulty the paper starts from: in the picture of its day, no definite distribution of energy between ether and matter."

  - id: lq-planck-constants
    title: "Planck's constants and the number of molecules"
    section: s2
    arguments: [arg-lq-planck-constants]
    printed:
      - anchor: s2-p2
        sentences: [2, 3, 4]
    equations:
      - eq-model-lq-planck-low-frequency
      - eq-model-lq-coefficient-match
      - eq-model-lq-avogadro-from-spectrum
    oneSentence: "For large wavelengths and radiation densities Planck's formula becomes \\(\\varrho_\\nu = \\frac{\\alpha}{\\beta}\\nu^2 T\\), the relation of § 1, and equating the coefficients gives \\(N = 6{,}17 \\cdot 10^{23}\\), exactly Planck's value; so Planck's determination of the elementary quanta is, to a certain degree, independent of his theory of black radiation."
    decoder:
      - symbol: "\\(\\alpha\\), \\(\\beta\\)"
        meaning: "The two constants of Planck's formula as the paper prints them, \\(\\alpha = 6{,}10 \\cdot 10^{-56}\\) and \\(\\beta = 4{,}866 \\cdot 10^{-11}\\)."
      - symbol: "large \\(T/\\nu\\)"
        meaning: "Large wavelengths and radiation densities, where \\(e^{\\beta\\nu/T} - 1\\) is close to \\(\\beta\\nu/T\\) and Planck's formula takes the form of § 1."
      - symbol: "\\(N\\)"
        meaning: "The number of real molecules in a gram-equivalent. Its reciprocal is the mass of a hydrogen atom in grams, which the paper gives as \\(1{,}62 \\cdot 10^{-24}\\) g."
    qualifications:
      - kind: approximation
        text: "The two formulas agree only in the limit of large \\(T/\\nu\\); at high frequencies they part."
      - kind: comparison
        text: "The value is compared with Planck's, which it matches exactly, and with values found in other ways, which it matches satisfactorily; it is a consistency check, not a new measurement."
      - kind: inference
        text: "What the paper concludes is limited: Planck's determination of the elementary quanta is independent of his theory of black radiation \"bis zu einem gewissen Grade\", to a certain degree."
    probes:
      - instrument: lq-03
        question: "At long wavelengths, where do Planck's formula and the relation of § 1 agree, and where do they part?"
    usedLater: []
    meanings:
      argumentStatus: "A comparison of two formulas in a limit"
      modelStatus: "Exact in the limit of large T/ν"
      evidentialRole: "A consistency check against Planck's constants"
      historicalStatus: "Planck's formula and constants are earlier work the paper cites; the comparison is this paper's"
    selectionReason: "It is the paper's one number drawn from radiation theory, and it separates the value of Planck's constants from Planck's derivation."

  - id: lq-entropy-temperature
    title: "The entropy of radiation and its temperature"
    section: s3
    arguments: [arg-lq-entropy-temperature]
    printed:
      - anchor: s3-p4
        sentences: [3, 4, 5]
    equations: [eq-model-lq-entropy-temperature]
    oneSentence: "Comparing two expressions for the entropy gained when black radiation of unit volume is warmed gives \\(\\partial\\varphi/\\partial\\varrho = 1/T\\), which the paper calls the law of black radiation: from the entropy function \\(\\varphi\\) one can find the radiation law, and from the radiation law, by integration, the function \\(\\varphi\\)."
    decoder:
      - symbol: "\\(\\varphi(\\varrho, \\nu)\\)"
        meaning: "The entropy per unit volume and unit frequency of radiation whose energy density at the frequency \\(\\nu\\) is \\(\\varrho\\)."
      - symbol: "\\(\\varrho\\)"
        meaning: "The energy density per unit frequency, printed in §§ 3 and 4 without its subscript \\(\\nu\\)."
      - symbol: "\\(\\varphi\\) vanishes for \\(\\varrho = 0\\)"
        meaning: "The condition that fixes the constant of integration when \\(\\varphi\\) is found from the radiation law."
    qualifications:
      - kind: premise
        text: "The warming is reversible and \\(dE\\) is the heat supplied; that is what allows \\(dS = dE/T\\)."
      - kind: premise
        text: "That \\(\\partial\\varphi/\\partial\\varrho\\) does not depend on \\(\\nu\\) comes from the section's condition that the entropy be a maximum at fixed energy."
    probes:
      - instrument: lq-04
        question: "Take the derivative of the entropy density with respect to the energy density: does it come out as 1/T?"
        preset: lq-04-derived-temperature
    usedLater: []
    meanings:
      argumentStatus: "A thermodynamic relation, used as a tool"
      modelStatus: "Exact for radiation in equilibrium"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Follows from thermodynamics available before 1905; the paper states it in this form"
    selectionReason: "It is the tool the next section uses to turn Wien's law into an entropy."

  - id: lq-radiation-entropy-volume
    title: "How the entropy of monochromatic radiation depends on its volume"
    section: s4
    arguments: [arg-lq-fixed-band-volume, arg-lq-wien-integration]
    printed:
      - anchor: s4-p1
        sentences: [3, 4]
      - anchor: s4-p2
        sentences: [4]
    equations:
      - eq-model-lq-wien-spectrum
      - eq-model-lq-wien-entropy-density
      - eq-model-lq-volume-entropy
    oneSentence: "Taking as its basis Wien's law, which experiment confirms for large \\(\\nu/T\\), the paper finds that the entropy of radiation of energy \\(E\\) between \\(\\nu\\) and \\(\\nu + d\\nu\\) depends on the volume it occupies as \\(S - S_0 = \\frac{E}{\\beta\\nu}\\lg\\left(\\frac{v}{v_0}\\right)\\), a result valid only within certain limits."
    decoder:
      - symbol: "\\(E\\)"
        meaning: "The energy of radiation whose frequency lies between \\(\\nu\\) and \\(\\nu + d\\nu\\)."
      - symbol: "\\(v\\), \\(v_0\\), \\(S_0\\)"
        meaning: "The volume the radiation occupies, a reference volume, and the radiation's entropy when it occupies \\(v_0\\)."
      - symbol: "\\(\\beta\\)"
        meaning: "The constant of Wien's law, \\(\\varrho = \\alpha\\nu^3 e^{-\\beta\\nu/T}\\)."
      - symbol: "\\(\\lg\\)"
        meaning: "The natural logarithm, as the paper prints it."
    qualifications:
      - kind: premise
        text: "The calculation rests on Wien's law, which the paper says is not exactly valid; its results hold only within certain limits, where Wien's law is confirmed, for large \\(\\nu/T\\)."
      - kind: premise
        text: "The energy and the frequency band are held fixed; only the volume changes."
    probes:
      - instrument: lq-04
        question: "Halve the volume the radiation occupies at fixed energy: how much does its entropy change?"
        preset: lq-04-halve-volume
      - instrument: lq-04
        question: "Try a dense state, outside the range of Wien's law: why does the laboratory refuse the comparison?"
        preset: lq-04-dense-refusal
    usedLater: []
    meanings:
      argumentStatus: "A derivation from Wien's law"
      modelStatus: "Within the range of validity of Wien's law"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the property of radiation that § 6 compares with a gas."

  - id: lq-boltzmann-principle
    title: "Boltzmann's principle and the entropy of independent points"
    section: s5
    arguments: [arg-lq-statistical-probability, arg-lq-independent-configurations]
    printed:
      - anchor: s5-p6
        sentences: [2]
      - anchor: s5-p8
        sentences: [1]
    equations:
      - eq-model-lq-configuration-probability
      - eq-model-lq-configuration-entropy
      - eq-model-lq-gas-entropy-change
    oneSentence: "Entropy and probability are related by \\(S - S_0 = \\frac{R}{N}\\lg W\\), and for \\(n\\) points moving independently in a volume \\(v_0\\) the probability that at a chosen instant all of them are in the part \\(v\\) is \\((v/v_0)^n\\), so their entropy depends on the volume as \\(S - S_0 = R\\left(\\frac{n}{N}\\right)\\lg\\left(\\frac{v}{v_0}\\right)\\)."
    decoder:
      - symbol: "\\(W\\)"
        meaning: "The relative probability of a state of entropy \\(S\\), compared with the initial state of entropy \\(S_0\\)."
      - symbol: "\\(n\\)"
        meaning: "The number of points moving independently of one another in the volume \\(v_0\\)."
      - symbol: "\"statistische Wahrscheinlichkeit\""
        meaning: "Statistical probability: the probability of finding a configuration at an arbitrarily chosen instant."
      - symbol: "\\(R/N\\)"
        meaning: "The universal constant \\(C\\) in \\(S = C\\lg W + \\text{konst.}\\), whose value the paper takes from the kinetic theory of gases."
    qualifications:
      - kind: premise
        text: "The value \\(R/N\\) of the constant \\(C\\) comes from the kinetic theory of gases, as the paper says."
      - kind: premise
        text: "The points move independently of one another; the probability is a product of one factor per point only because of that."
    probes:
      - instrument: lq-05
        question: "With two independent points and half the volume, how often are both found in the left half?"
        preset: lq-05-first-encounter
      - instrument: lq-05
        question: "Lock the points' positions together: does the probability still come out as a power of the volume ratio?"
        preset: lq-05-locked-positions
    usedLater: []
    meanings:
      argumentStatus: "Boltzmann's principle, applied to independent points"
      modelStatus: "Exact for points that move independently"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Boltzmann's principle is earlier work; the paper states it in this form and applies it"
    selectionReason: "It gives the gas side of the comparison § 6 makes."

  - id: lq-energy-quanta
    title: "Radiation that behaves as if it consisted of energy quanta"
    section: s6
    arguments: [arg-lq-entropy-correspondence]
    printed:
      - anchor: eq-s6-d4
      - anchor: s6-p6
        sentences: [1]
    equations:
      - eq-model-lq-radiation-entropy-change
      - eq-model-lq-gas-entropy-change
      - eq-model-lq-effective-count
      - eq-model-lq-energy-per-point
    oneSentence: "Read with Boltzmann's principle, the entropy of monochromatic radiation gives the probability that all its energy is found in a part \\(v\\) of the volume \\(v_0\\), and that probability has the form it has for independent points; so radiation of low density, where Wien's formula holds, behaves in thermal respects as if it consisted of mutually independent energy quanta of magnitude \\(R\\beta\\nu/N\\)."
    decoder:
      - symbol: "\\(W\\)"
        meaning: "The probability that, at an arbitrarily chosen instant, the whole energy \\(E\\) of radiation enclosed in the volume \\(v_0\\) by reflecting walls is found in the part \\(v\\) of it."
      - symbol: "\\(\\frac{N}{R}\\frac{E}{\\beta\\nu}\\)"
        meaning: "The exponent of \\(v/v_0\\): the energy \\(E\\) divided by \\(R\\beta\\nu/N\\). For \\(n\\) independent moving points of a gas the same probability is \\((v/v_0)^n\\), which is the comparison the paper makes."
      - symbol: "\\(R\\beta\\nu/N\\)"
        meaning: "The magnitude of each energy quantum. \\(R/N\\) is the gas constant per molecule and \\(\\beta\\) the constant of Wien's formula, so the product is what later texts write \\(h\\nu\\); the paper does not use the letter \\(h\\)."
      - symbol: "\"wie wenn\""
        meaning: "As if: the sentence states how the radiation behaves in its thermal properties, not what light is made of."
    qualifications:
      - kind: premise
        text: "Only for radiation of low density, within the range of validity of Wien's radiation formula; the sentence itself says so."
      - kind: inference
        text: "A heuristic conclusion from one thermal property, the dependence of the entropy on the volume. The paper next asks whether the laws of the generation and transformation of light are also such as they would be if light consisted of these quanta, and takes that question up in §§ 7 to 9."
    probes:
      - instrument: lq-06
        question: "Compare the radiation's entropy-volume law with that of a gas of independent points: how many points does the radiation behave like, and how much energy would each carry?"
        preset: lq-06-the-move
    usedLater: []
    meanings:
      argumentStatus: "A heuristic conclusion from a comparison"
      modelStatus: "Stated within the range of validity of Wien's formula"
      evidentialRole: "An inference, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the paper's heuristic point of view, stated as a result, and §§ 7 to 9 apply it."

  - id: lq-stokes-rule
    title: "Stokes's rule"
    section: s7
    arguments: [arg-lq-fluorescence-budget]
    printed:
      - anchor: s7-p1
        sentences: [5, 6]
    equations: [eq-model-lq-fluorescence-bound]
    oneSentence: "If each exciting quantum of frequency \\(\\nu_1\\) is absorbed and on its own gives rise to a light quantum of frequency \\(\\nu_2\\), the energy principle requires \\(\\frac{R}{N}\\beta\\nu_2 \\leqq \\frac{R}{N}\\beta\\nu_1\\), that is \\(\\nu_2 \\leqq \\nu_1\\), which is the known rule of Stokes."
    decoder:
      - symbol: "\\(\\nu_1\\)"
        meaning: "The frequency of the exciting light, absorbed by the photoluminescent substance."
      - symbol: "\\(\\nu_2\\)"
        meaning: "The frequency of the light the substance produces."
      - symbol: "\\(\\frac{R}{N}\\beta\\nu\\)"
        meaning: "The energy of one quantum of light of frequency \\(\\nu\\), taken from § 6 for both the exciting and the produced light."
    qualifications:
      - kind: premise
        text: "The photoluminescent substance is not to be regarded as a permanent source of energy; only then does the energy principle bound the produced quantum."
      - kind: premise
        text: "Each exciting quantum acts on its own, at least when the exciting quanta are sparse enough; the absorption may also produce quanta of other frequencies and energy of another kind, such as heat."
      - kind: conditional
        text: "The paper names when deviations are conceivable: when so many quanta are being transformed at once that one produced quantum can take its energy from several, and when the exciting or produced light is not of the kind Wien's law describes, for instance light from a body so hot that Wien's law fails at the wavelength in question."
    probes:
      - instrument: lq-07
        question: "Choose the exciting frequency: can the frequency of the emitted light exceed it while each quantum acts on its own?"
        preset: lq-07-stokes-rule
      - instrument: lq-07
        question: "Let two quanta act together: which of the paper's two conceivable deviations is this?"
        preset: lq-07-deviation-multi
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the quantum picture and the energy principle"
      modelStatus: "Holds when each exciting quantum acts on its own and the substance supplies no energy"
      evidentialRole: "Accounts for a rule already known from experiment"
      historicalStatus: "The rule was known before 1905, and the paper calls it known; its derivation from energy quanta is introduced here"
    selectionReason: "It is the first law of the generation and transformation of light that the paper derives from the energy quanta."

  - id: lq-photoelectric-energy
    title: "The energy of the electrons that light sets free"
    section: s8
    arguments: [arg-lq-photoelectric-energy, arg-lq-stopping-and-losses]
    printed:
      - anchor: s8-p2
        sentences: [3, 6, 8]
      - anchor: s8-p3
        sentences: [1]
      - anchor: s8-p5
        sentences: [1, 2]
      - anchor: s8-p6
        sentences: [1]
    equations: [eq-model-lq-photoelectric-maximum, eq-model-lq-stopping-energy]
    oneSentence: "If a light quantum gives its whole energy to one electron and the electron must do the work \\(P\\) to leave the body, the fastest electrons leave with the kinetic energy \\(\\frac{R}{N}\\beta\\nu - P\\), so the potential \\(\\Pi\\) that just stops them should be a straight line in the frequency with a slope that does not depend on the substance; for ultraviolet light at the edge of the solar spectrum the paper estimates about 4.3 volts, of the order of Lenard's results."
    decoder:
      - symbol: "\\(P\\)"
        meaning: "The work, characteristic of the body, that each electron must do to leave it."
      - symbol: "\\(\\Pi\\)"
        meaning: "The positive potential to which the body is charged when it just prevents a loss of electricity: in later language, the stopping potential."
      - symbol: "\\(\\varepsilon\\)"
        meaning: "The charge of the electron, which the paper calls its electric mass."
      - symbol: "\\(E\\) and \\(P'\\)"
        meaning: "The charge of one gram-equivalent of a monovalent ion, and the potential of that amount of negative electricity with respect to the body: the same relation written per gram-equivalent."
      - symbol: "4,3 Volt"
        meaning: "The paper's order-of-magnitude check, with \\(P' = 0\\), \\(\\nu = 1{,}03 \\cdot 10^{15}\\) (the edge of the solar spectrum toward the ultraviolet) and \\(\\beta = 4{,}866 \\cdot 10^{-11}\\)."
    qualifications:
      - kind: premise
        text: "That a light quantum gives its whole energy to a single electron is an assumption: the paper calls it the simplest picture, assumes that it occurs, and does not exclude that electrons take up only part of a quantum's energy."
      - kind: comparison
        text: "The 4.3 volts is compared with Lenard's results only in order of magnitude, with the work \\(P'\\) set to zero. It checks the size of the prediction, not the relation."
      - kind: conditional
        text: "The straight line, with a slope independent of the substance, is what must hold if the derived formula is right; the paper reports no such measurement."
    probes:
      - instrument: lq-08
        question: "Repeat the paper's order-of-magnitude check: what stopping potential does light at the ultraviolet edge of the solar spectrum give?"
        preset: lq-08-historical-check
      - instrument: lq-08
        question: "Raise the intensity at a fixed frequency: what changes, the number of electrons or the energy of each?"
        preset: lq-08-intensity-probe
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the quantum picture, with a stated assumption"
      modelStatus: "For electrons that take a quantum's whole energy and leave from the surface"
      evidentialRole: "A prediction, with an order-of-magnitude comparison"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the paper's quantitative prediction for the photoelectric effect."

  - id: lq-ionization
    title: "Ionisation of gases by ultraviolet light"
    section: s9
    arguments: [arg-lq-ionization-and-counts]
    printed:
      - anchor: s9-p1
        sentences: [1, 3, 4]
      - anchor: s9-p3
        sentences: [2, 4, 5]
    equations: [eq-model-lq-ionization-threshold, eq-model-lq-ion-count-bound]
    oneSentence: "If each absorbed light quantum ionises one gas molecule, the work of ionisation per gram-equivalent can be no greater than \\(R\\beta\\nu\\), which for Lenard's longest effective wavelength in air is \\(6{,}4 \\cdot 10^{12}\\) erg, nearly the upper limit found from Stark's ionisation voltage; and the number \\(j\\) of gram-molecules that the absorbed light \\(L\\) ionises must be \\(L/(R\\beta\\nu)\\)."
    decoder:
      - symbol: "\\(J\\)"
        meaning: "The theoretical work of ionisation per gram-equivalent."
      - symbol: "\\(R\\beta\\nu\\)"
        meaning: "The energy of a gram-equivalent's worth of quanta: \\(N\\) quanta of \\(R\\beta\\nu/N\\) each."
      - symbol: "\\(j\\)"
        meaning: "The number of gram-molecules ionised by the absorbed light."
      - symbol: "\\(L\\)"
        meaning: "The amount of light absorbed. In § 9, L is this energy, not the speed of light it names in §§ 1 and 2."
    qualifications:
      - kind: premise
        text: "That each absorbed quantum ionises one molecule is an assumption the paper states at the start of the section."
      - kind: comparison
        text: "The two figures come from different measurements, Lenard's longest effective wavelength and Stark's smallest ionisation voltage; the paper finds \\(6{,}4 \\cdot 10^{12}\\) and \\(9{,}6 \\cdot 10^{12}\\) nearly equal."
      - kind: conditional
        text: "The relation \\(j = L/(R\\beta\\nu)\\) must hold, if the paper's view corresponds to reality, for any gas that shows no appreciable absorption without ionisation at that frequency; the paper calls its test very important and reports none."
    probes:
      - instrument: lq-09
        question: "Is one quantum of the ultraviolet light enough to pay for one ionisation?"
        preset: lq-09-threshold
      - instrument: lq-09
        question: "Repeat the paper's check with Lenard's wavelength: how does the energy of the quanta compare with the work of ionisation?"
        preset: lq-09-historical-checks
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the quantum picture, with a stated assumption"
      modelStatus: "For a gas that absorbs light at the frequency only by being ionised"
      evidentialRole: "A bound compared with two measurements, and a proposed test"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the paper's last application of the energy quanta, and it ends with the test the paper thought important."
