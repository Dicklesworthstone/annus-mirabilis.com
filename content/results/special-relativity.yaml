# The results of Zur Elektrodynamik bewegter Körper (ap-17-891), as the results face shows them
# (dispatch 241), in the form of content/results/mass-energy.yaml. Checked by
# src/content/results/resultCards.ts.
#
# The as-printed layer is never typed here: each entry names an anchor of the German face (a
# display, or sentences of a paragraph by their order in it) and the text is read from the face.
# This paper has no ledger draft, so the face is read from its source blocks
# (src/content/results/sourceBlockFace.ts), as the German face is. Einstein's notation stays on
# the printed side: β is the modern γ, τ is the moving system's time coordinate (not a proper
# time), and V is the speed of light (content/notation/special-relativity.yaml). Everything
# written here (the one-sentence reading, the decoder, the qualifications, the probe questions) is
# draft explanatory prose. Historical statements come from the historian's-margin readings of
# the laboratories (content/editorial/readings-owners/am-sr-*.yaml), which cite their sources, and
# a misprint is explained from its record in docs/provenance/ap-17-891.md while the printed reading
# stays on the quoted side.
#
# A card's common wrong turns are not listed here: each record in
# content/misconceptions/special-relativity names the results it concerns in its resultIds, bound
# to the cards that quote its anchored paragraphs. "Used later" notes stay empty until margin
# records exist to cite. Probes name the laboratory, the question, and a preset its manifest
# registers (content/experiments/sr-NN.yaml).
paper: special-relativity
review: draft
cards:
  - id: sr-two-postulates
    title: "The principle of relativity and the constancy of the velocity of light"
    section: s0
    arguments: [arg-sr-magnet-conductor]
    printed:
      - anchor: s0-p2
        sentences: [1, 2, 3, 4]
    equations: []
    oneSentence: "The paper raises two presuppositions: that the same electrodynamic and optical laws hold in every coordinate system in which the equations of mechanics hold, which it calls the principle of relativity, and that light in empty space always travels with a definite velocity \\(V\\), independent of the state of motion of the emitting body; together, it says, they suffice for a simple and consistent electrodynamics of moving bodies, in which, it says, a light ether will prove superfluous, insofar as no absolutely resting space is introduced and no point of empty space is given a velocity."
    decoder:
      - symbol: "\"Prinzip der Relativität\""
        meaning: "The principle of relativity: the conjecture, raised to a presupposition, that absolute rest corresponds to no property of the phenomena, in electrodynamics as in mechanics."
      - symbol: "\\(V\\)"
        meaning: "The velocity of light in empty space, printed V; today it is written c."
      - symbol: "\"nur scheinbar unverträglich\""
        meaning: "Only apparently incompatible: light keeping one velocity seems to contradict the principle of relativity, and § 3 shows that the two agree."
      - symbol: "\"Lichtmedium\", \"Lichtäther\""
        meaning: "The light medium, or light ether: the unsuccessful attempts the paper mentions tried to detect the earth's motion relative to it. The paper introduces no absolutely resting space and assigns no velocity to a point of empty space."
    qualifications:
      - kind: premise
        text: "Both are presuppositions, and the paper does not derive them. Together with Maxwell's theory for bodies at rest, it says, they suffice for its electrodynamics of moving bodies."
      - kind: premise
        text: "The paper cites the magnet and the conductor, and the unsuccessful attempts to detect the earth's motion through the light medium, as what suggests the principle, not as a proof of it."
      - kind: comparison
        text: "Lorentz's theory predicts the same currents at the speeds of real apparatus, so the introduction objects to an asymmetry in the explanation, not to a failed prediction."
    probes:
      - instrument: sr-02
        question: "Move the magnet past the resting conductor, then the conductor past the resting magnet at the same relative speed: is the current the same, and how does each description account for it?"
        preset: sr-02-apparatus-nagging-fact
      - instrument: sr-02
        question: "Now show the resolution: how does one description, depending only on the relative motion, cover both cases?"
        preset: sr-02-apparatus
    usedLater: []
    meanings:
      argumentStatus: "Two presuppositions, from which the paper derives the rest"
      modelStatus: "The theory's starting points, not results of it"
      evidentialRole: "A conjecture raised to a presupposition, suggested by examples such as the magnet and the conductor and by the failed attempts to detect the earth's motion through the light medium"
      historicalStatus: "The magnet-and-conductor case was a textbook example, discussed in Föppl's 1894 introduction to Maxwell's theory; the two presuppositions are introduced in this paper"
    selectionReason: "Every section of the paper rests on these two presuppositions, and § 3 returns to show that they agree."

  - id: sr-synchronous-clocks
    title: "Synchronous clocks and the time of a distant event"
    section: s1
    arguments: [arg-sr-synchronization]
    printed:
      - anchor: s1-p7
        sentences: [4, 5, 6]
      - anchor: eq-s1-d1
      - anchor: s1-p9
        sentences: [2]
      - anchor: s1-p10
        sentences: [1]
      - anchor: eq-s1-d2
      - anchor: s1-p11
        sentences: [1]
    equations: [eq-model-sr-sync-equal-legs, eq-model-sr-sync-midpoint]
    oneSentence: "Two clocks at rest at A and B run synchronously, by definition, when a ray of light that leaves A at \\(t_A\\), is reflected at B at \\(t_B\\) and returns to A at \\(t'_A\\) takes as long out as back, \\(t_B-t_A=t'_A-t_B\\); the time of an event is then the reading of such a clock at its place, and the quantity \\(2\\overline{AB}/(t'_A-t_A)\\) is set, in accordance with experience, to be a universal constant, the speed of light in empty space."
    decoder:
      - symbol: "\\(t_A\\), \\(t_B\\), \\(t'_A\\)"
        meaning: "The departure of the ray from A, read on A's clock; its reflection at B, read on B's clock; and its return to A, read on A's clock."
      - symbol: "\\(\\overline{AB}\\)"
        meaning: "The distance between A and B."
      - symbol: "\\(V\\)"
        meaning: "The speed of light in empty space, printed V; today it is written c."
      - symbol: "\"durch Definition\""
        meaning: "By definition, letter-spaced in the print: that light takes as long from A to B as from B to A is stipulated, and nothing in the procedure measures it."
      - symbol: "\"die Zeit des ruhenden Systems\""
        meaning: "The time of the stationary system: the paper stresses that the time so defined belongs to clocks at rest in that system."
    qualifications:
      - kind: premise
        text: "The paper assumes that the definition can be applied without contradiction to any number of points: if the clock at B is synchronous with the clock at A, then A's is synchronous with B's, and two clocks synchronous with a third are synchronous with each other."
      - kind: premise
        text: "Two different things are laid down. The equality of the two travel times is a definition; that the round-trip quantity is a universal constant is stipulated in accordance with experience."
      - kind: comparison
        text: "Whether the equal-times rule is a free choice was argued later, beginning with Reichenbach in 1928, and the question is still debated. The paper calls it a definition."
    probes:
      - instrument: sr-01
        question: "A signal leaves A at 0 s and returns at 10 s: what must B's clock read at the moment of reflection?"
        preset: sr-01-sync-0-10
      - instrument: sr-01
        question: "Light goes 10 light-seconds out and back: what does \\(2\\overline{AB}/(t'_A-t_A)\\) come to?"
        preset: sr-01-round-trip-10ls
      - instrument: sr-01
        question: "Clocks at B and at C are each synchronous with the clock at A: are they synchronous with each other?"
        preset: sr-01-three-stations
    usedLater: []
    meanings:
      argumentStatus: "A definition, with an assumption that it is consistent and a stipulation from experience"
      modelStatus: "A definition for clocks at rest in one system"
      evidentialRole: "A definition, not evidence; the constancy of the round-trip speed is taken from experience"
      historicalStatus: "In 1900 Poincaré had described observers moving through the ether who set their clocks by exchanging light signals and so obtain Lorentz's local time, to first order; here the procedure defines the time of the stationary system"
    selectionReason: "Every later section rests on it: it defines the time of a distant event, and with it what simultaneous means."

  - id: sr-relativity-of-simultaneity
    title: "The relativity of simultaneity"
    section: s2
    arguments: [arg-sr-rod-events]
    printed:
      - anchor: eq-s2-d2
      - anchor: eq-s2-d3
      - anchor: s2-p7
        sentences: [4]
      - anchor: s2-p8
        sentences: [1]
    equations: [eq-model-sr-simultaneity-offset]
    oneSentence: "Clocks at the two ends of a moving rod, which the stationary system calls synchronous, are not synchronous by the moving observers' own test, so two events that are simultaneous in one coordinate system are in general not simultaneous in a system moving relative to it."
    decoder:
      - symbol: "\\(t_A\\), \\(t_B\\), \\(t'_A\\)"
        meaning: "The times, read on the stationary system's clocks, at which a ray of light leaves the end A of the rod, is reflected at the end B, and arrives back at A."
      - symbol: "\\(r_{AB}\\)"
        meaning: "The length of the moving rod, measured in the stationary system."
      - symbol: "\\(v\\)"
        meaning: "The speed of the rod along the X-axis of the stationary system."
      - symbol: "\\(V\\)"
        meaning: "The speed of light, printed V; today it is written c."
      - symbol: "why the two times differ"
        meaning: "In the stationary system the ray chases the end B, which moves away at \\(v\\), and meets the end A coming toward it, so the way out takes \\(r_{AB}/(V-v)\\) and the way back \\(r_{AB}/(V+v)\\). The test of § 1 that the moving observers apply calls the clocks synchronous only when the two times are equal."
    qualifications:
      - kind: premise
        text: "The result rests on § 1's definition of synchronous clocks, by a ray of light sent out and reflected, and on the principle of the constancy of the velocity of light. Simultaneity at a distance is defined by that procedure; the paper does not observe it."
    probes:
      - instrument: sr-01
        question: "Two clocks 10 light-seconds apart move at 0.6 of the speed of light and are set by the moving observers' own test: how far apart do they read in the stationary system, and which one is ahead?"
        preset: sr-01-moving-pair-0.6c
      - instrument: sr-03
        question: "Take two events that are simultaneous in K: at what times does k assign them?"
        preset: sr-03-valid-pair-0.6c
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the definition of synchronous clocks and the two principles"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper. In 1900 Poincaré had described observers moving through the ether who set their clocks by light signals and so obtain Lorentz's local time, to first order"
    selectionReason: "It is the conclusion § 2 draws in its own words: the concept of simultaneity has no absolute meaning."

  - id: sr-principles-compatible
    title: "The two principles are compatible"
    section: s3
    arguments: [arg-sr-lorentz-map]
    printed:
      - anchor: s3-p16
        sentences: [1]
      - anchor: eq-s3-d17
      - anchor: eq-s3-d18
      - anchor: s3-p17
        sentences: [1, 2]
    equations: []
    oneSentence: "A spherical light wave sent out from the common origin at the time zero spreads with the speed \\(V\\) in the stationary system and, transformed by the equations of § 3, also with the speed \\(V\\) in the moving system, which shows that the principle of relativity and the constancy of the speed of light are compatible."
    decoder:
      - symbol: "\\(x^2+y^2+z^2=V^2t^2\\)"
        meaning: "The points the wave has just reached at the time \\(t\\) of the stationary system K: a sphere of radius \\(Vt\\)."
      - symbol: "\\(\\xi^2+\\eta^2+\\zeta^2=V^2\\tau^2\\)"
        meaning: "The same wave front in the coordinates of the moving system k, at its time \\(\\tau\\): again a sphere, growing at the speed \\(V\\)."
      - symbol: "\\(\\xi, \\eta, \\zeta, \\tau\\)"
        meaning: "The coordinates and the time of the moving system k, as § 3 defines them; \\(\\tau\\) is k's time coordinate, not a proper time."
    qualifications:
      - kind: premise
        text: "The transformation equations were built from the constancy of the speed of light in the stationary system and the definition of time; the spherical wave checks that the same holds in the moving system, which is what the principle of relativity requires."
    probes:
      - instrument: sr-04
        question: "With the constructed map at 0.6 of the speed of light, does a ray keep the speed of light in both systems?"
        preset: sr-04-construct-0.6c
      - instrument: sr-04
        question: "Put the Galilean map on the same rays: what speed does it give the light in the moving system?"
        preset: sr-04-galilean-shelf
    usedLater: []
    meanings:
      argumentStatus: "A check that the two postulates do not contradict each other"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A consistency argument, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "The introduction calls the two postulates only apparently irreconcilable; this is where § 3 shows they agree."

  - id: sr-transformation-equations
    title: "The transformation equations"
    section: s3
    arguments: [arg-sr-lorentz-map, arg-sr-transverse-and-inverse]
    printed:
      - anchor: s3-p22
        sentences: [10]
      - anchor: eq-s3-d25
      - anchor: eq-s3-d26
    equations: [eq-model-sr-map-time, eq-model-sr-map-position, eq-model-sr-lorentz-factor]
    oneSentence: "An event with coordinates \\(x, y, z\\) and time \\(t\\) in the stationary system has, in a system moving along x with speed \\(v\\), the time \\(\\tau=\\beta(t-vx/V^2)\\) and the coordinates \\(\\xi=\\beta(x-vt)\\), \\(\\eta=y\\), \\(\\zeta=z\\), once the unknown factor \\(\\varphi(v)\\) of the derivation is shown to be 1."
    decoder:
      - symbol: "\\(\\beta\\)"
        meaning: "Einstein's β is \\(1/\\sqrt{1-(v/V)^2}\\), the factor written γ today. It is not today's β, which means \\(v/c\\)."
      - symbol: "\\(\\tau\\)"
        meaning: "The time of the moving system k at the event, as its own clocks, set by § 1's rule, read it. It is k's time coordinate, not a proper time."
      - symbol: "\\(\\xi, \\eta, \\zeta\\)"
        meaning: "The event's coordinates in k, whose axes are parallel to those of the stationary system K."
      - symbol: "\\(V\\)"
        meaning: "The speed of light, printed V; today it is written c."
      - symbol: "\\(\\varphi(v)=1\\)"
        meaning: "The derivation leaves a factor \\(\\varphi(v)\\) open. A third system moving back with \\(-v\\) gives \\(\\varphi(v)\\varphi(-v)=1\\), and a rod moving across its length, which cannot depend on the sense of the motion, gives \\(\\varphi(v)=\\varphi(-v)\\); so \\(\\varphi(v)=1\\)."
    qualifications:
      - kind: premise
        text: "The equations follow from the two principles, from § 1's definition of time and from the symmetry arguments the paper states; the factor \\(\\varphi(v)\\) is fixed by symmetry, not by an observation."
    probes:
      - instrument: sr-04
        question: "At 0.6 of the speed of light, what does the constructed map give for β, and which constraint fixes each coefficient?"
        preset: sr-04-construct-0.6c
      - instrument: sr-03
        question: "Boost to 0.6 of the speed of light: what do the two systems say about the same two events?"
        preset: sr-03-boost-0.6c
    usedLater: []
    meanings:
      argumentStatus: "The derivation of § 3, completed by a symmetry argument"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Lorentz had published equivalent coordinate equations in 1904, as a change of variables with a local time, and Poincaré named them the Lorentz transformation in June 1905; this paper derives them from its two principles and cites neither"
    selectionReason: "Every later section of the paper applies these equations: to rods and clocks, to velocities, to the fields and to light."

  - id: sr-moving-rigid-body
    title: "A moving sphere measured as an ellipsoid"
    section: s4
    arguments: [arg-sr-clock-and-length]
    printed:
      - anchor: s4-p1
        sentences: [4]
      - anchor: eq-s4-d3
      - anchor: s4-p3
        sentences: [1, 2, 3]
    equations: [eq-model-sr-length-contraction]
    oneSentence: "A rigid body that is a sphere of radius \\(R\\) when measured at rest has, measured from the stationary system while it moves with speed \\(v\\), the shape of an ellipsoid whose axis along the motion is \\(R\\sqrt{1-(v/V)^2}\\) and whose two other axes stay \\(R\\)."
    decoder:
      - symbol: "\\(R\\sqrt{1-(v/V)^2}\\)"
        meaning: "The length of the axis along the motion, measured in the stationary system: the sphere is shortened in the ratio \\(1:\\sqrt{1-(v/V)^2}\\) in that direction only."
      - symbol: "\\(R, R\\)"
        meaning: "The two axes across the motion, which the motion leaves unchanged."
      - symbol: "\"vom ruhenden System aus betrachtet\""
        meaning: "Viewed from the stationary system: the shape is found from the positions of the body's points at one time \\(t=0\\) of that system."
      - symbol: "\\(v=V\\)"
        meaning: "At the speed of light every moving object would be flat in the stationary system; for speeds greater than light the paper says its considerations become meaningless."
    qualifications:
      - kind: premise
        text: "The shape is a set of positions read at one time of the stationary system. It is not what a camera would record, which also depends on when light from each point left it."
    probes:
      - instrument: sr-03
        question: "The sphere moving at 0.6 of the speed of light: what are its three axes in the stationary system?"
        preset: sr-03-sphere-0.6c
      - instrument: sr-03
        question: "Measure k's rod from K and K's rod from k: is the shortening the same both ways?"
        preset: sr-03-reciprocal-0.6c
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation equations"
      modelStatus: "Exact within the paper's kinematics, for a body the paper calls rigid"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "FitzGerald in 1889 and Lorentz in 1892 had proposed that bodies moving through the ether contract along their motion, as a physical effect; here the same factor follows from the definition of simultaneity and the two principles, and the paper cites no one for it"
    selectionReason: "It is the first physical consequence § 4 draws from the transformation: lengths along the motion depend on the system that measures them."

  - id: sr-moving-clock
    title: "A moving clock falls behind"
    section: s4
    arguments: [arg-sr-clock-and-length, arg-sr-transported-clock]
    printed:
      - anchor: s4-p5
        sentences: [1, 2]
      - anchor: eq-s4-d6
      - anchor: s4-p6
        sentences: [2]
      - anchor: s4-p8
        sentences: [1, 2]
    equations: [eq-model-sr-time-dilation, eq-model-sr-slow-clock, eq-model-sr-transported-clock]
    oneSentence: "A clock at rest in the moving system, viewed from the stationary system, loses \\(1-\\sqrt{1-(v/V)^2}\\) seconds each second, so a clock moved from A to B, or around a closed curve back to A, lags behind the clock that stayed, by \\(\\frac{1}{2}tv^2/V^2\\) seconds to second order."
    decoder:
      - symbol: "\\(\\tau\\)"
        meaning: "The reading of the clock at the origin of the moving system k: the time of k there. It is k's time coordinate, not a proper time."
      - symbol: "\\(\\tau = t\\sqrt{1-(v/V)^2}\\)"
        meaning: "At the place of that clock, \\(x=vt\\), the transformation gives this: while the stationary system's clocks advance by \\(t\\), the moving clock advances by less."
      - symbol: "\\(\\frac{1}{2}tv^2/V^2\\)"
        meaning: "The lag after a trip lasting \\(t\\) seconds of the stationary system, to within quantities of the fourth and higher order in \\(v/V\\)."
      - symbol: "Unruhuhr"
        meaning: "A balance-wheel clock, the paper's example for the clock at the equator."
    qualifications:
      - kind: approximation
        text: "The lag \\(\\frac{1}{2}tv^2/V^2\\) is printed to within quantities of the fourth and higher order; the exact loss follows from the square root."
      - kind: premise
        text: "The theorem for a closed curve assumes that the result proved for a polygonal line also holds for a continuously curved one, and the paper says it assumes this."
      - kind: inference
        text: "The equator remark applies the closed-curve theorem to the earth's rotation, and it holds in this paper's kinematics alone. The card keeps the remark as printed."
      - kind: comparison
        text: "On the real earth the difference in gravitational potential cancels the effect, and clocks at sea level keep the same rate everywhere, which the later general theory of relativity explains."
    probes:
      - instrument: sr-05
        question: "A clock goes out and back at 0.6 of the speed of light: how far behind the clock that stayed is it at the reunion?"
        preset: sr-05-out-and-back-0.6c
      - instrument: sr-05
        question: "At \\(v/V = 10^{-4}\\), compare the exact loss with the paper's second-order lag."
        preset: sr-05-low-speed-1e-4
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation equations, and an assumption for curved paths"
      modelStatus: "Exact for a straight path, second order as printed, and assumed for a curved one"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the consequence § 4 calls peculiar: two clocks that were synchronous no longer are after one of them has moved."

  - id: sr-velocity-addition
    title: "The addition theorem of velocities"
    section: s5
    arguments: [arg-sr-velocity-composition]
    printed:
      - anchor: s5-p2
        sentences: [3]
      - anchor: eq-s5-d5
      - anchor: s5-p2
        sentences: [7]
      - anchor: eq-s5-d6
      - anchor: s5-p2
        sentences: [8]
      - anchor: s5-p6
        sentences: [1]
      - anchor: eq-s5-d8
    equations: [eq-model-sr-velocity-x, eq-model-sr-velocity-y]
    oneSentence: "A point that moves with the velocity \\(w\\) in the system k, while k moves with \\(v\\) relative to K, has in K a velocity \\(U\\) that for two velocities along one line is \\(U=(v+w)/(1+vw/V^2)\\), so that two velocities smaller than \\(V\\) always compose to one smaller than \\(V\\), and the velocity of light composed with a smaller one stays \\(V\\)."
    decoder:
      - symbol: "\\(U\\)"
        meaning: "The velocity of the point relative to the stationary system K."
      - symbol: "\\(w\\), \\(\\alpha\\)"
        meaning: "The velocity of the point relative to the moving system k, and the angle between the velocities \\(v\\) and \\(w\\)."
      - symbol: "\\(\\varkappa\\), \\(\\lambda\\)"
        meaning: "The amounts by which \\(v\\) and \\(w\\) fall short of \\(V\\), in \\(v=V-\\varkappa\\) and \\(w=V-\\lambda\\), both positive and smaller than \\(V\\). They are speeds; \\(\\lambda\\) is not a wavelength here."
      - symbol: "\"nur in erster Annäherung\""
        meaning: "Only to a first approximation: when \\(v\\) and \\(w\\) are small compared with \\(V\\), the terms divided by \\(V^2\\) are small, and \\(U\\) is close to what the parallelogram of velocities gives."
      - symbol: "the modern layer"
        meaning: "The theorem finds the velocity in K from the velocity in k, with a plus sign. The modern equations run the other way, from K to k, with a minus sign, and write \\(c\\) for \\(V\\)."
    qualifications:
      - kind: premise
        text: "The theorem applies the transformation equations of § 3 to a point moving uniformly in k."
      - kind: conditional
        text: "The bound is proved for two velocities each smaller than \\(V\\); § 4 says that for velocities greater than that of light the paper's considerations become meaningless."
      - kind: comparison
        text: "Laue showed in 1907 that the formula for velocities along one line gives Fresnel's drag coefficient \\(1-1/n^2\\), which Fizeau had measured in flowing water in 1851. That is a later use of the theorem, not part of the paper."
    probes:
      - instrument: sr-06
        question: "Compose 0.6 of the speed of light with 0.6 along one line: what is \\(U\\), and what would the parallelogram of velocities give?"
        preset: sr-06-collinear-0.6-0.6
      - instrument: sr-06
        question: "Compose 0.99 of the speed of light with 0.99: how close to \\(V\\) does \\(U\\) come?"
        preset: sr-06-near-light-0.99
      - instrument: sr-06
        question: "A ray of light crosses k at right angles to the motion: what speed does it have in K?"
        preset: sr-06-null-ray
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation equations"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the theorem § 5 is named for, and it shows that velocities smaller than light's never compose to one that reaches it."

  - id: sr-field-transformation
    title: "The electric and magnetic forces in the moving system"
    section: s6
    arguments: [arg-sr-field-derivatives, arg-sr-field-components]
    printed:
      - anchor: eq-s6-d9
      - anchor: s6-p9
        sentences: [1]
      - anchor: s6-p10
        sentences: [1]
      - anchor: s6-p7
        sentences: [2]
      - anchor: s6-p8
        sentences: [1, 2]
    equations: [eq-model-sr-field-ex, eq-model-sr-field-ey, eq-model-sr-field-ez, eq-model-sr-field-bx, eq-model-sr-field-by, eq-model-sr-field-bz]
    oneSentence: "Carried into the moving system by the equations of § 3, the Maxwell-Hertz equations for empty space keep their form when the electric and magnetic forces in that system are the printed combinations, in which the components along the motion are unchanged and those across it mix electric with magnetic, so that, as the paper concludes, the two forces have no existence independent of the state of motion of the coordinate system."
    decoder:
      - symbol: "\\(X, Y, Z\\) and \\(L, M, N\\)"
        meaning: "The components of the electric and of the magnetic force in K; primed, the same components in k. Here \\(L\\) and \\(N\\) are magnetic components, not the \\(L\\) or the \\(N\\) of the other papers."
      - symbol: "\\(\\beta\\)"
        meaning: "\\(1/\\sqrt{1-(v/V)^2}\\), the factor written \\(\\gamma\\) today, as in § 3."
      - symbol: "\\(Y-\\frac{v}{V}N\\)"
        meaning: "The paper uses Gaussian units, in which electric and magnetic forces have the same dimension. In SI the same combination is \\(E_y-vB_z\\), and the modern layer writes the SI form."
      - symbol: "\"Alte\" and \"Neue Ausdrucksweise\""
        meaning: "The old and the new manner of expression. In the old, a charge moving in a field feels an electromotive force besides the electric force; in the new, the force on it is the electric force in a system in which it is at rest."
    qualifications:
      - kind: premise
        text: "The derivation assumes the Maxwell-Hertz equations for empty space, not a theory of matter, and the principle of relativity, which requires them to hold in the same form in k."
      - kind: premise
        text: "That the transformed quantities are the forces a charge at rest in k would feel is a further step. § 6 takes it by measuring force on a unit charge, and by taking, from the principle of relativity, that a charge of one unit in K is one unit in k; that the equations keep their form does not by itself prove it."
      - kind: approximation
        text: "The old manner of expression is printed with terms in the second and higher powers of \\(v/V\\) neglected. The transformation of the forces is exact."
    probes:
      - instrument: sr-08
        question: "A field that is purely electric in K, seen from k moving at 0.6 of the speed of light: what electric and magnetic forces does k measure?"
        preset: sr-08-pure-electric-0.6c
      - instrument: sr-08
        question: "A field that is purely magnetic in K, seen from k moving at 10 m/s: what electric force does a charge at rest in k feel?"
        preset: sr-08-pure-magnetic-low-speed
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the principle of relativity applied to the Maxwell-Hertz equations, with the forces in k defined by their action on a charge at rest there"
      modelStatus: "Exact within the electrodynamics of empty space"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Lorentz's 1904 theory had already transformed the free-space fields, as mathematical aids in an ether at rest; here they are the forces measured in the moving system"
    selectionReason: "It removes the asymmetry of magnet and conductor with which the introduction opens, as § 6 says in its own words."

  - id: sr-doppler-aberration
    title: "Doppler's principle and aberration for any velocity"
    section: s7
    arguments: [arg-sr-doppler-aberration]
    printed:
      - anchor: s7-p3
        sentences: [1]
      - anchor: eq-s7-d7
      - anchor: s7-p3
        sentences: [2, 3]
      - anchor: eq-s7-d8
      - anchor: s7-p3
        sentences: [4]
      - anchor: eq-s7-d9
      - anchor: s7-p5
        sentences: [2]
    equations: [eq-model-sr-doppler-ratio, eq-model-sr-doppler-factor, eq-model-sr-aberration]
    oneSentence: "An observer who moves with the velocity \\(v\\) relative to a very distant source of frequency \\(\\nu\\), at the angle \\(\\varphi\\) between the line from source to observer and the observer's velocity, perceives the frequency \\(\\nu'=\\nu(1-\\cos\\varphi\\,\\frac{v}{V})/\\sqrt{1-(v/V)^2}\\) and finds the ray at the angle \\(\\varphi'\\) given by \\(\\cos\\varphi'=(\\cos\\varphi-\\frac{v}{V})/(1-\\frac{v}{V}\\cos\\varphi)\\): Doppler's principle and the law of aberration for arbitrary velocities."
    decoder:
      - symbol: "\\(\\nu\\), \\(\\nu'\\)"
        meaning: "The frequency of the light in the system of the source, and the frequency the moving observer perceives."
      - symbol: "\\(\\varphi\\)"
        meaning: "The angle between the line from source to observer and the observer's velocity, measured in the system at rest relative to the source. At \\(\\varphi=0\\) the observer moves away from the source along that line."
      - symbol: "\\(\\varphi'\\)"
        meaning: "The angle between the ray and the same line, as the moving observer measures it."
      - symbol: "\\(v=-\\infty\\), \\(\\nu=\\infty\\)"
        meaning: "As printed. The equation above it grows without bound as \\(v\\) approaches \\(-V\\), an observer approaching the source at nearly the speed of light, and has no real value beyond; the older relation \\(\\nu'=\\nu(1-v/V)\\) grows without bound only as \\(v\\) goes to \\(-\\infty\\), which is the usual view the sentence sets itself against. So the sentence reads as \\(v=-V\\), and its \\(\\nu\\) most likely as the perceived \\(\\nu'\\). Every face keeps the printed reading; the correction is offered here only."
    qualifications:
      - kind: premise
        text: "The source is so distant that near the observer its light is represented, to a sufficient approximation, by a plane wave, as § 7 sets it up; the frequency and the direction follow from transforming that wave's phase and fields."
      - kind: comparison
        text: "Stellar aberration had been observed since Bradley's report of 1729, and Ives and Stilwell measured the second-order Doppler shift in canal rays in 1938, reading it within Lorentz's theory. Both are measurements of the world, separate from this calculation."
    probes:
      - instrument: sr-09
        question: "Approach the source along the line of sight at 0.6 of the speed of light: by what factor does the perceived frequency grow?"
        preset: sr-09-approaching-0.6
      - instrument: sr-09
        question: "A ray at 90 degrees to the motion in the source's system: what frequency and what angle does the observer find?"
        preset: sr-09-transverse-0.6
      - instrument: sr-09
        question: "At the earth's speed in its orbit, how far is a star at right angles to the motion displaced?"
        preset: sr-09-earth-orbit-aberration
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation of a plane wave's phase and fields"
      modelStatus: "Exact within the paper's electrodynamics, for a plane wave from a very distant source"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Doppler's principle and aberration were known before, and the paper names the first after Doppler; their forms for arbitrary velocities are derived in this paper"
    selectionReason: "It is the first consequence § 7 draws for light, and it names it in its own words: Doppler's principle for arbitrary velocities, and the law of aberration in its most general form."

  - id: sr-light-complex-energy
    title: "The energy of a light complex in the moving system"
    section: s8
    arguments: [arg-sr-light-complex]
    printed:
      - anchor: s8-p1
        sentences: [2, 3]
      - anchor: s8-p2
        sentences: [2]
      - anchor: eq-s8-d3
      - anchor: s8-p2
        sentences: [3]
      - anchor: eq-s8-d4
      - anchor: eq-s8-d5
      - anchor: s8-p5
        sentences: [1]
    equations: [eq-model-sr-light-energy, eq-model-sr-light-volume, eq-model-sr-light-density]
    oneSentence: "Measured in the moving system k, the light enclosed by a sphere that moves with it at the speed of light has its energy per unit volume multiplied by \\(q^2\\) and its volume divided by \\(q\\), where \\(q=(1-\\frac{v}{V}\\cos\\varphi)/\\sqrt{1-(v/V)^2}\\), so its energy changes by the factor \\(q\\), the same factor by which its frequency changes."
    decoder:
      - symbol: "\"Lichtkomplex\""
        meaning: "A light complex: the part of a plane wave inside a spherical surface whose centre moves with the speed of light along the wave normal. No energy crosses that surface, so it encloses the same light at every moment."
      - symbol: "\\(A^2/8\\pi\\), \\(A'^2/8\\pi\\)"
        meaning: "The energy of the light per unit volume, in the paper's Gaussian units, measured in K and in k. \\(A\\) and \\(A'\\) are the amplitudes of its electric or magnetic force, transformed in § 7."
      - symbol: "\\(S\\), \\(S'\\)"
        meaning: "The volume the surface encloses, measured in K, where it is a sphere, and in k at the time \\(\\tau=0\\), where it is an ellipsoid."
      - symbol: "\\(E\\), \\(E'\\)"
        meaning: "The light energy the surface encloses, measured in K and in k."
      - symbol: "\\(\\varphi\\)"
        meaning: "The angle between the wave normal of the light and the direction in which k moves, measured in K. At \\(\\varphi=0\\) the light travels the way k moves."
      - symbol: "\\(q\\)"
        meaning: "The modern layer's name for the factor by which the light's frequency changes, § 7's Doppler factor for this direction of the light."
    qualifications:
      - kind: premise
        text: "That \\(A'^2/8\\pi\\) is the light energy per unit volume in k is taken from the principle of relativity, as the first sentence of § 8 says."
      - kind: premise
        text: "The light is a plane wave in empty space, and the complex is the part of it inside the moving sphere; because no energy crosses that surface, the same light is compared in both systems."
      - kind: comparison
        text: "The volume's factor \\(\\sqrt{1-(v/V)^2}/(1-\\frac{v}{V}\\cos\\varphi)\\) depends on the direction of the light: with \\(\\varphi=0\\) and \\(v\\) at 0.6 of the speed of light it is 2, where a rigid body at rest in K is shortened to 0.8 of its length along the motion."
      - kind: comparison
        text: "§ 8 remarks that the energy and the frequency of a light complex change by the same law, and does not connect this with the light quanta of the March paper; reading a complex's energy as \\(h\\nu\\) in every system came later."
    probes:
      - instrument: sr-10
        question: "k moves at 0.6 of the speed of light in the direction the light travels: by what factors do the complex's energy, volume and energy per unit volume change?"
        preset: sr-10-longitudinal-0.6
      - instrument: sr-10
        question: "The same speed, with the light travelling against the motion of k: does the energy grow or shrink, and by the same factor as the frequency?"
        preset: sr-10-opposite-0.6
    usedLater: [energy-transformation]
    meanings:
      argumentStatus: "A consequence of the transformed amplitude of § 7 and of the volume of a surface that moves with the light"
      modelStatus: "Exact within the paper's electrodynamics, for a plane wave in empty space"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper; the remark that energy and frequency transform alike is Einstein's, and the paper does not connect it with light quanta"
    selectionReason: "It is § 8's first result, and the paper calls it remarkable that the energy and the frequency of a light complex change by the same law. The mass-energy paper of September 1905 starts from it, citing § 8."

  - id: sr-moving-mirror
    title: "Light reflected by a moving mirror, and its pressure"
    section: s8
    arguments: [arg-sr-moving-mirror]
    printed:
      - anchor: s8-p6
        sentences: [1, 2]
      - anchor: eq-s8-d12
      - anchor: s8-p10
        sentences: [3, 4]
      - anchor: eq-s8-d13
      - anchor: s8-p10
        sentences: [5]
      - anchor: eq-s8-d14
    equations: [eq-model-sr-mirror-frequency]
    oneSentence: "Light of frequency \\(\\nu\\) and energy per unit volume \\(A^2/8\\pi\\), falling at the angle \\(\\varphi\\) on a perfect mirror that moves with the velocity \\(v\\) along its normal, comes back with the frequency \\(\\nu\\,(1-2\\frac{v}{V}\\cos\\varphi+(v/V)^2)/(1-(v/V)^2)\\) and presses on the mirror with \\(P=2\\frac{A^2}{8\\pi}(\\cos\\varphi-\\frac{v}{V})^2/(1-(v/V)^2)\\), which to a first approximation is \\(2\\frac{A^2}{8\\pi}\\cos^2\\varphi\\), the pressure on a mirror at rest."
    decoder:
      - symbol: "\\(A\\), \\(\\varphi\\), \\(\\nu\\)"
        meaning: "The amplitude, the angle of incidence and the frequency of the incident light, measured in K. The mirror is the plane \\(\\xi=0\\) of k, so its normal is the direction of motion, and \\(\\varphi\\) is the angle between the wave normal and that direction."
      - symbol: "\\(A'''\\), \\(\\varphi'''\\), \\(\\nu'''\\)"
        meaning: "The same quantities for the reflected light, measured in K. The double-primed quantities describe it in k, where the mirror is at rest and reflects it as a mirror at rest does."
      - symbol: "\\((1-\\frac{v}{V})^2\\) in the \\(\\nu'''\\) display"
        meaning: "As printed. The paper's own steps give \\(1-(v/V)^2\\), the denominator of the \\(A'''\\) display above it; with the printed square, a mirror moving along the line of the light would return it with its frequency unchanged. Every face keeps the printed reading, and the modern layer has \\(1-(v/V)^2\\)."
      - symbol: "\\(P\\)"
        meaning: "The pressure of the light on the mirror, force per unit area. It is found from the work it does: the energy arriving on unit area of the mirror in unit time, minus the energy leaving it, equals \\(P\\cdot v\\)."
      - symbol: "\\(2\\frac{A^2}{8\\pi}\\)"
        meaning: "Twice the energy per unit volume. With the energy per unit volume written \\(u\\), in any system of units the pressure is \\(2u(\\cos\\varphi-v/c)^2/(1-v^2/c^2)\\)."
    qualifications:
      - kind: premise
        text: "The mirror is ideal: perfectly reflecting, its motion prescribed, with no recoil, absorption or thickness."
      - kind: inference
        text: "The pressure comes from the energy principle: the difference between the energy arriving on the mirror and the energy leaving it is the work done by the pressure of the light."
      - kind: conditional
        text: "The light reaches the mirror only while \\(V\\cos\\varphi\\) exceeds \\(v\\)."
      - kind: approximation
        text: "The form \\(2\\frac{A^2}{8\\pi}\\cos^2\\varphi\\) neglects the terms in \\(v/V\\). The formula before it is exact within the model."
      - kind: comparison
        text: "The first approximation is the pressure Maxwell's theory gave for a mirror at rest, which Bartoli had also argued for from thermodynamics; Lebedev, and independently Nichols and Hull, measured light pressure in 1901. Those are measurements of the world, separate from this calculation."
    probes:
      - instrument: sr-11
        question: "A mirror receding at 0.6 of the speed of light, the light falling along its normal: what frequency comes back, and what pressure does the light exert?"
        preset: sr-11-normal-0.6
      - instrument: sr-11
        question: "The mirror receding at 0.6 of the speed of light and the light falling at the angle whose cosine is 0.6: does the light reach the mirror at all?"
        preset: sr-11-interception-limit-0.6
    usedLater: []
    meanings:
      argumentStatus: "A consequence of transforming the light to the mirror's rest system, reflecting it there, transforming it back, and applying the energy principle"
      modelStatus: "Exact within the paper's electrodynamics, for a plane wave and an ideal mirror; the \\(\\cos^2\\varphi\\) form is a first approximation"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "The first approximation was Maxwell's pressure on a mirror at rest; the exact formula for a moving mirror is derived in this paper"
    selectionReason: "It is the problem § 8 sets itself, and it is solved by the method the section's last paragraph offers for every problem in the optics of moving bodies: transform the light to a system in which the body is at rest."

  - id: sr-convection-current
    title: "The Maxwell-Hertz equations with convection current keep their form"
    section: s9
    arguments: [arg-sr-charge-current]
    printed:
      - anchor: s9-p2
        sentences: [1]
      - anchor: eq-s9-d3
      - anchor: eq-s9-d4
      - anchor: s9-p2
        sentences: [2]
      - anchor: s9-p3
        sentences: [1]
    equations: [eq-model-sr-charge-density, eq-model-sr-current-density]
    oneSentence: "Carried into the moving system by the transformations of § 3 and § 6, the Maxwell-Hertz equations with convection current, which § 9 states for K, keep their form, with the charge density \\(\\varrho'=\\beta(1-\\frac{v u_x}{V^2})\\varrho\\) and the velocity of the electricity transformed by the addition theorem of § 5; so the electrodynamic basis of Lorentz's theory of moving bodies conforms to the principle of relativity, and a body whose charge is constant in a system moving with it has a constant charge in K as well."
    decoder:
      - symbol: "\\(\\varrho\\), \\(\\varrho'\\)"
        meaning: "\\(4\\pi\\) times the density of electricity, as § 9 defines it, in K and in k."
      - symbol: "\\(u_x, u_y, u_z\\) and \\(u_\\xi, u_\\eta, u_\\zeta\\)"
        meaning: "The velocity of the electricity in K and in k. § 9 notes that the second is the first transformed by the addition theorem of § 5, so it is the velocity measured in k."
      - symbol: "\\(\\beta\\)"
        meaning: "\\(1/\\sqrt{1-(v/V)^2}\\), the factor written \\(\\gamma\\) today, as in § 3."
      - symbol: "\\(u\\varrho\\)"
        meaning: "The convection current: electricity carried along by moving charges, in the equations beside the rate of change of the electric force. In SI the charge density transforms as \\(\\rho'=\\gamma(\\rho-vJ_x/c^2)\\), the modern layer's form."
      - symbol: "\\(\\frac{\\partial L'}{\\partial\\tau}\\), \\(\\frac{\\partial M'}{\\partial\\tau}\\), \\(\\frac{\\partial N'}{\\partial\\tau}\\), as printed"
        meaning: "The three magnetic equations of k are printed without the factor \\(1/V\\) before the time derivative, which the same equations in K carry, as do those of § 6. They contain no convection term and transform as in § 6, so the factor belongs there. Every face keeps the printed reading."
    qualifications:
      - kind: premise
        text: "The electric masses are bound unchangeably to small rigid bodies (ions, electrons); on that supposition the equations are, as § 9 says, the basis of Lorentz's electrodynamics and optics of moving bodies."
      - kind: inference
        text: "What § 9 shows is that the transformed equations have the same form, with charge density and velocity transformed as stated, and it draws from them the constancy of a body's charge. It does not write a four-current or an invariant, and it does not discuss the continuity equation."
      - kind: comparison
        text: "Joining charge and current density into one four-vector, with \\((c\\rho)^2-|J|^2\\) unchanged, is the later language of Poincaré and Minkowski. That a wire carrying a current appears charged to a moving observer is a modern consequence the paper does not discuss."
    probes:
      - instrument: sr-12
        question: "Charge moving at half the speed of light, seen from a system moving at 0.6 of it: what charge density and current does that system measure?"
        preset: sr-12-convection-0.5c
      - instrument: sr-12
        question: "A uniformly charged sphere seen from a system moving at 0.6 of the speed of light: does its charge density change, and does its total charge?"
        preset: sr-12-moving-sphere-0.6c
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformations of §§ 3, 5 and 6 applied to the Maxwell-Hertz equations with convection current"
      modelStatus: "Exact within Lorentz's electrodynamics of charges bound to small rigid bodies"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "The equations are the basis of Lorentz's theory; that they conform to the principle of relativity under these kinematics is shown in this paper, and the four-current is the later language of Poincaré and Minkowski"
    selectionReason: "It is § 9's conclusion in the paper's own words: on its kinematic principles, the electrodynamic basis of Lorentz's theory of the electrodynamics of moving bodies conforms to the principle of relativity."

  - id: sr-electron-masses
    title: "The longitudinal and transverse masses of the electron"
    section: s10
    arguments: [arg-sr-electron-conventions]
    printed:
      - anchor: s10-p7
        sentences: [1, 2, 3]
      - anchor: eq-s10-d4
      - anchor: s10-p7
        sentences: [4]
      - anchor: eq-s10-d5
      - anchor: eq-s10-d6
      - anchor: eq-s10-d7
      - anchor: s10-p8
        sentences: [1]
    equations: [eq-model-sr-longitudinal-mass, eq-model-sr-transverse-mass-printed, eq-model-sr-transverse-mass-laboratory]
    oneSentence: "Calling the force on the electron the force measured in a system that moves with it at that moment, and measuring its acceleration in K, the paper finds the longitudinal mass \\(\\mu/(\\sqrt{1-(v/V)^2})^3\\) and the transverse mass \\(\\mu/(1-(v/V)^2)\\), and warns that other definitions of force and acceleration give other numbers for the masses."
    decoder:
      - symbol: "\\(\\mu\\), \\(\\varepsilon\\)"
        meaning: "The electron's mass, as long as it moves slowly, and its charge."
      - symbol: "\\(\\beta\\)"
        meaning: "\\(1/\\sqrt{1-(v/V)^2}\\), the factor written \\(\\gamma\\) today. The longitudinal mass is \\(\\mu\\beta^3\\) and the transverse mass \\(\\mu\\beta^2\\)."
      - symbol: "\\(\\mu\\beta^3\\) in the third row of (A)"
        meaning: "As printed. The paper's own steps give \\(\\mu\\beta^2\\) for the \\(z\\) row, as for the \\(y\\) row: both directions are across the motion, and the transverse mass two displays below is \\(\\mu\\beta^2\\). Every face keeps the printed \\(\\beta^3\\), and the modern layer has \\(\\gamma^2\\)."
      - symbol: "\\(\\varepsilon X'\\), \\(\\varepsilon Y'\\), \\(\\varepsilon Z'\\)"
        meaning: "The force on the electron measured in the system that moves with it at that moment, which a spring balance at rest in that system could measure, as § 10 says."
      - symbol: "\"Massenzahl × Beschleunigungszahl = Kraftzahl\""
        meaning: "Mass number times acceleration number equals force number: the equation the paper keeps, with force and acceleration defined as it has just stated."
    qualifications:
      - kind: premise
        text: "The force is the one measured in the system moving with the electron at that moment, and the acceleration is measured in K."
      - kind: comparison
        text: "With force and acceleration both measured in K, the transverse ratio is \\(\\mu\\beta\\), today's convention, while the longitudinal ratio is \\(\\mu\\beta^3\\) under both. The paper says as much: other definitions give other numbers, and theories of the motion of the electron must be compared with great care."
      - kind: inference
        text: "§ 10 extends the masses to ponderable material points, since one becomes an electron in the paper's sense when an arbitrarily small charge is added to it."
    probes:
      - instrument: sr-13
        question: "An electron at 0.6 of the speed of light: what ratio of force to acceleration does each convention give, along the motion and across it?"
        preset: sr-13-convention-0.6
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the equations of motion (A), with force and acceleration defined as the paper states"
      modelStatus: "Exact within the paper's dynamics of a charged point; the numbers depend on the definition of force"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Longitudinal and transverse mass were the usual terms of the theory of the electron, as the paper's question says; these values follow from its kinematics"
    selectionReason: "It is the question § 10 asks in the usual terms, with the paper's own warning beside it: the numbers depend on how force and acceleration are defined."

  - id: sr-electron-kinetic-energy
    title: "The kinetic energy of the electron"
    section: s10
    arguments: [arg-sr-electron-work]
    printed:
      - anchor: s10-p10
        sentences: [1, 2, 3, 4]
      - anchor: eq-s10-d8
      - anchor: s10-p11
        sentences: [1, 2]
      - anchor: s10-p12
        sentences: [1]
    equations: [eq-model-sr-electron-work-integral, eq-model-sr-electron-work-result]
    oneSentence: "An electron accelerated slowly from rest along the X-axis by an electrostatic force takes from the field the energy \\(W=\\mu V^2\\{1/\\sqrt{1-(v/V)^2}-1\\}\\), which grows without bound as \\(v\\) approaches \\(V\\), so that, as with the paper's earlier results, speeds greater than that of light have no possibility of existence; the same expression must hold for ponderable masses."
    decoder:
      - symbol: "\\(W\\)"
        meaning: "The kinetic energy of the electron, set equal to the energy taken from the electrostatic field."
      - symbol: "\\(\\int_0^v\\beta^3 v\\,dv\\), as printed"
        meaning: "The middle member lacks the factor \\(\\mu\\), which the first equation of (A) carries; with it, the three members are equal. The result on the right is correct as printed, and every face keeps the printed middle member."
      - symbol: "\\(\\mu V^2\\)"
        meaning: "The electron's mass times the square of the speed of light. The paper does not read it as an energy the electron has at rest; the relation between a body's energy and its inertia is the subject of the paper of September 1905."
    qualifications:
      - kind: premise
        text: "The electron starts from rest at the origin of K and moves along the X-axis under an electrostatic force. It is accelerated slowly, so that it gives up no energy as radiation, and the energy taken from the field is then its kinetic energy."
      - kind: premise
        text: "The first equation of (A), with the longitudinal mass, holds throughout the motion."
      - kind: approximation
        text: "For small \\(v/V\\) the expression becomes \\(\\frac{1}{2}\\mu v^2\\), the kinetic energy of Newton's mechanics."
      - kind: inference
        text: "It holds for ponderable masses by the argument the paper gives for the masses: a small charge makes a ponderable point an electron in its sense."
    probes:
      - instrument: sr-13
        question: "An electron brought from rest to 0.95 of the speed of light: how much kinetic energy has it taken from the field, and how far is that from \\(\\frac{1}{2}\\mu v^2\\)?"
        preset: sr-13-energy-0.95
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the longitudinal equation of motion and the energy principle"
      modelStatus: "Exact within the paper's dynamics, for slow acceleration without radiation"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper; the relation between a body's energy and its inertia is taken up in the mass-energy paper of September 1905"
    selectionReason: "It is the energy § 10 derives, with the limit the paper draws from it: the energy grows without bound as the speed approaches that of light."

  - id: sr-electron-laws
    title: "Three relations for experiment on the electron"
    section: s10
    arguments: [arg-sr-electron-work]
    printed:
      - anchor: s10-p13
        sentences: [1]
      - anchor: s10-p15
        sentences: [1, 2]
      - anchor: eq-s10-d9
      - anchor: s10-p16
        sentences: [1]
      - anchor: s10-p17
        sentences: [1]
      - anchor: eq-s10-d10
      - anchor: s10-p18
        sentences: [1]
      - anchor: eq-s10-d12
      - anchor: s10-p14
        sentences: [1]
    equations: [eq-model-sr-electron-energy, eq-model-sr-magnetic-radius]
    oneSentence: "From the equations of motion (A) the paper draws three relations open to experiment: the ratio of an electron's magnetic to its electric deflectability is \\(v/V\\) at any speed, the potential difference it has passed through fixes its speed by \\(P=\\frac{\\mu}{\\varepsilon}V^2\\{1/\\sqrt{1-(v/V)^2}-1\\}\\), and a magnetic force \\(N\\) at right angles to its motion bends its path with the radius \\(R=V^2\\frac{\\mu}{\\varepsilon}\\frac{v/V}{\\sqrt{1-(v/V)^2}}\\frac{1}{N}\\); these three, it says, express completely the laws by which the electron must move on its theory."
    decoder:
      - symbol: "\\(A_m\\), \\(A_e\\)"
        meaning: "The magnetic and the electric deflectability of the electron. An electric force \\(Y\\) and a magnetic force \\(N\\) deflect it equally when \\(Y=N\\,v/V\\)."
      - symbol: "\\(P\\)"
        meaning: "Here the potential difference the electron has passed through from rest. In § 8 the same letter is the pressure of light."
      - symbol: "\\(R\\), \\(N\\)"
        meaning: "The radius of curvature of the path, and a magnetic force at right angles to the electron's velocity, the only deflecting force. \\(N\\) is a magnetic component here, not a number of molecules."
      - symbol: "\\(\\frac{\\mu}{\\varepsilon}V^2\\)"
