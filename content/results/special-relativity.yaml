# The results of Zur Elektrodynamik bewegter Körper (ap-17-891), as the results face shows them
# (dispatch 241), in the form of content/results/mass-energy.yaml. Checked by
# src/content/results/resultCards.ts.
#
# The as-printed layer is never typed here: each entry names an anchor of the German face (a
# display, or sentences of a paragraph by their order in it) and the text is read from the face.
# This paper has no ledger draft, so the face is read from its source blocks
# (src/content/results/sourceBlockFace.ts), as the German face is. Einstein's notation stays on
# the printed side: β is the modern γ, τ is the moving system's time coordinate (not a proper
# time), and V is the speed of light (content/notation/special-relativity.yaml). Everything
# written here (the one-sentence reading, the decoder, the qualifications, the probe questions) is
# draft explanatory prose. Historical statements come from the historian's-margin readings of
# the laboratories (content/editorial/readings-owners/am-sr-*.yaml), which cite their sources, and
# a misprint is explained from its record in docs/provenance/ap-17-891.md while the printed reading
# stays on the quoted side.
#
# A card's common wrong turns are not listed here: each record in
# content/misconceptions/special-relativity names the results it concerns in its resultIds, bound
# to the cards that quote its anchored paragraphs. "Used later" notes stay empty until margin
# records exist to cite. Probes name the laboratory, the question, and a preset its manifest
# registers (content/experiments/sr-NN.yaml).
paper: special-relativity
review: draft
cards:
  - id: sr-synchronous-clocks
    title: "Synchronous clocks and the time of a distant event"
    section: s1
    arguments: [arg-sr-synchronization]
    printed:
      - anchor: s1-p7
        sentences: [4, 5, 6]
      - anchor: eq-s1-d1
      - anchor: s1-p9
        sentences: [2]
      - anchor: s1-p10
        sentences: [1]
      - anchor: eq-s1-d2
      - anchor: s1-p11
        sentences: [1]
    equations: [eq-model-sr-sync-equal-legs, eq-model-sr-sync-midpoint]
    oneSentence: "Two clocks at rest at A and B run synchronously, by definition, when a ray of light that leaves A at \\(t_A\\), is reflected at B at \\(t_B\\) and returns to A at \\(t'_A\\) takes as long out as back, \\(t_B-t_A=t'_A-t_B\\); the time of an event is then the reading of such a clock at its place, and the quantity \\(2\\overline{AB}/(t'_A-t_A)\\) is set, in accordance with experience, to be a universal constant, the speed of light in empty space."
    decoder:
      - symbol: "\\(t_A\\), \\(t_B\\), \\(t'_A\\)"
        meaning: "The departure of the ray from A, read on A's clock; its reflection at B, read on B's clock; and its return to A, read on A's clock."
      - symbol: "\\(\\overline{AB}\\)"
        meaning: "The distance between A and B."
      - symbol: "\\(V\\)"
        meaning: "The speed of light in empty space, printed V; today it is written c."
      - symbol: "\"durch Definition\""
        meaning: "By definition, letter-spaced in the print: that light takes as long from A to B as from B to A is stipulated, and nothing in the procedure measures it."
      - symbol: "\"die Zeit des ruhenden Systems\""
        meaning: "The time of the stationary system: the paper stresses that the time so defined belongs to clocks at rest in that system."
    qualifications:
      - kind: premise
        text: "The paper assumes that the definition can be applied without contradiction to any number of points: if the clock at B is synchronous with the clock at A, then A's is synchronous with B's, and two clocks synchronous with a third are synchronous with each other."
      - kind: premise
        text: "Two different things are laid down. The equality of the two travel times is a definition; that the round-trip quantity is a universal constant is stipulated in accordance with experience."
      - kind: comparison
        text: "Whether the equal-times rule is a free choice was argued later, beginning with Reichenbach in 1928, and the question is still debated. The paper calls it a definition."
    probes:
      - instrument: sr-01
        question: "A signal leaves A at 0 s and returns at 10 s: what must B's clock read at the moment of reflection?"
        preset: sr-01-sync-0-10
      - instrument: sr-01
        question: "Light goes 10 light-seconds out and back: what does \\(2\\overline{AB}/(t'_A-t_A)\\) come to?"
        preset: sr-01-round-trip-10ls
      - instrument: sr-01
        question: "Clocks at B and at C are each synchronous with the clock at A: are they synchronous with each other?"
        preset: sr-01-three-stations
    usedLater: []
    meanings:
      argumentStatus: "A definition, with an assumption that it is consistent and a stipulation from experience"
      modelStatus: "A definition for clocks at rest in one system"
      evidentialRole: "A definition, not evidence; the constancy of the round-trip speed is taken from experience"
      historicalStatus: "In 1900 Poincaré had described observers moving through the ether who set their clocks by exchanging light signals and so obtain Lorentz's local time, to first order; here the procedure defines the time of the stationary system"
    selectionReason: "Every later section rests on it: it defines the time of a distant event, and with it what simultaneous means."

  - id: sr-relativity-of-simultaneity
    title: "The relativity of simultaneity"
    section: s2
    arguments: [arg-sr-rod-events]
    printed:
      - anchor: eq-s2-d2
      - anchor: eq-s2-d3
      - anchor: s2-p7
        sentences: [4]
      - anchor: s2-p8
        sentences: [1]
    equations: [eq-model-sr-simultaneity-offset]
    oneSentence: "Clocks at the two ends of a moving rod, which the stationary system calls synchronous, are not synchronous by the moving observers' own test, so two events that are simultaneous in one coordinate system are in general not simultaneous in a system moving relative to it."
    decoder:
      - symbol: "\\(t_A\\), \\(t_B\\), \\(t'_A\\)"
        meaning: "The times, read on the stationary system's clocks, at which a ray of light leaves the end A of the rod, is reflected at the end B, and arrives back at A."
      - symbol: "\\(r_{AB}\\)"
        meaning: "The length of the moving rod, measured in the stationary system."
      - symbol: "\\(v\\)"
        meaning: "The speed of the rod along the X-axis of the stationary system."
      - symbol: "\\(V\\)"
        meaning: "The speed of light, printed V; today it is written c."
      - symbol: "why the two times differ"
        meaning: "In the stationary system the ray chases the end B, which moves away at \\(v\\), and meets the end A coming toward it, so the way out takes \\(r_{AB}/(V-v)\\) and the way back \\(r_{AB}/(V+v)\\). The test of § 1 that the moving observers apply calls the clocks synchronous only when the two times are equal."
    qualifications:
      - kind: premise
        text: "The result rests on § 1's definition of synchronous clocks, by a ray of light sent out and reflected, and on the principle of the constancy of the velocity of light. Simultaneity at a distance is defined by that procedure; the paper does not observe it."
    probes:
      - instrument: sr-01
        question: "Two clocks 10 light-seconds apart move at 0.6 of the speed of light and are set by the moving observers' own test: how far apart do they read in the stationary system, and which one is ahead?"
        preset: sr-01-moving-pair-0.6c
      - instrument: sr-03
        question: "Take two events that are simultaneous in K: at what times does k assign them?"
        preset: sr-03-valid-pair-0.6c
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the definition of synchronous clocks and the two principles"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper. In 1900 Poincaré had described observers moving through the ether who set their clocks by light signals and so obtain Lorentz's local time, to first order"
    selectionReason: "It is the conclusion § 2 draws in its own words: the concept of simultaneity has no absolute meaning."

  - id: sr-principles-compatible
    title: "The two principles are compatible"
    section: s3
    arguments: [arg-sr-lorentz-map]
    printed:
      - anchor: s3-p16
        sentences: [1]
      - anchor: eq-s3-d17
      - anchor: eq-s3-d18
      - anchor: s3-p17
        sentences: [1, 2]
    equations: []
    oneSentence: "A spherical light wave sent out from the common origin at the time zero spreads with the speed \\(V\\) in the stationary system and, transformed by the equations of § 3, also with the speed \\(V\\) in the moving system, which shows that the principle of relativity and the constancy of the speed of light are compatible."
    decoder:
      - symbol: "\\(x^2+y^2+z^2=V^2t^2\\)"
        meaning: "The points the wave has just reached at the time \\(t\\) of the stationary system K: a sphere of radius \\(Vt\\)."
      - symbol: "\\(\\xi^2+\\eta^2+\\zeta^2=V^2\\tau^2\\)"
        meaning: "The same wave front in the coordinates of the moving system k, at its time \\(\\tau\\): again a sphere, growing at the speed \\(V\\)."
      - symbol: "\\(\\xi, \\eta, \\zeta, \\tau\\)"
        meaning: "The coordinates and the time of the moving system k, as § 3 defines them; \\(\\tau\\) is k's time coordinate, not a proper time."
    qualifications:
      - kind: premise
        text: "The transformation equations were built from the constancy of the speed of light in the stationary system and the definition of time; the spherical wave checks that the same holds in the moving system, which is what the principle of relativity requires."
    probes:
      - instrument: sr-04
        question: "With the constructed map at 0.6 of the speed of light, does a ray keep the speed of light in both systems?"
        preset: sr-04-construct-0.6c
      - instrument: sr-04
        question: "Put the Galilean map on the same rays: what speed does it give the light in the moving system?"
        preset: sr-04-galilean-shelf
    usedLater: []
    meanings:
      argumentStatus: "A check that the two postulates do not contradict each other"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A consistency argument, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "The introduction calls the two postulates only apparently irreconcilable; this is where § 3 shows they agree."

  - id: sr-transformation-equations
    title: "The transformation equations"
    section: s3
    arguments: [arg-sr-lorentz-map, arg-sr-transverse-and-inverse]
    printed:
      - anchor: s3-p22
        sentences: [10]
      - anchor: eq-s3-d25
      - anchor: eq-s3-d26
    equations: [eq-model-sr-map-time, eq-model-sr-map-position, eq-model-sr-lorentz-factor]
    oneSentence: "An event with coordinates \\(x, y, z\\) and time \\(t\\) in the stationary system has, in a system moving along x with speed \\(v\\), the time \\(\\tau=\\beta(t-vx/V^2)\\) and the coordinates \\(\\xi=\\beta(x-vt)\\), \\(\\eta=y\\), \\(\\zeta=z\\), once the unknown factor \\(\\varphi(v)\\) of the derivation is shown to be 1."
    decoder:
      - symbol: "\\(\\beta\\)"
        meaning: "Einstein's β is \\(1/\\sqrt{1-(v/V)^2}\\), the factor written γ today. It is not today's β, which means \\(v/c\\)."
      - symbol: "\\(\\tau\\)"
        meaning: "The time of the moving system k at the event, as its own clocks, set by § 1's rule, read it. It is k's time coordinate, not a proper time."
      - symbol: "\\(\\xi, \\eta, \\zeta\\)"
        meaning: "The event's coordinates in k, whose axes are parallel to those of the stationary system K."
      - symbol: "\\(V\\)"
        meaning: "The speed of light, printed V; today it is written c."
      - symbol: "\\(\\varphi(v)=1\\)"
        meaning: "The derivation leaves a factor \\(\\varphi(v)\\) open. A third system moving back with \\(-v\\) gives \\(\\varphi(v)\\varphi(-v)=1\\), and a rod moving across its length, which cannot depend on the sense of the motion, gives \\(\\varphi(v)=\\varphi(-v)\\); so \\(\\varphi(v)=1\\)."
    qualifications:
      - kind: premise
        text: "The equations follow from the two principles, from § 1's definition of time and from the symmetry arguments the paper states; the factor \\(\\varphi(v)\\) is fixed by symmetry, not by an observation."
    probes:
      - instrument: sr-04
        question: "At 0.6 of the speed of light, what does the constructed map give for β, and which constraint fixes each coefficient?"
        preset: sr-04-construct-0.6c
      - instrument: sr-03
        question: "Boost to 0.6 of the speed of light: what do the two systems say about the same two events?"
        preset: sr-03-boost-0.6c
    usedLater: []
    meanings:
      argumentStatus: "The derivation of § 3, completed by a symmetry argument"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Lorentz had published equivalent coordinate equations in 1904, as a change of variables with a local time, and Poincaré named them the Lorentz transformation in June 1905; this paper derives them from its two principles and cites neither"
    selectionReason: "Every later section of the paper applies these equations: to rods and clocks, to velocities, to the fields and to light."

  - id: sr-moving-rigid-body
    title: "A moving sphere measured as an ellipsoid"
    section: s4
    arguments: [arg-sr-clock-and-length]
    printed:
      - anchor: s4-p1
        sentences: [4]
      - anchor: eq-s4-d3
      - anchor: s4-p3
        sentences: [1, 2, 3]
    equations: [eq-model-sr-length-contraction]
    oneSentence: "A rigid body that is a sphere of radius \\(R\\) when measured at rest has, measured from the stationary system while it moves with speed \\(v\\), the shape of an ellipsoid whose axis along the motion is \\(R\\sqrt{1-(v/V)^2}\\) and whose two other axes stay \\(R\\)."
    decoder:
      - symbol: "\\(R\\sqrt{1-(v/V)^2}\\)"
        meaning: "The length of the axis along the motion, measured in the stationary system: the sphere is shortened in the ratio \\(1:\\sqrt{1-(v/V)^2}\\) in that direction only."
      - symbol: "\\(R, R\\)"
        meaning: "The two axes across the motion, which the motion leaves unchanged."
      - symbol: "\"vom ruhenden System aus betrachtet\""
        meaning: "Viewed from the stationary system: the shape is found from the positions of the body's points at one time \\(t=0\\) of that system."
      - symbol: "\\(v=V\\)"
        meaning: "At the speed of light every moving object would be flat in the stationary system; for speeds greater than light the paper says its considerations become meaningless."
    qualifications:
      - kind: premise
        text: "The shape is a set of positions read at one time of the stationary system. It is not what a camera would record, which also depends on when light from each point left it."
    probes:
      - instrument: sr-03
        question: "The sphere moving at 0.6 of the speed of light: what are its three axes in the stationary system?"
        preset: sr-03-sphere-0.6c
      - instrument: sr-03
        question: "Measure k's rod from K and K's rod from k: is the shortening the same both ways?"
        preset: sr-03-reciprocal-0.6c
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation equations"
      modelStatus: "Exact within the paper's kinematics, for a body the paper calls rigid"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "FitzGerald in 1889 and Lorentz in 1892 had proposed that bodies moving through the ether contract along their motion, as a physical effect; here the same factor follows from the definition of simultaneity and the two principles, and the paper cites no one for it"
    selectionReason: "It is the first physical consequence § 4 draws from the transformation: lengths along the motion depend on the system that measures them."

  - id: sr-moving-clock
    title: "A moving clock falls behind"
    section: s4
    arguments: [arg-sr-clock-and-length, arg-sr-transported-clock]
    printed:
      - anchor: s4-p5
        sentences: [1, 2]
      - anchor: eq-s4-d6
      - anchor: s4-p6
        sentences: [2]
      - anchor: s4-p8
        sentences: [1, 2]
    equations: [eq-model-sr-time-dilation, eq-model-sr-slow-clock, eq-model-sr-transported-clock]
    oneSentence: "A clock at rest in the moving system, viewed from the stationary system, loses \\(1-\\sqrt{1-(v/V)^2}\\) seconds each second, so a clock moved from A to B, or around a closed curve back to A, lags behind the clock that stayed, by \\(\\frac{1}{2}tv^2/V^2\\) seconds to second order."
    decoder:
      - symbol: "\\(\\tau\\)"
        meaning: "The reading of the clock at the origin of the moving system k: the time of k there. It is k's time coordinate, not a proper time."
      - symbol: "\\(\\tau = t\\sqrt{1-(v/V)^2}\\)"
        meaning: "At the place of that clock, \\(x=vt\\), the transformation gives this: while the stationary system's clocks advance by \\(t\\), the moving clock advances by less."
      - symbol: "\\(\\frac{1}{2}tv^2/V^2\\)"
        meaning: "The lag after a trip lasting \\(t\\) seconds of the stationary system, to within quantities of the fourth and higher order in \\(v/V\\)."
      - symbol: "Unruhuhr"
        meaning: "A balance-wheel clock, the paper's example for the clock at the equator."
    qualifications:
      - kind: approximation
        text: "The lag \\(\\frac{1}{2}tv^2/V^2\\) is printed to within quantities of the fourth and higher order; the exact loss follows from the square root."
      - kind: premise
        text: "The theorem for a closed curve assumes that the result proved for a polygonal line also holds for a continuously curved one, and the paper says it assumes this."
      - kind: inference
        text: "The equator remark applies the closed-curve theorem to the earth's rotation, and it holds in this paper's kinematics alone. On the real earth the difference in gravitational potential cancels it, and clocks at sea level keep the same rate everywhere, which the later general theory of relativity explains. The card keeps the remark as printed."
    probes:
      - instrument: sr-05
        question: "A clock goes out and back at 0.6 of the speed of light: how far behind the clock that stayed is it at the reunion?"
        preset: sr-05-out-and-back-0.6c
      - instrument: sr-05
        question: "At \\(v/V = 10^{-4}\\), compare the exact loss with the paper's second-order lag."
        preset: sr-05-low-speed-1e-4
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation equations, and an assumption for curved paths"
      modelStatus: "Exact for a straight path, second order as printed, and assumed for a curved one"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the consequence § 4 calls peculiar: two clocks that were synchronous no longer are after one of them has moved."

  - id: sr-velocity-addition
    title: "The addition theorem of velocities"
    section: s5
    arguments: [arg-sr-velocity-composition]
    printed:
      - anchor: s5-p2
        sentences: [3]
      - anchor: eq-s5-d5
      - anchor: s5-p2
        sentences: [7]
      - anchor: eq-s5-d6
      - anchor: s5-p2
        sentences: [8]
      - anchor: s5-p6
        sentences: [1]
      - anchor: eq-s5-d8
    equations: [eq-model-sr-velocity-x, eq-model-sr-velocity-y]
    oneSentence: "A point that moves with the velocity \\(w\\) in the system k, while k moves with \\(v\\) relative to K, has in K a velocity \\(U\\) that for two velocities along one line is \\(U=(v+w)/(1+vw/V^2)\\), so that two velocities smaller than \\(V\\) always compose to one smaller than \\(V\\), and the velocity of light composed with a smaller one stays \\(V\\)."
    decoder:
      - symbol: "\\(U\\)"
        meaning: "The velocity of the point relative to the stationary system K."
      - symbol: "\\(w\\), \\(\\alpha\\)"
        meaning: "The velocity of the point relative to the moving system k, and the angle between the velocities \\(v\\) and \\(w\\)."
      - symbol: "\\(\\varkappa\\), \\(\\lambda\\)"
        meaning: "The amounts by which \\(v\\) and \\(w\\) fall short of \\(V\\), in \\(v=V-\\varkappa\\) and \\(w=V-\\lambda\\), both positive and smaller than \\(V\\). They are speeds; \\(\\lambda\\) is not a wavelength here."
      - symbol: "\"nur in erster Annäherung\""
        meaning: "Only to a first approximation: when \\(v\\) and \\(w\\) are small compared with \\(V\\), the terms divided by \\(V^2\\) are small, and \\(U\\) is close to what the parallelogram of velocities gives."
      - symbol: "the modern layer"
        meaning: "The theorem finds the velocity in K from the velocity in k, with a plus sign. The modern equations run the other way, from K to k, with a minus sign, and write \\(c\\) for \\(V\\)."
    qualifications:
      - kind: premise
        text: "The theorem applies the transformation equations of § 3 to a point moving uniformly in k."
      - kind: conditional
        text: "The bound is proved for two velocities each smaller than \\(V\\); § 4 says that for velocities greater than that of light the paper's considerations become meaningless."
      - kind: comparison
        text: "Laue showed in 1907 that the formula for velocities along one line gives Fresnel's drag coefficient \\(1-1/n^2\\), which Fizeau had measured in flowing water in 1851. That is a later use of the theorem, not part of the paper."
    probes:
      - instrument: sr-06
        question: "Compose 0.6 of the speed of light with 0.6 along one line: what is \\(U\\), and what would the parallelogram of velocities give?"
        preset: sr-06-collinear-0.6-0.6
      - instrument: sr-06
        question: "Compose 0.99 of the speed of light with 0.99: how close to \\(V\\) does \\(U\\) come?"
        preset: sr-06-near-light-0.99
      - instrument: sr-06
        question: "A ray of light crosses k at right angles to the motion: what speed does it have in K?"
        preset: sr-06-null-ray
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation equations"
      modelStatus: "Exact within the paper's kinematics"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Introduced in this paper"
    selectionReason: "It is the theorem § 5 is named for, and it shows that velocities smaller than light's never compose to one that reaches it."

  - id: sr-field-transformation
    title: "The electric and magnetic forces in the moving system"
    section: s6
    arguments: [arg-sr-field-derivatives, arg-sr-field-components]
    printed:
      - anchor: eq-s6-d9
      - anchor: s6-p9
        sentences: [1]
      - anchor: s6-p10
        sentences: [1]
      - anchor: s6-p7
        sentences: [2]
      - anchor: s6-p8
        sentences: [1, 2]
    equations: [eq-model-sr-field-ex, eq-model-sr-field-ey, eq-model-sr-field-ez, eq-model-sr-field-bx, eq-model-sr-field-by, eq-model-sr-field-bz]
    oneSentence: "Carried into the moving system by the equations of § 3, the Maxwell-Hertz equations for empty space keep their form when the electric and magnetic forces in that system are the printed combinations, in which the components along the motion are unchanged and those across it mix electric with magnetic, so that, as the paper concludes, the two forces have no existence independent of the state of motion of the coordinate system."
    decoder:
      - symbol: "\\(X, Y, Z\\) and \\(L, M, N\\)"
        meaning: "The components of the electric and of the magnetic force in K; primed, the same components in k. Here \\(L\\) and \\(N\\) are magnetic components, not the \\(L\\) or the \\(N\\) of the other papers."
      - symbol: "\\(\\beta\\)"
        meaning: "\\(1/\\sqrt{1-(v/V)^2}\\), the factor written \\(\\gamma\\) today, as in § 3."
      - symbol: "\\(Y-\\frac{v}{V}N\\)"
        meaning: "The paper uses Gaussian units, in which electric and magnetic forces have the same dimension. In SI the same combination is \\(E_y-vB_z\\), and the modern layer writes the SI form."
      - symbol: "\"Alte\" and \"Neue Ausdrucksweise\""
        meaning: "The old and the new manner of expression. In the old, a charge moving in a field feels an electromotive force besides the electric force; in the new, the force on it is the electric force in a system in which it is at rest."
    qualifications:
      - kind: premise
        text: "The derivation assumes the Maxwell-Hertz equations for empty space, not a theory of matter, and the principle of relativity, which requires them to hold in the same form in k."
      - kind: premise
        text: "That the transformed quantities are the forces a charge at rest in k would feel is a further step. § 6 takes it by measuring force on a unit charge, and by taking, from the principle of relativity, that a charge of one unit in K is one unit in k; that the equations keep their form does not by itself prove it."
      - kind: approximation
        text: "The old manner of expression is printed with terms in the second and higher powers of \\(v/V\\) neglected. The transformation of the forces is exact."
    probes:
      - instrument: sr-08
        question: "A field that is purely electric in K, seen from k moving at 0.6 of the speed of light: what electric and magnetic forces does k measure?"
        preset: sr-08-pure-electric-0.6c
      - instrument: sr-08
        question: "A field that is purely magnetic in K, seen from k moving at 10 m/s: what electric force does a charge at rest in k feel?"
        preset: sr-08-pure-magnetic-low-speed
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the principle of relativity applied to the Maxwell-Hertz equations, with the forces in k defined by their action on a charge at rest there"
      modelStatus: "Exact within the electrodynamics of empty space"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Lorentz's 1904 theory had already transformed the free-space fields, as mathematical aids in an ether at rest; here they are the forces measured in the moving system"
    selectionReason: "It removes the asymmetry of magnet and conductor with which the introduction opens, as § 6 says in its own words."

  - id: sr-doppler-aberration
    title: "Doppler's principle and aberration for any velocity"
    section: s7
    arguments: [arg-sr-doppler-aberration]
    printed:
      - anchor: s7-p3
        sentences: [1]
      - anchor: eq-s7-d7
      - anchor: s7-p3
        sentences: [2, 3]
      - anchor: eq-s7-d8
      - anchor: s7-p3
        sentences: [4]
      - anchor: eq-s7-d9
      - anchor: s7-p5
        sentences: [2]
    equations: [eq-model-sr-doppler-ratio, eq-model-sr-doppler-factor, eq-model-sr-aberration]
    oneSentence: "An observer who moves with the velocity \\(v\\) relative to a very distant source of frequency \\(\\nu\\), at the angle \\(\\varphi\\) between the line from source to observer and the observer's velocity, perceives the frequency \\(\\nu'=\\nu(1-\\cos\\varphi\\,\\frac{v}{V})/\\sqrt{1-(v/V)^2}\\) and finds the ray at the angle \\(\\varphi'\\) given by \\(\\cos\\varphi'=(\\cos\\varphi-\\frac{v}{V})/(1-\\frac{v}{V}\\cos\\varphi)\\): Doppler's principle and the law of aberration for arbitrary velocities."
    decoder:
      - symbol: "\\(\\nu\\), \\(\\nu'\\)"
        meaning: "The frequency of the light in the system of the source, and the frequency the moving observer perceives."
      - symbol: "\\(\\varphi\\)"
        meaning: "The angle between the line from source to observer and the observer's velocity, measured in the system at rest relative to the source. At \\(\\varphi=0\\) the observer moves away from the source along that line."
      - symbol: "\\(\\varphi'\\)"
        meaning: "The angle between the ray and the same line, as the moving observer measures it."
      - symbol: "\\(v=-\\infty\\), \\(\\nu=\\infty\\)"
        meaning: "As printed. The equation above it grows without bound as \\(v\\) approaches \\(-V\\), an observer approaching the source at nearly the speed of light, and has no real value beyond; the older relation \\(\\nu'=\\nu(1-v/V)\\) grows without bound only as \\(v\\) goes to \\(-\\infty\\), which is the usual view the sentence sets itself against. So the sentence reads as \\(v=-V\\), and its \\(\\nu\\) most likely as the perceived \\(\\nu'\\). Every face keeps the printed reading; the correction is offered here only."
    qualifications:
      - kind: premise
        text: "The source is so distant that near the observer its light is represented, to a sufficient approximation, by a plane wave, as § 7 sets it up; the frequency and the direction follow from transforming that wave's phase and fields."
      - kind: comparison
        text: "Stellar aberration had been observed since Bradley's report of 1729, and Ives and Stilwell measured the second-order Doppler shift in canal rays in 1938, reading it within Lorentz's theory. Both are measurements of the world, separate from this calculation."
    probes:
      - instrument: sr-09
        question: "Approach the source along the line of sight at 0.6 of the speed of light: by what factor does the perceived frequency grow?"
        preset: sr-09-approaching-0.6
      - instrument: sr-09
        question: "A ray at 90 degrees to the motion in the source's system: what frequency and what angle does the observer find?"
        preset: sr-09-transverse-0.6
      - instrument: sr-09
        question: "At the earth's speed in its orbit, how far is a star at right angles to the motion displaced?"
        preset: sr-09-earth-orbit-aberration
    usedLater: []
    meanings:
      argumentStatus: "A consequence of the transformation of a plane wave's phase and fields"
      modelStatus: "Exact within the paper's electrodynamics, for a plane wave from a very distant source"
      evidentialRole: "A derivation, not evidence"
      historicalStatus: "Doppler's principle and aberration were known before, and the paper names the first after Doppler; their forms for arbitrary velocities are derived in this paper"
    selectionReason: "It is the first consequence § 7 draws for light, and it names it in its own words: Doppler's principle for arbitrary velocities, and the law of aberration in its most general form."
