        - sectionId: lq-s1
          anchor: lq-s1-p3
        - sectionId: lq-s5
          anchor: lq-s5-p6
    notes: "Modern notation writes the ratio R/N as Boltzmann's constant, a symbol the paper never prints. The C of §5 is identified with R/N later in the argument; until then the two are kept apart."
    sources:
      facsimilePage: 134
      anchor: lq-s1-p3
    verification:
      printed: true
      checkedAgainst: "Plate of printed page 134 (public/figures/plates/pages/ap-17-132/134-1280.webp): glyph read by eye from the page image, not the text layer. The entry's former page 133 carries no mathematics. The group is first printed on page 134 (§1) as R over N in a stacked fraction multiplying T; the inline form R/N is first printed on page 141. An agent check, not a human review; human review pending."
      by: "agent:ConcordanceCheck-light-quanta"
      date: "2026-09-24"

  - id: lq.R_beta_N.planckConstant
    paper: light-quanta
    # lq-s7 added by dispatch 256: § 7 prints the group on p. 144, "Energiequanten von der Größe
    # (R/N)βν" and (R/N)βν₂ ≦ (R/N)βν₁, read from the plate (public/figures/plates/pages/ap-17-132/144-1280.webp).
    scope: ["lq-s2", "lq-s6", "lq-s7", "lq-s8", "lq-s9"]
    glyph:
      unicode: "Rβ/N"
      latex: "R\\beta/N"
      variant: plain
    meaning: "The printed group Rβ/N, Planck's constant"
    binding:
      quantityId: planckConstant
    operation:
      kind: rename
      target:
        form: group
        pattern:
          kind: divide
          left:
            kind: multiply
            terms: ["molarGasConstant", "wienConstantBeta"]
          right:
            kind: term
            terms: ["avogadroConstant"]
        modernGlyph: "h"
    notes: "The paper never writes h. It prints this group only with ν attached, as Rβν/N (first on page 143) and as (R/N)βν. Modern notation writes the whole group Rβ/N as Planck's constant h."
    sources:
      facsimilePage: 143
      anchor: lq-s6-p6
    verification:
      printed: true
      checkedAgainst: "Plate of printed page 143 (public/figures/plates/pages/ap-17-132/143-1280.webp): glyph read by eye from the page image, not the text layer. The entry's former page 134 does not carry this group. It is printed only with ν attached: first as Rβν/N on page 143 (§6, 'Energiequanten von der Größe Rβν/N'), then as (R/N)βν on pages 144 and 145 and as R over N times βν on page 146. The string Rβ/N without ν is not printed. An agent check, not a human review; human review pending."
      by: "agent:ConcordanceCheck-light-quanta"
      date: "2026-09-24"

  - id: lq.beta.wienConstant
    paper: light-quanta
    scope: ["lq-s2", "lq-s6", "lq-s8", "lq-s9"]
    glyph:
      unicode: "β"
      latex: "\\beta"
      variant: plain
    meaning: "Wien's constant in the exponential; in modern terms, Planck's constant over Boltzmann's"
    binding:
      quantityId: wienConstantBeta
    # Filed as a modernization, not a rename, by TanElk's ruling (dispatch 259). As a rename to the
    # expression h/k_B it would have drawn § 2's N = (β/α)·8πR/L³ as N = R/k_B.
    operation:
      kind: modernization
      modernLensRef: "lq-planck-constants-identification"
      argumentChangeDescription: "Reading β as h/k, Planck's constant over Boltzmann's, is Planck's identification of Wien's constant. It changes the argument, and it is not a new name for the letter. § 2 finds N = (β/α)·8πR/L³ by comparing coefficients. With β = h/k and α = 8πh/c³ written in, that becomes N = R/k, a molecular number drawn from a constant that already contains it. The modern notation keeps a letter."
    collision:
      severity: danger
      kind: cross-toggle
      collidesWith: ["lorentzFactor", "speedRatio"]
      collidesWithModern: ["\\gamma", "speedRatio"]
      firstUseAnchor: lq-s2-p2
      firstUseBySection:
        - sectionId: lq-s2
          anchor: lq-s2-p2
        - sectionId: lq-s6
          anchor: lq-s6-p1
        - sectionId: lq-s8
          anchor: lq-s8-p2
        - sectionId: lq-s9
          anchor: lq-s9-p1
    notes: "The third meaning of β. In paper 3 it is the factor a modern reader writes γ. It is not v/c: read as v/c, every later formula looks plausible and is wrong."
    sources:
      facsimilePage: 136
      anchor: lq-s2-p2
    verification:
      printed: true
      checkedAgainst: "Plate of printed page 136 (public/figures/plates/pages/ap-17-132/136-1280.webp): glyph read by eye from the page image, not the text layer. The entry's former page 134 does not carry β. β is first printed on page 136 (§2), in the exponent of Planck's formula and as β = 4,866 · 10⁻¹¹. An agent check, not a human review; human review pending."
      by: "agent:ConcordanceCheck-light-quanta"
      date: "2026-09-24"

