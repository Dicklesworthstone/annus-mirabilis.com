# Scoped Notation Concordance for Light Quanta (ap-17-132)
# Specification: AGENTS.md, am-not-concordance-model-uag, am-not-entries-light-quanta-9cb.
# Verification status: on 2026-09-24 an agent (agent:ConcordanceCheck-light-quanta)
# read every glyph by eye from the plate images of printed pages 132 to 148
# (public/figures/plates/pages/ap-17-132/), never the text layer and never OCR.
# Each entry records that check, and the page and paragraph of its first printed
# use where it has one; four editorial entries are marked as not printed.
# No human has reviewed them. Scopes and bindings follow AGENTS.md, the quantity
# registry and the bead's required list; they were not re-derived from the plates.
# No parallel markdown ledger: pending/verified status lives on each entry.

paper: light-quanta

entries:
  # =========================================================================
  # Groups and constants
  # =========================================================================
  - id: lq.R.molarGasConstant
    paper: light-quanta
    scope: ["lq-s1", "lq-s2", "lq-s5", "lq-s6", "lq-s8", "lq-s9"]
    glyph:
      unicode: "R"
      latex: "R"
      variant: plain
    meaning: "Universal molar gas constant, as printed"
    binding:
      quantityId: molarGasConstant
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "R"
    notes: "The value R = 8.31 · 10⁷ erg/(mol·K) is the one this edition uses for Einstein's printed constants: an input, not a correction of anything printed."
    sources:
      facsimilePage: 134
      anchor: lq-s1-p3
    verification:
      printed: true
      checkedAgainst: "Plate of printed page 134 (public/figures/plates/pages/ap-17-132/134-1280.webp): glyph read by eye from the page image, not the text layer. Italic R, named 'die absolute Gaskonstante', first printed on page 134 (§1) beside the first display of R over N. An agent check, not a human review; human review pending."
      by: "agent:ConcordanceCheck-light-quanta"
      date: "2026-09-24"

  - id: lq.N.avogadroConstant
    paper: light-quanta
