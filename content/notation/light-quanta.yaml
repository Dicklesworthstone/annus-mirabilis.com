# Scoped Notation Concordance for Light Quanta (ap-17-132)
# Specification: AGENTS.md, am-not-concordance-model-uag, am-not-entries-light-quanta-9cb.
# Verification status: all entries are marked pending per honesty constraint
# (no pinned facsimile scan is currently committed in the repository).
# Glyphs and scopes follow AGENTS.md, the quantity registry, and the bead's
# required list. They are not compared to page pixels. Absence is recorded;
# invented facsimile readings are not admitted.
# No parallel markdown ledger: pending/verified status lives on each entry.

paper: light-quanta

entries:
  # =========================================================================
  # Groups and constants
  # =========================================================================
  - id: lq.R.molarGasConstant
    paper: light-quanta
    scope: ["lq-s1", "lq-s2", "lq-s5", "lq-s6", "lq-s8", "lq-s9"]
    glyph:
      unicode: "R"
      latex: "R"
      variant: plain
    meaning: "Universal molar gas constant, as printed"
    binding:
      quantityId: molarGasConstant
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "R"
    notes: "The value R = 8.31e7 erg/(mol·K) is an editorial input of the printed-historical constant set, not a concordance repair."
    sources:
      facsimilePage: 134
      anchor: lq-s2-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-17-132)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: lq.N.avogadroConstant
    paper: light-quanta
    scope: ["lq-s1", "lq-s2", "lq-s5", "lq-s6", "lq-s8", "lq-s9"]
    glyph:
      unicode: "N"
      latex: "N"
      variant: plain
    meaning: "Einstein's number of molecules in a gram-molecule, computed in §2 from Planck's constants"
    binding:
      quantityId: avogadroConstant
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "N_A"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["magneticFieldComponent"]
      collidesWithModern: ["magneticFieldComponent"]
      firstUseAnchor: lq-s2-p1
      firstUseBySection:
        - sectionId: lq-s2
          anchor: lq-s2-p1
    notes: "Avogadro's number here and in paper 2. A magnetic-field component in paper 3. Printed 6.17e23 is a printed-historical constant-set entry, not a concordance correction."
    sources:
      facsimilePage: 134
      anchor: lq-s2-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-17-132)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: lq.R_over_N.boltzmannConstant
    paper: light-quanta
    scope: ["lq-s1", "lq-s2", "lq-s5", "lq-s6"]
    glyph:
      unicode: "R/N"
      latex: "R/N"
      variant: plain
    meaning: "The printed group R/N, Boltzmann's constant"
    binding:
      quantityId: boltzmannConstant
    operation:
      kind: rename
      target:
        form: group
        pattern:
          kind: divide
          left:
            kind: term
            terms: ["molarGasConstant"]
          right:
            kind: term
            terms: ["avogadroConstant"]
        modernGlyph: "k_B"
    collision:
      severity: caution
      kind: within-paper
      collidesWith: ["lq.C.universalEntropyConstant"]
      collidesWithModern: ["k_B"]
      firstUseAnchor: lq-s1-p1
      firstUseBySection:
        - sectionId: lq-s1
          anchor: lq-s1-p1
        - sectionId: lq-s5
          anchor: lq-s5-p1
    notes: "Group rename matched on bound quantity ids, never on the characters R/N. k_B is not a printed symbol. §5's C is identified with this group later; the two quantity ids stay distinct until that identification."
    sources:
      facsimilePage: 133
      anchor: lq-s1-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-17-132)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: lq.R_beta_N.planckConstant
    paper: light-quanta
    scope: ["lq-s2", "lq-s6", "lq-s8", "lq-s9"]
    glyph:
      unicode: "Rβ/N"
      latex: "R\\beta/N"
      variant: plain
    meaning: "The printed group R beta / N, Planck's constant"
    binding:
      quantityId: planckConstant
    operation:
      kind: rename
      target:
        form: group
        pattern:
          kind: divide
          left:
            kind: multiply
            terms: ["molarGasConstant", "wienConstantBeta"]
          right:
            kind: term
            terms: ["avogadroConstant"]
        modernGlyph: "h"
    notes: "The paper never writes h. Group rename only. h is not a printed symbol."
    sources:
      facsimilePage: 134
      anchor: lq-s2-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-17-132)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: lq.beta.wienConstant
    paper: light-quanta
    scope: ["lq-s2", "lq-s6", "lq-s8", "lq-s9"]
    glyph:
      unicode: "β"
      latex: "\\beta"
      variant: plain
    meaning: "Wien's constant in the exponential, the modern h/k_B"
    binding:
      quantityId: wienConstantBeta
    operation:
      kind: rename
      target:
        form: expression
        modernTree:
          kind: divide
          left:
            kind: term
            terms: ["planckConstant"]
          right:
            kind: term
            terms: ["boltzmannConstant"]
        modernGlyph: "h/k_B"
    collision:
      severity: danger
      kind: cross-toggle
      collidesWith: ["lorentzFactor", "speedRatio"]
      collidesWithModern: ["\\gamma", "speedRatio"]
      firstUseAnchor: lq-s2-p1
      firstUseBySection:
        - sectionId: lq-s2
          anchor: lq-s2-p1
        - sectionId: lq-s6
          anchor: lq-s6-p1
        - sectionId: lq-s8
          anchor: lq-s8-p1
        - sectionId: lq-s9
          anchor: lq-s9-p1
    notes: "The third meaning of beta. In paper 3 it is the Lorentz factor (modern gamma). It is not v/c. Assuming beta = v/c makes every later formula look plausible and be wrong. Rename of an expression, not a one-letter swap."
    sources:
      facsimilePage: 134
      anchor: lq-s2-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-17-132)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: lq.alpha.wienConstant
    paper: light-quanta
    scope: ["lq-s1", "lq-s2"]
    glyph:
      unicode: "α"
      latex: "\\alpha"
      variant: plain
    meaning: "Wien's prefactor constant in the radiation law"
    binding:
      quantityId: wienConstantAlpha
    operation:
      kind: rename
      target:
        form: expression
        modernTree:
          kind: divide
          left:
            kind: multiply
            terms: ["8", "pi", "planckConstant"]
          right:
            kind: power
            terms: ["speedOfLight"]
            factor: 3
        modernGlyph: "8\\pi h/c^{3}"
    collision:
      severity: caution
      kind: within-paper
      collidesWith: ["lq.alpha_nu.fourierPhase"]
      collidesWithModern: ["fourierPhase"]
      firstUseAnchor: lq-s1-p1
      firstUseBySection:
        - sectionId: lq-s1
          anchor: lq-s1-p1
        - sectionId: lq-s2
          anchor: lq-s2-p1
    notes: "Expression rename. This entry never carries or corrects a printed value. A suspected exponent misprint of alpha belongs to the provenance receipt, not here."
    sources:
      facsimilePage: 133
      anchor: lq-s1-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-17-132)"
      by: "Editorial Staff"
      date: "2026-09-17"

