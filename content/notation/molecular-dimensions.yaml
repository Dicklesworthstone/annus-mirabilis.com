modernOnlySymbols:
  - id: md.intrinsicViscosity
    glyph:
      unicode: "[η]"
      latex: "[\\eta]"
      variant: plain
    binding:
      quantityId: suspensionViscosityCoefficient
    scope: ["md-1911"]
    introducedBy: "modern-notation"
    label: "Modern intrinsic viscosity. Equal to 5/2 for rigid spheres; never substituted for the 1906 printed 1, and never called k."
