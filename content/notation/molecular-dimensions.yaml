# Scoped Notation Concordance for Molecular Dimensions (ap-19-289, companion)
# and the 1911 viscosity-law correction (ap-34-591).
# Specification: AGENTS.md, am-not-concordance-model-uag.
# There is no br issue am-not-entries-molecular-dimensions; this file is the
# companion's concordance so the k-as-viscosity pair with paper 2 is complete.
# Verification status: on 2026-09-24, 10 of the 11 entries were read by eye from page images
# of the pinned scans ap-19-289 and ap-34-591 (pdftoppm pixels, never the text layer) by an
# agent, and each says so on its own record; md.one.viscosityLawCoefficient1906 stays pending.
# None has been reviewed by a human. Absence is recorded; invented facsimile readings are not
# admitted.
# No parallel markdown ledger: pending/verified status lives on each entry.

paper: molecular-dimensions

entries:
  # =========================================================================
  # Viscosity: solvent, suspension, and the coefficient of phi
  # =========================================================================
  - id: md.k.viscosity
    paper: molecular-dimensions
    scope: ["md-s1", "md-s2", "md-s3", "md-s4", "md-1906", "md-1911"]
    glyph:
      unicode: "k"
      latex: "k"
      variant: plain
    meaning: "Solvent viscosity in the dilute-suspension law, as printed"
    binding:
      quantityId: viscosity
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "\\eta"
    collision:
      severity: danger
      kind: cross-toggle
      collidesWith: ["boltzmannConstant"]
      collidesWithModern: ["boltzmannConstant"]
      firstUseAnchor: md-s1-p1
      firstUseBySection:
        - sectionId: md-s1
          anchor: md-s1-p1
        - sectionId: md-1906
          anchor: md-1906-p1
        - sectionId: md-1911
          anchor: md-1911-p1
    notes: "The same danger collision as paper 2: Einstein's k is viscosity, never Boltzmann's constant. The coefficient of phi in the viscosity law is never called k."
    sources:
      facsimilePage: 289
      anchor: md-s1-p1
    verification:
      printed: true
      checkedAgainst: "Page image of printed page 289 (PDF page 1 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): italic k in 'dem Reibungskoeffizienten k', the first paragraph of §1, as the fluid's viscosity. Also printed as the solvent viscosity on pages 591 and 592 of the 1911 correction (public/papers/pdfs/ap-34-591.pdf). Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.kstar.effectiveViscosity
    paper: molecular-dimensions
    scope: ["md-s1", "md-s2", "md-1906", "md-1911"]
    glyph:
      unicode: "k*"
      latex: "k^*"
      variant: plain
    meaning: "Effective viscosity of the dilute suspension, as printed"
    binding:
      quantityId: effectiveViscosity
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "\\eta^*"
    notes: "k-star is the suspension viscosity. The solvent viscosity is k. Neither is Boltzmann's constant."
    sources:
      facsimilePage: 300
      anchor: md-s1-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): k with a raised asterisk. Not on page 289; first printed on page 300 (PDF page 12), 'Bezeichnen wir mit k* den Reibungskoeffizienten des Gemisches', then k* = k(1 + φ). Also printed on page 592 of the 1911 correction. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.phi.volumeFraction
    paper: molecular-dimensions
    scope: ["md-s1", "md-s2", "md-s3", "md-1906", "md-1911"]
    glyph:
      unicode: "φ"
      latex: "\\varphi"
      variant: plain
    meaning: "Volume fraction of suspended spheres in the dilute-suspension viscosity law"
    binding:
      quantityId: volumeFraction
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "\\varphi"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["spectralEntropyDensity", "transitionKernel", "propagationAngleStationary"]
      collidesWithModern: ["spectralEntropyDensity", "transitionKernel", "propagationAngleStationary"]
      firstUseAnchor: md-s1-p1
      firstUseBySection:
        - sectionId: md-s1
          anchor: md-s1-p1
    notes: "Volume fraction here. Spectral entropy density in paper 1, transition kernel in paper 2, an angle in paper 3."
    sources:
      facsimilePage: 298
      anchor: md-s1-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): the looped lower-case phi. Not on page 289; first printed on page 298 (PDF page 10) in equation (7b), W = 2δ²k(1 − φ), and defined at the top of page 299 as the fraction of the volume taken by the spheres. The capital Φ on pages 296 to 298 is a different symbol, the volume of one sphere. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.one.viscosityLawCoefficient1906
    paper: molecular-dimensions
    scope: ["md-1906"]
    glyph:
      unicode: "1"
      latex: "1"
      variant: plain
    meaning: "Coefficient of φ in the 1906 viscosity law k* = k(1 + φ), printed as 1"
    binding:
      quantityId: suspensionViscosityCoefficient
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "1"
    collision:
      severity: danger
      kind: cross-toggle
      collidesWith: ["md.k.viscosity"]
      collidesWithModern: ["k", "\\eta"]
      firstUseAnchor: md-1906-p1
      firstUseBySection:
        - sectionId: md-1906
          anchor: md-1906-p1
    notes: "The 1906 printing, not k. The 1911 correction prints 2,5 for the same coefficient (modern 5/2), listed separately. The modern value for rigid spheres, 5/2, is not substituted here, or the 1906 error would be hidden."
    sources:
      facsimilePage: 289
      anchor: md-1906-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-19-289)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: md.fiveHalves.viscosityLawCoefficient1911
    paper: molecular-dimensions
    scope: ["md-1911"]
    glyph:
      unicode: "2,5"
      latex: "2{,}5"
      variant: plain
    meaning: "Coefficient of φ after the 1911 correction, printed as 2,5 (modern 5/2)"
    binding:
      quantityId: suspensionViscosityCoefficient
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "\\frac{5}{2}"
    collision:
      severity: danger
      kind: cross-toggle
      collidesWith: ["md.k.viscosity"]
      collidesWithModern: ["k", "\\eta"]
      firstUseAnchor: md-1911-p1
      firstUseBySection:
        - sectionId: md-1911
          anchor: md-1911-p1
    # Moved from the note, which readers see, by dispatch 246
    #   (D-2026-09-25-no-review-status-banners): "Ann. Phys. (4) 34, 591-592. Not k. N scales as the
    #   square root of this coefficient. This value is not silently back-ported onto the 1906
    #   printing. Corrected 2026-09-24 from the plate: the 1911 correction prints this coefficient as
    #   the decimal 2,5, in k* = k(1 + 2,5 φ) on page 592, not as the fraction 5/2."
    notes: "Ann. Phys. (4) 34, 591-592. Not k. N scales as the square root of this coefficient. This value is not silently back-ported onto the 1906 printing. The 1911 correction prints this coefficient as the decimal 2,5, in k* = k(1 + 2,5 φ) on page 592, not as the fraction 5/2."
    sources:
      facsimilePage: 592
      anchor: md-1911-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 591 and 592 (PDF pages 1 and 2 of public/papers/pdfs/ap-34-591.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): the coefficient of φ is printed as the decimal 2,5, in k* = k(1 + 2,5 φ) and again in '2,5 mal stärker', both on page 592. The recorded glyph 5/2 is not printed, and the glyph was corrected to 2,5. Page 591 does not print this coefficient (the ½ there is the coefficient of Φ in the corrected equation (7)). Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.relative.relativeViscosity
    paper: molecular-dimensions
    scope: ["md-s1", "md-1906", "md-1911"]
    glyph:
      unicode: "k*/k"
      latex: "k^*/k"
      variant: plain
    meaning: "Ratio of suspension viscosity to solvent viscosity"
    binding:
      quantityId: relativeViscosity
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "\\eta^*/\\eta"
    notes: "The ratio k-star/k. Distinct from the coefficient of phi."
    sources:
      facsimilePage: 301
      anchor: md-s1-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): k* over k. Not on page 289; first printed on page 301 (PDF page 13), as the display fraction k*/k = 1 + φ and inline as k*/k = 1,0245, and again on page 304 in §5. Not printed in the 1911 correction. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  # =========================================================================
  # Particles, counts, and related printed symbols
  # =========================================================================
  - id: md.P.particleRadius
    paper: molecular-dimensions
    scope: ["md-s1", "md-s2", "md-s3", "md-s4"]
    glyph:
      unicode: "P"
      latex: "P"
      variant: plain
    meaning: "Radius of a suspended sphere"
    binding:
      quantityId: particleRadius
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "a"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["workFunction"]
      collidesWithModern: ["workFunction"]
      firstUseAnchor: md-s1-p1
      firstUseBySection:
        - sectionId: md-s1
          anchor: md-s1-p1
    notes: "The radius here and in paper 2; the work function in paper 1. Printed as italic P, first on page 291, where the sphere is given the radius P."
    sources:
      facsimilePage: 291
      anchor: md-s1-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): italic P as the radius of the sphere. Not on page 289; first printed on page 291 (PDF page 3), 'dem Radius P'. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.N.avogadroConstant
    paper: molecular-dimensions
    scope: ["md-s1", "md-s2", "md-s3", "md-s4"]
    glyph:
      unicode: "N"
      latex: "N"
      variant: plain
    meaning: "Number of molecules in a gram-molecule"
    binding:
      quantityId: avogadroConstant
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "N_A"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["magneticFieldStationary"]
      collidesWithModern: ["magneticFieldStationary"]
      firstUseAnchor: md-s3-p1
      firstUseBySection:
        - sectionId: md-s3
          anchor: md-s3-p1
    notes: "Avogadro's number here and in papers 1 and 2. A magnetic-field component in paper 3. N scales as the square root of the coefficient of phi."
    sources:
      facsimilePage: 302
      anchor: md-s3-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): italic N. Not on page 300; first printed on page 302 (PDF page 14), at the end of §3, '342/N cm³, ... N die Anzahl der wirklichen Moleküle in einem Grammolekül'. Also printed on page 592 of the 1911 correction. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.D.diffusionCoefficient
    paper: molecular-dimensions
    scope: ["md-s3", "md-s4"]
    glyph:
      unicode: "D"
      latex: "D"
      variant: plain
    meaning: "Diffusion coefficient of the dissolved substance"
    binding:
      quantityId: diffusionCoefficient
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "D"
    notes: "Used with Stokes drag and osmotic pressure to infer the size of a molecule. Printed as italic D, first as the diffusion coefficient on page 303, in §4. On pages 293 and 294, in §1, the same letter names an auxiliary function."
    sources:
      facsimilePage: 303
      anchor: md-s3-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): italic D as the diffusion coefficient. Not on page 300 and not in §3; first printed on page 303 (PDF page 15) in §4, 'für den Diffusionskoeffizienten D'. The same letter is printed on pages 293 and 294 (§1, in equations (5) and (5a) and the lines after them) for an auxiliary function, not a diffusion coefficient. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.T.temperature
    paper: molecular-dimensions
    scope: ["md-s3", "md-s4"]
    glyph:
      unicode: "T"
      latex: "T"
      variant: plain
    meaning: "Absolute temperature"
    binding:
      quantityId: temperature
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "T"
    sources:
      facsimilePage: 303
      anchor: md-s3-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): italic T. Not on page 300 and not in §3; first printed on page 303 (PDF page 15) in §4, 'wobei T die absolute Temperatur'. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

  - id: md.R.molarGasConstant
    paper: molecular-dimensions
    scope: ["md-s3", "md-s4"]
    glyph:
      unicode: "R"
      latex: "R"
      variant: plain
    meaning: "Universal molar gas constant"
    binding:
      quantityId: molarGasConstant
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "R"
    sources:
      facsimilePage: 303
      anchor: md-s3-p1
    verification:
      printed: true
      checkedAgainst: "Page images of printed pages 289 to 306 (PDF pages 1 to 18 of public/papers/pdfs/ap-19-289.pdf, rendered with pdftoppm at 200 dpi, the cited line again at 400 dpi): italic R as the gas constant. Not on page 300 and not in §3; first printed on page 303 (PDF page 15) in §4, 'R = 8,31 . 10⁷'. The same letter is printed on pages 295 and 296 (§1) and 299 and 300 (§2) for the radius of a large sphere, and on page 591 of the 1911 correction. Read by eye from the page image, not the text layer. An agent check, not a human review."
      by: "agent:ConcordanceCheck-molecular-dimensions"
      date: "2026-09-24"

modernOnlySymbols:
  - id: md.intrinsicViscosity
    glyph:
      unicode: "[η]"
      latex: "[\\eta]"
      variant: plain
    binding:
      quantityId: suspensionViscosityCoefficient
    scope: ["md-1911"]
    introducedBy: "modern-notation"
    label: "Modern intrinsic viscosity. Equal to 5/2 for rigid spheres; never substituted for the 1906 printed 1, and never called k."
