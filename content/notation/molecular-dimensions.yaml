      firstUseAnchor: md-s1-p1
      firstUseBySection:
        - sectionId: md-s1
          anchor: md-s1-p1
    notes: "Radius here and in paper 2. Work function in paper 1. Glyph pending facsimile."
    sources:
      facsimilePage: 289
      anchor: md-s1-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-19-289)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: md.N.avogadroConstant
    paper: molecular-dimensions
    scope: ["md-s1", "md-s2", "md-s3", "md-s4"]
    glyph:
      unicode: "N"
      latex: "N"
      variant: plain
    meaning: "Number of molecules in a gram-molecule"
    binding:
      quantityId: avogadroConstant
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "N_A"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["magneticFieldStationary"]
      collidesWithModern: ["magneticFieldStationary"]
      firstUseAnchor: md-s3-p1
      firstUseBySection:
        - sectionId: md-s3
          anchor: md-s3-p1
    notes: "Avogadro's number here and in papers 1 and 2. A magnetic-field component in paper 3. N scales as the square root of the coefficient of phi."
    sources:
      facsimilePage: 300
      anchor: md-s3-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-19-289)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: md.D.diffusionCoefficient
    paper: molecular-dimensions
    scope: ["md-s3", "md-s4"]
    glyph:
      unicode: "D"
      latex: "D"
      variant: plain
    meaning: "Diffusion coefficient of the dissolved substance"
    binding:
      quantityId: diffusionCoefficient
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "D"
    notes: "Glyph pending facsimile. Used with Stokes drag and osmotic pressure to infer molecular size."
    sources:
      facsimilePage: 300
      anchor: md-s3-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-19-289)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: md.T.temperature
    paper: molecular-dimensions
    scope: ["md-s3", "md-s4"]
    glyph:
      unicode: "T"
      latex: "T"
      variant: plain
    meaning: "Absolute temperature"
    binding:
      quantityId: temperature
    operation:
      kind: rename
      target:
        form: symbol
        modernGlyph: "T"
    sources:
      facsimilePage: 300
      anchor: md-s3-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-19-289)"
      by: "Editorial Staff"
      date: "2026-09-17"

  - id: md.R.molarGasConstant
    paper: molecular-dimensions
    scope: ["md-s3", "md-s4"]
    glyph:
      unicode: "R"
      latex: "R"
      variant: plain
    meaning: "Universal molar gas constant"
