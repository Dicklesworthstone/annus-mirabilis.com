# Scoped Notation Concordance for Mass-Energy Equivalence (ap-18-639)
# Specification: AGENTS.md, am-not-concordance-model-uag, am-not-entries-mass-energy-wq2.
# Verification status: all entries are marked pending per honesty constraint
# (no pinned facsimile scan is currently committed in the repository).
# Glyphs and scopes follow AGENTS.md, the quantity registry, and the paper's
# printed text. They reflect checked period transcriptions rather than direct
# pixel verifications. Absence is recorded; invented facsimile readings
# are not admitted.
# No parallel markdown ledger: pending/verified status lives on each entry.

paper: mass-energy

