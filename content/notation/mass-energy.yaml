  # =========================================================================
  # The Lorentz Factor (Pending Facsimile Verification)
  # =========================================================================
  - id: me.root.lorentzFactor
    paper: mass-energy
    scope: ["me-s0"]
    glyph:
      unicode: "1/√(1 - v²/V²)"
      latex: "\\frac{1}{\\sqrt{1 - v^2/V^2}}"
      variant: plain
    meaning: "The Lorentz factor; printed form unconfirmed (explicit radical vs. beta) pending facsimile"
    binding:
      quantityId: lorentzFactor
    operation:
      kind: rename
      target:
        form: group
        pattern:
          kind: divide
          left:
            kind: number
            value: 1
          right:
            kind: root
            terms: ["speedOfLight", "frameSpeed"]
        modernGlyph: "\\gamma"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["wienConstantBeta", "speedRatio"]
      collidesWithModern: ["speedRatio"]
      firstUseAnchor: me-s0-p1
      firstUseBySection:
        - sectionId: me-s0
          anchor: me-s0-p1
    notes: "The printed form in paper 4 (whether written as an explicit radical 1/\\sqrt{1 - v^2/V^2} or as shorthand \\beta) is UNKNOWN pending direct facsimile verification against ap-18-639. In modern notation, this expression maps to \\gamma."
    sources:
      facsimilePage: 639
      anchor: me-s0-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-18-639)"
      by: "Editorial Staff"
      date: "2026-09-17"

