  # =========================================================================
  # The Lorentz Factor (Pending Facsimile Verification)
  # =========================================================================
  - id: me.root.lorentzFactor
    paper: mass-energy
    scope: ["me-s0"]
    glyph:
      unicode: "1/√(1 - v²/V²)"
      latex: "\\frac{1}{\\sqrt{1 - v^2/V^2}}"
      variant: plain
    meaning: "The Lorentz factor, printed throughout as an explicit radical; β does not appear in this paper"
    binding:
      quantityId: lorentzFactor
    operation:
      kind: rename
      target:
        form: group
        pattern:
          kind: divide
          left:
            kind: number
            value: 1
          right:
            kind: root
            terms: ["speedOfLight", "frameSpeed"]
        modernGlyph: "\\gamma"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["wienConstantBeta", "speedRatio"]
      collidesWithModern: ["speedRatio"]
      firstUseAnchor: me-s0-p5
      firstUseBySection:
        - sectionId: me-s0
          anchor: me-s0-p5
    # Moved from the note, which readers see, by dispatch 246
    #   (D-2026-09-25-no-review-status-banners): "Checked against the printed pages: the factor is
    #   printed as an explicit radical every time, six times (p. 639 once, p. 640 four times, p. 641
    #   once). β is not printed anywhere in this paper, although the relativity paper uses β for the
    #   same factor. Modern notation writes the whole radical as γ."
    notes: "The factor is printed as an explicit radical every time, six times (p. 639 once, p. 640 four times, p. 641 once). β is not printed anywhere in this paper, although the relativity paper uses β for the same factor. Modern notation writes the whole radical as γ."
    sources:
      facsimilePage: 639
      anchor: me-s0-p5
    verification:
      printed: true
      checkedAgainst: "Pinned facsimile ap-18-639 (sha256 c4770702edca3047c324a92cc0a008e27355c236b3e5e0a87d75eea630ab5f19), pages 639-641 re-rendered at 400 dpi and read as images; no OCR. Log: docs/editorial/mass-energy-notation-verification.md"
      by: "pane31 (agent reading; not the human German source review)"
      date: "2026-09-19"

