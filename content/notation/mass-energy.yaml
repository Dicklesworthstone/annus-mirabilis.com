# Two entries were removed in that pass because the facsimile does not print them:
# me.K.stationarySystem and me.k.movingSystem. This paper names its coordinate
# systems by their coordinates, (x, y, z) and (xi, eta, zeta); K and k as system
# labels belong to paper 3. K here means kinetic energy and nothing else.
# beta is not printed in this paper either; see the log and the bead comment.

