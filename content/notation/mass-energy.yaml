        modernGlyph: "c"
    collision:
      severity: caution
      kind: cross-paper
      collidesWith: ["volume"]
      collidesWithModern: ["volume"]
      firstUseAnchor: me-s0-p1
      firstUseBySection:
        - sectionId: me-s0
