  # =========================================================================
  # Unit Conversion (CGS ergs to grams with rounded speed of light)
  # =========================================================================
  - id: me.9e20.cgsConversion
    paper: mass-energy
    scope: ["me-s0"]
    glyph:
      unicode: "9 · 10²⁰"
      latex: "9\\cdot 10^{20}"
      variant: plain
    meaning: "Printed factor (3·10^10 cm/s)^2 in CGS converting energy in ergs to mass in grams"
    binding:
      nonQuantityKind: unit-symbol
    operation:
      kind: unitConversion
      fromSystem: cgs
      toSystem: si
      factor: 1e-17
      conversionDerivationRef: "Printed 9e20 (cm/s)^2 rounds V to 3e10 cm/s. In SI, 1/c^2 = 1/(2.99792e8 m/s)^2 = 1.11265e-17 kg/J. The printed value 1/(9e20 erg/g) = 1/(9e20 * 1e-7 J / 1e-3 kg) = 1/(9e16 J/kg) = 1.11111e-17 kg/J, which is 0.14% above exact modern 1/c^2 because Einstein rounded V."
    notes: "Unit-conversion entry for the paper's printed 9*10^20 factor. That is 0.14 percent above modern c^2 = 8.98755*10^20 cm^2/s^2 because the paper rounds V to 3*10^10 cm/s."
    sources:
      facsimilePage: 641
      anchor: me-s0-p6
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-18-639)"
      by: "Editorial Staff"
      date: "2026-09-17"

