  # =========================================================================
  # Unit Conversion (CGS ergs to grams with rounded speed of light)
  # =========================================================================
  - id: me.9e20.cgsConversion
    paper: mass-energy
    scope: ["me-s0"]
    glyph:
      unicode: "9 · 10²⁰"
      latex: "9\\cdot 10^{20}"
      variant: plain
    meaning: "Printed factor (3 · 10¹⁰ cm/s)², which turns an energy in ergs into a mass in grams"
    binding:
      nonQuantityKind: unit-symbol
    operation:
      kind: unitConversion
      fromSystem: cgs
      toSystem: si
      factor: 1e-17
      conversionDerivationRef: "Printed 9e20 (cm/s)^2 rounds V to 3e10 cm/s. In SI, 1/c^2 = 1/(2.99792e8 m/s)^2 = 1.11265e-17 kg/J. The printed value 1/(9e20 erg/g) = 1/(9e20 * 1e-7 J / 1e-3 kg) = 1/(9e16 J/kg) = 1.11111e-17 kg/J, which is 0.14% above exact modern 1/c^2 because Einstein rounded V."
    notes: "The paper's printed factor 9 · 10²⁰ is 0.14 percent above the modern c² = 8.98755 · 10²⁰ cm²/s², because the paper rounds V to 3 · 10¹⁰ cm/s."
    sources:
      facsimilePage: 641
      anchor: me-s0-p15
    verification:
      printed: true
      checkedAgainst: "Pinned facsimile ap-18-639 (sha256 c4770702edca3047c324a92cc0a008e27355c236b3e5e0a87d75eea630ab5f19), pages 639-641 re-rendered at 400 dpi and read as images; no OCR. Log: docs/editorial/mass-energy-notation-verification.md"
