    notes: "Speed of light in vacuum. In modern notation written c. Collides with volume V in papers 1 and 2."
    sources:
      facsimilePage: 639
      anchor: me-s0-p1
    verification:
      printed: true
      checkedAgainst: "Pending facsimile scan (ap-18-639)"
      by: "Editorial Staff"
