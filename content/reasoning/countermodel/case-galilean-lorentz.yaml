schemaVersion: 1
id: case-galilean-lorentz
title: Which constraint makes the difference?
question: Does a model that works for slow objects also keep the light speed unchanged?
scope: The low-speed check, the light-speed postulate, and the inverse test ask different questions. Deselecting a requirement changes which questions count; it does not change a computed prediction or disprove classical mechanics.
review: draft
defaultBeta: 0.6
sources:
  - id: einstein-1905-kinematics
    label: Einstein (1905), Zur Elektrodynamik bewegter Körper, §§2–5
    url: https://doi.org/10.1002/andp.19053221004
    parallelWork: false
candidates:
  - id: galilean
    label: Galilean absolute time
    modelVersion: galilean-absolute-time-v1
    circumstances: Ordinary low-speed mechanics with a shared absolute time. A change of coordinates has an inverse; retaining absolute time need not preserve the measured light speed.
    historicalStatus: available-before-cutoff
    sourceIds:
      - einstein-1905-kinematics
  - id: lorentz
    label: Einstein’s inertial-frame kinematics
    modelVersion: lorentz-1905-kinematics-v1
    circumstances: Aligned inertial frames with the relativity and light-speed postulates. This comparison tests consequences of the resulting map; it does not derive the map from its own predictions.
    historicalStatus: introduced-in-current-paper
    sourceIds:
      - einstein-1905-kinematics
tests:
  - id: low-speed
    label: 'Low-speed composition: 10 m/s plus 10 m/s'
    kind: constraint
    test: low-speed
    inputs:
      u: 10
      v: 10
    tolerance:
      absolute: 1.0e-09
      relative: 1.0e-12
      reason: A stated numerical comparison threshold, not a measurement uncertainty or a confidence interval. The absolute floor also covers zero components.
    explanation: Both candidates are compared with ordinary addition at the stated low speeds. The relativistic residual uses a cancellation-free expression so rounding two nearly equal speeds does not conceal the difference. This check keeps its own speeds when the main observer setting changes.
  - id: light-speed
    label: Light-speed postulate
    kind: constraint
    test: light-speed
    inputs: {}
    tolerance:
      absolute: 1.0e-06
      relative: 1.0e-12
      reason: A stated numerical comparison threshold, not a measurement uncertainty or a confidence interval. The absolute floor also covers zero components.
    explanation: Transform the two events on a light ray and divide their spatial separation by their time separation. The required reference is the light speed, not a result copied from the competing candidate.
  - id: inverse
    label: Forward map followed by its inverse
    kind: constraint
    test: inverse
    inputs:
      events:
