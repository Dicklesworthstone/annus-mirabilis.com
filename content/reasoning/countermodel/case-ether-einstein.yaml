    tolerance:
      absolute: 1.0e-06
      relative: 1.0e-12
      reason: A stated numerical comparison threshold, not a measurement uncertainty or a confidence interval. The absolute floor also covers zero components.
    explanation: One route first forms the Galilean relative coordinate, then applies Lorentz’s scaling and local time. The other uses the existing Lorentz boost owner. Neither route calls the other to produce these event coordinates. Components use ct, x, y and z in metres.
  - id: rod
    label: Simultaneous endpoint measurement of a 100 m rod
    kind: observation
    test: rod
    inputs:
      properLength: 100
    tolerance:
      absolute: 1.0e-10
      relative: 1.0e-12
      reason: A stated numerical comparison threshold, not a measurement uncertainty or a confidence interval. The absolute floor also covers zero components.
    explanation: The endpoints are fixed in the rod frame. Each candidate’s inverse map selects the endpoint times that are simultaneous in the laboratory. Equal times in the rod frame would answer a different length question.
  - id: clock
    label: Moving-clock seconds per laboratory second
    kind: observation
    test: clock
    inputs: {}
    tolerance:
      absolute: 1.0e-12
      relative: 1.0e-12
      reason: A stated numerical comparison threshold, not a measurement uncertainty or a confidence interval. The absolute floor also covers zero components.
    explanation: Transform two events on the moving clock’s worldline. Compare the elapsed rest-frame time per laboratory second. This is an inertial clock-rate comparison, not a round-trip or acceleration experiment.
  - id: composition
    label: Collinear composition with an object at 0.6c
    kind: observation
    test: composition
    inputs:
      worldlineBeta: 0.6
    tolerance:
      absolute: 1.0e-06
      relative: 1.0e-12
      reason: A stated numerical comparison threshold, not a measurement uncertainty or a confidence interval. The absolute floor also covers zero components.
    explanation: Transform a rest-frame worldline back to the laboratory with each candidate’s inverse map. The reference is the other candidate’s prediction. Poincaré’s June 1905 contribution is parallel work, not knowledge placed on the 1904 shelf.
