schemaVersion: 1
id: case-ether-einstein
title: When the chosen observations cannot decide
question: Can these kinematic measurements distinguish a privileged-frame interpretation?
scope: These are predicted outcomes of specified measurements, not historical datasets. Compare each candidate with the other. Numerical agreement under these observations does not decide whether an ether exists; disagreement elsewhere would require another stated test. The historical source links are references, not edition text.
review: draft
defaultBeta: 0.6
sources:
  - id: einstein-1905-kinematics
    label: Einstein (1905), Zur Elektrodynamik bewegter Körper, §§2–5
    url: https://doi.org/10.1002/andp.19053221004
    parallelWork: false
  - id: lorentz-1904-transformation
    label: Lorentz (1904), Electromagnetic phenomena, §§3–4, 8; relative coordinates and local time
    url: https://en.wikisource.org/wiki/Electromagnetic_phenomena
    parallelWork: false
  - id: poincare-1905-june-note
    label: Poincaré, 5 June 1905, Sur la dynamique de l’électron, pp. 1504–1508; parallel work
    url: https://fr.wikisource.org/wiki/Sur_la_dynamique_de_l’électron_(juin)
    parallelWork: true
candidates:
  - id: lorentz-ether
    label: Lorentz’s ether-based kinematics
    modelVersion: lorentz-1904-local-time-l1-v1
    circumstances: Relative coordinates, contraction and local time with Lorentz’s scale factor set to one, interpreted with a privileged frame. Velocity composition also uses the group property associated with Poincaré’s June 1905 parallel work.
    historicalStatus: available-before-cutoff
    sourceIds:
      - lorentz-1904-transformation
      - poincare-1905-june-note
  - id: lorentz
    label: Einstein’s inertial-frame kinematics
    modelVersion: lorentz-1905-kinematics-v1
    circumstances: Aligned inertial frames with the relativity and light-speed postulates. This comparison tests consequences of the resulting map; it does not derive the map from its own predictions.
    historicalStatus: introduced-in-current-paper
    sourceIds:
      - einstein-1905-kinematics
