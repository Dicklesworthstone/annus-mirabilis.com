# SR-11's formulas (dispatch 301).
lab: sr-11
formulas:
  - latex: "\\begin{aligned}\\frac{\\nu'''}{\\nu} &= \\frac{1 - 2\\beta\\cos\\varphi + \\beta^2}{1 - \\beta^2} \\\\ &= \\frac{1 - 2(0.6)(1) + 0.36}{1 - 0.36} \\\\ &= \\frac{0.16}{0.64} \\\\ &= 0.25\\end{aligned}"
    incidental: "The frequency after two reflections, § 8's printed relation, evaluated at the mirror speed and angle this page invents and carried down to a number. The relation carries its words where it is printed."
  - latex: "\\begin{aligned}P &= 2u\\,\\frac{(\\cos\\varphi - \\beta)^2}{1 - \\beta^2} \\\\ &= 2u\\,\\frac{(1 - 0.6)^2}{1 - 0.36} \\\\ &= 2u\\,\\frac{0.16}{0.64} \\\\ &= 0.5\\,u\\end{aligned}"
    incidental: "The pressure on the mirror, § 8's printed relation, worked at the same invented settings. The arithmetic is the lab's; the relation is the paper's."
  - latex: "\\begin{aligned}P_{\\text{incident}} &= u\\,c\\,A_{\\text{m}}(1 - \\beta) \\\\ &= 0.4\\,u\\,c\\,A_{\\text{m}}\\end{aligned}"
    incidental: "The incident power at those settings, a step in the lab's own energy ledger. The sentence carrying it names the surface and the factor it uses."
  - latex: "\\begin{aligned}P_{\\text{reflected}} &= u\\left(\\frac{\\nu'''}{\\nu}\\right)^2 c\\,A_{\\text{m}}(1 + \\beta) \\\\ &= u(0.0625)c\\,A_{\\text{m}}(1.6) \\\\ &= 0.1\\,u\\,c\\,A_{\\text{m}}\\end{aligned}"
    incidental: "The reflected power at the same settings, the companion of the line above and a step in the same ledger."
  - latex: "\\begin{aligned}\\dot{W}_{\\text{mechanical}} &= P\\cdot v\\cdot A_{\\text{m}} \\\\ &= (0.5\\,u)(0.6\\,c)(A_{\\text{m}}) \\\\ &= 0.3\\,u\\,c\\,A_{\\text{m}}\\end{aligned}"
    incidental: "The mechanical power the light delivers to the moving mirror, computed from the pressure two displays above and the speed the page set."
  - latex: "\\begin{aligned}&P_{\\text{incident}} - P_{\\text{reflected}} - \\dot{W}_{\\text{mechanical}} \\\\ &\\quad = 0.4 - 0.1 - 0.3 \\\\ &\\quad = 0\\end{aligned}"
    incidental: "The ledger closing: the three numbers above added with their signs, coming to nothing. It is arithmetic on this page's own case, and what it shows, that the energy balance holds, is said in the sentence after it."
