  - latex: "\\begin{gathered}S - S_0 = \\frac{E}{\\beta\\nu}\\ln\\frac{v}{v_0} \\\\ (\\text{printed \"lg\" is the} \\\\ \\text{natural logarithm})\\end{gathered}"
