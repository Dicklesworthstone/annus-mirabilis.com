# BM-05's formulas (dispatch 291/301).
lab: bm-05
formulas:
  # The lab's own discrete walk. § 4 works with a continuous distribution of displacements and
  # prints no sum over steps.
  - latex: "\\begin{gathered}x_n=\\sum_{j=1}^{n}\\Delta_j, \\\\ \\langle\\Delta\\rangle=0, \\\\ \\langle x_n^2\\rangle=n\\langle\\Delta^2\\rangle\\end{gathered}"
    own:
      id: lab-bm-05-discrete-walk
      inWords:
        - text: "The place a particle has reached"
          quantityId: displacement1d
        - text: " is the sum of "
        - text: "the steps"
          quantityId: displacementIncrement
        - text: " it has taken. Their average is zero, and the average of the square of where it has got to is "
        - text: "the number of steps"
          quantityId: walkStepCount
        - text: " times the average of the square of one step."
      r0: "A walk in steps: the displacements add, their average is nothing, and the average of the square grows in proportion to how many steps have been taken."
      r1: "The particle takes a step, then another, each drawn independently and each as likely to go one way as the other. Adding them gives where it has got to. The average of the sum is the sum of the averages, which is zero, so the walk has no preferred direction and no drift. The average of the SQUARE does not vanish, because squaring removes the signs, and it is the one growing quantity: expanding the square gives $n$ terms of $\\langle\\Delta^2\\rangle$ and $n(n-1)$ cross terms, and every cross term is the product of two averages that are separately zero, because the steps are independent. So the mean square grows in proportion to the number of steps, and the typical distance in proportion to its square root. That is the whole of why a walk spreads as the square root of the time, and why it is so much slower than travelling."
      r2:
        - latex: "x_n=\\sum_{j=1}^{n}\\Delta_j"
          why: "Where the particle has got to after $n$ steps: the steps add, and nothing else about them is used."
        - latex: "\\langle\\Delta\\rangle=0"
          why: "Each step is as likely to go one way as the other, which is the assumption § 4 makes about the displacements in the interval it considers."
        - latex: "\\langle x_n^2\\rangle=\\sum_{j=1}^{n}\\langle\\Delta_j^2\\rangle+\\text{the cross terms}"
          why: "Square the sum and average. It falls into the squared terms and the cross terms."
        - latex: "\\langle\\Delta_j\\rangle=0 \\quad \\Longrightarrow \\quad \\text{every cross term}=0"
          why: "A cross term is the average of a product of two different steps. The steps are independent, so that average is the product of their two averages, and each of those is zero. Every cross term goes, and there are $n(n-1)$ of them."
        - latex: "\\langle x_n^2\\rangle=n\\langle\\Delta^2\\rangle"
          why: "What is left is $n$ equal squared terms. The mean square is proportional to the number of steps, not to its square, which is the difference between spreading and travelling."
      r3: "The discrete walk is this edition's, not Einstein's. § 4 does not count steps: it takes a distribution $\\varphi(\\Delta)$ of displacements in a short interval $\\tau$, assumes it symmetric, and expands under an integral. The two give the same diffusion equation, and the lab's next displays make the passage. What the step picture adds is a reason a reader can hold, and what it costs is that the interval $\\tau$ becomes a step rather than a limit; the paper is careful that $\\tau$ be small enough for the expansion and large enough for independence, and a walk in steps hides that condition rather than removing it."

  - latex: "\\begin{gathered}D=\\frac{\\langle\\Delta^2\\rangle}{2\\tau}, \\\\ \\langle x^2\\rangle=2Dt, \\\\ \\sqrt{\\langle x^2\\rangle}\\propto\\sqrt{t}\\end{gathered}"
    display: eq-s4-d9

  - latex: "\\begin{aligned}& p(x,t+\\tau) \\\\ &\\qquad = \\int p(x-\\Delta,t)\\varphi(\\Delta)\\,d\\Delta\\end{aligned}"
    own:
      id: lab-bm-05-probability-transport
      inWords:
        - text: "The probability density"
          quantityId: probabilityDensity
        - text: " at "
        - text: "position"
          quantityId: positionCoordinate1d
        - text: " and a "
        - text: "time"
          quantityId: fieldTimeCoordinate
        - text: " one "
        - text: "step interval"
          quantityId: stepInterval
        - text: " later is the sum of earlier densities at possible starting positions, weighted by "
        - text: "the step probability density"
          quantityId: transitionKernel
        - text: " for each "
        - text: "displacement"
          quantityId: displacementIncrement
        - text: "."
      r0: "To find where the particle may be after another step, consider every place it could have started and how likely the required step is. The total probability remains one."
      r1: "The lab uses $p$ for probability per unit length. A particle arriving at $x$ after a step $\\Delta$ started at $x-\\Delta$. Its contribution is the earlier density there times the probability of that step. Integrating over all signed steps adds those contributions. The step law is independent of starting position and of previous steps, and its integral is one. These assumptions make the update conserve total probability. The equation is an exact update for this step model; obtaining the differential equation requires a further smooth, small-step approximation."
      r2:
        - latex: "\\int_{-\\infty}^{+\\infty} p(x,t)\\,d x=1"
          why: "The initial distribution assigns total probability one. Integrating a density over length gives probability."
        - latex: "\\int_{-\\infty}^{+\\infty} \\varphi(\\Delta)\\,d\\Delta=1"
          why: "The independent step law is normalized separately: the particle makes some signed step."
        - latex: "p(x,t+\\tau)=\\int_{-\\infty}^{+\\infty}p(x-\\Delta,t)\\varphi(\\Delta)\\,d\\Delta"
          why: "Add the contributions from every starting position. Integrating this update over x keeps total probability one because both normalized factors have unit integral."
      r3: "This is the lab's probability form of the transport step in section 4. During that derivation Einstein uses f for particles per volume; later he reinterprets f as particles per displacement and normalizes its integral to a total count. The lab instead uses probability density throughout. The paper prints the earlier position with a plus sign. Its even step law makes that form equivalent to the lab's minus sign after reversing the integration variable. These choices are stated here rather than treating the lab formula as an unchanged quotation."

  - latex: "\\frac{\\partial p}{\\partial t}=D\\frac{\\partial^2p}{\\partial x^2}"
    own:
      id: lab-bm-05-probability-diffusion
      inWords:
        - text: "The rate at which "
        - text: "probability density"
          quantityId: probabilityDensity
        - text: " changes with "
        - text: "time"
          quantityId: fieldTimeCoordinate
        - text: " equals "
        - text: "the diffusion coefficient"
          quantityId: diffusionCoefficient
        - text: " times its curvature as a function of "
        - text: "position"
          quantityId: positionCoordinate1d
        - text: "."
      r0: "A peak flattens and a trough fills. How quickly the probability density changes depends on its curvature, with the diffusion coefficient setting the rate."
      r1: "The first partial derivative measures change in time at a fixed position. The second spatial derivative measures curvature at a fixed time. For positive constant $D$, a local peak has negative curvature and loses density; a trough has positive curvature and gains it. Each side has dimension inverse length per time. The equation describes a smooth probability distribution, not the velocity of a single particle. It follows from the step update when independent symmetric steps have a finite second moment and the higher expansion terms can be neglected."
      r2:
        - latex: "D=\\frac{1}{2\\tau}\\int_{-\\infty}^{+\\infty}\\Delta^2\\varphi(\\Delta)\\,d\\Delta"
          why: "The finite second moment per twice the step interval sets the spreading rate. Symmetry removes the signed first moment, which would otherwise give drift."
        - latex: "\\frac{\\partial p}{\\partial t}=D\\frac{\\partial^2p}{\\partial x^2}"
          why: "After retaining the second-order spatial contribution, the continuum balance equates local change in time with diffusivity times spatial curvature."
        - latex: "\\int_{-\\infty}^{+\\infty}p(x,t)\\,d x=1"
          why: "With no probability flux lost at infinity, the solution keeps unit total probability. This is the lab's normalization condition, separate from the local differential equation."
      r3: "Einstein's printed equation (1) in section 4 initially describes a volume number density f. He then applies the same linear equation to the displacement count density whose integral is the number of particles. Dividing that later density by a fixed total count gives the probability form used here. The normalization changes the meaning and units of the density without changing the structure of this linear evolution equation."
