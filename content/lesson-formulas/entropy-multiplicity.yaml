# entropy-multiplicity: where each formula's shape is printed in the papers (am-cadl).
#
# One entry per formula block of content/foundations/entropy-multiplicity.json, named by its latex exactly as the
# lesson writes it. `usedAt` names printed displays that print this shape, with a note saying what
# the paper does with it there. `notUsed` records, with its reason, a formula the papers do not
# print, so the absence is a judgement and not a silence.
lesson: entropy-multiplicity
formulas:
  - latex: "S - S_0 = k_B \\ln W"
    usedAt:
      - paper: light-quanta
        display: eq-s5-d6
        note: "Boltzmann's principle as the paper prints it: R over N where the lesson writes the Boltzmann constant, and lg for the natural logarithm."
