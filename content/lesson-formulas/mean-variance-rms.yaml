# mean-variance-rms: where each formula's shape is printed in the papers (am-cadl).
#
# One entry per formula block of content/foundations/mean-variance-rms.json, named by its latex exactly as the
# lesson writes it. `usedAt` names printed displays that print this shape, with a note saying what
# the paper does with it there. `notUsed` records, with its reason, a formula the papers do not
# print, so the absence is a judgement and not a silence.
lesson: mean-variance-rms
formulas:
  - latex: "\\langle x\\rangle=\\frac{1}{M}\\sum_{i=1}^{M}x_i"
    notUsed: "The papers print ensemble averages, not sample statistics over M measurements. brownian-motion writes the mean square with an overbar inside eq-s4-d12 and never a sum over a finite sample divided by its count."
  - latex: "\\langle x^2\\rangle=\\frac{1}{M}\\sum_{i=1}^{M}x_i^2"
    notUsed: "The same reason, and it is the one that matters most for this lesson: the quantity brownian-motion reaches is the overbarred mean square at eq-s4-d12, which is a property of the distribution rather than of a run of observations."
  - latex: "\\operatorname{Var}(x)=\\langle x^2\\rangle-\\langle x\\rangle^2"
    notUsed: "No display prints a variance. The paper needs only the mean square, because the mean displacement is zero: brownian-motion prints the symmetry phi of Delta equals phi of minus Delta as its own display at eq-s4-d3, which is what makes the subtraction this formula performs unnecessary."
