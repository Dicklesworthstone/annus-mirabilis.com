# unit-system-1905: where each formula's shape is printed in the papers (am-cadl).
#
# One entry per formula block of content/foundations/unit-system-1905.json, named by its latex exactly as the
# lesson writes it. `usedAt` names printed displays that print this shape, with a note saying what
# the paper does with it there. `notUsed` records, with its reason, a formula the papers do not
# print, so the absence is a judgement and not a silence.
lesson: unit-system-1905
formulas:
  - latex: "\\begin{aligned} &1.35\\times10^{-2}\\,\\mathrm{P}\\times\\frac{0.1\\,\\mathrm{Pa\\,s}}{1\\,\\mathrm{P}} \\\\ &\\quad = 1.35\\times10^{-3}\\,\\mathrm{Pa\\,s} \\end{aligned}"
    notUsed: "The papers print values in their own units and never a conversion between unit systems. The lesson does the arithmetic so that a reader can read Einstein's viscosity in poise, as it reaches brownian-motion eq-s5-d3, without converting it in their head."
  - latex: "\\begin{gathered} 1\\,\\mathrm{abV} = 10^{-8}\\,\\mathrm{V}, \\\\ 1\\,\\mathrm{abC} = 10\\,\\mathrm{C}, \\\\ 1\\,\\mathrm{statV} = 299.792458\\,\\mathrm{V}, \\\\ 1\\,\\mathrm{G} = 10^{-4}\\,\\mathrm{T} \\end{gathered}"
    notUsed: "The same reason. The electromagnetic units are the ones special-relativity works in throughout; no display states the factors that relate them to modern SI."
