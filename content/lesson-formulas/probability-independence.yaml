# probability-independence: where each formula's shape is printed in the papers.
#
# One entry per formula block of content/foundations/probability-independence.json, named by its latex exactly as the
# lesson writes it. `usedAt` names printed displays that print this shape, with a note saying what
# the paper does with it there. `notUsed` records, with its reason, a formula the papers do not
# print, so the absence is a judgement and not a silence.
lesson: probability-independence
formulas:
  - latex: "(\\Delta_1 + \\Delta_2)^2 = \\Delta_1^2 + 2\\Delta_1\\Delta_2 + \\Delta_2^2"
    notUsed: "The papers print no algebraic square of a sum. I searched all four display sets: the only candidate is special-relativity eq-s5-d5, where the bracket (v squared plus w squared plus 2vw cos alpha) is the law of cosines in velocity composition and not this shape."
  - latex: "\\langle \\Delta_1 \\Delta_2 \\rangle = \\langle \\Delta_1 \\rangle \\langle \\Delta_2 \\rangle = 0"
    notUsed: "No display writes a cross moment of two steps in angle brackets. What brownian-motion prints is the first moment of ONE step, as the integral of Δ times φ inside eq-s4-d7, which is the term that drops out of the expansion."
