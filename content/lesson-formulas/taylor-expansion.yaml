# taylor-expansion: where each formula's shape is printed in the papers, and which letters are bound
# (am-inst-permalink-tape-s677 is not this; the edge is the one src/content/lessonFormulas.ts describes).
#
# One entry per formula block of content/foundations/taylor-expansion.json, named by its latex exactly
# as the lesson writes it. `usedAt` names printed displays that print this shape, with a note saying
# what the paper does with it there. `notUsed` records, with its reason, a formula the papers do not
# print, so the absence is a judgement and not a silence.
lesson: taylor-expansion
formulas:
  - latex: "\\begin{aligned}f(x+\\Delta)&=f(x)+\\Delta f'(x)\\\\&\\quad+\\frac{\\Delta^2}{2}f''(x)+\\ldots\\end{aligned}"
    usedAt:
      - paper: brownian-motion
        display: eq-s4-d6
        note: "The expansion itself, in x and to second order, with Einstein writing the tail as “in inf.” The second-derivative term is the one that survives the integration two displays later and carries the diffusion coefficient."
      - paper: brownian-motion
        display: eq-s4-d5
        note: "The same expansion on the other side, in time and kept to first order: one τ and one derivative is all §4 needs of it."
  - latex: "(x+\\Delta)^2=x^2+2x\\Delta+\\Delta^2"
    notUsed: "The papers print no algebraic square of a sum. The shape is in the lesson so the Δ squared term looks familiar before the density is expanded; where the papers need it they expand a function instead, at brownian-motion eq-s4-d6."
